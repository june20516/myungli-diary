<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="96" height="96">
  <!-- 명리일기 앱 아이콘, 작은 원형 (48px 이하). 공책·낙관을 키우고 日 획을 굵게 했습니다. -->
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f2e9"/>
      <stop offset="1" stop-color="#ffe9e5"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#background)"/>
  <rect x="18" y="12" width="64" height="76" rx="8" fill="#597f61"/>
  <rect x="18" y="12" width="13" height="76" rx="5" fill="#47634c"/>
  <!-- 낙관: 반시계 30°, 요철 없는 사각, 굵은 양각 日 -->
  <g transform="rotate(-30 59 61)">
    <g transform="translate(40 42) scale(1.9)">
      <rect x="1" y="1" width="18" height="18" rx="2.5" fill="#a75c53"/>
      <rect x="5.4" y="3.8" width="9.2" height="12.4" rx="1.2" fill="none" stroke="#fef4f2" stroke-width="2.6"/>
      <line x1="6" y1="10" x2="14" y2="10" stroke="#fef4f2" stroke-width="2.6"/>
    </g>
  </g>
</svg>
