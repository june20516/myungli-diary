<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024">
  <!-- 명리일기 앱 아이콘, 큰 원형 (60px 이상). 풀블리드 정사각: 모서리는 플랫폼이 깎습니다. -->
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f2e9"/>
      <stop offset="1" stop-color="#ffe9e5"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#background)"/>
  <!-- 공책: 표지 sage-600, 등판 sage-700 -->
  <rect x="21" y="14" width="58" height="72" rx="7" fill="#597f61"/>
  <rect x="21" y="14" width="10" height="72" rx="4" fill="#47634c"/>
  <!-- 낙관: 반시계 30°, 손으로 찍은 듯한 테두리, 가는 양각 日 -->
  <g transform="rotate(-30 60 63)">
    <g transform="translate(46 49) scale(1.4)">
      <path d="M1.2 1.5 q8.8 -1.3 17.6 0 q1.2 8.5 0 17 q-8.8 1.3 -17.6 0 q-1.2 -8.5 0 -17 z" fill="#a75c53"/>
      <rect x="6.2" y="4.6" width="7.6" height="10.8" rx="1" fill="none" stroke="#fef4f2" stroke-width="1.7"/>
      <line x1="6.8" y1="10" x2="13.2" y2="10" stroke="#fef4f2" stroke-width="1.7"/>
    </g>
  </g>
</svg>
