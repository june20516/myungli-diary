[project]
name = "myungli-writing"
version = "0.8.0"
description = "명리일기 라이팅 검사기: 원고가 슬롯 명세와 규칙을 지키는지 검사합니다"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6",
    "regex>=2024.11",
    "grpcio==1.84.0",
    "protobuf>=7.35.1",  # 생성 코드(mlw._gen)의 런타임 요구 버전
]

[project.scripts]
mlw = "mlw.cli:main"

[dependency-groups]
dev = [
    "grpcio-tools==1.84.0",
    "pytest>=9",
    "ruff",
    "mypy",
    "types-pyyaml",
    "types-regex",
    "types-protobuf",
    "types-grpcio>=1.84.0.20260928",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlw"]

[tool.mypy]
strict = true
mypy_path = "src"
# protoc 생성 코드는 검사하지 않는다 (tools/gen_proto.sh)
exclude = ["src/mlw/_gen/"]
untyped_calls_exclude = ["mlw._gen"]

[tool.ruff]
line-length = 110
extend-exclude = ["src/mlw/_gen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers"]
markers = [
    "contract: 저장소 계약 파일(IA, core 메시지 키·근거 목록, design lengths.md)을 읽는 테스트. ci-gate drift·gate에서는 이것만 돕니다(D81)",
]
