# 문체 규칙. 나머지는 R1~R3 결과로 채웁니다.

- id: style.S1
  name: 괄호 풀이 금지
  severity: error
  detect:
    kind: regex
    pattern: '[가-힣]+\([가-힣\s]+\)'
    langs: [ko]
  exempt_purposes: []
  examples:
    hit:
      - {lang: ko, slot_purpose: info, text: "일간(나를 뜻하는 글자)이 강해요."}
    pass:
      - {lang: ko, slot_purpose: info, text: "나를 뜻하는 글자가 강해요."}

- id: style.S2
  name: 말줄임 금지
  severity: warn
  detect:
    kind: regex
    pattern: '…|\.\.\.'
  exempt_purposes: []
  examples:
    hit:
      - {lang: ko, slot_purpose: info, text: "조금 쉬어 가도 좋아요..."}
    pass:
      - {lang: ko, slot_purpose: info, text: "조금 쉬어 가도 좋아요."}

- id: style.S3
  name: 해요체로 맺기 (합니다체 금지)
  severity: error
  detect:
    kind: regex
    # 문장 끝(구두점이나 문자열 끝)의 "니다"·"니까"만 봅니다. 연결어미 "~니까 " 뒤에는 공백이 와서 걸리지 않습니다.
    pattern: '(니다|니까)(?=[.?!]|$)'
    langs: [ko]
  exempt_purposes: []
  examples:
    hit:
      - {lang: ko, slot_purpose: info, text: "오늘 맞는 색은 남색입니다."}
      - {lang: ko, slot_purpose: care, text: "할 일이 많은 날입니다. 무리하지 않는 편이 좋습니다."}
      - {lang: ko, slot_purpose: guide, text: "오늘 하루는 어땠습니까?"}
    pass:
      - {lang: ko, slot_purpose: info, text: "오늘은 남색이 잘 맞아요."}
      - {lang: ko, slot_purpose: guide, text: "민지님의 오늘 하루는 어땠나요?"}
      - {lang: ko, slot_purpose: guide, text: "바쁜 날이니까 하나만 골라 해 보세요."}
      - {lang: ko, slot_purpose: care, text: "몸이 무거우니까 천천히 가도 괜찮아요."}

# raw: true는 NFC만 적용한 원문에서 판정합니다. 정규화는 자리표시자를 "값"으로 바꿔 `{name}` 뒤를 알 수 없기 때문입니다.
# 영어는 접미사가 없어(W5) 대상이 아닙니다.
- id: style.S4
  name: 호칭 접미사 누락
  severity: error
  detect:
    kind: regex
    pattern: '\{name\}(?!님)'
    langs: [ko]
    raw: true
  exempt_purposes: []
  examples:
    hit:
      - {lang: ko, slot_purpose: guide, text: "{name}의 오늘 하루는 어땠나요?"}
    pass:
      - {lang: ko, slot_purpose: guide, text: "{name}님의 오늘 하루는 어땠나요?"}

- id: style.S5
  name: 호칭 접미사 누락 (일본어)
  severity: error
  detect:
    kind: regex
    pattern: '\{name\}(?!さん)'
    langs: [ja]
    raw: true
  exempt_purposes: []
  examples:
    hit:
      - {lang: ja, slot_purpose: guide, text: "{name}の一日はどうでしたか？"}
    pass:
      - {lang: ja, slot_purpose: guide, text: "{name}さんの一日はどうでしたか？"}

# 2인칭 "당신"은 번역투이고 거리감이 있어 호칭(`{name}님`)으로 씁니다(W5). 모든 목적에 적용합니다.
- id: style.S6
  name: 당신 대신 호칭
  severity: error
  detect:
    kind: lexicon
    words: ["당신"]
    langs: [ko]
  exempt_purposes: []
  examples:
    hit:
      - {lang: ko, slot_purpose: care, text: "재물의 흐름이 당신에게 어떤 의미로 다가왔나요?"}
    pass:
      - {lang: ko, slot_purpose: guide, text: "민지님의 오늘 하루는 어땠나요?"}
