# 문체 규칙. 나머지는 R1~R3 결과로 채웁니다.

- id: style.S1
  name: 괄호 풀이 금지
  severity: error
  detect:
    kind: regex
    pattern: '[가-힣]+\([가-힣\s]+\)'
    langs: [ko]
  exempt_purposes: []
  examples:
    hit:
      - {lang: ko, slot_purpose: info, text: "일간(나를 뜻하는 글자)이 강해요."}
    pass:
      - {lang: ko, slot_purpose: info, text: "나를 뜻하는 글자가 강해요."}

- id: style.S2
  name: 말줄임 금지
  severity: warn
  detect:
    kind: regex
    pattern: '…|\.\.\.'
  exempt_purposes: []
  examples:
    hit:
      - {lang: ko, slot_purpose: info, text: "조금 쉬어 가도 좋아요..."}
    pass:
      - {lang: ko, slot_purpose: info, text: "조금 쉬어 가도 좋아요."}

# raw: true는 NFC만 적용한 원문에서 판정합니다. 정규화는 자리표시자를 "값"으로 바꿔 `{name}` 뒤를 알 수 없기 때문입니다.
# 영어는 접미사가 없어(W5) 대상이 아닙니다.
- id: style.S4
  name: 호칭 접미사 누락
  severity: error
  detect:
    kind: regex
    pattern: '\{name\}(?!님)'
    langs: [ko]
    raw: true
  exempt_purposes: []
  examples:
    hit:
      - {lang: ko, slot_purpose: guide, text: "{name}의 오늘 하루는 어땠나요?"}
    pass:
      - {lang: ko, slot_purpose: guide, text: "{name}님의 오늘 하루는 어땠나요?"}

- id: style.S5
  name: 호칭 접미사 누락 (일본어)
  severity: error
  detect:
    kind: regex
    pattern: '\{name\}(?!さん)'
    langs: [ja]
    raw: true
  exempt_purposes: []
  examples:
    hit:
      - {lang: ja, slot_purpose: guide, text: "{name}の一日はどうでしたか？"}
    pass:
      - {lang: ja, slot_purpose: guide, text: "{name}さんの一日はどうでしたか？"}

# 2인칭 "당신"은 번역투이고 거리감이 있어 호칭(`{name}님`)으로 씁니다(W5). 모든 목적에 적용합니다.
- id: style.S6
  name: 당신 대신 호칭
  severity: error
  detect:
    kind: lexicon
    words: ["당신"]
    langs: [ko]
  exempt_purposes: []
  examples:
    hit:
      - {lang: ko, slot_purpose: care, text: "재물의 흐름이 당신에게 어떤 의미로 다가왔나요?"}
    pass:
      - {lang: ko, slot_purpose: guide, text: "민지님의 오늘 하루는 어땠나요?"}

# D72: 부정 신호(기신·공망·충)와 잠금 해제·구매 안내를 한 원고(같은 문장·같은 자리)에 함께 두지 않습니다. 모든 언어에 적용합니다.
# 원고 한 건 전체에서 두 lookahead가 모두 맞으면 걸립니다. 충은 앞뒤에 다른 한글이 붙은 낱말(충분·보충)을 빼려고 조사·끝만 허용합니다.
- id: style.S7
  name: 부정 신호를 잠금 해제·구매 안내와 잇지 않기
  severity: error
  detect:
    kind: regex
    pattern: '(?is)^(?=.*(?:기신|공망|(?<![가-힣])충(?=[이을은과의]|\s|$)|gisin|gongmang|\bvoid\b|\bclash|unfavou?rable|day to go gently|忌神|空亡|天中殺|大殺界|冲|沖))(?=.*(?:잠금|해제|열어\s?보|광고|구매|결제|이용권|unlock|\bads?\b|ad-free|purchase|\bbuy\b|subscri|ロック|解除|広告|購入|課金))'
  exempt_purposes: []
  examples:
    hit:
      - {lang: ko, slot_purpose: guide, text: "오늘은 기신의 날이에요. 잠금을 풀면 피할 방법을 볼 수 있어요."}
      - {lang: ko, slot_purpose: guide, text: "공망이 든 날이라면 광고 제거권으로 더 자세히 보세요."}
      - {lang: ko, slot_purpose: info, text: "일지와 충이 있어요. 구매하면 풀이를 더 볼 수 있어요."}
      - {lang: en, slot_purpose: guide, text: "A clash is coming. Unlock the full reading to stay safe."}
      - {lang: ja, slot_purpose: guide, text: "今日は空亡です。ロックを解除して詳しく見てください。"}
    pass:
      - {lang: ko, slot_purpose: guide, text: "광고를 보고 근거를 열어 보세요."}
      - {lang: ko, slot_purpose: info, text: "오늘은 기신의 날이에요. 큰 결정은 하루 미뤄도 괜찮아요."}
      - {lang: ko, slot_purpose: guide, text: "시간이 충분해요. 잠금을 풀고 근거를 보세요."}
      - {lang: en, slot_purpose: guide, text: "Watch a short ad to unlock the evidence."}
      - {lang: ja, slot_purpose: info, text: "今日は空亡の日です。予定を詰め込みすぎないでください。"}
