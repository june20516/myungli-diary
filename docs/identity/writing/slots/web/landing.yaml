# 웹 랜딩 원고(#1329, D144~D146). IA는 docs/ia/site.json의 web-landing이고, 슬롯 하나가 IA 슬롯 하나를 담습니다.
# 원고는 content/<lang>/web.yaml, web이 읽는 생성물은 generated/web/<lang>.json(슬롯 → 키 → 글)입니다.
# server 시드와 ARB로 나가지 않습니다. 톤과 문장은 스토어 문구(slots/store/, 라운드 R49)를 따르고,
# 같은 자리의 문장은 스토어 원고와 같게 둡니다. 앱 밖 화면이라 상한은 unbounded입니다(#191).

- id: web-landing.meta.title
  where: "web-landing: 브라우저 탭, 검색 결과 제목, 공유 미리보기 제목"
  ia: [web-landing.meta.title]
  purpose: info
  user_state: "검색 결과나 메신저 공유 미리보기에서 처음 봅니다."
  structure: "앱 이름, 세로 막대(|), 태그라인(W49). 태그라인은 스토어 부제와 같습니다."
  tone: {진지: 3, 격식: 3, 존중: 4, 담백: 5}
  max_length: {ko: unbounded, en: unbounded, ja: unbounded}
  keys:
    - metaTitle
  examples:
    good:
      - {lang: ko, key: metaTitle, text: "명리일기 | 오늘 일진을 내 사주에 맞춰 풀어 주는 일기", why: "앱 이름과 태그라인 그대로", source: writing}
    bad:
      - {lang: ko, text: "명리일기 | 사주, 운세, 만세력, 궁합 무료", why: "검색어 나열, 앱에 없는 기능", source: writing}
  a11y:
    truncation: "검색 결과에서 뒤가 잘릴 수 있어 앱 이름을 앞에 둡니다."
    screen_reader: "페이지 제목으로 읽습니다."

- id: web-landing.meta.description
  where: "web-landing: 검색 결과 설명, 공유 미리보기 설명"
  ia: [web-landing.meta.description]
  purpose: info
  user_state: "검색 결과나 공유 미리보기에서 제목 아래 한두 줄을 봅니다."
  structure: "두 문장. 스토어 짧은 설명(store.short-description)과 같습니다."
  tone: {진지: 3, 격식: 2, 존중: 4, 담백: 4}
  max_length: {ko: unbounded, en: unbounded, ja: unbounded}
  keys:
    - metaDescription
  examples:
    good:
      - {lang: ko, key: metaDescription, text: "같은 날이라도 각자의 오늘은 달라요. 내 사주로 매일의 일진을 풀어 드려요.", why: "스토어 짧은 설명과 같음", source: round-R49}
    bad:
      - {lang: ko, text: "정확한 사주 풀이와 운세를 무료로 확인하세요!", why: "근거 없는 과장, 느낌표", source: writing}
  a11y:
    truncation: "검색 엔진이 길이에 맞춰 자릅니다."
    screen_reader: "보이지 않는 칸입니다."

- id: web-landing.hero.tagline
  where: "web-landing: 앱 이름 아래 한 줄 소개"
  ia: [web-landing.hero.tagline]
  purpose: info
  user_state: "랜딩을 열자마자 앱 이름 아래에서 무엇을 해 주는지 봅니다."
  structure: "명사로 맺는 한 줄. 태그라인(W49), 스토어 부제와 같은 문장입니다."
  tone: {진지: 3, 격식: 3, 존중: 4, 담백: 4}
  max_length: {ko: unbounded, en: unbounded, ja: unbounded}
  keys:
    - heroTagline
  examples:
    good:
      - {lang: ko, key: heroTagline, text: "오늘 일진을 내 사주에 맞춰 풀어 주는 일기", why: "태그라인 그대로(라운드 R49 A)", source: round-R49}
    bad:
      - {lang: ko, text: "사주 일진 풀이, 길흉 달력, 일기", why: "기능 나열(라운드 R49 C)", source: round-R49}
  a11y:
    truncation: "줄바꿈으로 감쌉니다."
    screen_reader: "그대로 읽습니다."

- id: web-landing.hero.body
  where: "web-landing: 한 줄 소개 아래 본문"
  ia: [web-landing.hero.body]
  purpose: info
  user_state: "앱을 처음 알게 된 사람이 받을지 정하려고 두세 문장을 읽습니다."
  structure: "두 문장. 내 사주로 본 오늘과 그 옆의 일기를 앞에, 달력을 뒤에 둡니다(라운드 R49, 스토어 홍보 문구와 같음)."
  tone: {진지: 3, 격식: 2, 존중: 4, 담백: 4}
  max_length: {ko: unbounded, en: unbounded, ja: unbounded}
  keys:
    - heroBody
  examples:
    good:
      - {lang: ko, key: heroBody, text: "내 사주로 풀이한 오늘을 보고, 그날 있었던 일을 풀이 옆에 일기로 남겨요. 잘 풀리는 날과 조심할 날은 달력에서 미리 확인해요.", why: "라운드 R49 D, 스토어 홍보 문구와 같음", source: round-R49}
    bad:
      - {lang: ko, text: "같은 날이라도 사주가 다르면 오늘도 달라요. 왜 그렇게 봤는지 원전 근거까지 보여 드려요.", why: "근거를 앞세워 일기가 빠짐(라운드 R49 A)", source: round-R49}
  a11y:
    truncation: "줄바꿈으로 감쌉니다."
    screen_reader: "그대로 읽습니다."

- id: web-landing.shots.alt
  where: "web-landing: 앱 화면 사진의 대체 텍스트"
  ia: [web-landing.shots.alt]
  purpose: info
  user_state: "스크린리더 사용자가 사진 대신 듣거나, 사진이 뜨지 않을 때 봅니다."
  structure: "화면 이름, 마침표, 그 사진에 보이는 것 한 구절. 키는 스토어 스크린샷 키와 같고, web이 고른 사진의 키를 씁니다."
  tone: {진지: 3, 격식: 3, 존중: 4, 담백: 5}
  max_length: {ko: unbounded, en: unbounded, ja: unbounded}
  keys:
    - today
    - evidence
    - calendar
    - daySheet
    - mySaju
    - share
  select: "web이 보여 주는 사진(스토어 스크린샷 today, evidence, calendar, daySheet, mySaju, share)마다 같은 이름의 키"
  examples:
    good:
      - {lang: ko, key: calendar, text: "달력 화면. 잘 풀리는 날과 조심할 날이 표시된 한 달", why: "사진에 보이는 것을 그대로", source: writing}
    bad:
      - {lang: ko, text: "앱 화면 3", why: "무엇이 보이는지 알 수 없음", source: writing}
      - {lang: ko, text: "길일을 한눈에! 중요한 약속은 길일에 잡아 보세요", why: "대체 텍스트에 홍보 문구", source: writing}
  a11y:
    truncation: "보이지 않는 글입니다."
    screen_reader: "사진 대신 읽습니다."

