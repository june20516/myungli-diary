# 랜딩 사이트 404 페이지 원고(#1358, D146). IA는 docs/ia/site.json의 web-not-found입니다.
# 원고는 content/<lang>/web.yaml, 생성물은 랜딩과 같은 generated/web/<lang>.json입니다.
# 무엇이 없는지 알리는 정보 전달이라 ko는 합니다체로 씁니다. 앱 밖 화면이라 상한은 unbounded입니다(#191).

- id: web-not-found.meta.title
  where: "web-not-found: 404 페이지의 브라우저 탭 제목"
  ia: [web-not-found.meta.title]
  purpose: info
  user_state: "없는 주소를 열어 탭 제목을 봅니다."
  structure: "페이지 제목, 세로 막대(|), 앱 이름. 랜딩 탭 제목(W49)과 같은 세로 막대를 씁니다."
  tone: {진지: 3, 격식: 3, 존중: 4, 담백: 5}
  max_length: {ko: unbounded, en: unbounded, ja: unbounded}
  keys:
    - notFoundMetaTitle
  examples:
    good:
      - {lang: ko, key: notFoundMetaTitle, text: "페이지를 찾을 수 없습니다 | 명리일기", why: "무슨 페이지인지 먼저, 앱 이름은 뒤", source: writing}
    bad:
      - {lang: ko, text: "404 Not Found", why: "숫자 코드와 영어만", source: writing}
  a11y:
    truncation: "탭 너비에 맞춰 뒤가 잘려 페이지 제목을 앞에 둡니다."
    screen_reader: "페이지 제목으로 읽습니다."

- id: web-not-found.page.title
  where: "web-not-found: 페이지 첫 줄 제목"
  ia: [web-not-found.page.title]
  purpose: info
  user_state: "링크를 눌렀는데 기대한 페이지가 아닙니다."
  structure: "한 문장. 페이지를 찾을 수 없다는 사실만 말합니다."
  tone: {진지: 3, 격식: 3, 존중: 4, 담백: 5}
  max_length: {ko: unbounded, en: unbounded, ja: unbounded}
  keys:
    - notFoundPageTitle
  examples:
    good:
      - {lang: ko, key: notFoundPageTitle, text: "페이지를 찾을 수 없습니다", why: "사실 하나", source: writing}
    bad:
      - {lang: ko, text: "앗! 길을 잃으셨나요?", why: "감탄과 사용자 탓", source: writing}
  a11y:
    truncation: "줄바꿈으로 감쌉니다."
    screen_reader: "페이지 제목(h1)으로 읽습니다."

- id: web-not-found.page.body
  where: "web-not-found: 제목 아래 안내 한 문장"
  ia: [web-not-found.page.body]
  purpose: info
  user_state: "왜 페이지가 없는지 짐작하려 합니다."
  structure: "한 문장. 주소가 없거나 바뀌었다는 것만 말하고 사과나 사용자 탓을 넣지 않습니다. 갈 곳은 아래 링크가 맡습니다."
  tone: {진지: 3, 격식: 3, 존중: 4, 담백: 5}
  max_length: {ko: unbounded, en: unbounded, ja: unbounded}
  keys:
    - notFoundPageBody
  examples:
    good:
      - {lang: ko, key: notFoundPageBody, text: "주소가 바뀌었거나 없는 페이지입니다.", why: "이유 둘을 한 문장으로", source: writing}
    bad:
      - {lang: ko, text: "주소를 잘못 입력하셨습니다.", why: "사용자 탓", source: writing}
  a11y:
    truncation: "줄바꿈으로 감쌉니다."
    screen_reader: "본문으로 읽습니다."

- id: web-not-found.page.home
  where: "web-not-found: 랜딩 첫 화면으로 가는 링크"
  ia: [web-not-found.page.home]
  purpose: guide
  user_state: "명리일기 소개로 돌아가려 합니다."
  structure: "어디로 가는지 알 수 있는 링크 이름. 앱 이름을 넣어 랜딩 첫 화면임을 알립니다."
  tone: {진지: 3, 격식: 3, 존중: 4, 담백: 5}
  max_length: {ko: unbounded, en: unbounded, ja: unbounded}
  keys:
    - notFoundPageHome
  examples:
    good:
      - {lang: ko, key: notFoundPageHome, text: "명리일기 첫 화면으로", why: "가는 곳이 보임", source: writing}
    bad:
      - {lang: ko, text: "여기를 누르세요", why: "어디로 가는지 모름", source: writing}
  a11y:
    truncation: "줄바꿈으로 감쌉니다."
    screen_reader: "링크 이름으로 읽습니다."
