# 콘텐츠 슬롯: 온보딩(onboard)
#
# core 메시지 키가 아니라 writing 식별자 키입니다. 값은 엔진 GetBirthHour 응답에서 옵니다(D58).
# start·end는 server가 HH:MM으로 만든 문자열(text)입니다.

- id: onboard.hour_confirm
  where: 태어난 시간 입력 아래 시진 확인 줄(기기 지역이 한국일 때만, D58)
  ia: [onboard-time.hour.confirm]
  select: "GetBirthHour의 시진 지지 → branch, 시작·끝 시각 → start·end. 키는 hour.confirm 하나"
  purpose: info
  user_state: 태어난 시간을 막 골랐고, 그 시간이 어느 시진으로 계산되는지 확인합니다.
  structure: 한 문장. 시진 이름과 벽시계 범위를 말합니다.
  tone: {진지: 3, 격식: 2, 존중: 4, 담백: 5}
  max_length: {ko: null, en: null, ja: null}
  keys:
    - params: {branch: [branch], start: text, end: text}
      keys:
        - hour.confirm
  variants: {count: 1, rotation: "변주가 하나입니다"}
  examples:
    good:
      - {lang: ko, key: hour.confirm, text: "{branch}시({start}~{end})에 태어났어요.", why: "D58 예시 그대로", source: writing}
    bad:
      - {lang: ko, key: hour.confirm, text: "입력하신 시각은 {branch}시에 해당합니다.", why: "합니다체 style.S3, 범위 없음", source: writing}
  endings: ["~태어났어요"]
  a11y:
    truncation: 잘리지 않게 씁니다.
    screen_reader: 시각 범위를 "부터 까지"로 읽는 것은 app이 맡습니다.
