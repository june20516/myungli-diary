# 콘텐츠 슬롯: 달력(calendar)
#
# 키별 매개변수는 엔진 코드에서 옮긴 값입니다.
#   core/src/myungli_engine/composers/month.py, rules/calendar_luck.py
# 아직 정해지지 않은 필드는 "미정" 표현으로 둡니다. 문자열은 `미정`, 맵은 `{}`,
# examples는 `{good: [], bad: []}`, max_length는 언어별 `null`입니다. 라운드 R1~R7 결과(W6~W13)로 채웠습니다.
# keys는 문자열(매개변수 없는 키) 또는 `params`와 `keys`를 묶은 맵입니다.
# params는 매개변수 -> 값 종류 맵입니다. 값 종류는 `_schema.yaml`의 keys 설명을 봅니다. `name`은 적지 않습니다.

- id: calendar.day_level
  where: 월간 달력 날짜 운 등급
  purpose: info
  user_state: 한 달 달력을 훑으며 날짜마다 붙은 등급을 봅니다.
  structure: 짧은 명사구나 한 문장. 좋음·보통·조심 정도를 담백하게 말합니다. 강조는 점 색(design)이 맡습니다.
  tone: {진지: 3, 격식: 3, 존중: 4, 담백: 5}
  max_length: {ko: null, en: null, ja: null}
  keys:
    - params: {score: number}
      keys:
        - calendar.caution
        - calendar.good
        - calendar.neutral
  variants: {count: 1, rotation: "변주가 하나입니다"}
  examples:
    good:
      - {lang: ko, key: calendar.good, text: "잘 풀리는 날", why: "담백한 명사구", source: writing}
      - {lang: ko, key: calendar.caution, text: "조심할 날", why: "겁주지 않는 명사구", source: writing}
    bad:
      - {lang: ko, key: calendar.good, text: "대길일!", why: "들뜬 강조 slop.P8", source: writing}
  endings: []
  a11y:
    truncation: 칩이나 표 칸 안에서 잘리지 않게 짧게 씁니다.
    screen_reader: 이름 그대로 읽습니다.

