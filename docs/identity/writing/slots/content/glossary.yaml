# 콘텐츠 슬롯: 값 이름 사전(glossary)
#
# 키별 매개변수는 엔진 코드에서 옮긴 값입니다.
#   (매개변수 값의 언어별 이름. 엔진 코드 없음)
# 아직 정해지지 않은 필드는 "미정" 표현으로 둡니다. 문자열은 `미정`, 맵은 `{}`,
# examples는 `{good: [], bad: []}`, max_length는 언어별 `null`입니다. 라운드 R1~R7 결과(W6~W13)로 채웠습니다.
# keys는 문자열(매개변수 없는 키) 또는 `params`와 `keys`를 묶은 맵입니다.
# params는 매개변수 -> 값 종류 맵입니다. 값 종류는 `_schema.yaml`의 keys 설명을 봅니다. `name`은 적지 않습니다.

# 키는 `<범주>.<값>`입니다. 값은 proto enum에서 UNSPECIFIED를 빼고 접두어를 제거한 소문자입니다.
# color는 element와 같은 값 집합입니다(`{element:color}`). ten_god_group은 proto enum이 아니라 여기서 정합니다.
# place는 원국 자리 8개와 지지 자리의 지장간 4개(`_hidden`)입니다. role·luck·part는 proto enum이 아니라
# core 개인 해석 매개변수에서 옮겨 여기서 정합니다(W16).

- id: glossary.value_name
  where: 문장 매개변수로 들어가는 값의 언어별 이름
  purpose: info
  user_state: 문장 안에 들어간 값(색, 방향, 십성 이름)을 읽습니다.
  structure: >-
    값 이름 하나. 색은 일상에서 쓰는 색 이름(남색, 초록), 방향은 동·서·남·북과 북동 같은 8방위, 명리 용어는 한글 이름을 씁니다.
    개인 해석 조각(W16)은 문장 안에 끼워 읽히는 명사구로 씁니다. place는 "태어난 달의 천간"처럼 자리를 풀어 쓰고,
    role은 "나와 잘 맞는 기운"처럼 역할을(R10-8), strength·luck·part는 "힘이 센 편"·"대운"·"천간"처럼 씁니다.
