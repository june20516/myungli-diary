  where: 문장 매개변수로 들어가는 값의 언어별 이름
  purpose: info
  user_state: 문장 안에 들어간 값(색, 방향, 십성 이름)을 읽습니다.
  structure: 값 이름 하나. 색은 일상에서 쓰는 색 이름(남색, 초록), 방향은 동·서·남·북과 북동 같은 8방위, 명리 용어는 한글 이름을 씁니다.
