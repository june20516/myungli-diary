# 콘텐츠 슬롯: 값 이름 사전(glossary)
#
# 키별 매개변수는 엔진 코드에서 옮긴 값입니다.
#   (매개변수 값의 언어별 이름. 엔진 코드 없음)
# 아직 정해지지 않은 필드는 "미정" 표현으로 둡니다. 문자열은 `미정`, 맵은 `{}`,
# examples는 `{good: [], bad: []}`, max_length는 언어별 `null`입니다. 라운드(W0 Task 11~13)에서 채웁니다.
# keys는 문자열(매개변수 없는 키) 또는 `params`와 `keys`를 묶은 맵입니다.

# 키는 `<범주>.<값>`입니다. 값은 proto enum에서 UNSPECIFIED를 빼고 접두어를 제거한 소문자입니다.
# color는 element와 같은 값 집합입니다(`{element:color}`). ten_god_group은 proto enum이 아니라 여기서 정합니다.

