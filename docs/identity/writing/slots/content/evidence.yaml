    - params: {element: none, place: none, role: none, strength: none}
      keys: ["basis.personal/twelve_stage"]
    - params: {all: none, day_kind: none, featured: none}
      keys: ["basis.tags/select"]
    - params: {strength_level: none, strength_score: none}
      keys: ["basis.yongsin/eokbu"]
    - params: {month_branch: none, share: none, threshold: none}
      keys: ["basis.yongsin/johu"]
    - params: {strength_level: none}
      keys: ["basis.yongsin/johu_neutral"]
  variants: {count: 1, rotation: "변주가 하나입니다"}
  examples:
    good:
      - {lang: ko, text: "일간을 돕는 오행이 부족해 그 오행을 [[용신]]으로 봤어요.", why: "규칙과 적용 값을 함께", source: writing}
    bad: []
  endings: ["~봤어요"]
  a11y:
    truncation: 잘리지 않게 씁니다.
    screen_reader: 문장 그대로 읽습니다.

