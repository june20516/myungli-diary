# 콘텐츠 슬롯: 판정 근거와 원전(evidence)
#
# 엔진 Evidence(rule_id, source_ref, detail)로 문장을 고르는 슬롯입니다. 키는 core 목록에서 옵니다(#130):
# 규칙은 core/evidence_rules.json(rule_id → detail 키), 원전은 core/evidence_sources.json(source_ref → 원전 이름·대목·원문).
# 검사기가 키와 매개변수를 이 두 파일과 대조합니다(evidence.*). basis는 규칙마다, source는 원전마다 키가 있어야 합니다.
# basis의 detail 값은 아직 형식(값 이름 범주)이 정해지지 않아 종류를 none(문장에 쓰지 않음)으로 둡니다. W1 원고를 쓸 때 범주로 바꿉니다.
# explain.today_reason은 오늘 화면에서 누를 수 있는 용어(색·방향·숫자·집중 시간·태그·총운)를 내는 규칙만 담습니다.
# 원국 개인 해석(personal/*)은 personal.* 슬롯이, 용신 판정(yongsin/*)·달력 점수·가이드 질문은 근거 시트(basis)만 맡습니다.
# 이 슬롯들의 문장은 근거·해석 열람 권한이 없으면 server가 응답에서 뺍니다(D60).

- id: explain.today_reason
  where: 풀이 시트의 "오늘 그런 이유"
  ia: [explain-sheet.today.reason]
  select: "그 용어를 낸 판정의 Evidence.rule_id r → 키 reason.<r>"
  purpose: info
  user_state: 오늘 화면의 용어를 눌러, 오늘 왜 그 기운이 드는지 궁금합니다.
  structure: 한 문장. 오늘의 일진과 내 사주가 어떻게 만나서 그 판정이 나왔는지 일상어로 말합니다. 원전과 점수는 근거 단계에서 씁니다.
  tone: {진지: 3, 격식: 2, 존중: 4, 담백: 5}
  max_length: {ko: null, en: null, ja: null}
  keys:
    - "reason.color/lucky_element"
    - "reason.direction/gwiin_branch"
    - "reason.direction/ordinary_deity_huisin"
    - "reason.direction/ordinary_deity_yongsin"
    - "reason.direction/ordinary_fallback"
    - "reason.direction/tonggwan"
    - "reason.direction/yongsin"
    - "reason.fortune/day_kind"
    - "reason.fortune/tag"
    - "reason.number/hado"
    - "reason.tags/select"
  variants: {count: 1, rotation: "변주가 하나입니다"}
  examples:
    good:
      - {lang: ko, text: "오늘 들어오는 기운이 내 사주를 돕는 쪽이라 그래요.", why: "판정의 이유를 일상어로", source: writing}
    bad: []
  endings: ["~그래요"]
  a11y:
    truncation: 잘리지 않게 씁니다.
    screen_reader: 문장 그대로 읽습니다.

- id: evidence.basis
  where: 근거 시트의 판정 근거 본문
  ia: [evidence-sheet.basis.body]
  select: "Evidence.rule_id r → 키 basis.<r>. detail 값은 매개변수로 받습니다"
  purpose: info
  user_state: 판정이 어떤 규칙으로 나왔는지 원리를 보고 싶습니다.
  structure: 한두 문장. 적용한 규칙을 명리 용어로 말하고, 내 사주의 어느 값이 그 규칙에 걸렸는지 붙입니다.
  tone: {진지: 4, 격식: 3, 존중: 4, 담백: 5}
  max_length: {ko: null, en: null, ja: null}
  keys:
    - params: {breakdown: none, score: number}
      keys: ["basis.calendar/score"]
    # 행운 색의 role 값은 YONGSIN·TONGGWAN이라 glossary role에 TONGGWAN이 없습니다. 종류는 같은 슬롯의 role과 맞추되 문장에 쓰지 않습니다(W48).
    - params: {day_kind: [day_kind], element: [element, color], note: none, role: [role]}
      keys: ["basis.color/lucky_element"]
    - params: {element: [element, color], gisin: [element, color], shifted_element: [element, color]}
      keys: ["basis.color/balance"]
    - params: {base_element: [element, color], day_branch: text, element: [element, color], shift: none, twelve_stage: [twelve_stage]}
      keys: ["basis.color/shift"]
    - params: {day_branch: text, day_kind: [day_kind], direction: [direction8]}
      keys: ["basis.direction/gwiin_branch"]
    - params: {day_branch: text, day_kind: [day_kind], deity: none, direction: [direction8], element: [element, color]}
      keys: ["basis.direction/ordinary_deity_huisin"]
    - params: {day_branch: text, day_kind: [day_kind], deity: none, direction: [direction8], element: [element, color]}
      keys: ["basis.direction/ordinary_deity_yongsin"]
    - params: {day_branch: text, day_kind: [day_kind], direction: [direction8], element: [element, color]}
      keys: ["basis.direction/ordinary_fallback"]
    - params: {day_branch: text, day_kind: [day_kind], direction: [direction8], element: [element, color]}
      keys: ["basis.direction/tonggwan"]
    - params: {day_branch: text, day_kind: [day_kind], direction: [direction8], element: [element, color]}
      keys: ["basis.direction/yongsin"]
    - params: {birth_year: none, hour_branch: none, period: none}
      keys: ["basis.focus_time/birth_year"]
    - params: {day_pillar: none, hour_branch: none, period: none}
      keys: ["basis.focus_time/day_relation"]
    - params: {hour_branch: none, huangdao: none, period: none}
      keys: ["basis.focus_time/huangdao"]
    - params: {day_kind: [day_kind], group: [ten_god_group], ten_god: [ten_god, ten_god_group]}
      keys: ["basis.fortune/day_kind"]
    - params: {day_kind: [day_kind], featured: none, group: [ten_god_group], ten_god: [ten_god, ten_god_group]}
      keys: ["basis.fortune/tag"]
    - params: {basis: none, ten_god: [ten_god, ten_god_group]}
      keys: ["basis.guide/question"]
    - params: {day_stem: text, element: [element, color], number: number, parity: none}
      keys: ["basis.number/hado"]
    - params: {gisin: [element, color], strength: [strength], yongsin: [element, color]}
      keys: ["basis.personal/day_master"]
    - params: {current: none, element: [element, color], luck: [luck], part: [part], role: [role]}
      keys: ["basis.personal/luck_ten_god"]
    - params: {current: none, element: [element, color], role: [role]}
      keys: ["basis.personal/luck_twelve_stage"]
    - params: {element: [element, color], place: [place], role: [role]}
      keys: ["basis.personal/shinsal"]
    - params: {element: [element, color], group_count: number, place: [place], role: [role], strength: [strength]}
      keys: ["basis.personal/ten_god"]
    - params: {element: [element, color], place: [place], role: [role], strength: [strength]}
      keys: ["basis.personal/twelve_stage"]
    - params: {all: none, day_kind: [day_kind], featured: none}
      keys: ["basis.tags/select"]
    - params: {day_branch: text, shinsal: [shinsal]}
      keys: ["basis.tags/cheoneul_gwiin"]
    - params: {day_branch: text, natal_positions: list:place}
      keys: ["basis.tags/clash"]
    - params: {day_branch: text, natal_positions: list:place}
      keys: ["basis.tags/clash_day_branch"]
    - params: {day_branch: text, natal_positions: list:place}
      keys: ["basis.tags/clash_month_branch"]
    - params: {day_branch: text, shinsal: [shinsal]}
      keys: ["basis.tags/dohwa"]
    - params: {day_branch: text, shinsal: [shinsal]}
      keys: ["basis.tags/gongmang"]
    - params: {day_kind: [day_kind]}
      keys: ["basis.tags/gwiin_day"]
    - params: {natal_positions: list:place, relation_kind: [relation]}
      keys: ["basis.tags/harmony"]
    - params: {day_branch: text, shinsal: [shinsal]}
      keys: ["basis.tags/hwagae"]
    - params: {branch_ten_god: [ten_god, ten_god_group], group: [ten_god_group], natal_count: number, stem_ten_god: [ten_god, ten_god_group]}
      keys: ["basis.tags/ten_god_rush"]
    - params: {day_branch: text, shinsal: [shinsal]}
      keys: ["basis.tags/yeokma"]
    - params: {day_kind: [day_kind]}
      keys: ["basis.tags/yongsin_day"]
    - params: {strength_level: [strength], strength_score: none}
      keys: ["basis.yongsin/eokbu"]
    - params: {month_branch: text, share: none, threshold: none}
      keys: ["basis.yongsin/johu"]
    - params: {strength_level: [strength]}
      keys: ["basis.yongsin/johu_neutral"]
  variants: {count: 1, rotation: "변주가 하나입니다"}
  examples:
    good:
      - {lang: ko, text: "일간을 돕는 오행이 부족해 그 오행을 [[용신]]으로 봤어요.", why: "규칙과 적용 값을 함께", source: writing}
    bad: []
  endings: ["~봤어요"]
  a11y:
    truncation: 잘리지 않게 씁니다.
    screen_reader: 문장 그대로 읽습니다.

