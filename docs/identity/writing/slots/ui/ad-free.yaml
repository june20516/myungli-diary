  purpose: info
  user_state: "광고 제거권이 무엇을 주는지 봅니다."
  structure: "한 줄. 배너 제거와 근거·해석 열림을 함께 말합니다(#52, 라운드 R8)."
  tone: {진지: 3, 격식: 2, 존중: 4, 담백: 5}
  max_length: {ko: null, en: null, ja: null}
  keys:
    - adFreeOfferHead
  variants: {count: 1, rotation: "변주가 하나입니다"}
  examples:
    good:
      - {lang: ko, key: adFreeOfferHead, text: "한 달 동안 광고 없이, 근거와 해석까지 모두 열어 봐요.", why: "라운드 R8 선택", source: writing}
