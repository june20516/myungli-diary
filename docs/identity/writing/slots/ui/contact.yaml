# ui 슬롯: 문의 화면(contact, D102, #752, #745). 원고는 라운드 R29(W54).

- id: contact.intro.body
  where: "문의 화면(contact, D102): 화면 위 안내"
  purpose: guide
  user_state: "문의를 쓰려고 화면에 들어왔습니다."
  structure: "무엇을 쓰면 되는지와 답은 메일로 온다는 안내(D102 ③)."
  tone: {진지: 3, 격식: 3, 존중: 4, 담백: 5}
  max_length: {ko: 90, en: 150, ja: 63}
  keys:
    - contactIntroBody
  variants: {count: 1, rotation: "변주가 하나입니다"}
  examples:
    good:
      - {lang: ko, key: contactIntroBody, text: "궁금한 점이나 불편한 점을 적어 주세요. 답은 적어 주신 메일로 보내 드려요.", why: "라운드 R29-1", source: writing}
    bad:
      - {lang: ko, text: "어떤 이야기든 소중히 듣고 있어요! 편하게 마음을 들려주세요.", why: "무엇을 쓰는지 말하지 않고 반김을 얹음(R29-1 대조군)", source: writing}
  endings: ["~해 주세요", "~어요"]
  a11y:
    truncation: "잘리지 않게 씁니다."
    screen_reader: "문장 그대로 읽습니다."

- id: contact.message.field
  where: "문의 화면(contact, D102): 문의 내용 입력 칸 이름과 안내"
  purpose: guide
  user_state: "문의 내용을 씁니다."
  structure: "칸 이름과 칸 안 안내."
  tone: {진지: 3, 격식: 3, 존중: 4, 담백: 5}
  max_length: {ko: 29, en: 53, ja: 23}
  key_max_length:
    contactMessageFieldHint: {ko: 34, en: 62, ja: 28}
  keys:
    - contactMessageFieldLabel
    - contactMessageFieldHint
  variants: {count: 1, rotation: "변주가 하나입니다"}
  examples:
    good:
      - {lang: ko, key: contactMessageFieldLabel, text: "문의 내용", why: "라운드 R29-5", source: writing}
      - {lang: ko, key: contactMessageFieldHint, text: "언제, 어느 화면에서 있었던 일인지 함께 적어 주세요", why: "라운드 R29-5, 답하는 데 필요한 것", source: writing}
    bad:
      - {lang: ko, text: "무엇이든 편하게 남겨 주세요 :)", why: "이모티콘과 가벼운 부름(R29-5 대조군)", source: writing}
  endings: []
  a11y:
    truncation: "칸 이름은 한 줄 안에 씁니다."
    screen_reader: "칸 이름 다음에 안내를 읽습니다."

- id: contact.email.field
  where: "문의 화면(contact, D102): 답장 받을 메일 주소 입력 칸 이름과 안내(필수)"
  purpose: guide
  user_state: "답을 받을 메일 주소를 씁니다."
  structure: "칸 이름과 칸 안 안내. 필수 칸입니다(D102 ①)."
  tone: {진지: 3, 격식: 3, 존중: 4, 담백: 5}
  max_length: {ko: 29, en: 53, ja: 23}
  key_max_length:
    contactEmailFieldHint: {ko: 17, en: 31, ja: 16}
  keys:
    - contactEmailFieldLabel
    - contactEmailFieldHint
  variants: {count: 1, rotation: "변주가 하나입니다"}
  examples:
    good:
      - {lang: ko, key: contactEmailFieldLabel, text: "답장 받을 메일", why: "라운드 R29-6", source: writing}
      - {lang: ko, key: contactEmailFieldHint, text: "name@example.com", why: "라운드 R29-6, 주소 형식만 보임", source: writing}
    bad:
      - {lang: ko, text: "정확히 적어 주셔야 답장이 제대로 갈 수 있어요!", why: "주의를 감탄으로 강조(R29-6 대조군)", source: writing}
  endings: []
  a11y:
    truncation: "칸 이름은 한 줄 안에 씁니다."
    screen_reader: "칸 이름 다음에 안내를 읽습니다."

- id: contact.attached.notice
  where: "문의 화면(contact, D102): 함께 보내는 정보 고지"
  purpose: info
  user_state: "무엇이 함께 보내지는지 봅니다."
  structure: "계정 id, 앱 버전, 기기 정보(OS, 기종)를 함께 보내고, 사용자가 고칠 수 없으며 문의 처리에만 쓴다는 고지(D102 ①)."
  tone: {진지: 3, 격식: 3, 존중: 4, 담백: 5}
  max_length: {ko: 96, en: 162, ja: 69}
  keys:
    - contactAttachedNotice
  variants: {count: 1, rotation: "변주가 하나입니다"}
  examples:
    good:
      - {lang: ko, key: contactAttachedNotice, text: "계정 id, 앱 버전, 기기 정보(OS, 기종)를 함께 보냅니다. 문의 처리에만 활용됩니다.", why: "라운드 R29-2, 수집 고지라 합니다체(W43)", source: writing}
    bad:
      - {lang: ko, text: "고객님의 소중한 정보는 안전하게 보호되며, 더 나은 서비스를 위해서만 활용됩니다.", why: "무엇을 보내는지 말하지 않고 보호를 약속(R29-2 대조군)", source: writing}
  endings: ["~ㅂ니다"]
  a11y:
    truncation: "잘리지 않게 씁니다."
    screen_reader: "문장 그대로 읽습니다."

- id: contact.send.cta
  where: "문의 화면(contact, D102): 보내기 버튼"
  purpose: guide
