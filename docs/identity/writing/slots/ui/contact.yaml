    bad: []
  endings: []
  a11y:
    truncation: "버튼 한 줄 안에 씁니다."
    screen_reader: "버튼 이름으로 읽습니다."

- id: contact.sent.toast
  where: "문의 화면(contact, D102): 보낸 뒤 결과 toast"
  purpose: info
  user_state: "문의를 보냈는지 확인합니다."
  structure: "보냈다는 결과와 답이 메일로 온다는 것."
  tone: {진지: 3, 격식: 3, 존중: 4, 담백: 5}
  max_length: {ko: 48, en: 78, ja: 34}
  keys:
    - contactSentToast
  variants: {count: 1, rotation: "변주가 하나입니다"}
  examples:
    good:
      - {lang: ko, key: contactSentToast, text: "문의를 보냈어요.", why: "라운드 R29-3, 결과만", source: writing}
    bad:
      - {lang: ko, text: "소중한 문의 감사해요! 최대한 빨리 답해 드릴게요.", why: "감사와 빠른 답 약속(R29-3 대조군)", source: writing}
  endings: ["~어요"]
  a11y:
    truncation: "toast 두 줄 안에 씁니다."
    screen_reader: "알림으로 읽습니다."

- id: contact.address.note
  where: "문의 화면(contact, D102): 메일로 직접 보낼 수 있는 주소 안내(보내기를 못 쓸 때, E14)"
  purpose: guide
  user_state: "보내기가 안 될 때 다른 길을 찾습니다."
  structure: "안내 한 문장 다음 줄에 주소 `{email}`(E14 `support@myungli-diary.app`, app이 채움)."
  tone: {진지: 3, 격식: 3, 존중: 4, 담백: 5}
  max_length: {ko: 64, en: 108, ja: 46}
  keys:
    - params: {email: text}
      keys: [contactAddressNote]
  variants: {count: 1, rotation: "변주가 하나입니다"}
  examples:
    good:
      - {lang: ko, key: contactAddressNote, text: "보내기가 안 되면 이 주소로 메일을 보내 주세요.\n{email}", why: "주소는 app이 E14 값으로 채우고 다음 줄에 둠(조사를 붙이지 않음), R28-2와 같은 말", source: writing}
    bad: []
  endings: ["~해 주세요"]
  a11y:
    truncation: "잘리지 않게 씁니다."
    screen_reader: "문장 그대로 읽습니다."

- id: ui.contact.error
  where: "문의 화면(contact): 보내기 실패(error 상태)와 메일 주소 형식 오류(IA 밖, #752)"
  purpose: guide
  user_state: "문의를 보내지 못했거나 메일 주소를 잘못 적었습니다."
  structure: "무엇이 안 됐는지와 할 일. 보내기 실패(`SendFailed`)와 주소 형식(`EmailInvalid`)을 나눕니다."
  tone: {진지: 3, 격식: 3, 존중: 4, 담백: 5}
  max_length: {ko: 48, en: 78, ja: 34}
  key_max_length:
    contactEmailInvalid: {ko: 60, en: 100, ja: 44}
  components: [toast, text-field]
  keys:
    - contactSendFailed
    - contactEmailInvalid
  variants: {count: 1, rotation: "변주가 하나입니다"}
  examples:
    good:
      - {lang: ko, key: contactSendFailed, text: "문의를 보내지 못했어요. 잠시 뒤 다시 보내 주세요.", why: "로그인 오류 문구(ui.login.error)와 같은 틀", source: writing}
      - {lang: ko, key: contactEmailInvalid, text: "메일 주소를 다시 확인해 주세요.", why: "할 일만", source: writing}
    bad: []
  endings: ["~어요", "~해 주세요"]
  a11y:
    truncation: "잘리지 않게 씁니다."
    screen_reader: "문장 그대로 읽습니다."
