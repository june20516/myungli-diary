# 화면 문구 슬롯: 오늘·공유·달력 화면(today, share-preview, calendar, day-sheet, event-edit)
#
# id는 IA 슬롯 id 그대로입니다(슬롯 명세 v1.1). keys는 ARB 메시지 이름이고, IA id를 lowerCamelCase로 바꾼 이름에
# 숫자(변주)나 대문자로 시작하는 상태 이름을 붙일 수 있습니다(#90, 검사기 ia.key_name).
# 원고는 content/<lang>/ui.yaml이고, mlw gen-docs가 generated/arb/app_<lang>.arb를 만듭니다.
# ui 원고는 앱 ARB가 렌더하므로 호칭·조사 표기·용어 토큰을 쓰지 않습니다(ui.markup).

- id: today.guide.cta
  where: "오늘 화면(today): 일기 쓰기 버튼(언제나 새 일기, D83)"
  purpose: guide
  user_state: "가이드 질문을 보고 일기를 쓰려 합니다. 오늘 이미 썼을 수도 있습니다."
  structure: "동작 이름 하나. 기본은 쓰기, `Written`은 오늘 이미 쓴 날(새 일기 쓰기, 앞에 몇 편이 있어도 맞는 말, W37), `Full`은 상한을 채운 날(누를 수 없음). 상한 수치는 쓰지 않습니다(W37). `Full` 말고는 새 일기를 엽니다(D83 ②③)."
  tone: {진지: 2, 격식: 2, 존중: 4, 담백: 5}
  max_length: {ko: 23, en: 42, ja: 19}
  keys:
    - todayGuideCta
    - todayGuideCtaWritten
    - todayGuideCtaFull
  variants: {count: 1, rotation: "변주가 하나입니다"}
  examples:
    good:
      - {lang: ko, key: todayGuideCta, text: "일기 쓰기", why: "가이드 규칙(W6·W10)으로 쓴 원고", source: writing}
      - {lang: ko, key: todayGuideCtaWritten, text: "새 일기 쓰기", why: "라운드 R12 선택(R11-9 재출제, 앞에 몇 편이 있어도 맞는 말)", source: writing}
      - {lang: ko, key: todayGuideCtaFull, text: "오늘은 충분히 썼어요", why: "라운드 R12 선택", source: writing}
    bad:
      - {lang: ko, text: "쓴 일기 보기", why: "D83으로 이 버튼은 언제나 새 일기를 엶", source: writing}
      - {lang: ko, text: "오늘 일기 10편을 다 썼어요", why: "바뀔 수 있는 상한 수치를 씀(W37)", source: writing}
  endings: []
  a11y:
    truncation: "버튼 한 줄 안에 들어가게 짧게 씁니다."
    screen_reader: "버튼 이름 그대로 읽습니다."

- id: today.event.summary
  where: "오늘 화면(today): 오늘 일정 개수와 첫 일정"
  purpose: info
  user_state: "오늘 일정을 한 줄로 봅니다."
  structure: "`NextAt`은 다음 일정의 시각과 제목, `AllPast`는 모두 지났을 때 개수 문장입니다(design event-row summary, #217). `Ongoing`·`Next`는 일정 앞 상태 꼬리표입니다. 기본 키와 `Done`은 NextAt·AllPast로 바뀌어, app이 쓰지 않는다고 확인하면 지웁니다."
  tone: {진지: 3, 격식: 3, 존중: 4, 담백: 5}
  max_length: {ko: null, en: null, ja: null}
  keys:
    - params: {count: number, title: text}
      keys: [todayEventSummary]
    - todayEventSummaryOngoing
    - todayEventSummaryNext
    - todayEventSummaryDone
    - params: {time: text, title: text}
      keys: [todayEventSummaryNextAt]
    - params: {count: number}
      keys: [todayEventSummaryAllPast]
  variants: {count: 1, rotation: "변주가 하나입니다"}
  examples:
    good:
      - {lang: ko, key: todayEventSummary, text: "오늘 일정 {count}개, {title}", why: "가이드 규칙(W6·W10)으로 쓴 원고, 가운뎃점은 쉼표로(W44)", source: writing}
      - {lang: ko, key: todayEventSummaryOngoing, text: "진행 중", why: "가이드 규칙(W6·W10)으로 쓴 원고", source: writing}
      - {lang: ko, key: todayEventSummaryNext, text: "다음", why: "가이드 규칙(W6·W10)으로 쓴 원고", source: writing}
      - {lang: ko, key: todayEventSummaryDone, text: "오늘 일정이 모두 끝났어요", why: "가이드 규칙(W6·W10)으로 쓴 원고", source: writing}
    bad: []
  endings: []
  a11y:
    truncation: "한 줄 안에 들어가게 짧게 씁니다."
    screen_reader: "이름 그대로 읽습니다."

