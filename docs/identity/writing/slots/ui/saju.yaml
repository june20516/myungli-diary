  purpose: info
  user_state: "시간 모름으로 입력해 사주 표에 시주가 없습니다."
  structure: "한 문장."
  tone: {진지: 3, 격식: 2, 존중: 4, 담백: 5}
  max_length: {ko: 52, en: 90, ja: 38}
  keys:
    - sajuChartTimeUnknownNotice
  variants: {count: 1, rotation: "변주가 하나입니다"}
  examples:
    good:
      - {lang: ko, key: sajuChartTimeUnknownNotice, text: "태어난 시간을 몰라 시주는 빼고 보여 드려요.", why: "가이드 규칙(W6·W10)으로 쓴 원고", source: writing}
