  structure: "탭 이름 하나. 명리 용어 그대로 씁니다."
  tone: {진지: 3, 격식: 3, 존중: 4, 담백: 5}
  max_length: {ko: 13, en: 21, ja: 10}
  components: [segmented]
  keys:
    - sajuChartTabNatal
    - sajuChartTabLuck
  variants: {count: 1, rotation: "변주가 하나입니다"}
