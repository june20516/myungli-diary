# 화면 문구 슬롯: 사주 표 화면(saju-chart)
#
# id는 IA 슬롯 id 그대로입니다(슬롯 명세 v1.1). keys는 ARB 메시지 이름이고, IA id를 lowerCamelCase로 바꾼 이름에
# 숫자(변주)나 대문자로 시작하는 상태 이름을 붙일 수 있습니다(#90, 검사기 ia.key_name).
# 원고는 content/<lang>/ui.yaml이고, mlw gen-docs가 generated/arb/app_<lang>.arb를 만듭니다.
# ui 원고는 앱 ARB가 렌더하므로 호칭·조사 표기·용어 토큰을 쓰지 않습니다(ui.markup).

- id: saju-chart.time-unknown.notice
  where: "사주 표 화면(saju-chart): 시간 모름으로 시주가 빠졌다는 안내"
  purpose: info
  user_state: "시간 모름으로 입력해 사주 표에 시주가 없습니다."
  structure: "한 문장."
  tone: {진지: 3, 격식: 2, 존중: 4, 담백: 5}
  max_length: {ko: 52, en: 90, ja: 38}
  keys:
    - sajuChartTimeUnknownNotice
  variants: {count: 1, rotation: "변주가 하나입니다"}
  examples:
    good:
      - {lang: ko, key: sajuChartTimeUnknownNotice, text: "태어난 시간을 몰라 시주는 빼고 보여 드려요.", why: "가이드 규칙(W6·W10)으로 쓴 원고", source: writing}
    bad: []
  endings: ["~해요", "~어요"]
  a11y:
    truncation: "잘리지 않게 씁니다."
    screen_reader: "문장 그대로 읽습니다."

