      keys: [luckSeunYear]
    - params: {age: number}
      keys: [luckSeunAge]
  variants: {count: 1, rotation: "변주가 하나입니다"}
  examples:
    good:
      - {lang: ko, key: luckDaeunAgeRange, text: "{startAge}~{endAge}세", why: "시안 \"34~43세\", 범위는 W44", source: writing}
    bad:
      - {lang: ko, text: "34~43세 · 2023~2032년", why: "가운뎃점으로 두 값을 이음(D93, W44)", source: writing}
  endings: []
  a11y:
