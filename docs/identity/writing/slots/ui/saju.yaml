  structure: "틀 둘. `ganjiReading`은 천간 독음과 지지 독음을 잇습니다(값은 glossary `stem_reading`, `branch_reading`). `ganjiReadingSuffix`는 app이 한자 글꼴로 그린 간지 한자 바로 뒤에 붙이는 괄호 독음입니다(한자는 틀에 넣지 않음, 괄호 풀이 규칙 style.S1과 글꼴이 다른 두 조각 때문). en은 앞에 한 칸을 둡니다. 스크린리더는 한자를 읽지 않고 `ganjiReading`만 읽습니다(design today.json, diary.json). ko, ja는 붙여 쓰고 en은 두 낱말로 띄어 씁니다. 괄호는 ko, en 반각, ja 전각입니다."
