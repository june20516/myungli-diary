# IA 밖 사주 표 컴포넌트 문구(#331, app A57·A64). 키 이름은 app ARB 이름 그대로입니다(W22). 상한은 design 측정 전이라 null입니다.
# 명리 용어는 기존 원고와 같은 이름을 씁니다. ja는 근거 용어집(docs/research/ja-terms/) 신뢰도 상 표기입니다(W24).
