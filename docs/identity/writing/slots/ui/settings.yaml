# 화면 문구 슬롯: 설정·정보 수정·계산 기준·계정 삭제 화면
#
# id는 IA 슬롯 id 그대로입니다(슬롯 명세 v1.1). keys는 ARB 메시지 이름이고, IA id를 lowerCamelCase로 바꾼 이름에
# 숫자(변주)나 대문자로 시작하는 상태 이름을 붙일 수 있습니다(#90, 검사기 ia.key_name).
# 원고는 content/<lang>/ui.yaml이고, mlw gen-docs가 generated/arb/app_<lang>.arb를 만듭니다.
# ui 원고는 앱 ARB가 렌더하므로 호칭·조사 표기·용어 토큰을 쓰지 않습니다(ui.markup).

