- id: account-merge.title.body
  where: "계정 합치기 화면(account-merge): 합치면 남는 것과 옮겨지는 것"
  purpose: info
  user_state: "합칠지 정하려 합니다. 옮길 기록이 0건일 수도 있습니다."
  structure: "가져올 계정의 기록은 모두 이 계정으로 옮김, 사주 정보·호칭·설정은 고른 쪽, 가져올 계정과 그 인증 수단은 지워짐, 마지막에 구매도 옮김(D85 ④, D88 ①). 0건이어도 어색하지 않게 \"있는 기록은 모두\"로 쓰고, 광고 제거 기간처럼 상품 하나에 묶인 말은 쓰지 않습니다(R15-6)."
  tone: {진지: 4, 격식: 3, 존중: 4, 담백: 5}
  max_length: {ko: 120, en: 200, ja: 84}
  keys:
    - accountMergeTitleBody
  variants: {count: 1, rotation: "변주가 하나입니다"}
  examples:
    good:
      - {lang: ko, key: accountMergeTitleBody, text: "가져올 계정의 기록은 모두 이 계정으로 옮겨요. 사주 정보·호칭·설정은 고른 쪽 것을 쓰고, 가져올 계정과 그 인증 수단은 지워져요. 구매도 이 계정으로 옮겨요.", why: "라운드 R15 선택", source: writing}
    bad:
      - {lang: ko, text: "같은 날 일기가 겹치면 하나는 지워져요.", why: "D83 ④로 같은 날 일기도 모두 옮김", source: writing}
