      - {lang: ko, key: loginMethodsErrorBodyUnlink, text: "연결을 끊지 못했어요. 다시 시도해 주세요.", why: "로그인 오류 문구(ui.login.error)와 같은 틀", source: writing}
    bad: []
  endings: ["~어요", "~해 주세요"]
  a11y:
    truncation: "잘리지 않게 씁니다."
    screen_reader: "문장 그대로 읽습니다."

