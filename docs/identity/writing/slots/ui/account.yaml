# 화면 문구 슬롯: 로그인 수단·계정 합치기 화면(D82, PR #390, drift #394, 원고 #388, D83 #409)
#
# id는 IA 슬롯 id 그대로입니다(슬롯 명세 v1.1). keys는 ARB 메시지 이름입니다(#90, 검사기 ia.key_name).
# IA 밖 컴포넌트 낱말(제공자 이름, 연결 동작, 합칠 계정 요약, 합치기 실패)은 ui.* 슬롯입니다(D77 ②, W22).
# 원고는 content/<lang>/ui.yaml이고, mlw gen-docs가 generated/arb/app_<lang>.arb를 만듭니다.

- id: login-methods.intro.body
  where: "로그인 수단 화면(login-methods): 첫머리 설명"
  purpose: guide
  user_state: "연결한 로그인 수단을 봅니다."
  structure: "연결한 인증 수단 어느 것으로 로그인해도 같은 계정이라는 설명."
  tone: {진지: 3, 격식: 3, 존중: 4, 담백: 5}
  max_length: {ko: 90, en: 150, ja: 63}
  keys:
    - loginMethodsIntroBody
  variants: {count: 1, rotation: "변주가 하나입니다"}
  examples:
    good:
      - {lang: ko, key: loginMethodsIntroBody, text: "여러 인증 수단을 연결해 두면 어느 것으로든 이 계정에 로그인할 수 있어요.", why: "라운드 R11 선택, R14 용어(인증 수단)", source: writing}
    bad: []
  endings: ["~어요"]
  a11y:
    truncation: "잘리지 않게 씁니다."
    screen_reader: "문장 그대로 읽습니다."

- id: login-methods.last.notice
  where: "로그인 수단 화면(login-methods): 마지막 남은 수단 안내"
  purpose: guide
  user_state: "로그인 수단이 하나만 남았습니다."
  structure: "마지막 남은 인증 수단은 뗄 수 없다는 안내. 막는 말(~할 수 없어요) 대신 필요한 것을 말합니다(W36)."
  tone: {진지: 3, 격식: 3, 존중: 4, 담백: 5}
  max_length: {ko: 64, en: 108, ja: 46}
  keys:
    - loginMethodsLastNotice
  variants: {count: 1, rotation: "변주가 하나입니다"}
  examples:
    good:
      - {lang: ko, key: loginMethodsLastNotice, text: "인증 수단이 하나는 남아 있어야 해요.", why: "라운드 R11 선택, R14 용어(인증 수단)", source: writing}
    bad:
      - {lang: ko, text: "로그인 수단이 하나뿐이라 연결을 끊을 수 없어요.", why: "R11-6에서 버림. 막는 말 대신 필요한 것을 말함(W36)", source: writing}
  endings: ["~어요"]
  a11y:
    truncation: "잘리지 않게 씁니다."
    screen_reader: "문장 그대로 읽습니다."

- id: login-methods.unlink.confirm
  where: "로그인 수단 화면(login-methods): 떼기 확인"
  purpose: guide
  user_state: "로그인 수단 하나를 떼려 합니다."
  structure: "확인 창: 제목은 질문(제공자 이름 매개변수), 본문(`Body`)은 연결한 다른 인증 수단으로 계속 로그인할 수 있다는 것(W36), 버튼 둘(`Unlink`, `Cancel`). 제공자 이름 뒤에 조사를 붙이지 않습니다."
  tone: {진지: 3, 격식: 3, 존중: 4, 담백: 5}
  max_length: {ko: 10, en: 16, ja: 7}
  key_max_length:
    loginMethodsUnlinkConfirm: {ko: 34, en: 60, ja: 28}
    loginMethodsUnlinkConfirmBody: {ko: unbounded, en: unbounded, ja: unbounded}
  keys:
    - params: {provider: text}
      keys: [loginMethodsUnlinkConfirm]
    - loginMethodsUnlinkConfirmBody
    - loginMethodsUnlinkConfirmUnlink
    - loginMethodsUnlinkConfirmCancel
  variants: {count: 1, rotation: "변주가 하나입니다"}
  examples:
    good:
      - {lang: ko, key: loginMethodsUnlinkConfirm, text: "{provider} 연결을 끊을까요?", why: "라운드 R11 선택, 제목 상한으로 본문과 나눔(#441)", source: writing}
      - {lang: ko, key: loginMethodsUnlinkConfirmBody, text: "연결한 다른 인증 수단으로 계속 로그인할 수 있어요.", why: "라운드 R11 선택, R14 용어(인증 수단)", source: writing}
      - {lang: ko, key: loginMethodsUnlinkConfirmUnlink, text: "연결 끊기", why: "라운드 R11 선택", source: writing}
      - {lang: ko, key: loginMethodsUnlinkConfirmCancel, text: "취소", why: "다른 확인 창과 같음", source: writing}
    bad:
      - {lang: ko, text: "{provider} 연결을 끊을까요? 끊으면 이 수단으로는 로그인할 수 없어요.", why: "R11-8에서 버림. 잃는 것 대신 남는 방법을 말함(W36)", source: writing}
      - {lang: ko, text: "{provider}(으)로 로그인할 수 없게 돼요.", why: "제공자 이름 뒤 조사가 이름마다 달라짐(카카오로·LINE으로)", source: writing}
  endings: ["~까요?", "~어요"]
  a11y:
    truncation: "잘리지 않게 씁니다."
    screen_reader: "제목, 본문, 버튼 순서로 읽습니다."

- id: login-methods.error.body
