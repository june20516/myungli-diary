# 화면 문구 슬롯: 여러 화면이 함께 쓰는 공용 문구(#143)
#
# app이 임시로 두었던 슬롯 밖 문구(오류, 탭, 버튼, 접근성 이름, 휠, 선택지, 로그인)를 writing 원고로 옮깁니다.
# IA 밖 공용 문구라 자리는 components로 적고, 키 이름은 app ARB 이름을 그대로 씁니다(W22).
# 자리표시자 값 종류는 app ARB 타입과 같습니다(int → number, String → text).
# 원고는 content/<lang>/ui.yaml이고, mlw gen-docs가 generated/arb/app_<lang>.arb를 만듭니다.
# 글자 수 상한은 design #131 답을 기다리며 null로 둡니다. en·ja는 원어민 검수(W1) 전 초안입니다.

- id: ui.error.client
  where: "오류 상태·토스트: 앱이 나눈 통신 오류 종류별 안내(연결 없음, 시간 초과, 4xx, 5xx, 그 밖, 준비 중)"
  purpose: info
  user_state: "요청이 실패해 화면을 볼 수 없거나 동작이 끝나지 않았습니다."
  structure: "한두 문장. 무엇이 안 됐는지, 그다음 할 수 있는 일(다시 시도, 연결 확인)을 씁니다. 할 일이 없으면 한 문장으로 끝냅니다."
  tone: {진지: 3, 격식: 2, 존중: 4, 담백: 5}
  max_length: {ko: null, en: null, ja: null}
  components: [error-state, toast]
  keys:
    - errorOffline
    - errorTimeout
    - errorClient
    - errorServer
    - errorUnexpected
    - errorNotImplemented
  variants: {count: 1, rotation: "변주가 하나입니다"}
  examples:
    good:
      - {lang: ko, key: errorOffline, text: "인터넷에 연결되어 있지 않아요. 연결을 확인해 주세요.", why: "#143 공용 문구 원고", source: writing}
      - {lang: ko, key: errorTimeout, text: "응답이 늦어지고 있어요. 잠시 후 다시 시도해 주세요.", why: "#143 공용 문구 원고", source: writing}
    bad:
      - {lang: ko, text: "오류가 발생했습니다.", why: "합니다체(style.S3)이고 무엇을 하면 되는지 말하지 않음", source: writing}
  endings: ["~어요", "~해 주세요"]
  a11y:
    truncation: "두 줄 안에 들어가게 씁니다."
    screen_reader: "문장 그대로 읽습니다."

