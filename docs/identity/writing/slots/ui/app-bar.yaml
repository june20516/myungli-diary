# id는 IA 슬롯 id 그대로입니다(슬롯 명세 v1.1). keys는 ARB 메시지 이름입니다(#90, 검사기 ia.key_name).
# 제목은 그 화면으로 들어가는 탭·설정 항목·링크 이름과 같은 말을 씁니다(예: 탭 "오늘" → 제목 "오늘").
# 원고는 content/<lang>/ui.yaml이고, mlw gen-docs가 generated/arb/app_<lang>.arb를 만듭니다.

