# 화면 문구 슬롯: 깊이 단계(depth)
#
# keys는 Dart 식별자(lowerCamelCase)인 ARB 메시지 이름입니다. 이 파일의 슬롯은 IA 밖 공용 문구라 지금 이름 그대로 두고,
# 자리는 components로 적습니다. IA 슬롯을 담는 ui 슬롯의 키는 IA id의 lowerCamelCase에 숫자나 상태 이름을 붙입니다(#90).
# 원고는 content/<lang>/ui.yaml이고, mlw gen-docs가 generated/arb/app_<lang>.arb를 만듭니다.
# 아직 정해지지 않은 필드는 "미정" 표현으로 둡니다. 라운드 R1~R7 결과(W6~W13)로 채웠습니다.

- id: ui.depth.explain
  where: 풀이 시트(sheet)의 접근성 라벨. 깊이 풀이 단계(explain)의 이름입니다(D79로 기본 깊이 설정이 빠져 segmented 칸에는 쓰지 않음)
  purpose: info
  user_state: 용어를 탭해 하프 시트를 엽니다.
  structure: 단계 이름 하나.
  tone: {진지: 3, 격식: 3, 존중: 4, 담백: 5}
  max_length: {ko: unbounded, en: unbounded, ja: unbounded}
  components: [sheet]
  keys:
    - depthExplain
  variants: {count: 1, rotation: "변주가 하나입니다"}
  examples:
    good:
      - {lang: ko, text: "풀이", why: "라운드 R7-1 선택", source: writing}
    bad:
      - {lang: ko, text: "왜 그런지", why: "라운드 R7-1 탈락", source: writing}
  endings: []
  a11y:
    truncation: 화면에 보이지 않는 스크린리더 전용 이름이라 상한이 없습니다(design lengths.md, #372).
    screen_reader: 시트 이름으로 읽습니다.

- id: ui.depth.evidence_link
  where: "깊이 링크(depth-link): 오늘 화면에서 근거 시트로 가는 링크 이름(#153)"
  purpose: guide
  user_state: "오늘 풀이가 왜 그런지 더 보고 싶습니다."
  structure: "동작 이름 하나. 무엇을 보는지(근거)를 넣습니다."
  tone: {진지: 2, 격식: 2, 존중: 4, 담백: 4}
  max_length: {ko: 25, en: 45, ja: 20}
  ia: [today.evidence.link]
  components: [depth-link]
  keys:
    - depthLinkEvidence
  variants: {count: 1, rotation: "변주가 하나입니다"}
  examples:
    good:
      - {lang: ko, key: depthLinkEvidence, text: "근거 보기", why: "#153 공용 문구 원고", source: writing}
    bad:
      - {lang: ko, text: "더 알아보기", why: "무엇을 보는지 말하지 않음(W17)", source: writing}
  endings: []
  a11y:
    truncation: "링크 한 줄 안에 들어가게 짧게 씁니다."
    screen_reader: "링크 이름 그대로 읽습니다."
