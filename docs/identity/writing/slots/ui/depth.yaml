# 화면 문구 슬롯: 깊이 단계(depth)
#
# keys는 Dart 식별자(lowerCamelCase)인 ARB 메시지 이름입니다. 이 파일의 슬롯은 IA 밖 공용 문구라 지금 이름 그대로 두고,
# 자리는 components로 적습니다. IA 슬롯을 담는 ui 슬롯의 키는 IA id의 lowerCamelCase에 숫자나 상태 이름을 붙입니다(#90).
# 원고는 content/<lang>/ui.yaml이고, mlw gen-docs가 generated/arb/app_<lang>.arb를 만듭니다.
# 아직 정해지지 않은 필드는 "미정" 표현으로 둡니다. 라운드 R1~R7 결과(W6~W13)로 채웠습니다.

- id: ui.depth.default_label
  where: 깊이 단계 선택의 기본 단계 이름
  purpose: info
  user_state: 설정에서 처음에 어느 단계까지 펼쳐 볼지 고릅니다.
  structure: 설정 항목 이름. 무엇을 펼치는지(명리 풀이)를 이름에 넣습니다(R8-8). 고를 값은 "요약부터 / 풀이부터 / 원리부터"입니다.
  tone: {진지: 2, 격식: 2, 존중: 4, 담백: 4}
  max_length: {ko: 10, en: 18, ja: 10}
  components: [settings-row]
  keys:
    - depthDefaultLabel
  variants: {count: 1, rotation: "변주가 하나입니다"}
  examples:
    good:
      - {lang: ko, text: "명리 풀이 보기", why: "라운드 R8-8 선택(R7-2를 바꿈)", source: writing}
    bad:
      - {lang: ko, text: "펼침 기본값", why: "기획 용어 노출", source: writing}
      - {lang: ko, text: "얼마나 자세히 볼까요", why: "무엇을 펼치는지 말하지 않음(R8-8 재출제에서 탈락)", source: writing}
  endings: []
  a11y:
    truncation: 칩이나 표 칸 안에서 잘리지 않게 짧게 씁니다.
    screen_reader: 이름 그대로 읽습니다.

- id: ui.depth.surface
  where: 깊이 단계 표면 단계(첫 단계)의 안내
  purpose: info
  user_state: 카드에서 첫 단계를 봅니다.
  structure: 단계 이름 하나.
  tone: {진지: 3, 격식: 3, 존중: 4, 담백: 5}
  max_length: {ko: 8, en: 13, ja: 6}
  components: [segmented]
  keys:
    - depthSurface
  variants: {count: 1, rotation: "변주가 하나입니다"}
  examples:
    good:
      - {lang: ko, text: "요약", why: "라운드 R7-1 선택", source: writing}
    bad:
      - {lang: ko, text: "가볍게", why: "라운드 R7-1 탈락", source: writing}
  endings: []
  a11y:
    truncation: 칩이나 표 칸 안에서 잘리지 않게 짧게 씁니다.
    screen_reader: 이름 그대로 읽습니다.

