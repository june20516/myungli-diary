# 슬롯 명세 틀 (spec §4.1). 로더는 이 파일을 슬롯 검증 기준으로 씁니다.

- name: id
  required: true
  type: string
  description: 슬롯 식별자 (예 daily.fortune.head)
- name: where
  required: true
  type: string
  description: 사용 위치인 화면·컴포넌트. IA가 나오면 IA 화면 id로 연결합니다.
- name: purpose
  required: true
  type: "enum[info, guide, care]"
  description: 정보, 안내·기능 설명, 위로·공감. 원칙 0의 허용 범위를 정하는 축입니다.
- name: user_state
  required: true
  type: string
  description: 언제 어떤 상태로 보는가
- name: structure
  required: true
  type: string
  description: 문장 구조인 문장 수와 순서
- name: types
  required: false
  type: "list[enum[advice, state, care]]"
  description: 적용하는 문장 유형. 없으면 생략합니다.
- name: depth
  required: false
  type: map
  description: 깊이 단계(D37)와 단계별 허용 용어 범주
- name: endings
  required: false
  type: "list[string]"
  description: 우선 문장 맺음 (style.yaml 참조)
- name: tone
  required: true
  type: "map[string, int 1..5]"
  description: 톤 좌표인 진지·격식·존중·담백 각 1~5
- name: max_length
  required: true
  type: "map[lang, int | null]"
  description: 언어별 글자 수 상한. design과 조정하며 null이면 아직 정하지 않았습니다.
- name: keys
  required: true
  type: "list[string | map]"
  description: 메시지 키 또는 식별자 목록과 키별 매개변수
- name: variants
  required: false
  type: map
  description: 유형별 변주 수와 순환 규칙
- name: allowed
  required: false
  type: "list[string]"
  description: 목적별 허용 표현. 원칙 0 예외로 허용하는 slop 패턴 ID
- name: forbidden
  required: false
  type: "list[string]"
  description: 이 슬롯에서 추가로 금지하는 패턴 ID
- name: examples
  required: true
  type: "map[good|bad, list[map]]"
  description: 언어별 좋은 예와 나쁜 예, 이유 포함
- name: co_display
  required: false
  type: "list[string]"
  description: 같은 화면에 함께 나오는 슬롯 id. 빈도·밀도 검사용입니다.
- name: a11y
  required: false
  type: map
  description: 잘림 처리와 스크린리더 읽기
