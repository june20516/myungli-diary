# 슬롯 명세 틀 (W0 spec §4.1, IA 슬롯 spec §2). 판 번호는 계약 목록(docs/contracts/README.md)에 둡니다. 로더는 이 파일을 슬롯 검증 기준으로 씁니다.

- name: id
  required: true
  type: string
  description: 슬롯 식별자 (예 daily.fortune.head)
- name: where
  required: true
  type: string
  description: 사용 위치인 화면·컴포넌트. IA가 나오면 IA 화면 id로 연결합니다.
- name: purpose
  required: true
  type: "enum[info, guide, care]"
  description: 정보, 안내·기능 설명, 위로·공감. 원칙 0의 허용 범위를 정하는 축입니다.
- name: user_state
  required: true
  type: string
  description: 언제 어떤 상태로 보는가
- name: structure
  required: true
  type: string
  description: 문장 구조인 문장 수와 순서
- name: types
  required: false
  type: "list[enum[advice, state, care]]"
  description: 적용하는 문장 유형. 없으면 생략합니다.
- name: depth
  required: false
  type: map
  description: 깊이 단계(D37)와 단계별 허용 용어 범주
- name: endings
  required: false
  type: "list[string]"
  description: 우선 문장 맺음 (style.yaml 참조)
- name: tone
  required: true
  type: "map[string, int 1..5]"
  description: 톤 좌표인 진지·격식·존중·담백 각 1~5
- name: max_length
  required: true
  type: "map[lang, int | unbounded | null]"
  description: >-
    언어별 글자 수 상한. design과 조정하며(docs/identity/design/lengths.md) null이면 아직 정하지 않았습니다.
    unbounded는 레이아웃이 길이를 막지 않아(스크린리더 전용, 스크롤 본문, 확인 창 본문, app 밖 화면) 상한을 두지 않는다는 뜻입니다(#191).
- name: key_max_length
  required: false
  type: "map[string, map[lang, int | unbounded | null]]"
  description: >-
    키별 언어별 상한. 적힌 언어는 그 키에 슬롯 max_length 대신 씁니다. 한 슬롯의 키가 다른 칸에 놓일 때 씁니다
    (예 확인 창 슬롯의 제목·본문·버튼 키, #191). 키는 이 슬롯의 keys에 있어야 합니다.
- name: keys
  required: true
  type: "list[string | map]"
  description: >-
    메시지 키 또는 식별자 목록과 키별 매개변수. 항목은 문자열(매개변수 없는 키) 또는 {params, keys} 맵입니다.
    params는 매개변수 -> 값 종류 맵이고 값 종류는 다섯 중 하나입니다.
    ① glossary 범주 목록(예 [element, color]): 첫째가 기본 범주, 나머지는 {p:cat}로 고를 수 있는 범주.
    ② list:<범주>(예 list:branch): 목록 값을 범주 이름으로 바꿔 ", "로 잇습니다.
    ③ number: 숫자를 그대로 씁니다.
    ④ none: 문장에 쓸 수 없는 값입니다.
    ⑤ text: 렌더하는 쪽이 만든 문자열(날짜, 시각, 가격, 일정 제목)을 그대로 씁니다. 범주를 붙일 수 없습니다.
    name(호칭)은 모든 슬롯에서 쓸 수 있으므로 적지 않습니다.
    메시지 키의 매개변수 이름은 core/message_params.json과 같아야 합니다(complete.param_mismatch).
- name: ia
  required: false
  type: "list[string]"
  description: >-
    이 슬롯의 문장이 들어가는 IA 슬롯 id(docs/ia/screens.json). 여러 개일 수 있습니다.
    ui 슬롯은 보통 id가 IA 슬롯 id 그대로라 적지 않습니다. 예외로 D77로 IA에 올린 기존 문구는 키를 바꾸지 않게
    `ui.*` 슬롯 id를 두고 여기에 IA 슬롯 id를 적습니다(W20 개정, W33).
- name: components
  required: false
  type: "list[string]"
  description: IA 슬롯이 아니라 컴포넌트 안에 들어가는 이름의 자리(IA 컴포넌트 id). 예 tag-chip, day-cell
- name: select
  required: false
  type: string
  description: >-
    렌더하는 쪽이 키를 고르는 방법. core 메시지 키가 아닌 writing 식별자 키를 쓰는 content 슬롯과,
    app이 상태(사유)로 키를 고르는 ui 슬롯에 적습니다.
    예 "DailyResponse.day_kind 값 v → 키 character.reason.<v>"
- name: vocative
  required: false
  type: bool
  description: >-
    호칭 자리(D36). true인 슬롯만 {name}을 쓰고, 문장 맨 앞 호칭 덩어리(ko "{name}님, ", ja "{name}さん、",
    en "{name}, ")로만 씁니다. 호칭이 없으면 렌더러가 덩어리를 지웁니다(호칭·조사 규칙 v1.1).
- name: variants
  required: false
  type: map
  description: 유형별 변주 수와 순환 규칙
- name: allowed
  required: false
  type: "list[string]"
  description: 목적별 허용 표현. 원칙 0 예외로 허용하는 slop·문체 규칙 ID. 검사기는 이 슬롯에서 그 규칙을 건너뜁니다.
- name: forbidden
  required: false
  type: "list[string]"
  description: >-
    이 슬롯에서 추가로 금지하는 규칙 ID. 검사기는 규칙의 exempt_purposes와 관계없이 이 슬롯에 적용합니다.
    judge가 llm인 규칙은 CI 문장 검사에서 돌지 않으므로 적어도 CI에서는 효과가 없습니다(LLM 판정 명령의 몫).
- name: examples
  required: true
  type: "map[good|bad, list[map]]"
  description: 언어별 좋은 예와 나쁜 예, 이유 포함
- name: co_display
  required: false
  type: "list[string]"
  description: 같은 화면에 함께 나오는 슬롯 id. 빈도·밀도 검사용입니다.
- name: a11y
  required: false
  type: map
  description: 잘림 처리와 스크린리더 읽기
