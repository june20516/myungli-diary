# 용어 뜻(term) 원고(ja). 원어민 검수 전 초안. 태그 15개는 W1-1(#240), 나머지는 W1-3.
- {slot: term.meaning, key: term.tag.big_change, text: "命式の日支や月支と大きくぶつかることで、慣れた暮らしに変化が起きやすくなります。"}
- {slot: term.meaning, key: term.tag.cheoneul_gwiin, text: "最も尊い助けを表す神殺で、思いがけない人が手を差し伸べてくれやすくなります。"}
- {slot: term.meaning, key: term.tag.clash, text: "反対の気がぶつかり合うことで、予定が変わったり意見が分かれたりしやすくなります。"}
- {slot: term.meaning, key: term.tag.dohwa, text: "人の目を引く気を表す神殺で、魅力が表に出て注目を集めやすくなります。"}
- {slot: term.meaning, key: term.tag.gongmang, text: "空いた席を表す神殺で、努力した分の結果がすぐには手に入らないことがあります。"}
- {slot: term.meaning, key: term.tag.gwiin_day, text: "自分を助けてくれる人が近づく日で、助けを頼むのに向いています。"}
- {slot: term.meaning, key: term.tag.harmony, text: "異なる気がかみ合って一つになることで、人や物事がよくなじみます。"}
- {slot: term.meaning, key: term.tag.hwagae, text: "内側を深く見つめる気を表す神殺で、考えごとや趣味に心が向きやすくなります。"}
- {slot: term.meaning, key: term.tag.ten_god_rush.bigyeop, text: "命式にすでに多い比劫がその日さらに入ることで、自分や自分の取り分を前に出しがちです。"}
- {slot: term.meaning, key: term.tag.ten_god_rush.siksang, text: "命式にすでに多い食傷がその日さらに入ることで、言葉や表現があふれやすくなります。"}
- {slot: term.meaning, key: term.tag.ten_god_rush.jaeseong, text: "命式にすでに多い財星がその日さらに入ることで、お金や結果に心が向きやすくなります。"}
- {slot: term.meaning, key: term.tag.ten_god_rush.gwanseong, text: "命式にすでに多い官星がその日さらに入ることで、責任や決まりが重く感じられます。"}
- {slot: term.meaning, key: term.tag.ten_god_rush.inseong, text: "命式にすでに多い印星がその日さらに入ることで、考えが増え、誰かに頼りたくなります。"}
- {slot: term.meaning, key: term.tag.yeokma, text: "動きを表す神殺で、移動や外出が増えます。"}
- {slot: term.meaning, key: term.tag.yongsin_day, text: "命式に必要な気が入る日で、進めていることが順調に運びやすくなります。"}
- {slot: term.meaning, key: term.element.wood, text: "木のように上へ伸び、四方へ広がっていく性質です。人には、新しく始めて育てていこうとする心として表れます。"}
- {slot: term.meaning, key: term.element.fire, text: "火のように燃え上がり、明るく広がる性質です。人には、表に出して伝えようとする心として表れます。"}
- {slot: term.meaning, key: term.element.earth, text: "土のように受け止めて、つなぎとめておく性質です。人には、間を取り持ち、中心を守ろうとする心として表れます。"}
- {slot: term.meaning, key: term.element.metal, text: "金属のようにかたく、鋭く切り分ける性質です。人には、物事の是非を分け、きちんとけりをつけようとする心として表れます。"}
- {slot: term.meaning, key: term.element.water, text: "水のように低いほうへ流れ、しみ込んでいく性質です。人には、深く考え、静かに見守る心として表れます。"}
- {slot: term.meaning, key: term.stem.gap, text: "十干の一番目で、まっすぐ伸びる大きな木に似ています。一度決めた道をこつこつ進む姿です。"}
- {slot: term.meaning, key: term.stem.eul, text: "十干の二番目で、どこにでも根を張る草花に似ています。状況に合わせてしなりながらも、粘り強く育つ姿です。"}
- {slot: term.meaning, key: term.stem.byeong, text: "十干の三番目で、明るく照らす真昼の太陽に似ています。隠さず、広く明るく表に出す姿です。"}
- {slot: term.meaning, key: term.stem.jeong, text: "十干の四番目で、暗がりを照らす灯火に似ています。身近なところを長く温かく照らす姿です。"}
- {slot: term.meaning, key: term.stem.mu, text: "十干の五番目で、どっしりと構える大きな山に似ています。簡単には揺らがず、支えてくれる姿です。"}
- {slot: term.meaning, key: term.stem.gi, text: "十干の六番目で、種を育てる広い畑に似ています。受け入れたものを一歩ずつ育てていく姿です。"}
- {slot: term.meaning, key: term.stem.gyeong, text: "十干の七番目で、磨く前のかたい鉄に似ています。曲げずに、すぐに決める姿です。"}
- {slot: term.meaning, key: term.stem.sin, text: "十干の八番目で、美しく磨いた宝石に似ています。細やかに見分け、きれいに整える姿です。"}
- {slot: term.meaning, key: term.stem.im, text: "十干の九番目で、遠くへ流れていく大河に似ています。広く受け入れながら、滞りなく進んでいく姿です。"}
- {slot: term.meaning, key: term.stem.gye, text: "十干の十番目で、澄んだ湧き水に似ています。静かにそばを見守る姿です。"}
- {slot: term.meaning, key: term.branch.ja, text: "ねずみ年を表す地支です。真冬と真夜中を指します。"}
- {slot: term.meaning, key: term.branch.chuk, text: "うし年を表す地支です。冬の終わりと夜明け前を指します。"}
- {slot: term.meaning, key: term.branch.in, text: "とら年を表す地支です。早春と明け方を指します。"}
- {slot: term.meaning, key: term.branch.myo, text: "うさぎ年を表す地支です。春の盛りと日の出のころを指します。"}
- {slot: term.meaning, key: term.branch.jin, text: "たつ年を表す地支です。晩春と朝を指します。"}
- {slot: term.meaning, key: term.branch.sa, text: "へび年を表す地支です。初夏と昼前を指します。"}
- {slot: term.meaning, key: term.branch.o, text: "うま年を表す地支です。真夏と真昼を指します。"}
- {slot: term.meaning, key: term.branch.mi, text: "ひつじ年を表す地支です。晩夏と昼過ぎを指します。"}
- {slot: term.meaning, key: term.branch.shin, text: "さる年を表す地支です。初秋と夕方前を指します。"}
- {slot: term.meaning, key: term.branch.yu, text: "とり年を表す地支です。秋の盛りと日の入りのころを指します。"}
- {slot: term.meaning, key: term.branch.sul, text: "いぬ年を表す地支です。晩秋と宵の口を指します。"}
- {slot: term.meaning, key: term.branch.hae, text: "いのしし年を表す地支です。初冬と夜を指します。"}
- {slot: term.meaning, key: term.ten_god.bigyeon, text: "肩を並べる友人や仲間のように、自分と対等な気です。自分の力でやり遂げようとする心や、こだわりの強さとして表れやすくなります。"}
- {slot: term.meaning, key: term.ten_god.geopjae, text: "自分に似ていながら、自分の取り分を争うライバルのような気です。負けたくない気持ちや、思い切った決断として表れます。"}
- {slot: term.meaning, key: term.ten_god.siksin, text: "自分が持っているものを、のびのびと表に出す気です。食べて楽しむゆとりや、こつこつ何かを生み出す才として表れます。"}
- {slot: term.meaning, key: term.ten_god.sanggwan, text: "自分の考えを、ためらわず外へ出す気です。鋭い話しぶりや、型を破る機転として表れやすくなります。"}
- {slot: term.meaning, key: term.ten_god.pyeonjae, text: "大きく動くお金や機会を表す気です。物事を広く手がけ、人と幅広く付き合う手腕として表れます。"}
- {slot: term.meaning, key: term.ten_god.jeongjae, text: "少しずつ貯めるお金や、自分が守る取り分を表す気です。きちんと管理し、大切に使う誠実さとして表れます。"}
- {slot: term.meaning, key: term.ten_god.pyeongwan, text: "自分を鍛える厳しい基準や試練を表す気です。困難の前で踏みとどまる力として表れます。"}
- {slot: term.meaning, key: term.ten_god.jeonggwan, text: "自分を正しく導く決まりや責任を表す気です。約束を守り、任された役目を果たす姿として表れます。"}
- {slot: term.meaning, key: term.ten_god.pyeonin, text: "人とは違う道で学び、気づいていく気です。独特な発想や、一つのことを深く掘り下げる姿として表れます。"}
- {slot: term.meaning, key: term.ten_god.jeongin, text: "自分を大切にし、育ててくれる慈しみや学びを表す気です。落ち着いて学び、受けた助けをありがたく思う姿として表れます。"}
- {slot: term.meaning, key: term.ten_god_group.bigyeop, text: "比肩と劫財をまとめた呼び名で、自分と肩を並べる気です。自分を守り、自分の取り分を確保しようとする力がここに入ります。"}
- {slot: term.meaning, key: term.ten_god_group.siksang, text: "食神と傷官をまとめた呼び名で、内にあるものを外へ表す気です。言葉、表現、手先の器用さがここに入ります。"}
- {slot: term.meaning, key: term.ten_god_group.jaeseong, text: "偏財と正財をまとめた呼び名で、自分が扱い、手にするお金や結果を表します。暮らしのやりくり、仕事の成果、現実感覚がここに入ります。"}
- {slot: term.meaning, key: term.ten_god_group.gwanseong, text: "偏官と正官をまとめた呼び名で、自分を律する決まりや責任を表します。職場、名誉、守るべき約束がここに入ります。"}
- {slot: term.meaning, key: term.ten_god_group.inseong, text: "偏印と印綬をまとめた呼び名で、自分を育ててくれる学びや慈しみを表します。勉強、考えごと、受ける助けがここに入ります。"}
- {slot: term.meaning, key: term.shinsal.cheoneul_gwiin, text: "神殺の中で最も尊い助けを表します。困ったときに、思いがけない人が手を差し伸べてくれる福と見ます。"}
- {slot: term.meaning, key: term.shinsal.dohwa, text: "人の目を引く魅力を表す神殺です。人気やおしゃれ、異性からの関心として表れやすくなります。"}
- {slot: term.meaning, key: term.shinsal.yeokma, text: "遠くへ駆ける馬を表す神殺です。引っ越し、旅行、忙しい移動のように、居場所を移すこととして表れやすくなります。"}
- {slot: term.meaning, key: term.shinsal.hwagae, text: "内側を深く見つめる力を表す神殺です。勉強や芸術のように、一つのことに打ち込む姿として表れます。"}
- {slot: term.meaning, key: term.shinsal.yangin, text: "刃のようにとても強い推進力を表す神殺です。押し進める力が大きい分、争いやけがに気をつける必要があります。"}
- {slot: term.meaning, key: term.shinsal.gongmang, text: "空いた席を表す神殺です。努力した分の結果がすぐには手に入らないことがあり、欲を少し手放すときと見ます。"}
- {slot: term.meaning, key: term.day_kind.gwiin_day, text: "その日の気が、命式に貴人として届く日です。自分を助けてくれる人が近づきやすくなります。"}
- {slot: term.meaning, key: term.day_kind.yongsin_day, text: "命式に最も必要な気が入る日です。後回しにしていたことに手をつけるのに向いています。"}
- {slot: term.meaning, key: term.day_kind.gisin_day, text: "命式とあまり合わない気が入る日です。無理をせず、今していることを守るのに向いています。"}
- {slot: term.meaning, key: term.day_kind.ordinary_day, text: "命式を大きく助けも妨げもしない気が入る日です。いつも通りに過ごすのに向いています。"}
- {slot: term.meaning, key: term.relation.stem_hap, text: "二つの天干が引かれ合い、対になることです。人や物事が思いがけず手を結びやすくなります。"}
- {slot: term.meaning, key: term.relation.branch_hap, text: "二つの地支がかみ合い、一つになることです。関係が近づき、物事がよくなじみやすくなります。"}
- {slot: term.meaning, key: term.relation.chung, text: "向かい合う位置にある二つの地支がぶつかり合うことです。予定が変わったり、居場所を移したりすることが起きやすくなります。"}
- {slot: term.meaning, key: term.relation.hyeong, text: "地支同士が互いに削り合うことです。小さな摩擦や直すべきところが見えやすいので、丁寧に確かめるとよいでしょう。"}
- {slot: term.meaning, key: term.role.yongsin, text: "命式のバランスを整えるのに最も必要な五行です。この気が入る時期は、物事が順調に運びやすくなります。"}
- {slot: term.meaning, key: term.role.huisin, text: "用神をそばで助け、力を添える五行です。用神ほどではなくても、うれしい気です。"}
- {slot: term.meaning, key: term.role.gisin, text: "命式とあまり合わない五行です。この気が強い時期は、無理をしないのがよいでしょう。"}
- {slot: term.meaning, key: term.role.neutral, text: "命式を大きく助けも損ないもしない五行です。それ自体は穏やかな気です。"}
- {slot: term.meaning, key: term.luck.daeun, text: "人生の季節のように、10年ごとに巡ってくる大きな流れです。"}
- {slot: term.meaning, key: term.luck.seun, text: "年ごとに変わる、一年の流れです。その年に入る気が命式とどう合うかを表します。"}
