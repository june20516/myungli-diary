- {slot: calc-basis.schools.body, key: calcBasisSchoolsBody, text: "蔵干はひとつに絞らず、すべて表示します。子の刻に生まれた場合は、午前0時より前でも翌日として計算します。流派によって扱いが異なるため、ほかのアプリや本と結果が異なることがあります。"}
- {slot: calc-basis.longitude.body, key: calcBasisLongitudeBodySubtract, text: "出生時刻は{longitude}を基準に{minutes}分を引いて計算します。真太陽時は使いません。そのため、時の境目の数分以内に生まれた場合は、ほかの万歳暦アプリと時柱が異なることがあります。"}
- {slot: calc-basis.longitude.body, key: calcBasisLongitudeBodyAdd, text: "出生時刻は{longitude}を基準に{minutes}分を足して計算します。真太陽時は使いません。そのため、時の境目の数分以内に生まれた場合は、ほかの万歳暦アプリと時柱が異なることがあります。"}
- {slot: calc-basis.longitude.body, key: calcBasisLongitudeBodyNone, text: "出生時刻は{longitude}を基準に、補正せずに計算します。真太陽時は使いません。そのため、時の境目の数分以内に生まれた場合は、ほかの万歳暦アプリと時柱が異なることがあります。"}
- {slot: calc-basis.longitude.body, key: calcBasisLongitudeBodyDstSubtract, text: "出生時刻は、サマータイムの{dstMinutes}分を先に引き、{longitude}を基準にさらに{minutes}分を引いて計算します。真太陽時は使いません。そのため、時の境目の数分以内に生まれた場合は、ほかの万歳暦アプリと時柱が異なることがあります。"}
- {slot: calc-basis.longitude.body, key: calcBasisLongitudeBodyDstAdd, text: "出生時刻は、サマータイムの{dstMinutes}分を先に引き、{longitude}を基準に{minutes}分を足して計算します。真太陽時は使いません。そのため、時の境目の数分以内に生まれた場合は、ほかの万歳暦アプリと時柱が異なることがあります。"}
- {slot: calc-basis.longitude.body, key: calcBasisLongitudeBodyDstNone, text: "出生時刻は、サマータイムの{dstMinutes}分だけを引いて計算します。{longitude}が基準のため、経度の補正はしません。真太陽時は使いません。そのため、時の境目の数分以内に生まれた場合は、ほかの万歳暦アプリと時柱が異なることがあります。"}
