# 원전 출처(evidence.source) 원고(ja). W1-3b. 원문은 core quote를 정자로 옮김(W62), 원전 이름은 일본 신자체(窮通宝鑑), 뜻은 ko 원고와 같은 정보입니다. 원어민 검수 전 초안입니다. 줄 순서는 뜻, 원문, 출처(D118 ③, W64).
- {slot: evidence.source, key: "source.gungtong-bogam/five_elements#balance_principle", text: "多すぎるものは減らし、足りないものは補って中ほどへ戻すことが、命理の要だという意味です。\n以義推之，夫萬物負陰而抱陽，沖氣以和。過與不及，皆爲乖道。故高者抑之使平，下者舉之使崇，或益其不及，或損其太過。所以貴在折衷，歸於中道，使無有餘不足之累，即才官印食貴人驛馬之微意也。行運亦如之，識其微意，則於命理之說，思過半矣。\n窮通宝鑑「五行総論」"}
- {slot: evidence.source, key: "source.gungtong-bogam/five_elements#color", text: "五行にはそれぞれ本来の色があり、水は黒、火は赤、木は青、土は黄だという意味です。\n推其形色，則水黑、火赤、木青、土黃，此正色也。及其變易，則不然。常以生旺從正色，死絶從母色，成形冠帶從妻色，病敗從鬼色，旺墓從子色。\n窮通宝鑑「五行総論」"}
- {slot: evidence.source, key: "source.gungtong-bogam/five_elements#direction", text: "北は水、南は火、東は木、西は金、中央は土を生むという意味です。\n北方陰極而生寒，寒生水。南方陽極而生熱，熱生火。東方陽散以泄而生風，風生木。西方陰止以收而生燥，燥生金。中央陰陽交而生溫，溫生土。其相生也所以相維，其相剋也所以相制，此之謂有倫。\n窮通宝鑑「五行総論」"}
- {slot: evidence.source, key: "source.gungtong-bogam/five_elements#number", text: "五行にはそれぞれ数があり、水は1、火は2、木は3、金は4、土は5だという意味です。\n其數則水一、火二、木三、金四、土五。生旺加倍，死絶減半。\n窮通宝鑑「五行総論」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.丑", text: "十二月生まれの丁の日干には、庚と甲を用いるという意味です。\n三冬丁火微寒，專用庚甲。\n窮通宝鑑「三冬丁」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.亥", text: "十月生まれの丁の日干には、庚と甲を用いるという意味です。\n三冬丁火微寒，專用庚甲。\n窮通宝鑑「三冬丁」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.午", text: "五月の丁は自ら力が強い時期なので、甲をむやみに用いてはいけないという意味です。\n五月丁火，時歸建祿，不宜亂用甲木。\n窮通宝鑑「五月丁」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.卯", text: "二月生まれの丁の日干には、まず庚が、次に甲が必要だという意味です。\n二月丁火，濕乙傷丁，先庚後甲，非庚不能去乙，非甲不能引丁。\n窮通宝鑑「二月丁」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.子", text: "十一月の丁は、水があふれて助けとなる気がなければ、抑える力に従う命式となり、別の道で名を上げるという意味です。\n十一月丁火，或仲冬水多癸旺，全無比印，此作棄命從殺，亦有異途功名。\n窮通宝鑑「十一月丁」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.寅", text: "正月生まれの丁の日干には、力の強い甲を割る庚を用いるという意味です。\n正月丁火，甲木當權，乃爲母旺，非庚不能劈甲，何以引丁，姑用庚金。\n窮通宝鑑「正月丁」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.巳", text: "四月生まれの丁の日干には、甲を用いつつ、必ず庚で甲を割らなければならないという意味です。\n四月丁火乘旺，雖取甲引丁，必用庚劈甲。\n窮通宝鑑「四月丁」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.戌", text: "九月の丁は、戊が多くて火の気を奪い、甲がなければ、かえって並外れた命式になるという意味です。\n或九月一派戊土，洩丁火之氣，不見甲木，爲傷官傷盡，非尋常可比。\n窮通宝鑑「九月丁」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.未", text: "六月生まれの丁の日干には、まず甲が、次に壬が必要だという意味です。\n六月之丁，陰柔退氣，但値三伏生寒，丁弱極矣，專取甲木，壬水次之。\n窮通宝鑑「六月丁」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.申", text: "七月生まれの丁の日干には、まず甲が、次に甲を割る庚が必要で、丙を借りることもできるという意味です。\n七月丁火，退氣柔弱，端用甲木，金雖乘旺司權，無傷丁之理，仍取庚劈甲，爲引火之物，或借丙暖金晒甲，不慮丙奪丁光，凡兩丙夾丁者，夏月忌之，餘月不忌，但此格少年困苦刑剋中年富貴，必要地支見水制丙，方妙。\n窮通宝鑑「七月丁」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.辰", text: "三月生まれの丁の日干には、まず甲が、次に庚が必要だという意味です。\n三月丁火，戊土司令，洩弱丁氣，先用甲木引丁制土，次看庚金。\n窮通宝鑑「三月丁」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.酉", text: "八月の丁は、辛が多く、庚も助けとなる火もなければ、財に従う命式となり、豊かで尊くなるという意味です。\n或八月一派辛金，不見庚金，又無比劫，此棄命從財，富而且貴，雖不科甲，亦有異途。\n窮通宝鑑「八月丁」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.丑", text: "十二月生まれの丙の日干には、まず壬が必要だという意味です。\n十二月丙火，氣進二陽，侮雪欺霜，喜壬爲用。\n窮通宝鑑「十二月丙」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.亥", text: "十月生まれの丙の日干は、甲、戊、庚が現れれば、試験に受かって名を上げるという意味です。\n十月丙火，太陽失令，得見甲戊庚出干，可云科甲，主爲人性好清高，斯文領袖。\n窮通宝鑑「十月丙」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.午", text: "五月生まれの丙の日干は、壬が高く現れてこそ、よい命式になるという意味です。\n五月丙火，得壬高透，方爲上命。\n窮通宝鑑「五月丙」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.卯", text: "二月生まれの丙の日干には、壬だけを用いるという意味です。\n二月丙火，陽氣舒升，專用壬水。\n窮通宝鑑「二月丙」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.子", text: "十一月生まれの丙の日干には、まず壬が、次に戊が必要だという意味です。\n十一月丙火，冬至一陽生，弱中復強，壬水爲最，戊土佐之。\n窮通宝鑑「十一月丙」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.寅", text: "正月生まれの丙の日干には、まず壬が必要で、庚と辛が助けるという意味です。\n正月用壬，庚辛爲助。\n窮通宝鑑「正月丙」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.巳", text: "四月生まれの丙の日干には、壬を第一に用い、金の気が助けるという意味です。\n四月專用壬水，金爲佐。\n窮通宝鑑「四月丙」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.戌", text: "九月生まれの丙の日干には、まず甲が、次に壬が必要だという意味です。\n九月丙火，火氣愈退，所忌土晦光火，必須先用甲木，次取壬水。\n窮通宝鑑「九月丙」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.未", text: "六月生まれの丙の日干には、まず壬が、次に庚が必要だという意味です。\n六月丙火退氣，三伏生寒，壬水爲用，取庚輔佐。\n窮通宝鑑「六月丙」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.申", text: "七月の丙は、日が西に傾いて気が弱まるという意味です。\n七月丙火，太陽轉西，陽氣衰矣。\n窮通宝鑑「七月丙」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.辰", text: "三月生まれの丙の日干には、まず壬が必要だという意味です。\n三月丙火，氣漸炎升，用壬水。\n窮通宝鑑「三月丙」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.酉", text: "八月生まれの丙の日干には、沈んでいく光を映す壬が、今も必要だという意味です。\n八月丙火，日近黃昏，丙火之餘光，存於光湖，仍用壬水輔映。\n窮通宝鑑「八月丙」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.丑", text: "十二月生まれの乙の日干には、戊ではなく丙だけを用いるという意味です。\n冬月之木，雖取戊制水，不可作用，專取丙火則可。\n窮通宝鑑「三冬乙」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.亥", text: "十月生まれの乙の日干には、まず丙が、次に戊が必要だという意味です。\n十月乙木，木不受氣，而壬水司令，取丙爲用，戊土次之。\n窮通宝鑑「十月乙」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.午", text: "五月の乙は、丁が力を握り、穀物がみな日照りに遭う時期だという意味です。\n五月乙木，丁火司權，禾稼俱旱。\n窮通宝鑑「五月乙」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.卯", text: "二月生まれの乙の日干には、まず丙が、次に癸が必要だという意味です。\n二月乙木，陽氣漸升，木不寒矣，以丙爲君，癸爲臣，丙癸兩透，不透庚金，大富大貴。\n窮通宝鑑「二月乙」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.子", text: "十一月生まれの乙の日干には、丙だけを用い、癸は用いないという意味です。\n十一月乙木，花木寒凍，一陽來復，喜用丙火解凍，則花木有向陽之意，不宜用癸以凍花木，故專用丙火。\n窮通宝鑑「十一月乙」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.寅", text: "正月生まれの乙の日干には、まず丙が、次に癸が必要だという意味です。\n正月乙木，必須用丙，因天氣尤有餘寒，非丙不暖，雖有癸水，恐凝寒氣，故以丙火爲先，癸水次之。\n窮通宝鑑「正月乙」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.巳", text: "四月生まれの乙の日干には、まず癸が必要だという意味です。\n四月乙木，自有丙火，專取癸水爲尊。\n窮通宝鑑「四月乙」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.戌", text: "九月生まれの乙の日干は、根が枯れて葉が落ちるので、癸がぜひ必要だという意味です。\n九月乙木，根枯葉落，必賴癸水滋養。\n窮通宝鑑「九月乙」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.未", text: "六月生まれの乙の日干は、命式に金と水が多ければ、まず丙が必要だという意味です。\n六月乙木，木性且寒，柱多金水，丙火爲尊。\n窮通宝鑑「六月乙」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.申", text: "七月の乙は、庚が力を握って乙に惹かれるものの、地中の金とは合しにくいという意味です。\n七月乙木，庚金乘令，庚雖輸情於乙妹，怎奈干乙難合支金。\n窮通宝鑑「七月乙」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.辰", text: "三月生まれの乙の日干には、まず癸が、次に丙が必要だという意味です。\n三月乙木，陽氣愈熾，先癸後丙。\n窮通宝鑑「三月乙」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.酉", text: "八月の乙は、花も穀物もみな気が退いた時期だという意味です。\n八月乙木，芝蘭禾稼均退。\n窮通宝鑑「八月乙」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.丑", text: "十二月生まれの壬の日干は、月の前半に気が強いので、丙だけを用いるという意味です。\n十二月壬水，旺極復衰，何也？上半月癸辛主事，故旺，專用丙火。\n窮通宝鑑「十二月壬」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.亥", text: "十月生まれの壬の日干には、まず戊が必要で、庚まで共にそろえば大いに尊くなるという意味です。\n十月壬水司權，至旺之極，取戊爲用，若生辰日干，又見辰時，必須戊透，又須庚制甲，不傷戊土，戊庚兩全，定主登科乃第，位顯權高。\n窮通宝鑑「十月壬」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.午", text: "五月生まれの壬の日干には、まず癸が必要で、庚が助けるという意味です。\n五月壬水，丁旺壬弱，取癸爲用，取庚爲佐。\n窮通宝鑑「五月壬」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.卯", text: "二月生まれの壬の日干には、丙は用いず、戊と辛を用いるという意味です。\n二月壬水，寒氣初除，有並流之象，不用丙暖，專取戊土辛金。\n窮通宝鑑「二月壬」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.子", text: "十一月生まれの壬の日干には、まず戊が、次に丙が必要だという意味です。\n十一月壬水，陽刃幇身，較前更旺，先取戊土，次用丙火，丙戊兩透，富貴榮華。\n窮通宝鑑「十一月壬」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.寅", text: "正月生まれの壬の日干には、まず水の源となる庚が必要だという意味です。\n正月壬水，汪洋之象，能並百川之流，然水性柔弱，宜用庚金之源，庶不致汪洋無度。\n窮通宝鑑「正月壬」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.巳", text: "四月生まれの壬の日干には、まず同じ壬が、次に辛が必要で、庚が助けるという意味です。\n四月壬水，丙火司權，水弱極矣，專取壬水比肩爲助，次取辛金發源，且暗合丙火，庚金爲佐。\n窮通宝鑑「四月壬」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.戌", text: "九月の壬は、壬が多いとき、甲が戊を抑え、戊が再び現れれば丙を用いるという意味です。\n九月壬水進氣，其性特厚，若一派壬水，見一甲、制戌中之戊，戊又出干，斯用丙火。\n窮通宝鑑「九月壬」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.未", text: "六月生まれの壬の日干には、まず辛と癸が、次に甲が必要だという意味です。\n六月壬水，己土當權，丁火退氣，先用辛金癸水，次用甲木劈土。\n窮通宝鑑「六月壬」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.申", text: "七月生まれの壬の日干には、まず戊が、次に丁が必要だという意味です。\n七月壬水，庚金司令，壬得申之長生，源流自遠，轉弱爲強，專用戊土，次取丁火佐戊制庚。\n窮通宝鑑「七月壬」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.辰", text: "三月生まれの壬の日干には、まず甲が、次に庚が必要だという意味です。\n三月壬水，戊土司權，恐有推山填海之患，先用甲疏季土，次取庚金。\n窮通宝鑑「三月壬」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.酉", text: "八月生まれの壬の日干には、甲だけを用いるという意味です。\n八月壬水，辛金司權，正金白水清，忌戊土爲病，專用甲木。\n窮通宝鑑「八月壬」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.丑", text: "十二月生まれの己の日干には、まず丙が、次に甲が必要だという意味です。\n三冬己土，濕泥寒凍，非丙暖不生，取丙爲尊，甲木參酌。\n窮通宝鑑「三冬己」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.亥", text: "十月生まれの己の日干には、まず丙が、次に甲が必要だという意味です。\n三冬己土，濕泥寒凍，非丙暖不生，取丙爲尊，甲木參酌。\n窮通宝鑑「三冬己」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.午", text: "五月生まれの己の日干には、まず癸が、次に丙が必要だという意味です。\n三夏己土，雜氣才官，禾稼在田，最喜甘沛，取癸爲要，次用丙火。\n窮通宝鑑「三夏己」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.卯", text: "二月生まれの己の日干には、まず甲が必要だという意味です。\n二月己土，陽氣漸升，雖禾稼未成，萬物出土，田園未展，先取甲木疏之，忌合。\n窮通宝鑑「二月己」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.子", text: "十一月生まれの己の日干には、まず丙が、次に甲が必要だという意味です。\n三冬己土，濕泥寒凍，非丙暖不生，取丙爲尊，甲木參酌。\n窮通宝鑑「三冬己」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.寅", text: "正月生まれの己の日干には、まず丙が必要だという意味です。\n正月己土，田園猶凍，蓋因臘氣未除，餘寒未退，故丙爲尊。\n窮通宝鑑「正月己」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.巳", text: "四月生まれの己の日干には、まず癸が、次に丙が必要だという意味です。\n三夏己土，雜氣才官，禾稼在田，最喜甘沛，取癸爲要，次用丙火。\n窮通宝鑑「三夏己」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.戌", text: "九月生まれの己の日干には、温める丙と潤す癸を用いるという意味です。\n三秋己土，萬物收藏之際，外虛內實，寒氣漸升，須丙火溫之，癸水潤之，不特此也，且癸能洩金，丙能制金，補土精神，則秋生之物咸茂矣。\n窮通宝鑑「三秋己」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.未", text: "六月生まれの己の日干には、まず癸が、次に丙が必要だという意味です。\n三夏己土，雜氣才官，禾稼在田，最喜甘沛，取癸爲要，次用丙火。\n窮通宝鑑「三夏己」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.申", text: "七月生まれの己の日干には、温める丙と潤す癸を用いるという意味です。\n三秋己土，萬物收藏之際，外虛內實，寒氣漸升，須丙火溫之，癸水潤之，不特此也，且癸能洩金，丙能制金，補土精神，則秋生之物咸茂矣。\n窮通宝鑑「三秋己」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.辰", text: "三月生まれの己の日干には、まず丙が、次に癸が、続いて甲が必要だという意味です。\n三月己土，正栽培禾稼之時，先丙後癸，土暖而潤，隨用甲疏，三者俱透天干，必官居黃閣。\n窮通宝鑑「三月己」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.酉", text: "八月の己は、地に金の気が固まり、丙や丁が救わなければ、孤独で苦労するという意味です。\n八月支成金局，無丙丁出救，此人零丁孤苦。\n窮通宝鑑「八月己」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.丑", text: "十二月生まれの庚の日干には、まず丙が、次に丁が必要で、甲も欠かせないという意味です。\n十二月庚金，寒氣太重，且多濕泥，愈寒愈凍，先取丙火解凍，次取丁火煉金，甲亦不可少。\n窮通宝鑑「十二月庚」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.亥", text: "十月生まれの庚の日干には、鍛える丁と温める丙を用いるという意味です。\n十月庚金，水冷性寒，非丁莫造，非丙不暖。\n窮通宝鑑「十月庚」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.午", text: "五月生まれの庚の日干には、まず壬が、次に癸が必要だという意味です。\n五月庚金，丁火旺烈，庚金敗地，專用壬水，癸又次之。\n窮通宝鑑「五月庚」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.卯", text: "二月生まれの庚の日干には、まず丁が、次に丁を生かす甲と、甲を割る庚が必要だという意味です。\n二月庚金，柱中自然有乙，當令之乙，見庚必輸情於乙，此金有暗強之勢，如秋金一理，故二月庚金，專用丁火，借甲引丁，借庚劈甲。\n窮通宝鑑「二月庚」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.子", text: "十一月生まれの庚の日干には、まず丁と甲が、次に丙が必要だという意味です。\n十一月庚金，天氣嚴寒，仍取丁甲，次取丙火照暖。\n窮通宝鑑「十一月庚」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.寅", text: "正月生まれの庚の日干には、まず丙が、次に甲が必要だという意味です。\n正月庚金，木旺之際，有土皆死，不能生金，且金之寒氣未除，先用丙暖庚性，又慮土厚埋金，須甲疏洩。\n窮通宝鑑「正月庚」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.巳", text: "四月の庚は、この月に初めて力を得て、月の中に戊が隠れているという意味です。\n四月庚金，長生於巳，巳內有戊。\n窮通宝鑑「四月庚」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.戌", text: "九月生まれの庚の日干には、まず甲が、次に壬が必要だという意味です。\n九月庚金，戊土司令，最怕土厚埋金，宜先用甲疏，後用壬洗，則金自出矣。\n窮通宝鑑「九月庚」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.未", text: "六月生まれの庚の日干には、まず丁が、次に甲が必要だという意味です。\n六月庚金，三伏生寒，頑鈍極矣，先用丁火，次取甲木。\n窮通宝鑑「六月庚」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.申", text: "七月の庚は、かたさと鋭さが最も強いという意味です。\n七月庚金，剛銳極矣。\n窮通宝鑑「七月庚」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.辰", text: "三月生まれの庚の日干には、まず甲が、次に丁が必要だという意味です。\n三月庚金，戊土司令，無生金之理，有埋金之憂，故先甲後丁，不用庚劈甲。\n窮通宝鑑「三月庚」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.酉", text: "八月生まれの庚の日干には、丁と甲を用い、丙も欠かせないという意味です。\n八月庚金，剛銳未退，用丁用甲，丙不可少。\n窮通宝鑑「八月庚」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.丑", text: "十二月生まれの戊の日干には、まず丙が、次に甲が必要だという意味です。\n十一二月嚴寒冰凍，丙火爲專，甲木爲佐。\n窮通宝鑑「十一二月戊」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.亥", text: "十月生まれの戊の日干には、まず甲が、次に丙が必要だという意味です。\n十月戊土，時値小陽，陽氣略出，先用甲木，次取丙火。\n窮通宝鑑「十月戊」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.午", text: "五月生まれの戊の日干には、まず壬が、次に甲が必要で、丙は状況に応じて用いるという意味です。\n五月戊土，仲夏火炎，先看壬水，次取甲木，丙火酌用，用癸力微。\n窮通宝鑑「五月戊」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.卯", text: "二月生まれの戊の日干には、甲と癸があっても、まず寒さを払う丙が必要だという意味です。\n正二月即有甲癸，若無丙除寒，如萬物生而不長，故無丙者，富貴艱辛。\n窮通宝鑑「正二月戊」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.子", text: "十一月生まれの戊の日干には、まず丙が、次に甲が必要だという意味です。\n十一二月嚴寒冰凍，丙火爲專，甲木爲佐。\n窮通宝鑑「十一二月戊」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.寅", text: "正月生まれの戊の日干には、甲と癸があっても、まず寒さを払う丙が必要だという意味です。\n正二月即有甲癸，若無丙除寒，如萬物生而不長，故無丙者，富貴艱辛。\n窮通宝鑑「正二月戊」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.巳", text: "四月生まれの戊の日干には、まず甲が、次に丙と癸が必要だという意味です。\n四月戊土，陽氣發升，寒氣內藏，外實內虛，不畏火炎，無陽氣相催，萬物不長，故先用甲疏劈，次取丙癸爲佐。\n窮通宝鑑「四月戊」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.戌", text: "九月生まれの戊の日干には、まず甲が、次に癸が必要だという意味です。\n九月戊土當權，不可專用丙，先看甲木，次取癸水，卻忌化合。\n窮通宝鑑「九月戊」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.未", text: "六月生まれの戊の日干には、まず癸が、次に丙と甲が必要だという意味です。\n六月戊土，遇夏乾枯，先看癸水，次用丙火甲木。\n窮通宝鑑「六月戊」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.申", text: "七月生まれの戊の日干には、まず丙が、次に癸が、最後に甲が必要だという意味です。\n七月戊土，陽氣漸入，寒氣漸出，先丙後癸，甲木次之。\n窮通宝鑑「七月戊」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.辰", text: "三月生まれの戊の日干は、丙、甲、癸がひとつも見えなければ、愚かで低い立場になるという意味です。\n三月戊土司令，不見丙甲癸者，愚而且賤。\n窮通宝鑑「三月戊」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.酉", text: "八月生まれの戊の日干には、まず丙が、次に癸が必要で、木は要らないという意味です。\n八月戊土，金洩身寒，賴丙照暖，喜水滋潤，先丙後癸，不必木疏。\n窮通宝鑑「八月戊」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.丑", text: "十二月生まれの甲の日干には、まず庚が、次に丁が必要だという意味です。\n十二月甲木，天寒氣凍，木性極寒，無生發之象，先用庚劈甲，方引丁火始得木火有通明之象，故丁次之。\n窮通宝鑑「十二月甲」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.亥", text: "十月生まれの甲の日干には、まず庚と丁が、次に丙が必要だという意味です。\n十月甲木，庚丁爲要，丙火次之。\n窮通宝鑑「十月甲」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.午", text: "五月の甲は、木の中が空いて乾いているので、六月と同じ理屈で見るという意味です。\n五六月甲木，木性虛焦，一理共推。\n窮通宝鑑「五六月甲」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.卯", text: "二月の甲は、庚が所を得れば少し尊くなり、別の道で名を上げますが、財の後ろ盾が必要だという意味です。\n二月甲木，庚金得所，名陽刃駕殺，可云小貴，異途顯達，或主武職，但要財資之。\n窮通宝鑑「二月甲」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.子", text: "十一月生まれの甲の日干には、まず丁が、次に庚が必要で、丙が助けるという意味です。\n十一月甲木，木性生寒，丁先庚後，丙火佐之。\n窮通宝鑑「十一月甲」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.寅", text: "正月生まれの甲の日干は、まだ寒さが残るので、丙と癸に出会えば富と名誉を共に得るという意味です。\n正月甲木，初春尚有餘寒，得丙癸逢，富貴雙全。\n窮通宝鑑「正月甲」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.巳", text: "四月生まれの甲の日干には、まず癸が、次に丁が必要だという意味です。\n四月甲木退氣，丙火司權，先癸後丁。\n窮通宝鑑「四月甲」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.戌", text: "九月生まれの甲の日干には、まず丁が、次に壬と癸が必要だという意味です。\n九月甲木，木星凋零，獨愛丁火，壬癸滋扶，丁壬癸透，戊己亦透，此命配得中和，可許一榜。\n窮通宝鑑「九月甲」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.未", text: "六月の甲は、木の中が空いて乾いているので、五月と同じ理屈で見るという意味です。\n五六月甲木，木性虛焦，一理共推。\n窮通宝鑑「五六月甲」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.申", text: "七月生まれの甲の日干には、まず丁が、次に庚が必要で、庚は欠かせないという意味です。\n七月甲木，丁火爲尊，庚金次之，庚金不可少。\n窮通宝鑑「七月甲」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.辰", text: "三月の甲は、木の気が尽きていくという意味です。\n三月甲木，木氣相竭。\n窮通宝鑑「三月甲」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.酉", text: "八月の甲は、木の気が閉じ込められ、金の気が強いという意味です。\n八月甲木，木囚金旺。\n窮通宝鑑「八月甲」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.丑", text: "十二月生まれの癸の日干には、まず丙が必要だという意味です。\n十二月癸水，寒極成冰，萬物不能舒泰，宜丙火解凍。\n窮通宝鑑「十二月癸」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.亥", text: "十月生まれの癸の日干には、庚と辛を用いるという意味です。\n十月癸水，旺中有弱，何也？因亥搖木，洩散元神，宜用庚辛爲妙。\n窮通宝鑑「十月癸」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.午", text: "五月生まれの癸の日干には、庚と辛が必要で、同じ水の気があってこそ、うまく用いることができるという意味です。\n五月癸水，至弱無根，必須庚辛爲生身之本，但丁火司權，金難敵火，安能滋養癸水，宜見比劫，方得辛金之用。\n窮通宝鑑「五月癸」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.卯", text: "二月生まれの癸の日干には、まず庚が、次に辛が必要だという意味です。\n二月癸水，不剛不柔，乙木司令，洩弱元神，專以庚金爲用，辛金次之。\n窮通宝鑑「二月癸」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.子", text: "十一月生まれの癸の日干には、まず丙が、次に辛が必要だという意味です。\n十一月癸水，値冰凍之時，金水無交歡之象，專用丙火解凍，庶不致成冰，又要辛金滋扶，無丙有辛，不妙。\n窮通宝鑑「十一月癸」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.寅", text: "正月生まれの癸の日干には、まず辛が、次に丙が必要だという意味です。\n正月癸水，値三陽之候，雨露之精，其性至柔，先用辛金，生癸水之源，次用丙火照暖，名陰陽和合，萬物發生。\n窮通宝鑑「正月癸」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.巳", text: "四月生まれの癸の日干には、辛を用い、辛がなければ庚を用いるという意味です。\n四月癸水，喜辛金爲用，無辛用庚。\n窮通宝鑑「四月癸」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.戌", text: "九月生まれの癸の日干には、まず辛が必要で、同じ癸が甲を育てて戊を抑えるとよいという意味です。\n九月癸水，失令無根，戊土司權，剋制太過，專用辛金發水之源，要比肩滋甲制戊方妙。\n窮通宝鑑「九月癸」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.未", text: "六月の癸は、月の前半と後半に分けて見るという意味です。\n六月癸水，有上下月之分。\n窮通宝鑑「六月癸」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.申", text: "七月の癸は、弱く見えても、この月の中の庚が生かしてくれるので、かえって強くなるという意味です。\n七月癸水，正母旺子相之時，癸雖死申，殊不知申中有庚生之，名死處逢生，弱中復強，即運行西北，亦不死也。\n窮通宝鑑「七月癸」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.辰", text: "三月の癸は、清明のころか穀雨のころかを分けて見るという意味です。\n三月癸水，要分清明穀雨。\n窮通宝鑑「三月癸」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.酉", text: "八月生まれの癸の日干には、まず辛が、次に丙が必要だという意味です。\n八月癸水，辛金虛靈，非頑金可比，正金白水清，故取辛金爲用，丙火佐之。\n窮通宝鑑「八月癸」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.丑", text: "十二月生まれの辛の日干には、まず丙が、次に壬が必要だという意味です。\n十二月辛金，寒凍之極，先丙後壬，無丙不能解凍，無壬不能洗淘。\n窮通宝鑑「十二月辛」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.亥", text: "十月生まれの辛の日干には、まず壬が、次に丙が必要だという意味です。\n十月辛金，時値小陽，陽氣漸升，寒氣將降，先用壬水，次取丙火，壬丙兩透，金榜題名，何也？蓋辛金有壬水丙火，名金白水清，又在亥月故發。\n窮通宝鑑「十月辛」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.午", text: "五月生まれの辛の日干には、己と壬を共に用いるという意味です。\n五月辛金，丁火司權，辛金失令，陰柔之極，不宜鍛煉，須己壬兼用，何也？己爲泥沙，壬爲湖海，己無壬不濕，辛無己不生，故壬己並用。\n窮通宝鑑「五月辛」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.卯", text: "二月生まれの辛の日干には、まず壬が必要で、戊と己は害になるという意味です。\n二月辛金，陽和之際，壬水爲尊，見戊己爲病。\n窮通宝鑑「二月辛」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.子", text: "十一月生まれの辛の日干は、癸が現れるのを嫌い、壬と丙が共に現れれば大いに尊くなるという意味です。\n十一月辛金，癸水司令，爲寒冬雨露，切忌癸出凍金，而困丙火，壬丙兩透，不見戊癸，衣錦腰金。\n窮通宝鑑「十一月辛」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.寅", text: "正月生まれの辛の日干には、己と壬を用い、庚が甲を抑えてくれるとよいという意味です。\n正月辛金，陽氣舒而寒氣未除，不知正月建寅，中有長生之丙，解去寒氣，忌甲木司權，辛金失令，取己土爲生身之本，欲得辛金發現，全賴壬水之功，己壬兩透，支見庚制甲，科甲定然。\n窮通宝鑑「正月辛」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.巳", text: "四月生まれの辛の日干には、洗い清める壬が必要で、熱い丙は嫌うという意味です。\n四月辛金，時逢首夏，忌丙火之燥烈，喜壬水之洗淘。\n窮通宝鑑「四月辛」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.戌", text: "九月生まれの辛の日干には、まず壬が、次に甲が必要だという意味です。\n九月辛金，戊土司令，母旺子相，須甲疏土，壬洩旺金，先壬後甲。\n窮通宝鑑「九月辛」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.未", text: "六月生まれの辛の日干には、まず壬が、次に庚が必要だという意味です。\n六月辛金，己土當權，輔助太多，恐掩金光，先用壬水，取庚佐之。\n窮通宝鑑「六月辛」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.申", text: "七月の辛は、壬があり、戊が堤となってくれれば清廉な官吏になりますが、金持ちにはならないという意味です。\n七月辛金，値庚司令，不旺自旺，且壬水居申，四柱不見戊土，胎元戊藏申內，爲壬堤岸，人命得此，爲官清正，但不富耳。\n窮通宝鑑「七月辛」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.辰", text: "三月生まれの辛の日干には、まず壬が、次に甲が必要だという意味です。\n三月辛金，戊土司令，辛承正氣，母旺子相，先壬後甲。\n窮通宝鑑「三月辛」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.酉", text: "八月生まれの辛の日干には、壬だけを用いるという意味です。\n八月辛金，當權得令，旺之極矣，專用壬水淘洗火，故云：金見水以流通。\n窮通宝鑑「八月辛」"}
- {slot: evidence.source, key: "source.jeokcheonsu/tags#clash_month_branch", text: "月令は家のようなもので、その中で働く気は家の向きのようなものなので、必ず見極めるべきだという意味です。\n月令提綱，譬之宅也，人元用事之神，宅之向也，不可以不卜。\n滴天髄「月令論」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/tags#branch_hap", text: "合とは和すことで、陰と陽が和すれば気は自然に合わさるという意味です。\n夫合者，和也，乃陰陽相和，其氣自合。\n三命通会「論支元六合」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/tags#cheoneul_gwiin", text: "天乙貴人は最も尊い神で、行く先々であらゆる凶殺が静かに避けていくという意味です。\n其神最尊貴，所至之處，一切凶煞隱然而避。\n三命通会「論天乙貴人」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/tags#clash", text: "冲は十二支が互いにぶつかり合って争うことなので、おおむね凶と見るという意味です。\n相沖者，十二支戰擊之神，大概爲凶。\n三命通会「論冲撃」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/tags#clash_day_branch", text: "日柱の位置が傷つくと自分自身によくなく、これを折腰煞と呼ぶという意味です。\n傷日不利己身，名折腰煞\n三命通会「論年月日時」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/tags#dohwa", text: "寅午戌は卯、巳酉丑は午、申子辰は酉、亥卯未は子が長生の次の沐浴の位置で、敗神とも桃花煞とも呼ぶという意味です。\n寅午戌卯、已酉丑午、申子辰酉、亥卯未子即長生第二位沐浴之宮是也。一名敗神，一名桃花煞\n三命通会「論咸池」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/tags#gongmang", text: "甲から始まる十日が尽きて残る位置を空亡といい、位置はあっても禄がないのが空、地支はあっても天干がないのが亡だという意味です。\n故以甲旬盡處曰空亡，蓋有是位而無祿，曰空；有支而無干，曰亡。\n三命通会「論空亡」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/tags#hwagae", text: "三合の最後の位置である庫の位置を華蓋と呼ぶという意味です。\n故以三合底處得庫謂之華蓋。\n三命通会「論将星華蓋」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/tags#stem_hap", text: "陰が陽に、陽が陰に出会ってはじめて合となり、男女が出会って夫婦となるのと同じだという意味です。\n唯陰見陽，陽見陰爲合，亦如男女相合而成夫婦之道。\n三命通会「論十干合」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/tags#yeokma", text: "駅馬は先天数で数えた三合の数から出るという意味です。\n所謂驛馬者，乃先天三合數也\n三命通会「論駅馬」"}
- {slot: evidence.source, key: "source.jeokcheonsu/personal#day_master", text: "気が旺じていれば漏らし削るのがよく、衰えていれば助け支えるのを喜ぶ、それが子平の理だという意味です。\n旺則宜洩宜傷，衰則喜幇喜助，子平之理也\n滴天髄「衰旺論」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/five_elements#color_change", text: "五行の正色は水が黒、火が赤、木が青、金が白、土が黄色だが、変わるときは生旺なら正色、死絶なら自分を生む五行の色、成形と冠帯なら自分が剋す五行の色、病敗なら自分を剋す五行の色、旺墓なら自分が生む五行の色に従うという意味です。\n推其形色則水黑火赤木青金白土黃此正色也及其變易則不然常以生旺從正色死絶從母色成形冠帶從妻色病敗從鬼色旺墓從子色\n三命通会「論五行」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#luck.ten_god", text: "大運では、官は生じられるのを望み傷つけられるのを望まず、煞は制されるのを望み助けられるのを望まず、財は扶けられるのを望み劫されるのを望まず、印は旺じるのを望み衰えるのを望まず、食は生じられるのを望み梟に絶たれるのを望まないという意味です。\n官欲運生不欲運傷煞欲運制不欲運助財欲運扶不欲運劫印欲運旺不欲運衰食欲運生不欲運梟絶\n三命通会「論大運」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#luck.twelve_stage", text: "運が長生に入ると新しく興し始める事があり、建禄と帝旺に至ると盛んで楽しく、福と財が増すという意味です。\n凡行運長生主有創建作新之事到臨官帝旺主興盛快樂發福進財\n三命通会「論大運」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#ten_god.geonrok", text: "陽刃、比肩、敗財、建禄は名は違っても、実は一家の同じ気の神だという意味です。\n余按陽刃比肩敗財建祿名雖不同實一家同氣之神\n三命通会「論建禄」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#ten_god.jeonggwan", text: "正官とは甲が辛に、乙が庚に会うように、陰陽が組み合わさって互いを制し、用をなしてその道を成すものだという意味です。\n正官者乃甲見辛乙見庚之例陰陽配合相制有用成其道也\n三命通会「論正官」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#ten_god.jeongin", text: "この格は聡明で知恵が多く、性は慈しみ深く、言葉は善良だが遅く訥々とし、体つきは豊かだという意味です。\n此格主聰明多智慧性慈惠語善良遲訥體貌豐厚\n三命通会「論印綬」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#ten_god.jeongjae", text: "正財の格は人が誠実で、事を倹約に行い、生まれつき聡明だが、ただ吝嗇なところがあるという意味です。\n正財之格主人誠實行事儉約賦性聰明惟有慳吝\n三命通会「論正財」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#ten_god.pyeongwan", text: "制があれば偏官といい、制がなければ七煞と呼ぶという意味です。\n故有制謂之偏官無制謂之七煞\n三命通会「論偏官」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#ten_god.pyeonin", text: "倒食とは偏印のことで、呑啖煞ともいい、食神が最も嫌うものだという意味です。\n倒食即偏印之謂一名吞啖煞食神最忌見之\n三命通会「論倒食」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#ten_god.pyeonjae", text: "偏財の格は人が気前よく財にさほど吝嗇でなく、人に情があるが、偽りも多いという意味です。\n偏財格主人慷慨不甚吝財與人有情而多詐\n三命通会「論偏財」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#ten_god.sanggwan", text: "この格は才芸が多いが人を侮り、気位が高く心が険しく、はばかることがなく、謀は多いが遂げることは少なく、巧みを弄して拙を成すという意味です。\n此格主多材藝傲物氣高心險無忌憚多謀少遂弄巧成拙\n三命通会「論傷官」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#ten_god.siksin", text: "財が厚く食が豊かで、福と度量が広く、体が肥え、ゆったりと自ら足り、子があり長寿だという意味です。\n主人財厚食豐福量寛弘肌體肥大優游自足有子息有壽考\n三命通会「論食神」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#ten_god_group.gwanseong", text: "我を剋すものは、我が人に制される意であるから、官煞と名づけたという意味です。\n尅我者我受制於人之義故立名官煞\n三命通会「論古人立印食官財名義」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#ten_god_group.inseong", text: "我を生むものは父母の意があるから、印綬と名づけたという意味です。\n生我者有父母之義故立名印綬\n三命通会「論古人立印食官財名義」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#ten_god_group.jaeseong", text: "我が剋すものは、人が我に制される意であるから、妻財と名づけたという意味です。\n我尅者是人受制於我之義故立名妻財\n三命通会「論古人立印食官財名義」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#ten_god_group.siksang", text: "我が生むものは子孫の意があるから、食神と名づけたという意味です。\n我生者有子孫之義故立名食神\n三命通会「論古人立印食官財名義」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#twelve_stage", text: "五行は長生、沐浴、冠帯、建禄、帝旺、衰、病、死、墓、絶、胎、養の十二の段階を果てしなく巡ってまた始まり、それは人の一生の巡りに似ているという意味です。\n夫五行寄生十二官長生沐浴冠帶臨官帝旺衰病死墓絶胎養循環無端週而復始造物大體與人相似循環十二宮亦若人世輪迴也\n三命通会「論五行旺相休囚死並寄生十二宮」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#yangin", text: "羊は剛を言い、刃は切り分ける意を取ったもので、禄を過ぎると刃が生じるという意味です。\n羊言剛也刃者取宰割之義祿過則刃生\n三命通会「論羊刃」"}
- {slot: evidence.source, key: "source.xieji-bianfang/hours#birth_year", text: "昔の人は皆、生まれ年の天干を見て、官や財と合し、あるいは比肩、印綬、長生となり、あるいは禄馬貴人を取り、命を衝いたり剋したりしない時を選んだという意味です。\n古人皆論生年之天干或合官或合財或比肩或印綬或四長生或取祿馬貴人不衝命尅命\n協紀弁方書「論相主」"}
- {slot: evidence.source, key: "source.xieji-bianfang/hours#huangdao", text: "日から時を起こすと、子の日は申の時に青龍を起こし、酉の時を明堂とし、順に数えていくという意味です。\n日起時則子日申時起青龍酉時為明堂依次順數\n協紀弁方書「黄道黒道」"}
- {slot: evidence.source, key: "source.xieji-bianfang/hours#use_hour", text: "時は日の用であるから、すべては日を助けるかにかかっており、日の干支と比和するか日支と三合、六合すれば吉で、時の吉凶神にすべてこだわらず、貴人と禄馬だけを吉とするという意味です。\n時者日之用也全在幇扶日辰或與日支干比和或與日支三合六合即吉時家吉凶神不必盡拘惟貴人祿馬為吉\n協紀弁方書「用時法」"}
