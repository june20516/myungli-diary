# 원전 출처(evidence.source) 원고(ja). W1-3b. 원문은 core quote 글자 그대로, 원전 이름은 일본 신자체(窮通宝鑑), 뜻은 ko 원고와 같은 정보입니다. 원어민 검수 전 초안입니다.
- {slot: evidence.source, key: "source.gungtong-bogam/five_elements#balance_principle", text: "窮通宝鑑「五行総論」\n以义推之，夫万物负阴而抱阳，冲气以和。过与不及，皆为乖道。故高者抑之使平，下者举之使崇，或益其不及，或损其太过。所以贵在折衷，归於中道，使无有余不足之累，即才官印食贵人驿马之微意也。行运亦如之，识其微意，则於命理之说，思过半矣。\n多すぎるものは減らし、足りないものは補って中ほどへ戻すことが、命理の要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/five_elements#color", text: "窮通宝鑑「五行総論」\n推其形色，则水黑、火赤、木青、土黄，此正色也。及其变易，则不然。常以生旺从正色，死绝从母色，成形冠带从妻色，病败从鬼色，旺墓从子色。\n五行にはそれぞれ本来の色があり、水は黒、火は赤、木は青、土は黄だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/five_elements#direction", text: "窮通宝鑑「五行総論」\n北方阴极而生寒，寒生水。南方阳极而生热，热生火。东方阳散以泄而生风，风生木。西方阴止以收而生燥，燥生金。中央阴阳交而生温，温生土。其相生也所以相维，其相克也所以相制，此之谓有伦。\n北は水、南は火、東は木、西は金、中央は土を生むという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/five_elements#number", text: "窮通宝鑑「五行総論」\n其数则水一、火二、木三、金四、土五。生旺加倍，死绝减半。\n五行にはそれぞれ数があり、水は1、火は2、木は3、金は4、土は5だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.丑", text: "窮通宝鑑「三冬丁」\n三冬丁火微寒，耑用庚甲。\n十二月生まれの丁の日干には、庚と甲を用いるという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.亥", text: "窮通宝鑑「三冬丁」\n三冬丁火微寒，耑用庚甲。\n十月生まれの丁の日干には、庚と甲を用いるという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.午", text: "窮通宝鑑「五月丁」\n五月丁火，时归建禄，不宜乱用甲木。\n五月の丁は自ら力が強い時期なので、甲をむやみに用いてはいけないという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.卯", text: "窮通宝鑑「二月丁」\n二月丁火，溼乙伤丁，先庚后甲，非庚不能去乙，非甲不能引丁。\n二月生まれの丁の日干には、まず庚が、次に甲が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.子", text: "窮通宝鑑「十一月丁」\n十一月丁火，或仲冬水多癸旺，全无比印，此作弃命从杀，亦有异途功名。\n十一月の丁は、水があふれて助けとなる気がなければ、抑える力に従う命式となり、別の道で名を上げるという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.寅", text: "窮通宝鑑「正月丁」\n正月丁火，甲木当权，乃为母旺，非庚不能噼甲，何以引丁，姑用庚金。\n正月生まれの丁の日干には、力の強い甲を割る庚を用いるという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.巳", text: "窮通宝鑑「四月丁」\n四月丁火乘旺，虽取甲引丁，必用庚噼甲。\n四月生まれの丁の日干には、甲を用いつつ、必ず庚で甲を割らなければならないという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.戌", text: "窮通宝鑑「九月丁」\n或九月一派戊土，洩丁火之气，不见甲木，为伤官伤尽，非寻常可比。\n九月の丁は、戊が多くて火の気を奪い、甲がなければ、かえって並外れた命式になるという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.未", text: "窮通宝鑑「六月丁」\n六月之丁，阴柔退气，但值三伏生寒，丁弱极矣，专取甲木，壬水次之。\n六月生まれの丁の日干には、まず甲が、次に壬が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.申", text: "窮通宝鑑「七月丁」\n七月丁火，退气柔弱，端用甲木，金虽乘旺司权，无伤丁之理，仍取庚劈甲，为引火之物，或借丙暖金晒甲，不虑丙夺丁光，凡两丙夹丁者，夏月忌之，余月不忌，但此格少年困苦刑克中年富贵，必要地支见水制丙，方妙。\n七月生まれの丁の日干には、まず甲が、次に甲を割る庚が必要で、丙を借りることもできるという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.辰", text: "窮通宝鑑「三月丁」\n三月丁火，戊土司令，洩弱丁气，先用甲木引丁制土，次看庚金。\n三月生まれの丁の日干には、まず甲が、次に庚が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.酉", text: "窮通宝鑑「八月丁」\n或八月一派辛金，不见庚金，又无比劫，此弃命从财，富而且贵，虽不科甲，亦有异途。\n八月の丁は、辛が多く、庚も助けとなる火もなければ、財に従う命式となり、豊かで尊くなるという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.丑", text: "窮通宝鑑「十二月丙」\n十二月丙火，气进二阳，侮雪欺霜，喜壬为用。\n十二月生まれの丙の日干には、まず壬が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.亥", text: "窮通宝鑑「十月丙」\n十月丙火，太阳失令，得见甲戊庚出干，可云科甲，主为人性好清高，斯文领袖。\n十月生まれの丙の日干は、甲、戊、庚が現れれば、試験に受かって名を上げるという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.午", text: "窮通宝鑑「五月丙」\n五月丙火，得壬高透，方为上命。\n五月生まれの丙の日干は、壬が高く現れてこそ、よい命式になるという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.卯", text: "窮通宝鑑「二月丙」\n二月丙火，阳气舒升，耑用壬水。\n二月生まれの丙の日干には、壬だけを用いるという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.子", text: "窮通宝鑑「十一月丙」\n十一月丙火，冬至一阳生，弱中复强，壬水为最，戊土佐之。\n十一月生まれの丙の日干には、まず壬が、次に戊が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.寅", text: "窮通宝鑑「正月丙」\n正月用壬，庚辛为助。\n正月生まれの丙の日干には、まず壬が必要で、庚と辛が助けるという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.巳", text: "窮通宝鑑「四月丙」\n四月耑用壬水，金为佐。\n四月生まれの丙の日干には、壬を第一に用い、金の気が助けるという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.戌", text: "窮通宝鑑「九月丙」\n九月丙火，火气愈退，所忌土晦光火，必须先用甲木，次取壬水。\n九月生まれの丙の日干には、まず甲が、次に壬が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.未", text: "窮通宝鑑「六月丙」\n六月丙火退气，三伏生寒，壬水为用，取庚辅佐。\n六月生まれの丙の日干には、まず壬が、次に庚が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.申", text: "窮通宝鑑「七月丙」\n七月丙火，太阳转西，阳气衰矣。\n七月の丙は、日が西に傾いて気が弱まるという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.辰", text: "窮通宝鑑「三月丙」\n三月丙火，气渐炎升，用壬水。\n三月生まれの丙の日干には、まず壬が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.酉", text: "窮通宝鑑「八月丙」\n八月丙火，日近黄昏，丙火之余光，存于光湖，仍用壬水辅映。\n八月生まれの丙の日干には、沈んでいく光を映す壬が、今も必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.丑", text: "窮通宝鑑「三冬乙」\n冬月之木，虽取戊制水，不可作用，耑取丙火则可。\n十二月生まれの乙の日干には、戊ではなく丙だけを用いるという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.亥", text: "窮通宝鑑「十月乙」\n十月乙木，木不受气，而壬水司令，取丙为用，戊土次之。\n十月生まれの乙の日干には、まず丙が、次に戊が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.午", text: "窮通宝鑑「五月乙」\n五月乙木，丁火司权，禾稼俱旱。\n五月の乙は、丁が力を握り、穀物がみな日照りに遭う時期だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.卯", text: "窮通宝鑑「二月乙」\n二月乙木，阳气渐升，木不寒矣，以丙为君，癸为臣，丙癸两透，不透庚金，大富大贵。\n二月生まれの乙の日干には、まず丙が、次に癸が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.子", text: "窮通宝鑑「十一月乙」\n十一月乙木，花木寒冻，一阳来复，喜用丙火解冻，则花木有向阳之意，不宜用癸以冻花木，故耑用丙火。\n十一月生まれの乙の日干には、丙だけを用い、癸は用いないという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.寅", text: "窮通宝鑑「正月乙」\n正月乙木，必须用丙，因天气尤有余寒，非丙不暖，虽有癸水，恐凝寒气，故以丙火为先，癸水次之。\n正月生まれの乙の日干には、まず丙が、次に癸が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.巳", text: "窮通宝鑑「四月乙」\n四月乙木，自有丙火，耑取癸水为尊。\n四月生まれの乙の日干には、まず癸が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.戌", text: "窮通宝鑑「九月乙」\n九月乙木，根枯叶落，必赖癸水滋养。\n九月生まれの乙の日干は、根が枯れて葉が落ちるので、癸がぜひ必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.未", text: "窮通宝鑑「六月乙」\n六月乙木，木性且寒，柱多金水，丙火为尊。\n六月生まれの乙の日干は、命式に金と水が多ければ、まず丙が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.申", text: "窮通宝鑑「七月乙」\n七月乙木，庚金乘令，庚虽输情于乙妹，怎奈干乙难合支金。\n七月の乙は、庚が力を握って乙に惹かれるものの、地中の金とは合しにくいという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.辰", text: "窮通宝鑑「三月乙」\n三月乙木，阳气愈炽，先癸后丙。\n三月生まれの乙の日干には、まず癸が、次に丙が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.酉", text: "窮通宝鑑「八月乙」\n八月乙木，芝兰禾稼均退。\n八月の乙は、花も穀物もみな気が退いた時期だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.丑", text: "窮通宝鑑「十二月壬」\n十二月壬水，旺极复衰，何也？上半月癸辛主事，故旺，专用丙火。\n十二月生まれの壬の日干は、月の前半に気が強いので、丙だけを用いるという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.亥", text: "窮通宝鑑「十月壬」\n十月壬水司权，至旺之极，取戊为用，若生辰日干，又见辰时，必须戊透，又须庚制甲，不伤戊土，戊庚两全，定主豋科乃第，位显权高。\n十月生まれの壬の日干には、まず戊が必要で、庚まで共にそろえば大いに尊くなるという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.午", text: "窮通宝鑑「五月壬」\n五月壬水，丁旺壬弱，取癸为用，取庚为佐。\n五月生まれの壬の日干には、まず癸が必要で、庚が助けるという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.卯", text: "窮通宝鑑「二月壬」\n二月壬水，寒气初除，有并流之象，不用丙暖，专取戊土辛金。\n二月生まれの壬の日干には、丙は用いず、戊と辛を用いるという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.子", text: "窮通宝鑑「十一月壬」\n十一月壬水，阳刃帮身，较前更旺，先取戊土，次用丙火，丙戊两透，富贵荣华。\n十一月生まれの壬の日干には、まず戊が、次に丙が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.寅", text: "窮通宝鑑「正月壬」\n正月壬水，汪洋之象，能并百川之流，然水性柔弱，宜用庚金之源，庶不致汪洋无度。\n正月生まれの壬の日干には、まず水の源となる庚が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.巳", text: "窮通宝鑑「四月壬」\n四月壬水，丙火司权，水弱极矣，专取壬水比肩为助，次取辛金发源，且暗合丙火，庚金为佐。\n四月生まれの壬の日干には、まず同じ壬が、次に辛が必要で、庚が助けるという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.戌", text: "窮通宝鑑「九月壬」\n九月壬水进气，其性特厚，若一派壬水，见一甲、制戌中之戊，戊又出干，斯用丙火。\n九月の壬は、壬が多いとき、甲が戊を抑え、戊が再び現れれば丙を用いるという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.未", text: "窮通宝鑑「六月壬」\n六月壬水，己土当权，丁火退气，先用辛金癸水，次用甲木噼土。\n六月生まれの壬の日干には、まず辛と癸が、次に甲が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.申", text: "窮通宝鑑「七月壬」\n七月壬水，庚金司令，壬得申之长生，源流自远，转弱为强，专用戊土，次取丁火佐戊制庚。\n七月生まれの壬の日干には、まず戊が、次に丁が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.辰", text: "窮通宝鑑「三月壬」\n三月壬水，戊土司权，恐有推山填海之患，先用甲疏季土，次取庚金。\n三月生まれの壬の日干には、まず甲が、次に庚が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.酉", text: "窮通宝鑑「八月壬」\n八月壬水，辛金司权，正金白水清，忌戊土为病，专用甲木。\n八月生まれの壬の日干には、甲だけを用いるという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.丑", text: "窮通宝鑑「三冬己」\n三冬己土，溼泥寒冻，非丙暖不生，取丙为尊，甲木参酌。\n十二月生まれの己の日干には、まず丙が、次に甲が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.亥", text: "窮通宝鑑「三冬己」\n三冬己土，溼泥寒冻，非丙暖不生，取丙为尊，甲木参酌。\n十月生まれの己の日干には、まず丙が、次に甲が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.午", text: "窮通宝鑑「三夏己」\n三夏己土，杂气才官，禾稼在田，最喜甘沛，取癸为要，次用丙火。\n五月生まれの己の日干には、まず癸が、次に丙が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.卯", text: "窮通宝鑑「二月己」\n二月己土，阳气渐升，虽禾稼未成，万物出土，田园未展，先取甲木疏之，忌合。\n二月生まれの己の日干には、まず甲が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.子", text: "窮通宝鑑「三冬己」\n三冬己土，溼泥寒冻，非丙暖不生，取丙为尊，甲木参酌。\n十一月生まれの己の日干には、まず丙が、次に甲が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.寅", text: "窮通宝鑑「正月己」\n正月己土，田园犹冻，盖因腊气未除，余寒未退，故丙为尊。\n正月生まれの己の日干には、まず丙が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.巳", text: "窮通宝鑑「三夏己」\n三夏己土，杂气才官，禾稼在田，最喜甘沛，取癸为要，次用丙火。\n四月生まれの己の日干には、まず癸が、次に丙が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.戌", text: "窮通宝鑑「三秋己」\n三秋己土，万物收藏之际，外虚内实，寒气渐升，须丙火温之，癸水润之，不特此也，且癸能洩金，丙能制金，补土精神，则秋生之物咸茂矣。\n九月生まれの己の日干には、温める丙と潤す癸を用いるという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.未", text: "窮通宝鑑「三夏己」\n三夏己土，杂气才官，禾稼在田，最喜甘沛，取癸为要，次用丙火。\n六月生まれの己の日干には、まず癸が、次に丙が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.申", text: "窮通宝鑑「三秋己」\n三秋己土，万物收藏之际，外虚内实，寒气渐升，须丙火温之，癸水润之，不特此也，且癸能洩金，丙能制金，补土精神，则秋生之物咸茂矣。\n七月生まれの己の日干には、温める丙と潤す癸を用いるという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.辰", text: "窮通宝鑑「三月己」\n三月己土，正栽培禾稼之时，先丙后癸，土暖而润，随用甲疏，三者俱透天干，必官居黄阁。\n三月生まれの己の日干には、まず丙が、次に癸が、続いて甲が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.酉", text: "窮通宝鑑「八月己」\n八月支成金局，无丙丁出救，此人零丁孤苦。\n八月の己は、地に金の気が固まり、丙や丁が救わなければ、孤独で苦労するという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.丑", text: "窮通宝鑑「十二月庚」\n十二月庚金，寒气太重，且多湿泥，愈寒愈冻，先取丙火解冻，次取丁火炼金，甲亦不可少。\n十二月生まれの庚の日干には、まず丙が、次に丁が必要で、甲も欠かせないという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.亥", text: "窮通宝鑑「十月庚」\n十月庚金，水冷性寒，非丁莫造，非丙不暖。\n十月生まれの庚の日干には、鍛える丁と温める丙を用いるという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.午", text: "窮通宝鑑「五月庚」\n五月庚金，丁火旺烈，庚金败地，专用壬水，癸又次之。\n五月生まれの庚の日干には、まず壬が、次に癸が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.卯", text: "窮通宝鑑「二月庚」\n二月庚金，柱中自然有乙，当令之乙，见庚必输情于乙，此金有暗强之势，如秋金一理，故二月庚金，专用丁火，借甲引丁，借庚噼甲。\n二月生まれの庚の日干には、まず丁が、次に丁を生かす甲と、甲を割る庚が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.子", text: "窮通宝鑑「十一月庚」\n十一月庚金，天气严寒，仍取丁甲，次取丙火照暖。\n十一月生まれの庚の日干には、まず丁と甲が、次に丙が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.寅", text: "窮通宝鑑「正月庚」\n正月庚金，木旺之际，有土皆死，不能生金，且金之寒气未除，先用丙暖庚性，又虑土厚埋金，须甲疏洩。\n正月生まれの庚の日干には、まず丙が、次に甲が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.巳", text: "窮通宝鑑「四月庚」\n四月庚金，长生于巳，巳内有戊。\n四月の庚は、この月に初めて力を得て、月の中に戊が隠れているという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.戌", text: "窮通宝鑑「九月庚」\n九月庚金，戊土司令，最怕土厚埋金，宜先用甲疏，后用壬洗，则金自出矣。\n九月生まれの庚の日干には、まず甲が、次に壬が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.未", text: "窮通宝鑑「六月庚」\n六月庚金，三伏生寒，顽钝极矣，先用丁火，次取甲木。\n六月生まれの庚の日干には、まず丁が、次に甲が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.申", text: "窮通宝鑑「七月庚」\n七月庚金，刚锐极矣。\n七月の庚は、かたさと鋭さが最も強いという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.辰", text: "窮通宝鑑「三月庚」\n三月庚金，戊土司令，无生金之理，有埋金之忧，故先甲后丁，不用庚噼甲。\n三月生まれの庚の日干には、まず甲が、次に丁が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.酉", text: "窮通宝鑑「八月庚」\n八月庚金，刚锐未退，用丁用甲，丙不可少。\n八月生まれの庚の日干には、丁と甲を用い、丙も欠かせないという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.丑", text: "窮通宝鑑「十一二月戊」\n十一二月严寒冰冻，丙火为专，甲木为佐。\n十二月生まれの戊の日干には、まず丙が、次に甲が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.亥", text: "窮通宝鑑「十月戊」\n十月戊土，时值小阳，阳气略出，先用甲木，次取丙火。\n十月生まれの戊の日干には、まず甲が、次に丙が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.午", text: "窮通宝鑑「五月戊」\n五月戊土，仲夏火炎，先看壬水，次取甲木，丙火酌用，用癸力微。\n五月生まれの戊の日干には、まず壬が、次に甲が必要で、丙は状況に応じて用いるという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.卯", text: "窮通宝鑑「正二月戊」\n正二月即有甲癸，若无丙除寒，如万物生而不长，故无丙者，富贵艰辛。\n二月生まれの戊の日干には、甲と癸があっても、まず寒さを払う丙が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.子", text: "窮通宝鑑「十一二月戊」\n十一二月严寒冰冻，丙火为专，甲木为佐。\n十一月生まれの戊の日干には、まず丙が、次に甲が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.寅", text: "窮通宝鑑「正二月戊」\n正二月即有甲癸，若无丙除寒，如万物生而不长，故无丙者，富贵艰辛。\n正月生まれの戊の日干には、甲と癸があっても、まず寒さを払う丙が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.巳", text: "窮通宝鑑「四月戊」\n四月戊土，阳气发升，寒气内藏，外实内虚，不畏火炎，无阳气相催，万物不长，故先用甲疏噼，次取丙癸为佐。\n四月生まれの戊の日干には、まず甲が、次に丙と癸が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.戌", text: "窮通宝鑑「九月戊」\n九月戊土当权，不可专用丙，先看甲木，次取癸水，却忌化合。\n九月生まれの戊の日干には、まず甲が、次に癸が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.未", text: "窮通宝鑑「六月戊」\n六月戊土，遇夏干枯，先看癸水，次用丙火甲木。\n六月生まれの戊の日干には、まず癸が、次に丙と甲が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.申", text: "窮通宝鑑「七月戊」\n七月戊土，阳气渐入，寒气渐出，先丙后癸，甲木次之。\n七月生まれの戊の日干には、まず丙が、次に癸が、最後に甲が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.辰", text: "窮通宝鑑「三月戊」\n三月戊土司令，不见丙甲癸者，愚而且贱。\n三月生まれの戊の日干は、丙、甲、癸がひとつも見えなければ、愚かで低い立場になるという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.酉", text: "窮通宝鑑「八月戊」\n八月戊土，金洩身寒，赖丙照暖，喜水滋润，先丙后癸，不必木疏。\n八月生まれの戊の日干には、まず丙が、次に癸が必要で、木は要らないという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.丑", text: "窮通宝鑑「十二月甲」\n十二月甲木，天寒气冻，木性极寒，无生发之象，先用庚噼甲，方引丁火始得木火有通明之象，故丁次之。\n十二月生まれの甲の日干には、まず庚が、次に丁が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.亥", text: "窮通宝鑑「十月甲」\n十月甲木，庚丁为要，丙火次之。\n十月生まれの甲の日干には、まず庚と丁が、次に丙が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.午", text: "窮通宝鑑「五六月甲」\n五六月甲木，木性虚焦，一理共推。\n五月の甲は、木の中が空いて乾いているので、六月と同じ理屈で見るという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.卯", text: "窮通宝鑑「二月甲」\n二月甲木，庚金得所，名阳刃驾杀，可云小贵，异途显达，或主武职，但要财资之。\n二月の甲は、庚が所を得れば少し尊くなり、別の道で名を上げますが、財の後ろ盾が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.子", text: "窮通宝鑑「十一月甲」\n十一月甲木，木性生寒，丁先庚后，丙火佐之。\n十一月生まれの甲の日干には、まず丁が、次に庚が必要で、丙が助けるという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.寅", text: "窮通宝鑑「正月甲」\n正月甲木，初春尚有余寒，得丙癸逢，富贵双全。\n正月生まれの甲の日干は、まだ寒さが残るので、丙と癸に出会えば富と名誉を共に得るという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.巳", text: "窮通宝鑑「四月甲」\n四月甲木退气，丙火司权，先癸后丁。\n四月生まれの甲の日干には、まず癸が、次に丁が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.戌", text: "窮通宝鑑「九月甲」\n九月甲木，木星凋零，独爱丁火，壬癸滋扶，丁壬癸透，戊己亦透，此命配得中和，可许一榜。\n九月生まれの甲の日干には、まず丁が、次に壬と癸が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.未", text: "窮通宝鑑「五六月甲」\n五六月甲木，木性虚焦，一理共推。\n六月の甲は、木の中が空いて乾いているので、五月と同じ理屈で見るという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.申", text: "窮通宝鑑「七月甲」\n七月甲木，丁火为尊，庚金次之，庚金不可少。\n七月生まれの甲の日干には、まず丁が、次に庚が必要で、庚は欠かせないという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.辰", text: "窮通宝鑑「三月甲」\n三月甲木，木气相竭。\n三月の甲は、木の気が尽きていくという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.酉", text: "窮通宝鑑「八月甲」\n八月甲木，木囚金旺。\n八月の甲は、木の気が閉じ込められ、金の気が強いという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.丑", text: "窮通宝鑑「十二月癸」\n十二月癸水，寒极成冰，万物不能舒泰，宜丙火解冻。\n十二月生まれの癸の日干には、まず丙が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.亥", text: "窮通宝鑑「十月癸」\n十月癸水，旺中有弱，何也？因亥摇木，洩散元神，宜用庚辛为妙。\n十月生まれの癸の日干には、庚と辛を用いるという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.午", text: "窮通宝鑑「五月癸」\n五月癸水，至弱无根，必须庚辛为生身之本，但丁火司权，金难敌火，安能滋养癸水，宜见比劫，方得辛金之用。\n五月生まれの癸の日干には、庚と辛が必要で、同じ水の気があってこそ、うまく用いることができるという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.卯", text: "窮通宝鑑「二月癸」\n二月癸水，不刚不柔，乙木司令，洩弱元神，专以庚金为用，辛金次之。\n二月生まれの癸の日干には、まず庚が、次に辛が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.子", text: "窮通宝鑑「十一月癸」\n十一月癸水，值冰冻之时，金水无交欢之象，专用丙火解冻，庶不致成冰，又要辛金滋扶，无丙有辛，不妙。\n十一月生まれの癸の日干には、まず丙が、次に辛が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.寅", text: "窮通宝鑑「正月癸」\n正月癸水，值三阳之候，雨露之精，其性至柔，先用辛金，生癸水之源，次用丙火照暖，名阴阳和合，万物发生。\n正月生まれの癸の日干には、まず辛が、次に丙が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.巳", text: "窮通宝鑑「四月癸」\n四月癸水，喜辛金为用，无辛用庚。\n四月生まれの癸の日干には、辛を用い、辛がなければ庚を用いるという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.戌", text: "窮通宝鑑「九月癸」\n九月癸水，失令无根，戊土司权，剋制太过，专用辛金发水之源，要比肩滋甲制戊方妙。\n九月生まれの癸の日干には、まず辛が必要で、同じ癸が甲を育てて戊を抑えるとよいという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.未", text: "窮通宝鑑「六月癸」\n六月癸水，有上下月之分。\n六月の癸は、月の前半と後半に分けて見るという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.申", text: "窮通宝鑑「七月癸」\n七月癸水，正母旺子相之时，癸虽死申，殊不知申中有庚生之，名死处逢生，弱中复强，即运行西北，亦不死也。\n七月の癸は、弱く見えても、この月の中の庚が生かしてくれるので、かえって強くなるという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.辰", text: "窮通宝鑑「三月癸」\n三月癸水，要分清明谷雨。\n三月の癸は、清明のころか穀雨のころかを分けて見るという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.酉", text: "窮通宝鑑「八月癸」\n八月癸水，辛金虚灵，非顽金可比，正金白水清，故取辛金为用，丙火佐之。\n八月生まれの癸の日干には、まず辛が、次に丙が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.丑", text: "窮通宝鑑「十二月辛」\n十二月辛金，寒冻之极，先丙后壬，无丙不能解冻，无壬不能洗淘。\n十二月生まれの辛の日干には、まず丙が、次に壬が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.亥", text: "窮通宝鑑「十月辛」\n十月辛金，时值小阳，阳气渐升，寒气将降，先用壬水，次取丙火，壬丙两透，金榜题名，何也？盖辛金有壬水丙火，名金白水清，又在亥月故发。\n十月生まれの辛の日干には、まず壬が、次に丙が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.午", text: "窮通宝鑑「五月辛」\n五月辛金，丁火司权，辛金失令，阴柔之极，不宜煅炼，须己壬兼用，何也？己为泥沙，壬为湖海，己无壬不湿，辛无己不生，故壬己并用。\n五月生まれの辛の日干には、己と壬を共に用いるという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.卯", text: "窮通宝鑑「二月辛」\n二月辛金，阳和之际，壬水为尊，见戊己为病。\n二月生まれの辛の日干には、まず壬が必要で、戊と己は害になるという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.子", text: "窮通宝鑑「十一月辛」\n十一月辛金，癸水司令，为寒冬雨露，切忌癸出冻金，而困丙火，壬丙两透，不见戊癸，衣锦腰金。\n十一月生まれの辛の日干は、癸が現れるのを嫌い、壬と丙が共に現れれば大いに尊くなるという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.寅", text: "窮通宝鑑「正月辛」\n正月辛金，阳气舒而寒气未除，不知正月建寅，中有长生之丙，解去寒气，忌甲木司权，辛金失令，取己土为生身之本，欲得辛金发现，全赖壬水之功，己壬两透，支见庚制甲，科甲定然。\n正月生まれの辛の日干には、己と壬を用い、庚が甲を抑えてくれるとよいという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.巳", text: "窮通宝鑑「四月辛」\n四月辛金，时逢首夏，忌丙火之燥烈，喜壬水之洗淘。\n四月生まれの辛の日干には、洗い清める壬が必要で、熱い丙は嫌うという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.戌", text: "窮通宝鑑「九月辛」\n九月辛金，戊土司令，母旺子相，须甲疏土，壬洩旺金，先壬后甲。\n九月生まれの辛の日干には、まず壬が、次に甲が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.未", text: "窮通宝鑑「六月辛」\n六月辛金，己土当权，辅助太多，恐掩金光，先用壬水，取庚佐之。\n六月生まれの辛の日干には、まず壬が、次に庚が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.申", text: "窮通宝鑑「七月辛」\n七月辛金，值庚司令，不旺自旺，且壬水居申，四柱不见戊土，胎元戊藏申内，为壬堤岸，人命得此，为官清正，但不富耳。\n七月の辛は、壬があり、戊が堤となってくれれば清廉な官吏になりますが、金持ちにはならないという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.辰", text: "窮通宝鑑「三月辛」\n三月辛金，戊土司令，辛承正气，母旺子相，先壬后甲。\n三月生まれの辛の日干には、まず壬が、次に甲が必要だという意味です。"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.酉", text: "窮通宝鑑「八月辛」\n八月辛金，当权得令，旺之极矣，专用壬水淘洗火，故云：金见水以流通。\n八月生まれの辛の日干には、壬だけを用いるという意味です。"}
