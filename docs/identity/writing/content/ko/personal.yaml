# 원국 개인 해석(personal, "내 사주에서는") 원고(ko). W1-2.
# ①문장은 그 용어가 자리·시기에서 드러나는 모습과 쓰임, ②문장은 오행의 역할(과 강약)을 사실로 말합니다.
