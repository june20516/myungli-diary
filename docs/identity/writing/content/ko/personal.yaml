- {slot: personal.twelve_stage, key: personal.twelve_stage.jewang, text: "{place}에서 내 기운은 제왕 단계라, 힘이 가장 세게 차오른 자리예요. 이 자리의 오행 [[{element}]](은)는 {role}(이)에요."}
