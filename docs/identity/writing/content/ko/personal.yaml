- {slot: personal.ten_god, key: personal.ten_god.bigyeon, text: "{place}에 [[비견|ten_god.bigyeon]]이 있어, 곁에서 나란히 걷는 사람의 힘이 바탕에 깔려 있어요. 이 자리의 오행 [[{element}]](은)는 {role}(이)에요."}
- {slot: personal.ten_god, key: personal.ten_god.geopjae, text: "{place}에 [[겁재|ten_god.geopjae]]가 있어, 누군가와 겨루며 함께 커 가는 기질이 자리 잡고 있어요. 이 자리의 오행 [[{element}]](은)는 {role}(이)에요."}
- {slot: personal.ten_god, key: personal.ten_god.siksin, text: "{place}에 [[식신|ten_god.siksin]]이 있어, 즐기며 꾸준히 만들어 내는 힘이 바탕에 깔려 있어요. 이 자리의 오행 [[{element}]](은)는 {role}(이)에요."}
- {slot: personal.ten_god, key: personal.ten_god.sanggwan, text: "{place}에 [[상관|ten_god.sanggwan]]이 있어, 틀을 넘어 새롭게 표현하는 재주가 드러나요. 이 자리의 오행 [[{element}]](은)는 {role}(이)에요."}
- {slot: personal.ten_god, key: personal.ten_god.pyeonjae, text: "{place}에 [[편재|ten_god.pyeonjae]]가 있어, 기회를 넓게 보고 크게 움직이는 감각이 있어요. 이 자리의 오행 [[{element}]](은)는 {role}(이)에요."}
- {slot: personal.ten_god, key: personal.ten_god.jeongjae, text: "{place}에 [[정재|ten_god.jeongjae]]가 있어, 차곡차곡 모으고 살림을 챙기는 힘이 자리 잡고 있어요. 이 자리의 오행 [[{element}]](은)는 {role}(이)에요."}
- {slot: personal.ten_god, key: personal.ten_god.pyeongwan, text: "{place}에 [[편관|ten_god.pyeongwan]]이 있어, 부담이 와도 버티며 밀고 나가는 힘이 있어요. 이 자리의 오행 [[{element}]](은)는 {role}(이)에요."}
- {slot: personal.ten_god, key: personal.ten_god.jeonggwan, text: "{place}에 [[정관|ten_god.jeonggwan]]이 있어, 약속을 지키고 책임을 맡는 힘이 자리 잡고 있어요. 이 자리의 오행 [[{element}]](은)는 {role}(이)에요."}
- {slot: personal.ten_god, key: personal.ten_god.pyeonin, text: "{place}에 [[편인|ten_god.pyeonin]]이 있어, 남다른 눈으로 깊이 파고드는 기질이 있어요. 이 자리의 오행 [[{element}]](은)는 {role}(이)에요."}
- {slot: personal.ten_god, key: personal.ten_god.jeongin, text: "{place}에 [[정인|ten_god.jeongin]]이 있어, 배우고 도움을 받아들이는 힘이 바탕에 깔려 있어요. 이 자리의 오행 [[{element}]](은)는 {role}(이)에요."}
- {slot: personal.twelve_stage, key: personal.twelve_stage.jangsaeng, text: "{place}에서 내 기운은 장생 단계라, 새로 싹트고 자라나는 자리예요. 이 자리의 오행 [[{element}]](은)는 {role}(이)에요."}
- {slot: personal.twelve_stage, key: personal.twelve_stage.mokyok, text: "{place}에서 내 기운은 목욕 단계라, 이것저것 해 보며 감을 잡아 가는 자리예요. 이 자리의 오행 [[{element}]](은)는 {role}(이)에요."}
- {slot: personal.twelve_stage, key: personal.twelve_stage.gwandae, text: "{place}에서 내 기운은 관대 단계라, 자신감이 붙어 앞으로 나서는 자리예요. 이 자리의 오행 [[{element}]](은)는 {role}(이)에요."}
