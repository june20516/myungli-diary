# 원전 출처(evidence.source) 원고(ko). W1-3b. 원문은 core quote를 정자로 옮김(W62), 원전 이름은 한글 독음(R24-1). 줄 순서는 뜻, 원문, 출처(D118 ③, W64).
- {slot: evidence.source, key: "source.gungtong-bogam/five_elements#balance_principle", text: "넘치는 것은 덜고 모자란 것은 채워 가운데로 돌리는 것이 명리의 핵심이라는 뜻이에요.\n以義推之，夫萬物負陰而抱陽，沖氣以和。過與不及，皆爲乖道。故高者抑之使平，下者舉之使崇，或益其不及，或損其太過。所以貴在折衷，歸於中道，使無有餘不足之累，即才官印食貴人驛馬之微意也。行運亦如之，識其微意，則於命理之說，思過半矣。\n궁통보감 「오행총론」"}
- {slot: evidence.source, key: "source.gungtong-bogam/five_elements#color", text: "오행마다 바른 색이 있어 수는 검정, 화는 빨강, 목은 푸른색, 토는 노랑이라는 뜻이에요.\n推其形色，則水黑、火赤、木青、土黃，此正色也。及其變易，則不然。常以生旺從正色，死絶從母色，成形冠帶從妻色，病敗從鬼色，旺墓從子色。\n궁통보감 「오행총론」"}
- {slot: evidence.source, key: "source.gungtong-bogam/five_elements#direction", text: "북쪽은 수, 남쪽은 화, 동쪽은 목, 서쪽은 금, 가운데는 토를 낳는다는 뜻이에요.\n北方陰極而生寒，寒生水。南方陽極而生熱，熱生火。東方陽散以泄而生風，風生木。西方陰止以收而生燥，燥生金。中央陰陽交而生溫，溫生土。其相生也所以相維，其相剋也所以相制，此之謂有倫。\n궁통보감 「오행총론」"}
- {slot: evidence.source, key: "source.gungtong-bogam/five_elements#number", text: "오행마다 수가 있어 수는 1, 화는 2, 목은 3, 금은 4, 토는 5라는 뜻이에요.\n其數則水一、火二、木三、金四、土五。生旺加倍，死絶減半。\n궁통보감 「오행총론」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.丑", text: "겨울 석 달에 태어난 정화 일간에게는 갑목이 으뜸이고 경금이 도우며, 계수와 무토는 형편에 맞게 쓴다는 뜻이에요.\n三冬丁火，甲木爲尊，庚金佐之，癸戊權宜酌用可也。\n궁통보감 「삼동정」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.亥", text: "겨울 석 달에 태어난 정화 일간에게는 갑목이 으뜸이고 경금이 도우며, 계수와 무토는 형편에 맞게 쓴다는 뜻이에요.\n三冬丁火，甲木爲尊，庚金佐之，癸戊權宜酌用可也。\n궁통보감 「삼동정」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.午", text: "5월에 태어난 정화 일간이 지지에 화국을 이루고 천간에 화가 드러났을 때, 경금과 임수가 함께 드러나면 과거에 반드시 붙는다는 뜻이에요.\n或支成火局，干見火出，得庚壬兩透者，科甲定然。\n궁통보감 「오월정」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.卯", text: "2월에 태어난 정화 일간에게는 경금이 먼저, 그다음 갑목이 필요하다는 뜻이에요.\n二月丁火，濕乙傷丁，先庚後甲，非庚不能去乙，非甲不能引丁。\n궁통보감 「이월정」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.子", text: "겨울 석 달에 태어난 정화 일간에게는 갑목이 으뜸이고 경금이 도우며, 계수와 무토는 형편에 맞게 쓴다는 뜻이에요.\n三冬丁火，甲木爲尊，庚金佐之，癸戊權宜酌用可也。\n궁통보감 「십일월정」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.寅", text: "정월에 태어난 정화 일간에게는 힘이 센 갑목을 쪼갤 경금을 쓴다는 뜻이에요.\n正月丁火，甲木當權，乃爲母旺，非庚不能劈甲，何以引丁，姑用庚金。\n궁통보감 「정월정」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.巳", text: "4월에 태어난 정화 일간에게는 갑목을 쓰되 반드시 경금으로 갑목을 쪼개야 한다는 뜻이에요.\n四月丁火乘旺，雖取甲引丁，必用庚劈甲。\n궁통보감 「사월정」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.戌", text: "9월에 태어난 정화 일간이 갑목을 쓸 때는 경금이 빠질 수 없다는 뜻이에요.\n用甲者，庚不可少。\n궁통보감 「구월정」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.未", text: "6월에 태어난 정화 일간에게는 갑목이 먼저, 그다음 임수가 필요하다는 뜻이에요.\n六月之丁，陰柔退氣，但値三伏生寒，丁弱極矣，專取甲木，壬水次之。\n궁통보감 「유월정」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.申", text: "7월에 태어난 정화 일간에게는 갑목이 먼저, 그다음 갑목을 쪼갤 경금이 필요하고 병화를 빌릴 수도 있다는 뜻이에요.\n七月丁火，退氣柔弱，端用甲木，金雖乘旺司權，無傷丁之理，仍取庚劈甲，爲引火之物，或借丙暖金晒甲，不慮丙奪丁光，凡兩丙夾丁者，夏月忌之，餘月不忌，但此格少年困苦刑剋中年富貴，必要地支見水制丙，方妙。\n궁통보감 「칠월정」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.辰", text: "3월에 태어난 정화 일간에게는 갑목이 먼저, 그다음 경금이 필요하다는 뜻이에요.\n三月丁火，戊土司令，洩弱丁氣，先用甲木引丁制土，次看庚金。\n궁통보감 「삼월정」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.酉", text: "8월 항목에는 쓸 기운을 말한 문장이 없어 같은 가을 7월의 문장으로, 정화는 기운이 물러나 약하니 갑목을 쓰고 경금으로 갑목을 쪼개 불을 붙인다는 뜻이에요.\n七月丁火，退氣柔弱，端用甲木，金雖乘旺司權，無傷丁之理，仍取庚劈甲，爲引火之物\n궁통보감 「팔월정」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.丑", text: "12월에 태어난 병화 일간에게는 임수가 먼저 필요하다는 뜻이에요.\n十二月丙火，氣進二陽，侮雪欺霜，喜壬爲用。\n궁통보감 「십이월병」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.亥", text: "10월에 태어난 병화 일간은 갑목, 무토, 경금이 드러나면 시험에 붙어 이름을 낸다는 뜻이에요.\n十月丙火，太陽失令，得見甲戊庚出干，可云科甲，主爲人性好清高，斯文領袖。\n궁통보감 「시월병」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.午", text: "5월에 태어난 병화 일간은 임수가 높이 드러나야 좋은 사주가 된다는 뜻이에요.\n五月丙火，得壬高透，方爲上命。\n궁통보감 「오월병」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.卯", text: "2월에 태어난 병화 일간에게는 임수만 쓴다는 뜻이에요.\n二月丙火，陽氣舒升，專用壬水。\n궁통보감 「이월병」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.子", text: "11월에 태어난 병화 일간에게는 임수가 먼저, 그다음 무토가 필요하다는 뜻이에요.\n十一月丙火，冬至一陽生，弱中復強，壬水爲最，戊土佐之。\n궁통보감 「십일월병」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.寅", text: "정월에 태어난 병화 일간에게는 임수가 먼저 필요하고 경금과 신금이 돕는다는 뜻이에요.\n正月用壬，庚辛爲助。\n궁통보감 「정월병」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.巳", text: "4월에 태어난 병화 일간에게는 임수를 으뜸으로 쓰고 금 기운이 돕는다는 뜻이에요.\n四月專用壬水，金爲佐。\n궁통보감 「사월병」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.戌", text: "9월에 태어난 병화 일간에게는 갑목이 먼저, 그다음 임수가 필요하다는 뜻이에요.\n九月丙火，火氣愈退，所忌土晦光火，必須先用甲木，次取壬水。\n궁통보감 「구월병」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.未", text: "6월에 태어난 병화 일간에게는 임수가 먼저, 그다음 경금이 필요하다는 뜻이에요.\n六月丙火退氣，三伏生寒，壬水爲用，取庚輔佐。\n궁통보감 「유월병」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.申", text: "7월의 병화는 서산에 가까운 해라 토를 만나면 빛이 흐려지고, 호수와 바다를 비추면 밤하늘까지 밝히니 그대로 임수를 써서 빛을 돋운다는 뜻이에요.\n日近西山，見土皆晦，惟日照湖海，暮夜光天，故仍用壬水，輔映光輝。\n궁통보감 「칠월병」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.辰", text: "3월에 태어난 병화 일간에게는 임수가 먼저 필요하다는 뜻이에요.\n三月丙火，氣漸炎升，用壬水。\n궁통보감 「삼월병」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.酉", text: "8월에 태어난 병화 일간에게는 저무는 빛을 비춰 줄 임수가 여전히 필요하다는 뜻이에요.\n八月丙火，日近黃昏，丙火之餘光，存於光湖，仍用壬水輔映。\n궁통보감 「팔월병」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.丑", text: "12월에 태어난 을목 일간에게는 무토가 아니라 병화만 쓴다는 뜻이에요.\n冬月之木，雖取戊制水，不可作用，專取丙火則可。\n궁통보감 「삼동을」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.亥", text: "10월에 태어난 을목 일간에게는 병화가 먼저, 그다음 무토가 필요하다는 뜻이에요.\n十月乙木，木不受氣，而壬水司令，取丙爲用，戊土次之。\n궁통보감 「시월을」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.午", text: "5월에 태어난 을목 일간에게는 사주에 금과 수가 많으면 병화를 먼저 쓰고, 그 밖에는 모두 계수를 먼저 쓴다는 뜻이에요.\n柱多金水，丙火爲先，餘皆用癸水爲先。\n궁통보감 「오월을」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.卯", text: "2월에 태어난 을목 일간에게는 병화가 먼저, 그다음 계수가 필요하다는 뜻이에요.\n二月乙木，陽氣漸升，木不寒矣，以丙爲君，癸爲臣，丙癸兩透，不透庚金，大富大貴。\n궁통보감 「이월을」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.子", text: "11월에 태어난 을목 일간에게는 병화만 쓰고 계수는 쓰지 않는다는 뜻이에요.\n十一月乙木，花木寒凍，一陽來復，喜用丙火解凍，則花木有向陽之意，不宜用癸以凍花木，故專用丙火。\n궁통보감 「십일월을」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.寅", text: "정월에 태어난 을목 일간에게는 병화가 먼저, 그다음 계수가 필요하다는 뜻이에요.\n正月乙木，必須用丙，因天氣尤有餘寒，非丙不暖，雖有癸水，恐凝寒氣，故以丙火爲先，癸水次之。\n궁통보감 「정월을」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.巳", text: "4월에 태어난 을목 일간에게는 계수가 먼저 필요하다는 뜻이에요.\n四月乙木，自有丙火，專取癸水爲尊。\n궁통보감 「사월을」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.戌", text: "9월에 태어난 을목 일간은 뿌리가 마르고 잎이 져서 계수가 꼭 필요하다는 뜻이에요.\n九月乙木，根枯葉落，必賴癸水滋養。\n궁통보감 「구월을」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.未", text: "여름에 태어난 을목 일간에게는 오로지 계수를 쓰고 병화는 형편에 맞게 쓰며, 경금과 신금은 그다음이라는 뜻이에요.\n總之夏月之乙木，專用癸水，丙火酌用，庚辛次之。\n궁통보감 「유월을」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.申", text: "7월에 태어난 을목 일간에게는 기토를 쓰는 것이 좋고, 병화와 계수가 보이지 않아도 된다는 뜻이에요.\n七月喜己土爲用，或不見丙癸。\n궁통보감 「칠월을」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.辰", text: "3월에 태어난 을목 일간에게는 계수가 먼저, 그다음 병화가 필요하다는 뜻이에요.\n三月乙木，陽氣愈熾，先癸後丙。\n궁통보감 「삼월을」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.酉", text: "8월 백로 뒤의 을목은 목서 꽃이 아직 피지 않은 때라, 오로지 계수를 써서 꽃받침을 적신다는 뜻이에요.\n在白露之後，桂蕊未開，專用癸水以滋桂萼。\n궁통보감 「팔월을」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.丑", text: "12월에 태어난 임수 일간은 달 초반에 기운이 세므로 병화만 쓴다는 뜻이에요.\n十二月壬水，旺極復衰，何也？上半月癸辛主事，故旺，專用丙火。\n궁통보감 「십이월임」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.亥", text: "10월에 태어난 임수 일간에게는 무토가 먼저 필요하고, 경금까지 함께 갖추면 크게 귀해진다는 뜻이에요.\n十月壬水司權，至旺之極，取戊爲用，若生辰日干，又見辰時，必須戊透，又須庚制甲，不傷戊土，戊庚兩全，定主登科乃第，位顯權高。\n궁통보감 「시월임」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.午", text: "5월에 태어난 임수 일간에게는 계수가 먼저 필요하고 경금이 돕는다는 뜻이에요.\n五月壬水，丁旺壬弱，取癸爲用，取庚爲佐。\n궁통보감 「오월임」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.卯", text: "2월에 태어난 임수 일간에게는 병화는 쓰지 않고 무토와 신금을 쓴다는 뜻이에요.\n二月壬水，寒氣初除，有並流之象，不用丙暖，專取戊土辛金。\n궁통보감 「이월임」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.子", text: "11월에 태어난 임수 일간에게는 무토가 먼저, 그다음 병화가 필요하다는 뜻이에요.\n十一月壬水，陽刃幇身，較前更旺，先取戊土，次用丙火，丙戊兩透，富貴榮華。\n궁통보감 「십일월임」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.寅", text: "정월에 태어난 임수 일간에게는 물의 근원이 될 경금이 먼저 필요하다는 뜻이에요.\n正月壬水，汪洋之象，能並百川之流，然水性柔弱，宜用庚金之源，庶不致汪洋無度。\n궁통보감 「정월임」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.巳", text: "4월에 태어난 임수 일간에게는 같은 임수가 먼저, 그다음 신금이 필요하고 경금이 돕는다는 뜻이에요.\n四月壬水，丙火司權，水弱極矣，專取壬水比肩爲助，次取辛金發源，且暗合丙火，庚金爲佐。\n궁통보감 「사월임」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.戌", text: "9월의 임수는 임수가 가득할 때 갑목이 무토를 누르고 무토가 다시 드러나면 병화를 쓴다는 뜻이에요.\n九月壬水進氣，其性特厚，若一派壬水，見一甲、制戌中之戊，戊又出干，斯用丙火。\n궁통보감 「구월임」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.未", text: "6월에 태어난 임수 일간에게는 신금과 계수가 먼저, 그다음 갑목이 필요하다는 뜻이에요.\n六月壬水，己土當權，丁火退氣，先用辛金癸水，次用甲木劈土。\n궁통보감 「유월임」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.申", text: "7월에 태어난 임수 일간에게는 무토가 먼저, 그다음 정화가 필요하다는 뜻이에요.\n七月壬水，庚金司令，壬得申之長生，源流自遠，轉弱爲強，專用戊土，次取丁火佐戊制庚。\n궁통보감 「칠월임」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.辰", text: "3월에 태어난 임수 일간에게는 갑목이 먼저, 그다음 경금이 필요하다는 뜻이에요.\n三月壬水，戊土司權，恐有推山填海之患，先用甲疏季土，次取庚金。\n궁통보감 「삼월임」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.酉", text: "8월에 태어난 임수 일간에게는 갑목만 쓴다는 뜻이에요.\n八月壬水，辛金司權，正金白水清，忌戊土爲病，專用甲木。\n궁통보감 「팔월임」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.丑", text: "12월에 태어난 기토 일간에게는 병화가 먼저, 그다음 갑목이 필요하다는 뜻이에요.\n三冬己土，濕泥寒凍，非丙暖不生，取丙爲尊，甲木參酌。\n궁통보감 「삼동기」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.亥", text: "10월에 태어난 기토 일간에게는 병화가 먼저, 그다음 갑목이 필요하다는 뜻이에요.\n三冬己土，濕泥寒凍，非丙暖不生，取丙爲尊，甲木參酌。\n궁통보감 「삼동기」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.午", text: "5월에 태어난 기토 일간에게는 계수가 먼저, 그다음 병화가 필요하다는 뜻이에요.\n三夏己土，雜氣才官，禾稼在田，最喜甘沛，取癸爲要，次用丙火。\n궁통보감 「삼하기」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.卯", text: "2월에 태어난 기토 일간에게는 갑목이 먼저 필요하다는 뜻이에요.\n二月己土，陽氣漸升，雖禾稼未成，萬物出土，田園未展，先取甲木疏之，忌合。\n궁통보감 「이월기」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.子", text: "11월에 태어난 기토 일간에게는 병화가 먼저, 그다음 갑목이 필요하다는 뜻이에요.\n三冬己土，濕泥寒凍，非丙暖不生，取丙爲尊，甲木參酌。\n궁통보감 「삼동기」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.寅", text: "정월에 태어난 기토 일간에게는 병화가 먼저 필요하다는 뜻이에요.\n正月己土，田園猶凍，蓋因臘氣未除，餘寒未退，故丙爲尊。\n궁통보감 「정월기」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.巳", text: "4월에 태어난 기토 일간에게는 계수가 먼저, 그다음 병화가 필요하다는 뜻이에요.\n三夏己土，雜氣才官，禾稼在田，最喜甘沛，取癸爲要，次用丙火。\n궁통보감 「삼하기」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.戌", text: "가을 석 달에 태어난 기토 일간에게는 계수가 먼저, 병화가 그다음이고, 신금으로 계수를 돕는다는 뜻이에요.\n總之，三秋己土，先癸後丙，取辛輔癸。\n궁통보감 「삼추기」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.未", text: "6월에 태어난 기토 일간에게는 계수가 먼저, 그다음 병화가 필요하다는 뜻이에요.\n三夏己土，雜氣才官，禾稼在田，最喜甘沛，取癸爲要，次用丙火。\n궁통보감 「삼하기」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.申", text: "가을 석 달에 태어난 기토 일간에게는 계수가 먼저, 병화가 그다음이고, 신금으로 계수를 돕는다는 뜻이에요.\n總之，三秋己土，先癸後丙，取辛輔癸。\n궁통보감 「삼추기」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.辰", text: "3월에 태어난 기토 일간에게는 병화가 먼저, 그다음 계수, 이어서 갑목이 필요하다는 뜻이에요.\n三月己土，正栽培禾稼之時，先丙後癸，土暖而潤，隨用甲疏，三者俱透天干，必官居黃閣。\n궁통보감 「삼월기」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.酉", text: "가을 석 달에 태어난 기토 일간에게는 계수가 먼저, 병화가 그다음이고, 신금으로 계수를 돕는다는 뜻이에요.\n總之，三秋己土，先癸後丙，取辛輔癸。\n궁통보감 「팔월기」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.丑", text: "12월에 태어난 경금 일간에게는 병화가 먼저, 그다음 정화가 필요하고 갑목도 빠질 수 없다는 뜻이에요.\n十二月庚金，寒氣太重，且多濕泥，愈寒愈凍，先取丙火解凍，次取丁火煉金，甲亦不可少。\n궁통보감 「십이월경」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.亥", text: "10월에 태어난 경금 일간에게는 다듬을 정화와 데울 병화를 쓴다는 뜻이에요.\n十月庚金，水冷性寒，非丁莫造，非丙不暖。\n궁통보감 「시월경」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.午", text: "5월에 태어난 경금 일간에게는 임수가 먼저, 그다음 계수가 필요하다는 뜻이에요.\n五月庚金，丁火旺烈，庚金敗地，專用壬水，癸又次之。\n궁통보감 「오월경」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.卯", text: "2월에 태어난 경금 일간에게는 정화가 먼저, 그다음 정화를 살릴 갑목과 갑목을 쪼갤 경금이 필요하다는 뜻이에요.\n二月庚金，柱中自然有乙，當令之乙，見庚必輸情於乙，此金有暗強之勢，如秋金一理，故二月庚金，專用丁火，借甲引丁，借庚劈甲。\n궁통보감 「이월경」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.子", text: "11월에 태어난 경금 일간에게는 정화와 갑목이 먼저, 그다음 병화가 필요하다는 뜻이에요.\n十一月庚金，天氣嚴寒，仍取丁甲，次取丙火照暖。\n궁통보감 「십일월경」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.寅", text: "정월에 태어난 경금 일간에게는 병화가 먼저, 그다음 갑목이 필요하다는 뜻이에요.\n正月庚金，木旺之際，有土皆死，不能生金，且金之寒氣未除，先用丙暖庚性，又慮土厚埋金，須甲疏洩。\n궁통보감 「정월경」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.巳", text: "4월에 태어난 경금 일간에게 병화는 금을 녹이지 않아 불길을 두려워하지 않고 병화도 쓸 수 있지만, 임수를 먼저 써야 중화를 이루니, 여름에 난 금은 토를 반긴다는 뜻이에요.\n丙不鎔金，故不畏火炎，丙亦可作用，但先壬水，方得中和，故曰羣金生夏，喜用勾陳。\n궁통보감 「사월경」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.戌", text: "9월에 태어난 경금 일간에게는 갑목이 먼저, 그다음 임수가 필요하다는 뜻이에요.\n九月庚金，戊土司令，最怕土厚埋金，宜先用甲疏，後用壬洗，則金自出矣。\n궁통보감 「구월경」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.未", text: "6월에 태어난 경금 일간에게는 정화가 먼저, 그다음 갑목이 필요하다는 뜻이에요.\n六月庚金，三伏生寒，頑鈍極矣，先用丁火，次取甲木。\n궁통보감 「유월경」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.申", text: "7월에 태어난 경금 일간에게는 오로지 정화로 단련하고, 그다음 갑목으로 정화를 이끈다는 뜻이에요.\n專用丁火鍛煉，次取甲木引丁\n궁통보감 「칠월경」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.辰", text: "3월에 태어난 경금 일간에게는 갑목이 먼저, 그다음 정화가 필요하다는 뜻이에요.\n三月庚金，戊土司令，無生金之理，有埋金之憂，故先甲後丁，不用庚劈甲。\n궁통보감 「삼월경」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.酉", text: "8월에 태어난 경금 일간에게는 정화와 갑목을 쓰고 병화도 빠질 수 없다는 뜻이에요.\n八月庚金，剛銳未退，用丁用甲，丙不可少。\n궁통보감 「팔월경」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.丑", text: "12월에 태어난 무토 일간에게는 병화가 먼저, 그다음 갑목이 필요하다는 뜻이에요.\n十一二月嚴寒冰凍，丙火爲專，甲木爲佐。\n궁통보감 「십일이월무」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.亥", text: "10월에 태어난 무토 일간에게는 갑목이 먼저, 그다음 병화가 필요하다는 뜻이에요.\n十月戊土，時値小陽，陽氣略出，先用甲木，次取丙火。\n궁통보감 「시월무」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.午", text: "5월에 태어난 무토 일간에게는 임수가 먼저, 그다음 갑목이 필요하고 병화는 형편에 따라 쓴다는 뜻이에요.\n五月戊土，仲夏火炎，先看壬水，次取甲木，丙火酌用，用癸力微。\n궁통보감 「오월무」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.卯", text: "2월에 태어난 무토 일간에게는 갑목과 계수가 있어도 추위를 걷을 병화가 먼저 필요하다는 뜻이에요.\n正二月即有甲癸，若無丙除寒，如萬物生而不長，故無丙者，富貴艱辛。\n궁통보감 「정이월무」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.子", text: "11월에 태어난 무토 일간에게는 병화가 먼저, 그다음 갑목이 필요하다는 뜻이에요.\n十一二月嚴寒冰凍，丙火爲專，甲木爲佐。\n궁통보감 「십일이월무」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.寅", text: "정월에 태어난 무토 일간에게는 갑목과 계수가 있어도 추위를 걷을 병화가 먼저 필요하다는 뜻이에요.\n正二月即有甲癸，若無丙除寒，如萬物生而不長，故無丙者，富貴艱辛。\n궁통보감 「정이월무」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.巳", text: "4월에 태어난 무토 일간에게는 갑목이 먼저, 그다음 병화와 계수가 필요하다는 뜻이에요.\n四月戊土，陽氣發升，寒氣內藏，外實內虛，不畏火炎，無陽氣相催，萬物不長，故先用甲疏劈，次取丙癸爲佐。\n궁통보감 「사월무」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.戌", text: "9월에 태어난 무토 일간에게는 갑목이 먼저, 그다음 계수가 필요하다는 뜻이에요.\n九月戊土當權，不可專用丙，先看甲木，次取癸水，卻忌化合。\n궁통보감 「구월무」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.未", text: "6월에 태어난 무토 일간에게는 계수가 먼저, 그다음 병화와 갑목이 필요하다는 뜻이에요.\n六月戊土，遇夏乾枯，先看癸水，次用丙火甲木。\n궁통보감 「유월무」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.申", text: "7월에 태어난 무토 일간에게는 병화가 먼저, 그다음 계수, 마지막으로 갑목이 필요하다는 뜻이에요.\n七月戊土，陽氣漸入，寒氣漸出，先丙後癸，甲木次之。\n궁통보감 「칠월무」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.辰", text: "3월에 태어난 무토 일간은 병화, 갑목, 계수가 하나도 보이지 않으면 어리석고 낮은 처지가 된다는 뜻이에요.\n三月戊土司令，不見丙甲癸者，愚而且賤。\n궁통보감 「삼월무」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.酉", text: "8월에 태어난 무토 일간에게는 병화가 먼저, 그다음 계수가 필요하고 나무는 필요 없다는 뜻이에요.\n八月戊土，金洩身寒，賴丙照暖，喜水滋潤，先丙後癸，不必木疏。\n궁통보감 「팔월무」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.丑", text: "12월에 태어난 갑목 일간에게는 경금이 먼저, 그다음 정화가 필요하다는 뜻이에요.\n十二月甲木，天寒氣凍，木性極寒，無生發之象，先用庚劈甲，方引丁火始得木火有通明之象，故丁次之。\n궁통보감 「십이월갑」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.亥", text: "10월에 태어난 갑목 일간에게는 경금과 정화가 먼저, 그다음 병화가 필요하다는 뜻이에요.\n十月甲木，庚丁爲要，丙火次之。\n궁통보감 「시월갑」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.午", text: "5월에 태어난 갑목 일간에게는 계수가 먼저, 정화가 그다음이고 경금은 그 뒤라는 뜻이에요.\n五月先癸後丁庚金次之。\n궁통보감 「오뉴월갑」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.卯", text: "2월의 갑목은 경금이 제자리를 잡으면 조금 귀해지고 다른 길로 이름을 내지만, 재물의 뒷받침이 필요하다는 뜻이에요.\n二月甲木，庚金得所，名陽刃駕殺，可云小貴，異途顯達，或主武職，但要財資之。\n궁통보감 「이월갑」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.子", text: "11월에 태어난 갑목 일간에게는 정화가 먼저, 그다음 경금이 필요하고 병화가 돕는다는 뜻이에요.\n十一月甲木，木性生寒，丁先庚後，丙火佐之。\n궁통보감 「십일월갑」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.寅", text: "정월에 태어난 갑목 일간은 아직 추위가 남아 병화와 계수를 만나면 부와 명예를 함께 얻는다는 뜻이에요.\n正月甲木，初春尚有餘寒，得丙癸逢，富貴雙全。\n궁통보감 「정월갑」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.巳", text: "4월에 태어난 갑목 일간에게는 계수가 먼저, 그다음 정화가 필요하다는 뜻이에요.\n四月甲木退氣，丙火司權，先癸後丁。\n궁통보감 「사월갑」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.戌", text: "9월에 태어난 갑목 일간에게는 정화가 먼저, 그다음 임수와 계수가 필요하다는 뜻이에요.\n九月甲木，木星凋零，獨愛丁火，壬癸滋扶，丁壬癸透，戊己亦透，此命配得中和，可許一榜。\n궁통보감 「구월갑」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.未", text: "6월에 태어난 갑목 일간에게는 정화가 먼저, 경금이 그다음이고 계수는 없어도 된다는 뜻이에요.\n先丁後庚，無癸亦可。\n궁통보감 「오뉴월갑」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.申", text: "7월에 태어난 갑목 일간에게는 정화가 먼저, 그다음 경금이 필요하고 경금은 빠질 수 없다는 뜻이에요.\n七月甲木，丁火爲尊，庚金次之，庚金不可少。\n궁통보감 「칠월갑」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.辰", text: "3월에 태어난 갑목 일간에게는 경금을 먼저 쓰고 임수를 그다음에 쓴다는 뜻이에요.\n先取庚金，次用壬水。\n궁통보감 「삼월갑」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.酉", text: "8월에 태어난 갑목 일간에게는 정화가 먼저, 병화가 그다음, 경금이 그 뒤라는 뜻이에요.\n丁火爲先，次用丙火，庚金再次。\n궁통보감 「팔월갑」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.丑", text: "12월에 태어난 계수 일간에게는 병화가 먼저 필요하다는 뜻이에요.\n十二月癸水，寒極成冰，萬物不能舒泰，宜丙火解凍。\n궁통보감 「십이월계」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.亥", text: "10월에 태어난 계수 일간에게는 경금과 신금을 쓴다는 뜻이에요.\n十月癸水，旺中有弱，何也？因亥搖木，洩散元神，宜用庚辛爲妙。\n궁통보감 「시월계」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.午", text: "5월에 태어난 계수 일간에게는 경금과 신금이 필요하고, 같은 물 기운이 있어야 제대로 쓸 수 있다는 뜻이에요.\n五月癸水，至弱無根，必須庚辛爲生身之本，但丁火司權，金難敵火，安能滋養癸水，宜見比劫，方得辛金之用。\n궁통보감 「오월계」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.卯", text: "2월에 태어난 계수 일간에게는 경금이 먼저, 그다음 신금이 필요하다는 뜻이에요.\n二月癸水，不剛不柔，乙木司令，洩弱元神，專以庚金爲用，辛金次之。\n궁통보감 「이월계」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.子", text: "11월에 태어난 계수 일간에게는 병화가 먼저, 그다음 신금이 필요하다는 뜻이에요.\n十一月癸水，値冰凍之時，金水無交歡之象，專用丙火解凍，庶不致成冰，又要辛金滋扶，無丙有辛，不妙。\n궁통보감 「십일월계」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.寅", text: "정월에 태어난 계수 일간에게는 신금이 먼저, 그다음 병화가 필요하다는 뜻이에요.\n正月癸水，値三陽之候，雨露之精，其性至柔，先用辛金，生癸水之源，次用丙火照暖，名陰陽和合，萬物發生。\n궁통보감 「정월계」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.巳", text: "4월에 태어난 계수 일간에게는 신금을 쓰고, 신금이 없으면 경금을 쓴다는 뜻이에요.\n四月癸水，喜辛金爲用，無辛用庚。\n궁통보감 「사월계」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.戌", text: "9월에 태어난 계수 일간에게는 신금이 먼저 필요하고, 같은 계수가 갑목을 키워 무토를 눌러야 좋다는 뜻이에요.\n九月癸水，失令無根，戊土司權，剋制太過，專用辛金發水之源，要比肩滋甲制戊方妙。\n궁통보감 「구월계」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.未", text: "6월에 태어난 계수 일간은 미 안에 을목과 기토가 함께 있어 깨질 듯 깨지지 않으니 칠살을 따를 수 없어, 오로지 경금과 신금을 쓴다는 뜻이에요.\n因未中有乙己同宮，破而不破，故癸水不能從殺，所以專用庚辛。\n궁통보감 「유월계」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.申", text: "7월에 태어난 계수 일간은 경금이 때를 맡아 몹시 굳세고 날카로우니, 반드시 정화를 쓴다는 뜻이에요.\n但庚司令剛銳極矣，必取丁火爲用。\n궁통보감 「칠월계」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.辰", text: "3월 청명 뒤에 태어난 계수 일간은 아직 불기운이 세지 않아, 오로지 병화를 써서 음양을 어울리게 한다는 뜻이에요.\n清明後、火氣未熾，專用丙火，爲陰陽合諧。\n궁통보감 「삼월계」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.酉", text: "8월에 태어난 계수 일간에게는 신금이 먼저, 그다음 병화가 필요하다는 뜻이에요.\n八月癸水，辛金虛靈，非頑金可比，正金白水清，故取辛金爲用，丙火佐之。\n궁통보감 「팔월계」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.丑", text: "12월에 태어난 신금 일간에게는 병화가 먼저, 그다음 임수가 필요하다는 뜻이에요.\n十二月辛金，寒凍之極，先丙後壬，無丙不能解凍，無壬不能洗淘。\n궁통보감 「십이월신」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.亥", text: "10월에 태어난 신금 일간에게는 임수가 먼저, 그다음 병화가 필요하다는 뜻이에요.\n十月辛金，時値小陽，陽氣漸升，寒氣將降，先用壬水，次取丙火，壬丙兩透，金榜題名，何也？蓋辛金有壬水丙火，名金白水清，又在亥月故發。\n궁통보감 「시월신」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.午", text: "5월에 태어난 신금 일간에게는 기토와 임수를 함께 쓴다는 뜻이에요.\n五月辛金，丁火司權，辛金失令，陰柔之極，不宜鍛煉，須己壬兼用，何也？己爲泥沙，壬爲湖海，己無壬不濕，辛無己不生，故壬己並用。\n궁통보감 「오월신」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.卯", text: "2월에 태어난 신금 일간에게는 임수가 먼저 필요하고 무토와 기토는 해롭다는 뜻이에요.\n二月辛金，陽和之際，壬水爲尊，見戊己爲病。\n궁통보감 「이월신」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.子", text: "겨울에 태어난 신금 일간에게는 병화로 따뜻하게 해야 좋다는 뜻이에요.\n冬月辛金，須丙溫暖方妙。\n궁통보감 「십일월신」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.寅", text: "정월에 태어난 신금 일간에게는 기토와 임수를 쓰고, 경금이 갑목을 눌러 주면 좋다는 뜻이에요.\n正月辛金，陽氣舒而寒氣未除，不知正月建寅，中有長生之丙，解去寒氣，忌甲木司權，辛金失令，取己土爲生身之本，欲得辛金發現，全賴壬水之功，己壬兩透，支見庚制甲，科甲定然。\n궁통보감 「정월신」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.巳", text: "4월에 태어난 신금 일간에게는 씻어 줄 임수가 필요하고 뜨거운 병화는 꺼린다는 뜻이에요.\n四月辛金，時逢首夏，忌丙火之燥烈，喜壬水之洗淘。\n궁통보감 「사월신」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.戌", text: "9월에 태어난 신금 일간에게는 임수가 먼저, 그다음 갑목이 필요하다는 뜻이에요.\n九月辛金，戊土司令，母旺子相，須甲疏土，壬洩旺金，先壬後甲。\n궁통보감 「구월신」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.未", text: "6월에 태어난 신금 일간에게는 임수가 먼저, 그다음 경금이 필요하다는 뜻이에요.\n六月辛金，己土當權，輔助太多，恐掩金光，先用壬水，取庚佐之。\n궁통보감 「유월신」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.申", text: "7월의 신금은 임수가 있고 무토가 둑이 되어 주면 깨끗한 관리가 되지만 부자는 못 된다는 뜻이에요.\n七月辛金，値庚司令，不旺自旺，且壬水居申，四柱不見戊土，胎元戊藏申內，爲壬堤岸，人命得此，爲官清正，但不富耳。\n궁통보감 「칠월신」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.辰", text: "3월에 태어난 신금 일간에게는 임수가 먼저, 그다음 갑목이 필요하다는 뜻이에요.\n三月辛金，戊土司令，辛承正氣，母旺子相，先壬後甲。\n궁통보감 「삼월신」"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.酉", text: "8월에 태어난 신금 일간에게는 임수만 쓴다는 뜻이에요.\n八月辛金，當權得令，旺之極矣，專用壬水淘洗火，故云：金見水以流通。\n궁통보감 「팔월신」"}
- {slot: evidence.source, key: "source.jeokcheonsu/tags#clash_month_branch", text: "월령은 집과 같고 그 안에서 일을 맡은 기운은 집의 방향과 같아, 반드시 살펴야 한다는 뜻이에요.\n月令提綱，譬之宅也，人元用事之神，宅之向也，不可以不卜。\n적천수 「월령론」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/tags#branch_hap", text: "합은 어울림이라, 음과 양이 서로 어울리면 기운이 저절로 합해진다는 뜻이에요.\n夫合者，和也，乃陰陽相和，其氣自合。\n삼명통회 「논지원육합」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/tags#cheoneul_gwiin", text: "천을귀인은 가장 귀한 신이라, 이르는 곳마다 모든 흉살이 조용히 피해 간다는 뜻이에요.\n其神最尊貴，所至之處，一切凶煞隱然而避。\n삼명통회 「논천을귀인」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/tags#clash", text: "충은 열두 지지가 서로 맞부딪혀 싸우는 것이라 대개 흉하게 본다는 뜻이에요.\n相沖者，十二支戰擊之神，大概爲凶。\n삼명통회 「논충격」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/tags#clash_day_branch", text: "일주 자리가 상하면 나 자신에게 이롭지 않으니, 이를 절요살이라 부른다는 뜻이에요.\n傷日不利己身，名折腰煞\n삼명통회 「논년월일시」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/tags#dohwa", text: "인오술은 묘, 사유축은 오, 신자진은 유, 해묘미는 자가 장생 다음 목욕 자리이고, 패신이나 도화살이라고도 부른다는 뜻이에요.\n寅午戌卯、已酉丑午、申子辰酉、亥卯未子即長生第二位沐浴之宮是也。一名敗神，一名桃花煞\n삼명통회 「논함지」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/tags#gongmang", text: "갑으로 시작하는 열흘이 끝나고 남는 자리를 공망이라 하니, 자리는 있으나 녹이 없어 공, 지지는 있으나 천간이 없어 망이라는 뜻이에요.\n故以甲旬盡處曰空亡，蓋有是位而無祿，曰空；有支而無干，曰亡。\n삼명통회 「논공망」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/shinsal#cheondeok", text: "이 열두 자리는 흉을 돌려 선으로 만들 수 있어 천덕이라 한다는 뜻이에요.\n此十二位宮能回凶作善乃曰天德也\n삼명통회 「논천월덕」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/shinsal#woldeok", text: "월덕은 삼합이 비추는 방위로, 신자진은 임, 해묘미는 갑, 인오술은 병, 사유축은 경에 드니 임, 갑, 병, 경을 월덕이라 한다는 뜻이에요.\n月德者乃三合所照之方日月會合之辰申子辰會酉出庚入垣於壬亥卯未會午出丙入垣於甲寅午戌會卯出甲入垣於丙巳酉丑會子出壬入垣於庚故壬甲丙庚謂之月德\n삼명통회 「논천월덕」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/shinsal#geumyeo", text: "금여는 늘 녹 앞 두 자리에 있으니, 갑자생은 녹이 인에 있어 진이 금여라는 뜻이에요.\n金轝常居祿前二辰如甲子人祿在寅辰為金轝是也\n삼명통회 「논금여」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/shinsal#gosin", text: "해자축처럼 한 방위의 세 자리에서 앞으로 한 자리 나아가 인을 만나면 고, 뒤로 한 자리 물러나 술을 만나면 과라는 뜻이에요.\n如亥子丑逐方三位進前一辰見寅為孤退後一辰見戌為寡\n삼명통회 「논고신과숙」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/shinsal#gwasuk", text: "해자축처럼 한 방위의 세 자리에서 앞으로 한 자리 나아가 인을 만나면 고, 뒤로 한 자리 물러나 술을 만나면 과라는 뜻이에요.\n如亥子丑逐方三位進前一辰見寅為孤退後一辰見戌為寡\n삼명통회 「논고신과숙」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/shinsal#wonjin", text: "양남음녀는 충 자리 앞 한 칸, 음남양녀는 충 자리 뒤 한 칸의 지지라는 뜻이에요. 명리일기는 한국에서 널리 쓰는 쌍을 남녀 구분 없이 써요.\n是以陽男陰女在衝前一位支辰陰男陽女在衝後一位支辰\n삼명통회 「논원진」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/shinsal#gugyo", text: "양남음녀는 명 앞 세 번째 자리가 구, 뒤 세 번째 자리가 교이고, 음남양녀는 앞이 교, 뒤가 구라는 뜻이에요.\n陽男陰女命前三辰為勾命後三辰為絞陰男陽女命前三辰為絞命後三辰為勾\n삼명통회 「논구교」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/shinsal#cheonra_jimang", text: "어째서 술과 해를 천라, 진과 사를 지망이라 하는지 그 까닭을 묻는 대목이에요.\n何以戌亥為天羅辰巳為地網\n삼명통회 「논천라지망」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/shinsal#goegang", text: "이 격에는 경진, 임진, 무술, 경술의 네 날이 있다는 뜻이에요.\n此格有四日庚辰壬辰戊戌庚戌\n삼명통회 「괴강」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/shinsal#sipak_daepae", text: "육갑순 가운데 녹이 공망에 드는 열 날이라는 뜻이에요.\n六甲旬中十個日値祿入空亡\n삼명통회 「논십악대패」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/shinsal#eumchak_yangcha", text: "음양차착살은 병자, 정축, 무인, 신묘, 임진, 계사, 병오, 정미, 무신, 신유, 임술, 계해의 열두 날이라는 뜻이에요.\n陰陽差錯煞乃丙子丁丑戊寅辛卯壬辰癸巳丙午丁未戊申辛酉壬戌癸亥十二日也\n삼명통회 「총론제신살」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/shinsal#samgi", text: "삼기는 차례대로 놓여야 하고 거꾸로 어지러우면 안 되니, 을병정이나 갑무경이 연, 월, 일, 시 천간에 차례대로 놓이면 길하다는 뜻이에요.\n三奇要順布不欲倒亂如乙丙丁甲戊庚天干年月日時順布為吉\n삼명통회 「논삼기」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/shinsal#weighing", text: "앞의 신살들은 옛사람이 중히 여겼지만, 반드시 일간의 강약과 오행의 생극을 바탕으로 재관인식과 귀인, 녹마를 함께 본 뒤에 신살이 얼마나 무거운지 따져 봐야 하고, 신살만 보고 판단하면 틀린다는 뜻이에요.\n右十二宮神煞古人所重然必以主本旺相休囚五行生尅制化本之以財官印食參之以貴人祿馬然後看神煞輕重較量可也若專論神煞則誣矣\n삼명통회 「총론제신살」"}
- {slot: evidence.source, key: "source.xieji-bianfang/days#tiande", text: "천덕은 정월 정, 2월 곤, 3월 임, 4월 신, 5월 건, 6월 갑, 7월 계, 8월 간, 9월 병, 10월 을, 11월 손, 12월 경이라는 뜻이에요.\n天德者正月丁二月坤三月壬四月辛五月乾六月甲七月癸八月艮九月丙十月乙十一月巽十二月庚\n협기변방서 「천덕」"}
- {slot: evidence.source, key: "source.xieji-bianfang/days#yuede", text: "월덕은 1, 5, 9월은 병, 2, 6, 10월은 갑, 3, 7, 11월은 임, 4, 8, 12월은 경에 있다는 뜻이에요.\n月德者正五九月在丙二六十月在甲三七十一月在壬四八十二月在庚\n협기변방서 「월덕」"}
- {slot: evidence.source, key: "source.xingxue-dacheng/shinsal#amrok", text: "암록은 갑생이 해를 만나는 것이니 해가 인과 합하고, 을생이 술을 만나는 것이니 술이 묘와 합한다는 뜻이에요.\n暗祿者甲生人逢亥是亥能合寅乙生人逢戌是戌能合卯\n성학대성 「논공록교록암록」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/tags#hwagae", text: "삼합의 마지막 자리인 창고 자리를 화개라 부른다는 뜻이에요.\n故以三合底處得庫謂之華蓋。\n삼명통회 「논장성화개」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/tags#stem_hap", text: "음이 양을, 양이 음을 만나야 합이 되니, 남녀가 만나 부부가 되는 것과 같다는 뜻이에요.\n唯陰見陽，陽見陰爲合，亦如男女相合而成夫婦之道。\n삼명통회 「논십간합」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/tags#yeokma", text: "역마는 선천수로 따진 삼합의 수에서 나온다는 뜻이에요.\n所謂驛馬者，乃先天三合數也\n삼명통회 「논역마」"}
- {slot: evidence.source, key: "source.jeokcheonsu/personal#day_master", text: "기운이 왕하면 빼고 덜어 내는 것이 알맞고, 쇠하면 돕고 북돋는 것을 좋아한다는 것이 자평의 이치라는 뜻이에요.\n旺則宜洩宜傷，衰則喜幇喜助，子平之理也\n적천수 「쇠왕론」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/five_elements#color_change", text: "오행의 제 색은 수 검정, 화 빨강, 목 푸른색, 금 흰색, 토 노랑이지만, 바뀔 때는 생왕이면 제 색, 사절이면 나를 낳는 오행의 색, 성형과 관대면 내가 이기는 오행의 색, 병패면 나를 이기는 오행의 색, 왕묘면 내가 낳는 오행의 색을 따른다는 뜻이에요.\n推其形色則水黑火赤木青金白土黃此正色也及其變易則不然常以生旺從正色死絶從母色成形冠帶從妻色病敗從鬼色旺墓從子色\n삼명통회 「논오행」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#luck.ten_god", text: "운에서 관은 생해 주기를 바라고 상하기를 바라지 않으며, 살은 눌러 주기를 바라고 돕기를 바라지 않고, 재는 받쳐 주기를 바라고 빼앗기를 바라지 않으며, 인은 왕해지기를 바라고 쇠하기를 바라지 않고, 식은 생해 주기를 바라고 효에 끊기기를 바라지 않는다는 뜻이에요.\n官欲運生不欲運傷煞欲運制不欲運助財欲運扶不欲運劫印欲運旺不欲運衰食欲運生不欲運梟絶\n삼명통회 「논대운」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#luck.twelve_stage", text: "운이 장생에 들면 새로 세우고 시작하는 일이 있고, 건록과 제왕에 이르면 일이 성하고 즐거우며 복과 재물이 늘어난다는 뜻이에요.\n凡行運長生主有創建作新之事到臨官帝旺主興盛快樂發福進財\n삼명통회 「논대운」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#ten_god.geonrok", text: "양인, 비견, 패재, 건록은 이름은 달라도 실은 한집안처럼 같은 기운이라는 뜻이에요.\n余按陽刃比肩敗財建祿名雖不同實一家同氣之神\n삼명통회 「논건록」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#ten_god.jeonggwan", text: "정관은 갑이 신을, 을이 경을 만나는 경우처럼 음양이 짝을 이루어 서로 다스리며 쓰임이 있어 제 도리를 이룬다는 뜻이에요.\n正官者乃甲見辛乙見庚之例陰陽配合相制有用成其道也\n삼명통회 「논정관」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#ten_god.jeongin", text: "이 격은 총명하고 지혜가 많으며, 성품이 자애롭고 말이 선량하되 느리고 서툴며, 체격이 넉넉하다는 뜻이에요.\n此格主聰明多智慧性慈惠語善良遲訥體貌豐厚\n삼명통회 「논인수」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#ten_god.jeongjae", text: "정재격은 사람이 성실하고 일을 검소하게 하며 타고난 성품이 총명하지만, 다만 인색한 면이 있다는 뜻이에요.\n正財之格主人誠實行事儉約賦性聰明惟有慳吝\n삼명통회 「논정재」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#ten_god.pyeongwan", text: "다스림이 있으면 편관이라 하고, 다스림이 없으면 칠살이라 한다는 뜻이에요.\n故有制謂之偏官無制謂之七煞\n삼명통회 「논편관」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#ten_god.pyeonin", text: "도식은 곧 편인을 이르는 말로 탄담살이라고도 하며, 식신이 가장 꺼리는 것이라는 뜻이에요.\n倒食即偏印之謂一名吞啖煞食神最忌見之\n삼명통회 「논도식」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#ten_god.pyeonjae", text: "편재격은 사람이 시원시원해 재물에 그리 인색하지 않고 남에게 정이 있지만, 꾀가 많다는 뜻이에요.\n偏財格主人慷慨不甚吝財與人有情而多詐\n삼명통회 「논편재」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#ten_god.sanggwan", text: "이 격은 재주가 많지만 남을 얕보고 기세가 높으며 속이 험해 거리낌이 없고, 꾀는 많으나 이루는 것이 적어 재주를 부리다 일을 그르친다는 뜻이에요.\n此格主多材藝傲物氣高心險無忌憚多謀少遂弄巧成拙\n삼명통회 「논상관」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#ten_god.siksin", text: "재물이 넉넉하고 먹을 것이 풍성하며 복과 도량이 크고, 몸이 넉넉하며 여유롭게 스스로 만족하고, 자식과 장수가 있다는 뜻이에요.\n主人財厚食豐福量寛弘肌體肥大優游自足有子息有壽考\n삼명통회 「논식신」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#ten_god_group.gwanseong", text: "나를 극하는 것은 내가 남에게 다스림을 받는 셈이라 관살이라는 이름을 붙였다는 뜻이에요.\n尅我者我受制於人之義故立名官煞\n삼명통회 「논고인립인식관재명의」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#ten_god_group.inseong", text: "나를 낳는 것은 부모와 같은 셈이라 인수라는 이름을 붙였다는 뜻이에요.\n生我者有父母之義故立名印綬\n삼명통회 「논고인립인식관재명의」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#ten_god_group.jaeseong", text: "내가 극하는 것은 남이 나에게 다스림을 받는 셈이라 처재라는 이름을 붙였다는 뜻이에요.\n我尅者是人受制於我之義故立名妻財\n삼명통회 「논고인립인식관재명의」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#ten_god_group.siksang", text: "내가 낳는 것은 자손과 같은 셈이라 식신이라는 이름을 붙였다는 뜻이에요.\n我生者有子孫之義故立名食神\n삼명통회 「논고인립인식관재명의」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#twelve_stage", text: "오행은 장생, 목욕, 관대, 건록, 제왕, 쇠, 병, 사, 묘, 절, 태, 양의 열두 자리를 끝없이 돌아 다시 시작하는데, 이는 사람의 한살이가 돌고 도는 것과 같다는 뜻이에요.\n夫五行寄生十二官長生沐浴冠帶臨官帝旺衰病死墓絶胎養循環無端週而復始造物大體與人相似循環十二宮亦若人世輪迴也\n삼명통회 「논오행왕상휴수사병기생십이궁」"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#yangin", text: "양은 굳셈을 말하고 인은 베고 가른다는 뜻을 취한 것으로, 녹을 지나면 양인이 생긴다는 뜻이에요.\n羊言剛也刃者取宰割之義祿過則刃生\n삼명통회 「논양인」"}
- {slot: evidence.source, key: "source.xieji-bianfang/hours#birth_year", text: "옛사람들은 모두 태어난 해의 천간을 보고, 관이나 재와 합하거나 비견, 인수, 장생이 되거나 녹마와 귀인을 얻으면서 명을 충하거나 극하지 않는 때를 골랐다는 뜻이에요.\n古人皆論生年之天干或合官或合財或比肩或印綬或四長生或取祿馬貴人不衝命尅命\n협기변방서 「논상주」"}
- {slot: evidence.source, key: "source.xieji-bianfang/hours#huangdao", text: "날로 시를 일으키면 자일에는 신시에서 청룡을 시작하고 유시를 명당으로 삼아 차례대로 세어 나간다는 뜻이에요.\n日起時則子日申時起青龍酉時為明堂依次順數\n협기변방서 「황도흑도」"}
- {slot: evidence.source, key: "source.xieji-bianfang/hours#use_hour", text: "시는 날을 쓰는 것이라 오로지 날을 돕는 데 달려 있어, 일간이나 일지와 같은 기운이거나 일지와 삼합, 육합이 되면 곧 길하고, 시의 길신과 흉신에 다 얽매일 필요 없이 귀인과 녹마만 길로 본다는 뜻이에요.\n時者日之用也全在幇扶日辰或與日支干比和或與日支三合六合即吉時家吉凶神不必盡拘惟貴人祿馬為吉\n협기변방서 「용시법」"}
