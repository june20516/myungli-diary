# 원전 출처(evidence.source) 원고(ko). W1-3b. 원문은 core quote를 정자로 옮김(W62), 원전 이름은 한글 독음(R24-1).
- {slot: evidence.source, key: "source.gungtong-bogam/five_elements#balance_principle", text: "궁통보감 「오행총론」\n以義推之，夫萬物負陰而抱陽，沖氣以和。過與不及，皆爲乖道。故高者抑之使平，下者舉之使崇，或益其不及，或損其太過。所以貴在折衷，歸於中道，使無有餘不足之累，即才官印食貴人驛馬之微意也。行運亦如之，識其微意，則於命理之說，思過半矣。\n넘치는 것은 덜고 모자란 것은 채워 가운데로 돌리는 것이 명리의 핵심이라는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/five_elements#color", text: "궁통보감 「오행총론」\n推其形色，則水黑、火赤、木青、土黃，此正色也。及其變易，則不然。常以生旺從正色，死絶從母色，成形冠帶從妻色，病敗從鬼色，旺墓從子色。\n오행마다 바른 색이 있어 수는 검정, 화는 빨강, 목은 푸른색, 토는 노랑이라는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/five_elements#direction", text: "궁통보감 「오행총론」\n北方陰極而生寒，寒生水。南方陽極而生熱，熱生火。東方陽散以泄而生風，風生木。西方陰止以收而生燥，燥生金。中央陰陽交而生溫，溫生土。其相生也所以相維，其相剋也所以相制，此之謂有倫。\n북쪽은 수, 남쪽은 화, 동쪽은 목, 서쪽은 금, 가운데는 토를 낳는다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/five_elements#number", text: "궁통보감 「오행총론」\n其數則水一、火二、木三、金四、土五。生旺加倍，死絶減半。\n오행마다 수가 있어 수는 1, 화는 2, 목은 3, 금은 4, 토는 5라는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.丑", text: "궁통보감 「삼동정」\n三冬丁火微寒，專用庚甲。\n12월에 태어난 정화 일간에게는 경금과 갑목을 쓴다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.亥", text: "궁통보감 「삼동정」\n三冬丁火微寒，專用庚甲。\n10월에 태어난 정화 일간에게는 경금과 갑목을 쓴다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.午", text: "궁통보감 「오월정」\n五月丁火，時歸建祿，不宜亂用甲木。\n5월의 정화는 스스로 힘이 강한 때라 갑목을 함부로 쓰면 안 된다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.卯", text: "궁통보감 「이월정」\n二月丁火，濕乙傷丁，先庚後甲，非庚不能去乙，非甲不能引丁。\n2월에 태어난 정화 일간에게는 경금이 먼저, 그다음 갑목이 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.子", text: "궁통보감 「십일월정」\n十一月丁火，或仲冬水多癸旺，全無比印，此作棄命從殺，亦有異途功名。\n11월의 정화는 물이 넘치고 도울 기운이 없으면 누르는 힘을 따르는 사주가 되어 다른 길로 이름을 낸다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.寅", text: "궁통보감 「정월정」\n正月丁火，甲木當權，乃爲母旺，非庚不能劈甲，何以引丁，姑用庚金。\n정월에 태어난 정화 일간에게는 힘이 센 갑목을 쪼갤 경금을 쓴다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.巳", text: "궁통보감 「사월정」\n四月丁火乘旺，雖取甲引丁，必用庚劈甲。\n4월에 태어난 정화 일간에게는 갑목을 쓰되 반드시 경금으로 갑목을 쪼개야 한다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.戌", text: "궁통보감 「구월정」\n或九月一派戊土，洩丁火之氣，不見甲木，爲傷官傷盡，非尋常可比。\n9월의 정화는 무토가 가득해 불기운을 빼앗고 갑목이 없으면 오히려 남다른 사주가 된다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.未", text: "궁통보감 「유월정」\n六月之丁，陰柔退氣，但値三伏生寒，丁弱極矣，專取甲木，壬水次之。\n6월에 태어난 정화 일간에게는 갑목이 먼저, 그다음 임수가 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.申", text: "궁통보감 「칠월정」\n七月丁火，退氣柔弱，端用甲木，金雖乘旺司權，無傷丁之理，仍取庚劈甲，爲引火之物，或借丙暖金晒甲，不慮丙奪丁光，凡兩丙夾丁者，夏月忌之，餘月不忌，但此格少年困苦刑剋中年富貴，必要地支見水制丙，方妙。\n7월에 태어난 정화 일간에게는 갑목이 먼저, 그다음 갑목을 쪼갤 경금이 필요하고 병화를 빌릴 수도 있다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.辰", text: "궁통보감 「삼월정」\n三月丁火，戊土司令，洩弱丁氣，先用甲木引丁制土，次看庚金。\n3월에 태어난 정화 일간에게는 갑목이 먼저, 그다음 경금이 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.酉", text: "궁통보감 「팔월정」\n或八月一派辛金，不見庚金，又無比劫，此棄命從財，富而且貴，雖不科甲，亦有異途。\n8월의 정화는 신금이 가득하고 경금도 도울 불도 없으면 재물을 따르는 사주가 되어 부유하고 귀하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.丑", text: "궁통보감 「십이월병」\n十二月丙火，氣進二陽，侮雪欺霜，喜壬爲用。\n12월에 태어난 병화 일간에게는 임수가 먼저 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.亥", text: "궁통보감 「시월병」\n十月丙火，太陽失令，得見甲戊庚出干，可云科甲，主爲人性好清高，斯文領袖。\n10월에 태어난 병화 일간은 갑목, 무토, 경금이 드러나면 시험에 붙어 이름을 낸다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.午", text: "궁통보감 「오월병」\n五月丙火，得壬高透，方爲上命。\n5월에 태어난 병화 일간은 임수가 높이 드러나야 좋은 사주가 된다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.卯", text: "궁통보감 「이월병」\n二月丙火，陽氣舒升，專用壬水。\n2월에 태어난 병화 일간에게는 임수만 쓴다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.子", text: "궁통보감 「십일월병」\n十一月丙火，冬至一陽生，弱中復強，壬水爲最，戊土佐之。\n11월에 태어난 병화 일간에게는 임수가 먼저, 그다음 무토가 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.寅", text: "궁통보감 「정월병」\n正月用壬，庚辛爲助。\n정월에 태어난 병화 일간에게는 임수가 먼저 필요하고 경금과 신금이 돕는다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.巳", text: "궁통보감 「사월병」\n四月專用壬水，金爲佐。\n4월에 태어난 병화 일간에게는 임수를 으뜸으로 쓰고 금 기운이 돕는다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.戌", text: "궁통보감 「구월병」\n九月丙火，火氣愈退，所忌土晦光火，必須先用甲木，次取壬水。\n9월에 태어난 병화 일간에게는 갑목이 먼저, 그다음 임수가 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.未", text: "궁통보감 「유월병」\n六月丙火退氣，三伏生寒，壬水爲用，取庚輔佐。\n6월에 태어난 병화 일간에게는 임수가 먼저, 그다음 경금이 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.申", text: "궁통보감 「칠월병」\n七月丙火，太陽轉西，陽氣衰矣。\n7월의 병화는 해가 서쪽으로 기울어 기운이 약해진다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.辰", text: "궁통보감 「삼월병」\n三月丙火，氣漸炎升，用壬水。\n3월에 태어난 병화 일간에게는 임수가 먼저 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.酉", text: "궁통보감 「팔월병」\n八月丙火，日近黃昏，丙火之餘光，存於光湖，仍用壬水輔映。\n8월에 태어난 병화 일간에게는 저무는 빛을 비춰 줄 임수가 여전히 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.丑", text: "궁통보감 「삼동을」\n冬月之木，雖取戊制水，不可作用，專取丙火則可。\n12월에 태어난 을목 일간에게는 무토가 아니라 병화만 쓴다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.亥", text: "궁통보감 「시월을」\n十月乙木，木不受氣，而壬水司令，取丙爲用，戊土次之。\n10월에 태어난 을목 일간에게는 병화가 먼저, 그다음 무토가 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.午", text: "궁통보감 「오월을」\n五月乙木，丁火司權，禾稼俱旱。\n5월의 을목은 정화가 힘을 쥐어 곡식이 모두 가문 때라는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.卯", text: "궁통보감 「이월을」\n二月乙木，陽氣漸升，木不寒矣，以丙爲君，癸爲臣，丙癸兩透，不透庚金，大富大貴。\n2월에 태어난 을목 일간에게는 병화가 먼저, 그다음 계수가 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.子", text: "궁통보감 「십일월을」\n十一月乙木，花木寒凍，一陽來復，喜用丙火解凍，則花木有向陽之意，不宜用癸以凍花木，故專用丙火。\n11월에 태어난 을목 일간에게는 병화만 쓰고 계수는 쓰지 않는다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.寅", text: "궁통보감 「정월을」\n正月乙木，必須用丙，因天氣尤有餘寒，非丙不暖，雖有癸水，恐凝寒氣，故以丙火爲先，癸水次之。\n정월에 태어난 을목 일간에게는 병화가 먼저, 그다음 계수가 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.巳", text: "궁통보감 「사월을」\n四月乙木，自有丙火，專取癸水爲尊。\n4월에 태어난 을목 일간에게는 계수가 먼저 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.戌", text: "궁통보감 「구월을」\n九月乙木，根枯葉落，必賴癸水滋養。\n9월에 태어난 을목 일간은 뿌리가 마르고 잎이 져서 계수가 꼭 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.未", text: "궁통보감 「유월을」\n六月乙木，木性且寒，柱多金水，丙火爲尊。\n6월에 태어난 을목 일간은 사주에 금과 물이 많으면 병화가 먼저 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.申", text: "궁통보감 「칠월을」\n七月乙木，庚金乘令，庚雖輸情於乙妹，怎奈干乙難合支金。\n7월의 을목은 경금이 힘을 쥐고 을목에 끌리지만, 땅속의 쇠와는 합하기 어렵다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.辰", text: "궁통보감 「삼월을」\n三月乙木，陽氣愈熾，先癸後丙。\n3월에 태어난 을목 일간에게는 계수가 먼저, 그다음 병화가 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.酉", text: "궁통보감 「팔월을」\n八月乙木，芝蘭禾稼均退。\n8월의 을목은 꽃과 곡식이 모두 기운이 물러간 때라는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.丑", text: "궁통보감 「십이월임」\n十二月壬水，旺極復衰，何也？上半月癸辛主事，故旺，專用丙火。\n12월에 태어난 임수 일간은 달 초반에 기운이 세므로 병화만 쓴다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.亥", text: "궁통보감 「시월임」\n十月壬水司權，至旺之極，取戊爲用，若生辰日干，又見辰時，必須戊透，又須庚制甲，不傷戊土，戊庚兩全，定主登科乃第，位顯權高。\n10월에 태어난 임수 일간에게는 무토가 먼저 필요하고, 경금까지 함께 갖추면 크게 귀해진다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.午", text: "궁통보감 「오월임」\n五月壬水，丁旺壬弱，取癸爲用，取庚爲佐。\n5월에 태어난 임수 일간에게는 계수가 먼저 필요하고 경금이 돕는다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.卯", text: "궁통보감 「이월임」\n二月壬水，寒氣初除，有並流之象，不用丙暖，專取戊土辛金。\n2월에 태어난 임수 일간에게는 병화는 쓰지 않고 무토와 신금을 쓴다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.子", text: "궁통보감 「십일월임」\n十一月壬水，陽刃幇身，較前更旺，先取戊土，次用丙火，丙戊兩透，富貴榮華。\n11월에 태어난 임수 일간에게는 무토가 먼저, 그다음 병화가 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.寅", text: "궁통보감 「정월임」\n正月壬水，汪洋之象，能並百川之流，然水性柔弱，宜用庚金之源，庶不致汪洋無度。\n정월에 태어난 임수 일간에게는 물의 근원이 될 경금이 먼저 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.巳", text: "궁통보감 「사월임」\n四月壬水，丙火司權，水弱極矣，專取壬水比肩爲助，次取辛金發源，且暗合丙火，庚金爲佐。\n4월에 태어난 임수 일간에게는 같은 임수가 먼저, 그다음 신금이 필요하고 경금이 돕는다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.戌", text: "궁통보감 「구월임」\n九月壬水進氣，其性特厚，若一派壬水，見一甲、制戌中之戊，戊又出干，斯用丙火。\n9월의 임수는 임수가 가득할 때 갑목이 무토를 누르고 무토가 다시 드러나면 병화를 쓴다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.未", text: "궁통보감 「유월임」\n六月壬水，己土當權，丁火退氣，先用辛金癸水，次用甲木劈土。\n6월에 태어난 임수 일간에게는 신금과 계수가 먼저, 그다음 갑목이 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.申", text: "궁통보감 「칠월임」\n七月壬水，庚金司令，壬得申之長生，源流自遠，轉弱爲強，專用戊土，次取丁火佐戊制庚。\n7월에 태어난 임수 일간에게는 무토가 먼저, 그다음 정화가 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.辰", text: "궁통보감 「삼월임」\n三月壬水，戊土司權，恐有推山填海之患，先用甲疏季土，次取庚金。\n3월에 태어난 임수 일간에게는 갑목이 먼저, 그다음 경금이 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.酉", text: "궁통보감 「팔월임」\n八月壬水，辛金司權，正金白水清，忌戊土爲病，專用甲木。\n8월에 태어난 임수 일간에게는 갑목만 쓴다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.丑", text: "궁통보감 「삼동기」\n三冬己土，濕泥寒凍，非丙暖不生，取丙爲尊，甲木參酌。\n12월에 태어난 기토 일간에게는 병화가 먼저, 그다음 갑목이 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.亥", text: "궁통보감 「삼동기」\n三冬己土，濕泥寒凍，非丙暖不生，取丙爲尊，甲木參酌。\n10월에 태어난 기토 일간에게는 병화가 먼저, 그다음 갑목이 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.午", text: "궁통보감 「삼하기」\n三夏己土，雜氣才官，禾稼在田，最喜甘沛，取癸爲要，次用丙火。\n5월에 태어난 기토 일간에게는 계수가 먼저, 그다음 병화가 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.卯", text: "궁통보감 「이월기」\n二月己土，陽氣漸升，雖禾稼未成，萬物出土，田園未展，先取甲木疏之，忌合。\n2월에 태어난 기토 일간에게는 갑목이 먼저 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.子", text: "궁통보감 「삼동기」\n三冬己土，濕泥寒凍，非丙暖不生，取丙爲尊，甲木參酌。\n11월에 태어난 기토 일간에게는 병화가 먼저, 그다음 갑목이 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.寅", text: "궁통보감 「정월기」\n正月己土，田園猶凍，蓋因臘氣未除，餘寒未退，故丙爲尊。\n정월에 태어난 기토 일간에게는 병화가 먼저 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.巳", text: "궁통보감 「삼하기」\n三夏己土，雜氣才官，禾稼在田，最喜甘沛，取癸爲要，次用丙火。\n4월에 태어난 기토 일간에게는 계수가 먼저, 그다음 병화가 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.戌", text: "궁통보감 「삼추기」\n三秋己土，萬物收藏之際，外虛內實，寒氣漸升，須丙火溫之，癸水潤之，不特此也，且癸能洩金，丙能制金，補土精神，則秋生之物咸茂矣。\n9월에 태어난 기토 일간에게는 따뜻하게 할 병화와 적셔 줄 계수를 쓴다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.未", text: "궁통보감 「삼하기」\n三夏己土，雜氣才官，禾稼在田，最喜甘沛，取癸爲要，次用丙火。\n6월에 태어난 기토 일간에게는 계수가 먼저, 그다음 병화가 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.申", text: "궁통보감 「삼추기」\n三秋己土，萬物收藏之際，外虛內實，寒氣漸升，須丙火溫之，癸水潤之，不特此也，且癸能洩金，丙能制金，補土精神，則秋生之物咸茂矣。\n7월에 태어난 기토 일간에게는 따뜻하게 할 병화와 적셔 줄 계수를 쓴다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.辰", text: "궁통보감 「삼월기」\n三月己土，正栽培禾稼之時，先丙後癸，土暖而潤，隨用甲疏，三者俱透天干，必官居黃閣。\n3월에 태어난 기토 일간에게는 병화가 먼저, 그다음 계수, 이어서 갑목이 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.酉", text: "궁통보감 「팔월기」\n八月支成金局，無丙丁出救，此人零丁孤苦。\n8월의 기토는 땅에 쇠 기운이 뭉쳤는데 병화나 정화가 구해 주지 않으면 외롭고 고생한다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.丑", text: "궁통보감 「십이월경」\n十二月庚金，寒氣太重，且多濕泥，愈寒愈凍，先取丙火解凍，次取丁火煉金，甲亦不可少。\n12월에 태어난 경금 일간에게는 병화가 먼저, 그다음 정화가 필요하고 갑목도 빠질 수 없다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.亥", text: "궁통보감 「시월경」\n十月庚金，水冷性寒，非丁莫造，非丙不暖。\n10월에 태어난 경금 일간에게는 다듬을 정화와 데울 병화를 쓴다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.午", text: "궁통보감 「오월경」\n五月庚金，丁火旺烈，庚金敗地，專用壬水，癸又次之。\n5월에 태어난 경금 일간에게는 임수가 먼저, 그다음 계수가 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.卯", text: "궁통보감 「이월경」\n二月庚金，柱中自然有乙，當令之乙，見庚必輸情於乙，此金有暗強之勢，如秋金一理，故二月庚金，專用丁火，借甲引丁，借庚劈甲。\n2월에 태어난 경금 일간에게는 정화가 먼저, 그다음 정화를 살릴 갑목과 갑목을 쪼갤 경금이 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.子", text: "궁통보감 「십일월경」\n十一月庚金，天氣嚴寒，仍取丁甲，次取丙火照暖。\n11월에 태어난 경금 일간에게는 정화와 갑목이 먼저, 그다음 병화가 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.寅", text: "궁통보감 「정월경」\n正月庚金，木旺之際，有土皆死，不能生金，且金之寒氣未除，先用丙暖庚性，又慮土厚埋金，須甲疏洩。\n정월에 태어난 경금 일간에게는 병화가 먼저, 그다음 갑목이 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.巳", text: "궁통보감 「사월경」\n四月庚金，長生於巳，巳內有戊。\n4월의 경금은 이 달에 처음 힘을 받고, 달 안에 무토가 숨어 있다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.戌", text: "궁통보감 「구월경」\n九月庚金，戊土司令，最怕土厚埋金，宜先用甲疏，後用壬洗，則金自出矣。\n9월에 태어난 경금 일간에게는 갑목이 먼저, 그다음 임수가 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.未", text: "궁통보감 「유월경」\n六月庚金，三伏生寒，頑鈍極矣，先用丁火，次取甲木。\n6월에 태어난 경금 일간에게는 정화가 먼저, 그다음 갑목이 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.申", text: "궁통보감 「칠월경」\n七月庚金，剛銳極矣。\n7월의 경금은 단단하고 날카로움이 가장 강하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.辰", text: "궁통보감 「삼월경」\n三月庚金，戊土司令，無生金之理，有埋金之憂，故先甲後丁，不用庚劈甲。\n3월에 태어난 경금 일간에게는 갑목이 먼저, 그다음 정화가 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.酉", text: "궁통보감 「팔월경」\n八月庚金，剛銳未退，用丁用甲，丙不可少。\n8월에 태어난 경금 일간에게는 정화와 갑목을 쓰고 병화도 빠질 수 없다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.丑", text: "궁통보감 「십일이월무」\n十一二月嚴寒冰凍，丙火爲專，甲木爲佐。\n12월에 태어난 무토 일간에게는 병화가 먼저, 그다음 갑목이 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.亥", text: "궁통보감 「시월무」\n十月戊土，時値小陽，陽氣略出，先用甲木，次取丙火。\n10월에 태어난 무토 일간에게는 갑목이 먼저, 그다음 병화가 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.午", text: "궁통보감 「오월무」\n五月戊土，仲夏火炎，先看壬水，次取甲木，丙火酌用，用癸力微。\n5월에 태어난 무토 일간에게는 임수가 먼저, 그다음 갑목이 필요하고 병화는 형편에 따라 쓴다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.卯", text: "궁통보감 「정이월무」\n正二月即有甲癸，若無丙除寒，如萬物生而不長，故無丙者，富貴艱辛。\n2월에 태어난 무토 일간에게는 갑목과 계수가 있어도 추위를 걷을 병화가 먼저 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.子", text: "궁통보감 「십일이월무」\n十一二月嚴寒冰凍，丙火爲專，甲木爲佐。\n11월에 태어난 무토 일간에게는 병화가 먼저, 그다음 갑목이 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.寅", text: "궁통보감 「정이월무」\n正二月即有甲癸，若無丙除寒，如萬物生而不長，故無丙者，富貴艱辛。\n정월에 태어난 무토 일간에게는 갑목과 계수가 있어도 추위를 걷을 병화가 먼저 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.巳", text: "궁통보감 「사월무」\n四月戊土，陽氣發升，寒氣內藏，外實內虛，不畏火炎，無陽氣相催，萬物不長，故先用甲疏劈，次取丙癸爲佐。\n4월에 태어난 무토 일간에게는 갑목이 먼저, 그다음 병화와 계수가 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.戌", text: "궁통보감 「구월무」\n九月戊土當權，不可專用丙，先看甲木，次取癸水，卻忌化合。\n9월에 태어난 무토 일간에게는 갑목이 먼저, 그다음 계수가 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.未", text: "궁통보감 「유월무」\n六月戊土，遇夏乾枯，先看癸水，次用丙火甲木。\n6월에 태어난 무토 일간에게는 계수가 먼저, 그다음 병화와 갑목이 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.申", text: "궁통보감 「칠월무」\n七月戊土，陽氣漸入，寒氣漸出，先丙後癸，甲木次之。\n7월에 태어난 무토 일간에게는 병화가 먼저, 그다음 계수, 마지막으로 갑목이 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.辰", text: "궁통보감 「삼월무」\n三月戊土司令，不見丙甲癸者，愚而且賤。\n3월에 태어난 무토 일간은 병화, 갑목, 계수가 하나도 보이지 않으면 어리석고 낮은 처지가 된다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.酉", text: "궁통보감 「팔월무」\n八月戊土，金洩身寒，賴丙照暖，喜水滋潤，先丙後癸，不必木疏。\n8월에 태어난 무토 일간에게는 병화가 먼저, 그다음 계수가 필요하고 나무는 필요 없다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.丑", text: "궁통보감 「십이월갑」\n十二月甲木，天寒氣凍，木性極寒，無生發之象，先用庚劈甲，方引丁火始得木火有通明之象，故丁次之。\n12월에 태어난 갑목 일간에게는 경금이 먼저, 그다음 정화가 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.亥", text: "궁통보감 「시월갑」\n十月甲木，庚丁爲要，丙火次之。\n10월에 태어난 갑목 일간에게는 경금과 정화가 먼저, 그다음 병화가 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.午", text: "궁통보감 「오뉴월갑」\n五六月甲木，木性虛焦，一理共推。\n5월의 갑목은 나무가 속이 비고 말라 있어 6월과 같은 이치로 본다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.卯", text: "궁통보감 「이월갑」\n二月甲木，庚金得所，名陽刃駕殺，可云小貴，異途顯達，或主武職，但要財資之。\n2월의 갑목은 경금이 제자리를 잡으면 조금 귀해지고 다른 길로 이름을 내지만, 재물의 뒷받침이 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.子", text: "궁통보감 「십일월갑」\n十一月甲木，木性生寒，丁先庚後，丙火佐之。\n11월에 태어난 갑목 일간에게는 정화가 먼저, 그다음 경금이 필요하고 병화가 돕는다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.寅", text: "궁통보감 「정월갑」\n正月甲木，初春尚有餘寒，得丙癸逢，富貴雙全。\n정월에 태어난 갑목 일간은 아직 추위가 남아 병화와 계수를 만나면 부와 명예를 함께 얻는다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.巳", text: "궁통보감 「사월갑」\n四月甲木退氣，丙火司權，先癸後丁。\n4월에 태어난 갑목 일간에게는 계수가 먼저, 그다음 정화가 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.戌", text: "궁통보감 「구월갑」\n九月甲木，木星凋零，獨愛丁火，壬癸滋扶，丁壬癸透，戊己亦透，此命配得中和，可許一榜。\n9월에 태어난 갑목 일간에게는 정화가 먼저, 그다음 임수와 계수가 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.未", text: "궁통보감 「오뉴월갑」\n五六月甲木，木性虛焦，一理共推。\n6월의 갑목은 나무가 속이 비고 말라 있어 5월과 같은 이치로 본다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.申", text: "궁통보감 「칠월갑」\n七月甲木，丁火爲尊，庚金次之，庚金不可少。\n7월에 태어난 갑목 일간에게는 정화가 먼저, 그다음 경금이 필요하고 경금은 빠질 수 없다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.辰", text: "궁통보감 「삼월갑」\n三月甲木，木氣相竭。\n3월의 갑목은 나무의 기운이 다해 간다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.酉", text: "궁통보감 「팔월갑」\n八月甲木，木囚金旺。\n8월의 갑목은 나무 기운이 갇히고 쇠 기운이 강하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.丑", text: "궁통보감 「십이월계」\n十二月癸水，寒極成冰，萬物不能舒泰，宜丙火解凍。\n12월에 태어난 계수 일간에게는 병화가 먼저 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.亥", text: "궁통보감 「시월계」\n十月癸水，旺中有弱，何也？因亥搖木，洩散元神，宜用庚辛爲妙。\n10월에 태어난 계수 일간에게는 경금과 신금을 쓴다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.午", text: "궁통보감 「오월계」\n五月癸水，至弱無根，必須庚辛爲生身之本，但丁火司權，金難敵火，安能滋養癸水，宜見比劫，方得辛金之用。\n5월에 태어난 계수 일간에게는 경금과 신금이 필요하고, 같은 물 기운이 있어야 제대로 쓸 수 있다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.卯", text: "궁통보감 「이월계」\n二月癸水，不剛不柔，乙木司令，洩弱元神，專以庚金爲用，辛金次之。\n2월에 태어난 계수 일간에게는 경금이 먼저, 그다음 신금이 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.子", text: "궁통보감 「십일월계」\n十一月癸水，値冰凍之時，金水無交歡之象，專用丙火解凍，庶不致成冰，又要辛金滋扶，無丙有辛，不妙。\n11월에 태어난 계수 일간에게는 병화가 먼저, 그다음 신금이 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.寅", text: "궁통보감 「정월계」\n正月癸水，値三陽之候，雨露之精，其性至柔，先用辛金，生癸水之源，次用丙火照暖，名陰陽和合，萬物發生。\n정월에 태어난 계수 일간에게는 신금이 먼저, 그다음 병화가 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.巳", text: "궁통보감 「사월계」\n四月癸水，喜辛金爲用，無辛用庚。\n4월에 태어난 계수 일간에게는 신금을 쓰고, 신금이 없으면 경금을 쓴다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.戌", text: "궁통보감 「구월계」\n九月癸水，失令無根，戊土司權，剋制太過，專用辛金發水之源，要比肩滋甲制戊方妙。\n9월에 태어난 계수 일간에게는 신금이 먼저 필요하고, 같은 계수가 갑목을 키워 무토를 눌러야 좋다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.未", text: "궁통보감 「유월계」\n六月癸水，有上下月之分。\n6월의 계수는 달 초반과 후반을 나눠서 본다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.申", text: "궁통보감 「칠월계」\n七月癸水，正母旺子相之時，癸雖死申，殊不知申中有庚生之，名死處逢生，弱中復強，即運行西北，亦不死也。\n7월의 계수는 약해 보여도 이 달 안의 경금이 살려 주어 오히려 강해진다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.辰", text: "궁통보감 「삼월계」\n三月癸水，要分清明穀雨。\n3월의 계수는 청명 무렵인지 곡우 무렵인지 나눠서 본다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.酉", text: "궁통보감 「팔월계」\n八月癸水，辛金虛靈，非頑金可比，正金白水清，故取辛金爲用，丙火佐之。\n8월에 태어난 계수 일간에게는 신금이 먼저, 그다음 병화가 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.丑", text: "궁통보감 「십이월신」\n十二月辛金，寒凍之極，先丙後壬，無丙不能解凍，無壬不能洗淘。\n12월에 태어난 신금 일간에게는 병화가 먼저, 그다음 임수가 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.亥", text: "궁통보감 「시월신」\n十月辛金，時値小陽，陽氣漸升，寒氣將降，先用壬水，次取丙火，壬丙兩透，金榜題名，何也？蓋辛金有壬水丙火，名金白水清，又在亥月故發。\n10월에 태어난 신금 일간에게는 임수가 먼저, 그다음 병화가 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.午", text: "궁통보감 「오월신」\n五月辛金，丁火司權，辛金失令，陰柔之極，不宜鍛煉，須己壬兼用，何也？己爲泥沙，壬爲湖海，己無壬不濕，辛無己不生，故壬己並用。\n5월에 태어난 신금 일간에게는 기토와 임수를 함께 쓴다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.卯", text: "궁통보감 「이월신」\n二月辛金，陽和之際，壬水爲尊，見戊己爲病。\n2월에 태어난 신금 일간에게는 임수가 먼저 필요하고 무토와 기토는 해롭다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.子", text: "궁통보감 「십일월신」\n十一月辛金，癸水司令，爲寒冬雨露，切忌癸出凍金，而困丙火，壬丙兩透，不見戊癸，衣錦腰金。\n11월에 태어난 신금 일간은 계수가 드러나면 꺼리고, 임수와 병화가 함께 드러나면 크게 귀해진다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.寅", text: "궁통보감 「정월신」\n正月辛金，陽氣舒而寒氣未除，不知正月建寅，中有長生之丙，解去寒氣，忌甲木司權，辛金失令，取己土爲生身之本，欲得辛金發現，全賴壬水之功，己壬兩透，支見庚制甲，科甲定然。\n정월에 태어난 신금 일간에게는 기토와 임수를 쓰고, 경금이 갑목을 눌러 주면 좋다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.巳", text: "궁통보감 「사월신」\n四月辛金，時逢首夏，忌丙火之燥烈，喜壬水之洗淘。\n4월에 태어난 신금 일간에게는 씻어 줄 임수가 필요하고 뜨거운 병화는 꺼린다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.戌", text: "궁통보감 「구월신」\n九月辛金，戊土司令，母旺子相，須甲疏土，壬洩旺金，先壬後甲。\n9월에 태어난 신금 일간에게는 임수가 먼저, 그다음 갑목이 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.未", text: "궁통보감 「유월신」\n六月辛金，己土當權，輔助太多，恐掩金光，先用壬水，取庚佐之。\n6월에 태어난 신금 일간에게는 임수가 먼저, 그다음 경금이 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.申", text: "궁통보감 「칠월신」\n七月辛金，値庚司令，不旺自旺，且壬水居申，四柱不見戊土，胎元戊藏申內，爲壬堤岸，人命得此，爲官清正，但不富耳。\n7월의 신금은 임수가 있고 무토가 둑이 되어 주면 깨끗한 관리가 되지만 부자는 못 된다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.辰", text: "궁통보감 「삼월신」\n三月辛金，戊土司令，辛承正氣，母旺子相，先壬後甲。\n3월에 태어난 신금 일간에게는 임수가 먼저, 그다음 갑목이 필요하다는 뜻이에요."}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.酉", text: "궁통보감 「팔월신」\n八月辛金，當權得令，旺之極矣，專用壬水淘洗火，故云：金見水以流通。\n8월에 태어난 신금 일간에게는 임수만 쓴다는 뜻이에요."}
- {slot: evidence.source, key: "source.jeokcheonsu/tags#clash_month_branch", text: "적천수 「월령론」\n月令提綱，譬之宅也，人元用事之神，宅之向也，不可以不卜。\n월령은 집과 같고 그 안에서 일을 맡은 기운은 집의 방향과 같아, 반드시 살펴야 한다는 뜻이에요."}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/tags#branch_hap", text: "삼명통회 「논지원육합」\n夫合者，和也，乃陰陽相和，其氣自合。\n합은 어울림이라, 음과 양이 서로 어울리면 기운이 저절로 합해진다는 뜻이에요."}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/tags#cheoneul_gwiin", text: "삼명통회 「논천을귀인」\n其神最尊貴，所至之處，一切凶煞隱然而避。\n천을귀인은 가장 귀한 신이라, 이르는 곳마다 모든 흉살이 조용히 피해 간다는 뜻이에요."}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/tags#clash", text: "삼명통회 「논충격」\n相沖者，十二支戰擊之神，大概爲凶。\n충은 열두 지지가 서로 맞부딪혀 싸우는 것이라 대개 흉하게 본다는 뜻이에요."}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/tags#clash_day_branch", text: "삼명통회 「논년월일시」\n傷日不利己身，名折腰煞\n일주 자리가 상하면 나 자신에게 이롭지 않으니, 이를 절요살이라 부른다는 뜻이에요."}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/tags#dohwa", text: "삼명통회 「논함지」\n寅午戌卯、已酉丑午、申子辰酉、亥卯未子即長生第二位沐浴之宮是也。一名敗神，一名桃花煞\n인오술은 묘, 사유축은 오, 신자진은 유, 해묘미는 자가 장생 다음 목욕 자리이고, 패신이나 도화살이라고도 부른다는 뜻이에요."}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/tags#gongmang", text: "삼명통회 「논공망」\n故以甲旬盡處曰空亡，蓋有是位而無祿，曰空；有支而無干，曰亡。\n갑으로 시작하는 열흘이 끝나고 남는 자리를 공망이라 하니, 자리는 있으나 녹이 없어 공, 지지는 있으나 천간이 없어 망이라는 뜻이에요."}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/tags#hwagae", text: "삼명통회 「논장성화개」\n故以三合底處得庫謂之華蓋。\n삼합의 마지막 자리인 창고 자리를 화개라 부른다는 뜻이에요."}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/tags#stem_hap", text: "삼명통회 「논십간합」\n唯陰見陽，陽見陰爲合，亦如男女相合而成夫婦之道。\n음이 양을, 양이 음을 만나야 합이 되니, 남녀가 만나 부부가 되는 것과 같다는 뜻이에요."}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/tags#yeokma", text: "삼명통회 「논역마」\n所謂驛馬者，乃先天三合數也\n역마는 선천수로 따진 삼합의 수에서 나온다는 뜻이에요."}
