# Classical source lines (evidence.source), en. W1-3b draft. Quotes are the core quote in traditional characters (W62); source name romanized. Line order: meaning, quote, source (D118 ③, W64).
- {slot: evidence.source, key: "source.gungtong-bogam/five_elements#balance_principle", text: "Taking from what runs over and filling in what's lacking to bring things back to the middle is the core of myungli.\n以義推之，夫萬物負陰而抱陽，沖氣以和。過與不及，皆爲乖道。故高者抑之使平，下者舉之使崇，或益其不及，或損其太過。所以貴在折衷，歸於中道，使無有餘不足之累，即才官印食貴人驛馬之微意也。行運亦如之，識其微意，則於命理之說，思過半矣。\nGungtong Bogam, 五行總論"}
- {slot: evidence.source, key: "source.gungtong-bogam/five_elements#color", text: "Each element has its true color: Water is black, Fire is red, Wood is blue-green, and Earth is yellow.\n推其形色，則水黑、火赤、木青、土黃，此正色也。及其變易，則不然。常以生旺從正色，死絶從母色，成形冠帶從妻色，病敗從鬼色，旺墓從子色。\nGungtong Bogam, 五行總論"}
- {slot: evidence.source, key: "source.gungtong-bogam/five_elements#direction", text: "The north gives rise to Water, the south to Fire, the east to Wood, the west to Metal, and the center to Earth.\n北方陰極而生寒，寒生水。南方陽極而生熱，熱生火。東方陽散以泄而生風，風生木。西方陰止以收而生燥，燥生金。中央陰陽交而生溫，溫生土。其相生也所以相維，其相剋也所以相制，此之謂有倫。\nGungtong Bogam, 五行總論"}
- {slot: evidence.source, key: "source.gungtong-bogam/five_elements#number", text: "Each element has a number: Water is 1, Fire is 2, Wood is 3, Metal is 4, and Earth is 5.\n其數則水一、火二、木三、金四、土五。生旺加倍，死絶減半。\nGungtong Bogam, 五行總論"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.丑", text: "For a Jeonghwa Day Master born in the twelfth month, Gyeonggeum and Gapmok are used.\n三冬丁火微寒，專用庚甲。\nGungtong Bogam, 三冬丁"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.亥", text: "For a Jeonghwa Day Master born in the tenth month, Gyeonggeum and Gapmok are used.\n三冬丁火微寒，專用庚甲。\nGungtong Bogam, 三冬丁"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.午", text: "In the fifth month, Jeonghwa is strong on its own, so Gapmok should not be used carelessly.\n五月丁火，時歸建祿，不宜亂用甲木。\nGungtong Bogam, 五月丁"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.卯", text: "For a Jeonghwa Day Master born in the second month, Gyeonggeum is needed first, then Gapmok.\n二月丁火，濕乙傷丁，先庚後甲，非庚不能去乙，非甲不能引丁。\nGungtong Bogam, 二月丁"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.子", text: "In the eleventh month, when water runs over and no energy helps it, Jeonghwa forms a chart that follows the force pressing on it and makes its name by another path.\n十一月丁火，或仲冬水多癸旺，全無比印，此作棄命從殺，亦有異途功名。\nGungtong Bogam, 十一月丁"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.寅", text: "For a Jeonghwa Day Master born in the first month, Gyeonggeum is used to split the strong Gapmok.\n正月丁火，甲木當權，乃爲母旺，非庚不能劈甲，何以引丁，姑用庚金。\nGungtong Bogam, 正月丁"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.巳", text: "For a Jeonghwa Day Master born in the fourth month, Gapmok is used, but Gyeonggeum must split it.\n四月丁火乘旺，雖取甲引丁，必用庚劈甲。\nGungtong Bogam, 四月丁"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.戌", text: "In the ninth month, Muto fills the chart and drains Jeonghwa's fire, and if there is no Gapmok, it becomes an unusual chart instead.\n或九月一派戊土，洩丁火之氣，不見甲木，爲傷官傷盡，非尋常可比。\nGungtong Bogam, 九月丁"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.未", text: "For a Jeonghwa Day Master born in the sixth month, Gapmok is needed first, then Imsu.\n六月之丁，陰柔退氣，但値三伏生寒，丁弱極矣，專取甲木，壬水次之。\nGungtong Bogam, 六月丁"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.申", text: "For a Jeonghwa Day Master born in the seventh month, Gapmok is needed first, then Gyeonggeum to split it, and Byeonghwa may also be borrowed.\n七月丁火，退氣柔弱，端用甲木，金雖乘旺司權，無傷丁之理，仍取庚劈甲，爲引火之物，或借丙暖金晒甲，不慮丙奪丁光，凡兩丙夾丁者，夏月忌之，餘月不忌，但此格少年困苦刑剋中年富貴，必要地支見水制丙，方妙。\nGungtong Bogam, 七月丁"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.辰", text: "For a Jeonghwa Day Master born in the third month, Gapmok is needed first, then Gyeonggeum.\n三月丁火，戊土司令，洩弱丁氣，先用甲木引丁制土，次看庚金。\nGungtong Bogam, 三月丁"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丁.酉", text: "In the eighth month, if Singeum fills the chart and there is no Gyeonggeum and no fire to help, Jeonghwa forms a chart that follows wealth and becomes rich and honored.\n或八月一派辛金，不見庚金，又無比劫，此棄命從財，富而且貴，雖不科甲，亦有異途。\nGungtong Bogam, 八月丁"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.丑", text: "For a Byeonghwa Day Master born in the twelfth month, Imsu is needed first.\n十二月丙火，氣進二陽，侮雪欺霜，喜壬爲用。\nGungtong Bogam, 十二月丙"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.亥", text: "A Byeonghwa Day Master born in the tenth month passes exams and makes a name when Gapmok, Muto, and Gyeonggeum show in the chart.\n十月丙火，太陽失令，得見甲戊庚出干，可云科甲，主爲人性好清高，斯文領袖。\nGungtong Bogam, 十月丙"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.午", text: "A Byeonghwa Day Master born in the fifth month makes a good chart only when Imsu shows prominently.\n五月丙火，得壬高透，方爲上命。\nGungtong Bogam, 五月丙"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.卯", text: "For a Byeonghwa Day Master born in the second month, only Imsu is used.\n二月丙火，陽氣舒升，專用壬水。\nGungtong Bogam, 二月丙"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.子", text: "For a Byeonghwa Day Master born in the eleventh month, Imsu is needed first, then Muto.\n十一月丙火，冬至一陽生，弱中復強，壬水爲最，戊土佐之。\nGungtong Bogam, 十一月丙"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.寅", text: "For a Byeonghwa Day Master born in the first month, Imsu is needed first, with Gyeonggeum and Singeum helping.\n正月用壬，庚辛爲助。\nGungtong Bogam, 正月丙"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.巳", text: "For a Byeonghwa Day Master born in the fourth month, Imsu is used above all, with Metal energy helping.\n四月專用壬水，金爲佐。\nGungtong Bogam, 四月丙"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.戌", text: "For a Byeonghwa Day Master born in the ninth month, Gapmok is needed first, then Imsu.\n九月丙火，火氣愈退，所忌土晦光火，必須先用甲木，次取壬水。\nGungtong Bogam, 九月丙"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.未", text: "For a Byeonghwa Day Master born in the sixth month, Imsu is needed first, then Gyeonggeum.\n六月丙火退氣，三伏生寒，壬水爲用，取庚輔佐。\nGungtong Bogam, 六月丙"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.申", text: "In the seventh month, Byeonghwa weakens as the sun sinks toward the west.\n七月丙火，太陽轉西，陽氣衰矣。\nGungtong Bogam, 七月丙"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.辰", text: "For a Byeonghwa Day Master born in the third month, Imsu is needed first.\n三月丙火，氣漸炎升，用壬水。\nGungtong Bogam, 三月丙"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#丙.酉", text: "For a Byeonghwa Day Master born in the eighth month, Imsu is still needed to reflect its fading light.\n八月丙火，日近黃昏，丙火之餘光，存於光湖，仍用壬水輔映。\nGungtong Bogam, 八月丙"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.丑", text: "For an Eulmok Day Master born in the twelfth month, only Byeonghwa is used, not Muto.\n冬月之木，雖取戊制水，不可作用，專取丙火則可。\nGungtong Bogam, 三冬乙"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.亥", text: "For an Eulmok Day Master born in the tenth month, Byeonghwa is needed first, then Muto.\n十月乙木，木不受氣，而壬水司令，取丙爲用，戊土次之。\nGungtong Bogam, 十月乙"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.午", text: "For Eulmok, the fifth month is a time when Jeonghwa holds power and all the grain is parched.\n五月乙木，丁火司權，禾稼俱旱。\nGungtong Bogam, 五月乙"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.卯", text: "For an Eulmok Day Master born in the second month, Byeonghwa is needed first, then Gyesu.\n二月乙木，陽氣漸升，木不寒矣，以丙爲君，癸爲臣，丙癸兩透，不透庚金，大富大貴。\nGungtong Bogam, 二月乙"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.子", text: "For an Eulmok Day Master born in the eleventh month, only Byeonghwa is used, and Gyesu is not.\n十一月乙木，花木寒凍，一陽來復，喜用丙火解凍，則花木有向陽之意，不宜用癸以凍花木，故專用丙火。\nGungtong Bogam, 十一月乙"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.寅", text: "For an Eulmok Day Master born in the first month, Byeonghwa is needed first, then Gyesu.\n正月乙木，必須用丙，因天氣尤有餘寒，非丙不暖，雖有癸水，恐凝寒氣，故以丙火爲先，癸水次之。\nGungtong Bogam, 正月乙"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.巳", text: "For an Eulmok Day Master born in the fourth month, Gyesu is needed first.\n四月乙木，自有丙火，專取癸水爲尊。\nGungtong Bogam, 四月乙"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.戌", text: "An Eulmok Day Master born in the ninth month has dry roots and fallen leaves, so Gyesu is truly needed.\n九月乙木，根枯葉落，必賴癸水滋養。\nGungtong Bogam, 九月乙"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.未", text: "For an Eulmok Day Master born in the sixth month, Byeonghwa is needed first if the chart has a lot of Metal and Water.\n六月乙木，木性且寒，柱多金水，丙火爲尊。\nGungtong Bogam, 六月乙"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.申", text: "In the seventh month, Gyeonggeum holds power and is drawn to Eulmok, but it is hard to join with the metal hidden in the earth.\n七月乙木，庚金乘令，庚雖輸情於乙妹，怎奈干乙難合支金。\nGungtong Bogam, 七月乙"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.辰", text: "For an Eulmok Day Master born in the third month, Gyesu is needed first, then Byeonghwa.\n三月乙木，陽氣愈熾，先癸後丙。\nGungtong Bogam, 三月乙"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#乙.酉", text: "For Eulmok, the eighth month is a time when flowers and grain alike have lost their energy.\n八月乙木，芝蘭禾稼均退。\nGungtong Bogam, 八月乙"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.丑", text: "For an Imsu Day Master born in the twelfth month, the energy is strong early in the month, so only Byeonghwa is used.\n十二月壬水，旺極復衰，何也？上半月癸辛主事，故旺，專用丙火。\nGungtong Bogam, 十二月壬"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.亥", text: "For an Imsu Day Master born in the tenth month, Muto is needed first, and with Gyeonggeum as well, great honor follows.\n十月壬水司權，至旺之極，取戊爲用，若生辰日干，又見辰時，必須戊透，又須庚制甲，不傷戊土，戊庚兩全，定主登科乃第，位顯權高。\nGungtong Bogam, 十月壬"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.午", text: "For an Imsu Day Master born in the fifth month, Gyesu is needed first, with Gyeonggeum helping.\n五月壬水，丁旺壬弱，取癸爲用，取庚爲佐。\nGungtong Bogam, 五月壬"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.卯", text: "For an Imsu Day Master born in the second month, Muto and Singeum are used, not Byeonghwa.\n二月壬水，寒氣初除，有並流之象，不用丙暖，專取戊土辛金。\nGungtong Bogam, 二月壬"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.子", text: "For an Imsu Day Master born in the eleventh month, Muto is needed first, then Byeonghwa.\n十一月壬水，陽刃幇身，較前更旺，先取戊土，次用丙火，丙戊兩透，富貴榮華。\nGungtong Bogam, 十一月壬"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.寅", text: "For an Imsu Day Master born in the first month, Gyeonggeum is needed first as the source of its water.\n正月壬水，汪洋之象，能並百川之流，然水性柔弱，宜用庚金之源，庶不致汪洋無度。\nGungtong Bogam, 正月壬"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.巳", text: "For an Imsu Day Master born in the fourth month, another Imsu is needed first, then Singeum, with Gyeonggeum helping.\n四月壬水，丙火司權，水弱極矣，專取壬水比肩爲助，次取辛金發源，且暗合丙火，庚金爲佐。\nGungtong Bogam, 四月壬"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.戌", text: "In the ninth month, when Imsu is abundant, Gapmok holds down Muto, and if Muto shows again, Byeonghwa is used.\n九月壬水進氣，其性特厚，若一派壬水，見一甲、制戌中之戊，戊又出干，斯用丙火。\nGungtong Bogam, 九月壬"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.未", text: "For an Imsu Day Master born in the sixth month, Singeum and Gyesu are needed first, then Gapmok.\n六月壬水，己土當權，丁火退氣，先用辛金癸水，次用甲木劈土。\nGungtong Bogam, 六月壬"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.申", text: "For an Imsu Day Master born in the seventh month, Muto is needed first, then Jeonghwa.\n七月壬水，庚金司令，壬得申之長生，源流自遠，轉弱爲強，專用戊土，次取丁火佐戊制庚。\nGungtong Bogam, 七月壬"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.辰", text: "For an Imsu Day Master born in the third month, Gapmok is needed first, then Gyeonggeum.\n三月壬水，戊土司權，恐有推山填海之患，先用甲疏季土，次取庚金。\nGungtong Bogam, 三月壬"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#壬.酉", text: "For an Imsu Day Master born in the eighth month, only Gapmok is used.\n八月壬水，辛金司權，正金白水清，忌戊土爲病，專用甲木。\nGungtong Bogam, 八月壬"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.丑", text: "For a Gito Day Master born in the twelfth month, Byeonghwa is needed first, then Gapmok.\n三冬己土，濕泥寒凍，非丙暖不生，取丙爲尊，甲木參酌。\nGungtong Bogam, 三冬己"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.亥", text: "For a Gito Day Master born in the tenth month, Byeonghwa is needed first, then Gapmok.\n三冬己土，濕泥寒凍，非丙暖不生，取丙爲尊，甲木參酌。\nGungtong Bogam, 三冬己"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.午", text: "For a Gito Day Master born in the fifth month, Gyesu is needed first, then Byeonghwa.\n三夏己土，雜氣才官，禾稼在田，最喜甘沛，取癸爲要，次用丙火。\nGungtong Bogam, 三夏己"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.卯", text: "For a Gito Day Master born in the second month, Gapmok is needed first.\n二月己土，陽氣漸升，雖禾稼未成，萬物出土，田園未展，先取甲木疏之，忌合。\nGungtong Bogam, 二月己"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.子", text: "For a Gito Day Master born in the eleventh month, Byeonghwa is needed first, then Gapmok.\n三冬己土，濕泥寒凍，非丙暖不生，取丙爲尊，甲木參酌。\nGungtong Bogam, 三冬己"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.寅", text: "For a Gito Day Master born in the first month, Byeonghwa is needed first.\n正月己土，田園猶凍，蓋因臘氣未除，餘寒未退，故丙爲尊。\nGungtong Bogam, 正月己"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.巳", text: "For a Gito Day Master born in the fourth month, Gyesu is needed first, then Byeonghwa.\n三夏己土，雜氣才官，禾稼在田，最喜甘沛，取癸爲要，次用丙火。\nGungtong Bogam, 三夏己"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.戌", text: "For a Gito Day Master born in the ninth month, Byeonghwa to warm it and Gyesu to moisten it are used.\n三秋己土，萬物收藏之際，外虛內實，寒氣漸升，須丙火溫之，癸水潤之，不特此也，且癸能洩金，丙能制金，補土精神，則秋生之物咸茂矣。\nGungtong Bogam, 三秋己"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.未", text: "For a Gito Day Master born in the sixth month, Gyesu is needed first, then Byeonghwa.\n三夏己土，雜氣才官，禾稼在田，最喜甘沛，取癸爲要，次用丙火。\nGungtong Bogam, 三夏己"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.申", text: "For a Gito Day Master born in the seventh month, Byeonghwa to warm it and Gyesu to moisten it are used.\n三秋己土，萬物收藏之際，外虛內實，寒氣漸升，須丙火溫之，癸水潤之，不特此也，且癸能洩金，丙能制金，補土精神，則秋生之物咸茂矣。\nGungtong Bogam, 三秋己"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.辰", text: "For a Gito Day Master born in the third month, Byeonghwa is needed first, then Gyesu, and after that Gapmok.\n三月己土，正栽培禾稼之時，先丙後癸，土暖而潤，隨用甲疏，三者俱透天干，必官居黃閣。\nGungtong Bogam, 三月己"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#己.酉", text: "In the eighth month, metal energy gathers in the earth of Gito, and without Byeonghwa or Jeonghwa to rescue it, life is lonely and hard.\n八月支成金局，無丙丁出救，此人零丁孤苦。\nGungtong Bogam, 八月己"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.丑", text: "For a Gyeonggeum Day Master born in the twelfth month, Byeonghwa is needed first, then Jeonghwa, and Gapmok cannot be left out either.\n十二月庚金，寒氣太重，且多濕泥，愈寒愈凍，先取丙火解凍，次取丁火煉金，甲亦不可少。\nGungtong Bogam, 十二月庚"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.亥", text: "For a Gyeonggeum Day Master born in the tenth month, Jeonghwa to refine it and Byeonghwa to warm it are used.\n十月庚金，水冷性寒，非丁莫造，非丙不暖。\nGungtong Bogam, 十月庚"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.午", text: "For a Gyeonggeum Day Master born in the fifth month, Imsu is needed first, then Gyesu.\n五月庚金，丁火旺烈，庚金敗地，專用壬水，癸又次之。\nGungtong Bogam, 五月庚"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.卯", text: "For a Gyeonggeum Day Master born in the second month, Jeonghwa is needed first, then Gapmok to keep Jeonghwa burning and Gyeonggeum to split Gapmok.\n二月庚金，柱中自然有乙，當令之乙，見庚必輸情於乙，此金有暗強之勢，如秋金一理，故二月庚金，專用丁火，借甲引丁，借庚劈甲。\nGungtong Bogam, 二月庚"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.子", text: "For a Gyeonggeum Day Master born in the eleventh month, Jeonghwa and Gapmok are needed first, then Byeonghwa.\n十一月庚金，天氣嚴寒，仍取丁甲，次取丙火照暖。\nGungtong Bogam, 十一月庚"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.寅", text: "For a Gyeonggeum Day Master born in the first month, Byeonghwa is needed first, then Gapmok.\n正月庚金，木旺之際，有土皆死，不能生金，且金之寒氣未除，先用丙暖庚性，又慮土厚埋金，須甲疏洩。\nGungtong Bogam, 正月庚"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.巳", text: "In the fourth month, Gyeonggeum first gains strength, and Muto lies hidden within the month.\n四月庚金，長生於巳，巳內有戊。\nGungtong Bogam, 四月庚"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.戌", text: "For a Gyeonggeum Day Master born in the ninth month, Gapmok is needed first, then Imsu.\n九月庚金，戊土司令，最怕土厚埋金，宜先用甲疏，後用壬洗，則金自出矣。\nGungtong Bogam, 九月庚"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.未", text: "For a Gyeonggeum Day Master born in the sixth month, Jeonghwa is needed first, then Gapmok.\n六月庚金，三伏生寒，頑鈍極矣，先用丁火，次取甲木。\nGungtong Bogam, 六月庚"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.申", text: "In the seventh month, Gyeonggeum is at its hardest and sharpest.\n七月庚金，剛銳極矣。\nGungtong Bogam, 七月庚"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.辰", text: "For a Gyeonggeum Day Master born in the third month, Gapmok is needed first, then Jeonghwa.\n三月庚金，戊土司令，無生金之理，有埋金之憂，故先甲後丁，不用庚劈甲。\nGungtong Bogam, 三月庚"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#庚.酉", text: "For a Gyeonggeum Day Master born in the eighth month, Jeonghwa and Gapmok are used, and Byeonghwa cannot be left out either.\n八月庚金，剛銳未退，用丁用甲，丙不可少。\nGungtong Bogam, 八月庚"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.丑", text: "For a Muto Day Master born in the twelfth month, Byeonghwa is needed first, then Gapmok.\n十一二月嚴寒冰凍，丙火爲專，甲木爲佐。\nGungtong Bogam, 十一二月戊"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.亥", text: "For a Muto Day Master born in the tenth month, Gapmok is needed first, then Byeonghwa.\n十月戊土，時値小陽，陽氣略出，先用甲木，次取丙火。\nGungtong Bogam, 十月戊"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.午", text: "For a Muto Day Master born in the fifth month, Imsu is needed first, then Gapmok, and Byeonghwa is used as the situation calls for.\n五月戊土，仲夏火炎，先看壬水，次取甲木，丙火酌用，用癸力微。\nGungtong Bogam, 五月戊"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.卯", text: "For a Muto Day Master born in the second month, even with Gapmok and Gyesu present, Byeonghwa is needed first to clear away the cold.\n正二月即有甲癸，若無丙除寒，如萬物生而不長，故無丙者，富貴艱辛。\nGungtong Bogam, 正二月戊"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.子", text: "For a Muto Day Master born in the eleventh month, Byeonghwa is needed first, then Gapmok.\n十一二月嚴寒冰凍，丙火爲專，甲木爲佐。\nGungtong Bogam, 十一二月戊"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.寅", text: "For a Muto Day Master born in the first month, even with Gapmok and Gyesu present, Byeonghwa is needed first to clear away the cold.\n正二月即有甲癸，若無丙除寒，如萬物生而不長，故無丙者，富貴艱辛。\nGungtong Bogam, 正二月戊"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.巳", text: "For a Muto Day Master born in the fourth month, Gapmok is needed first, then Byeonghwa and Gyesu.\n四月戊土，陽氣發升，寒氣內藏，外實內虛，不畏火炎，無陽氣相催，萬物不長，故先用甲疏劈，次取丙癸爲佐。\nGungtong Bogam, 四月戊"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.戌", text: "For a Muto Day Master born in the ninth month, Gapmok is needed first, then Gyesu.\n九月戊土當權，不可專用丙，先看甲木，次取癸水，卻忌化合。\nGungtong Bogam, 九月戊"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.未", text: "For a Muto Day Master born in the sixth month, Gyesu is needed first, then Byeonghwa and Gapmok.\n六月戊土，遇夏乾枯，先看癸水，次用丙火甲木。\nGungtong Bogam, 六月戊"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.申", text: "For a Muto Day Master born in the seventh month, Byeonghwa is needed first, then Gyesu, and finally Gapmok.\n七月戊土，陽氣漸入，寒氣漸出，先丙後癸，甲木次之。\nGungtong Bogam, 七月戊"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.辰", text: "A Muto Day Master born in the third month ends up foolish and in a low position if none of Byeonghwa, Gapmok, or Gyesu appears.\n三月戊土司令，不見丙甲癸者，愚而且賤。\nGungtong Bogam, 三月戊"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#戊.酉", text: "For a Muto Day Master born in the eighth month, Byeonghwa is needed first, then Gyesu, and Wood is not needed.\n八月戊土，金洩身寒，賴丙照暖，喜水滋潤，先丙後癸，不必木疏。\nGungtong Bogam, 八月戊"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.丑", text: "For a Gapmok Day Master born in the twelfth month, Gyeonggeum is needed first, then Jeonghwa.\n十二月甲木，天寒氣凍，木性極寒，無生發之象，先用庚劈甲，方引丁火始得木火有通明之象，故丁次之。\nGungtong Bogam, 十二月甲"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.亥", text: "For a Gapmok Day Master born in the tenth month, Gyeonggeum and Jeonghwa are needed first, then Byeonghwa.\n十月甲木，庚丁爲要，丙火次之。\nGungtong Bogam, 十月甲"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.午", text: "In the fifth month, Gapmok is hollow and dry inside, so it is read by the same principle as the sixth month.\n五六月甲木，木性虛焦，一理共推。\nGungtong Bogam, 五六月甲"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.卯", text: "In the second month, Gapmok gains some honor and makes a name by another path once Gyeonggeum settles into place, but it needs the backing of wealth.\n二月甲木，庚金得所，名陽刃駕殺，可云小貴，異途顯達，或主武職，但要財資之。\nGungtong Bogam, 二月甲"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.子", text: "For a Gapmok Day Master born in the eleventh month, Jeonghwa is needed first, then Gyeonggeum, with Byeonghwa helping.\n十一月甲木，木性生寒，丁先庚後，丙火佐之。\nGungtong Bogam, 十一月甲"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.寅", text: "A Gapmok Day Master born in the first month still has cold lingering, so meeting Byeonghwa and Gyesu brings both wealth and honor.\n正月甲木，初春尚有餘寒，得丙癸逢，富貴雙全。\nGungtong Bogam, 正月甲"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.巳", text: "For a Gapmok Day Master born in the fourth month, Gyesu is needed first, then Jeonghwa.\n四月甲木退氣，丙火司權，先癸後丁。\nGungtong Bogam, 四月甲"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.戌", text: "For a Gapmok Day Master born in the ninth month, Jeonghwa is needed first, then Imsu and Gyesu.\n九月甲木，木星凋零，獨愛丁火，壬癸滋扶，丁壬癸透，戊己亦透，此命配得中和，可許一榜。\nGungtong Bogam, 九月甲"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.未", text: "In the sixth month, Gapmok is hollow and dry inside, so it is read by the same principle as the fifth month.\n五六月甲木，木性虛焦，一理共推。\nGungtong Bogam, 五六月甲"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.申", text: "For a Gapmok Day Master born in the seventh month, Jeonghwa is needed first, then Gyeonggeum, and Gyeonggeum cannot be left out.\n七月甲木，丁火爲尊，庚金次之，庚金不可少。\nGungtong Bogam, 七月甲"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.辰", text: "In the third month, Gapmok's wood energy is running out.\n三月甲木，木氣相竭。\nGungtong Bogam, 三月甲"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#甲.酉", text: "In the eighth month, Gapmok's wood energy is shut in and metal energy is strong.\n八月甲木，木囚金旺。\nGungtong Bogam, 八月甲"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.丑", text: "For a Gyesu Day Master born in the twelfth month, Byeonghwa is needed first.\n十二月癸水，寒極成冰，萬物不能舒泰，宜丙火解凍。\nGungtong Bogam, 十二月癸"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.亥", text: "For a Gyesu Day Master born in the tenth month, Gyeonggeum and Singeum are used.\n十月癸水，旺中有弱，何也？因亥搖木，洩散元神，宜用庚辛爲妙。\nGungtong Bogam, 十月癸"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.午", text: "For a Gyesu Day Master born in the fifth month, Gyeonggeum and Singeum are needed, and they only work properly with fellow Water energy present.\n五月癸水，至弱無根，必須庚辛爲生身之本，但丁火司權，金難敵火，安能滋養癸水，宜見比劫，方得辛金之用。\nGungtong Bogam, 五月癸"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.卯", text: "For a Gyesu Day Master born in the second month, Gyeonggeum is needed first, then Singeum.\n二月癸水，不剛不柔，乙木司令，洩弱元神，專以庚金爲用，辛金次之。\nGungtong Bogam, 二月癸"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.子", text: "For a Gyesu Day Master born in the eleventh month, Byeonghwa is needed first, then Singeum.\n十一月癸水，値冰凍之時，金水無交歡之象，專用丙火解凍，庶不致成冰，又要辛金滋扶，無丙有辛，不妙。\nGungtong Bogam, 十一月癸"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.寅", text: "For a Gyesu Day Master born in the first month, Singeum is needed first, then Byeonghwa.\n正月癸水，値三陽之候，雨露之精，其性至柔，先用辛金，生癸水之源，次用丙火照暖，名陰陽和合，萬物發生。\nGungtong Bogam, 正月癸"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.巳", text: "For a Gyesu Day Master born in the fourth month, Singeum is used, and if there is no Singeum, Gyeonggeum is used.\n四月癸水，喜辛金爲用，無辛用庚。\nGungtong Bogam, 四月癸"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.戌", text: "For a Gyesu Day Master born in the ninth month, Singeum is needed first, and it is good when another Gyesu nourishes Gapmok to hold down Muto.\n九月癸水，失令無根，戊土司權，剋制太過，專用辛金發水之源，要比肩滋甲制戊方妙。\nGungtong Bogam, 九月癸"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.未", text: "In the sixth month, Gyesu is read separately for the early and late parts of the month.\n六月癸水，有上下月之分。\nGungtong Bogam, 六月癸"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.申", text: "In the seventh month, Gyesu may look weak, but the Gyeonggeum within the month keeps it alive, so it grows strong instead.\n七月癸水，正母旺子相之時，癸雖死申，殊不知申中有庚生之，名死處逢生，弱中復強，即運行西北，亦不死也。\nGungtong Bogam, 七月癸"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.辰", text: "In the third month, Gyesu is read differently depending on whether the birth falls near the solar term Cheongmyeong or near Gogu.\n三月癸水，要分清明穀雨。\nGungtong Bogam, 三月癸"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#癸.酉", text: "For a Gyesu Day Master born in the eighth month, Singeum is needed first, then Byeonghwa.\n八月癸水，辛金虛靈，非頑金可比，正金白水清，故取辛金爲用，丙火佐之。\nGungtong Bogam, 八月癸"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.丑", text: "For a Singeum Day Master born in the twelfth month, Byeonghwa is needed first, then Imsu.\n十二月辛金，寒凍之極，先丙後壬，無丙不能解凍，無壬不能洗淘。\nGungtong Bogam, 十二月辛"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.亥", text: "For a Singeum Day Master born in the tenth month, Imsu is needed first, then Byeonghwa.\n十月辛金，時値小陽，陽氣漸升，寒氣將降，先用壬水，次取丙火，壬丙兩透，金榜題名，何也？蓋辛金有壬水丙火，名金白水清，又在亥月故發。\nGungtong Bogam, 十月辛"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.午", text: "For a Singeum Day Master born in the fifth month, Gito and Imsu are used together.\n五月辛金，丁火司權，辛金失令，陰柔之極，不宜鍛煉，須己壬兼用，何也？己爲泥沙，壬爲湖海，己無壬不濕，辛無己不生，故壬己並用。\nGungtong Bogam, 五月辛"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.卯", text: "For a Singeum Day Master born in the second month, Imsu is needed first, and Muto and Gito do harm.\n二月辛金，陽和之際，壬水爲尊，見戊己爲病。\nGungtong Bogam, 二月辛"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.子", text: "A Singeum Day Master born in the eleventh month dislikes Gyesu showing in the chart, and gains great honor when Imsu and Byeonghwa show together.\n十一月辛金，癸水司令，爲寒冬雨露，切忌癸出凍金，而困丙火，壬丙兩透，不見戊癸，衣錦腰金。\nGungtong Bogam, 十一月辛"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.寅", text: "For a Singeum Day Master born in the first month, Gito and Imsu are used, and it is good when Gyeonggeum holds down Gapmok.\n正月辛金，陽氣舒而寒氣未除，不知正月建寅，中有長生之丙，解去寒氣，忌甲木司權，辛金失令，取己土爲生身之本，欲得辛金發現，全賴壬水之功，己壬兩透，支見庚制甲，科甲定然。\nGungtong Bogam, 正月辛"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.巳", text: "For a Singeum Day Master born in the fourth month, Imsu is needed to wash it clean, and hot Byeonghwa is unwelcome.\n四月辛金，時逢首夏，忌丙火之燥烈，喜壬水之洗淘。\nGungtong Bogam, 四月辛"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.戌", text: "For a Singeum Day Master born in the ninth month, Imsu is needed first, then Gapmok.\n九月辛金，戊土司令，母旺子相，須甲疏土，壬洩旺金，先壬後甲。\nGungtong Bogam, 九月辛"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.未", text: "For a Singeum Day Master born in the sixth month, Imsu is needed first, then Gyeonggeum.\n六月辛金，己土當權，輔助太多，恐掩金光，先用壬水，取庚佐之。\nGungtong Bogam, 六月辛"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.申", text: "In the seventh month, with Imsu present and Muto serving as its embankment, Singeum becomes an honest official but not a rich one.\n七月辛金，値庚司令，不旺自旺，且壬水居申，四柱不見戊土，胎元戊藏申內，爲壬堤岸，人命得此，爲官清正，但不富耳。\nGungtong Bogam, 七月辛"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.辰", text: "For a Singeum Day Master born in the third month, Imsu is needed first, then Gapmok.\n三月辛金，戊土司令，辛承正氣，母旺子相，先壬後甲。\nGungtong Bogam, 三月辛"}
- {slot: evidence.source, key: "source.gungtong-bogam/johu_evidence#辛.酉", text: "For a Singeum Day Master born in the eighth month, only Imsu is used.\n八月辛金，當權得令，旺之極矣，專用壬水淘洗火，故云：金見水以流通。\nGungtong Bogam, 八月辛"}
- {slot: evidence.source, key: "source.jeokcheonsu/tags#clash_month_branch", text: "The month command is like a house, and the energy in charge within it is like the way the house faces, so it must be examined.\n月令提綱，譬之宅也，人元用事之神，宅之向也，不可以不卜。\nJeokcheonsu, 月令論"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/tags#branch_hap", text: "Hap means getting along: when yin and yang get along, their energies join on their own.\n夫合者，和也，乃陰陽相和，其氣自合。\nSammyeong Tonghoe, 論支元六合"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/tags#cheoneul_gwiin", text: "Cheoneul Gwiin is the noblest spirit, and wherever it goes, every harmful influence quietly steps aside.\n其神最尊貴，所至之處，一切凶煞隱然而避。\nSammyeong Tonghoe, 論天乙貴人"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/tags#clash", text: "Chung is the twelve branches striking and fighting each other, so it is mostly seen as unlucky.\n相沖者，十二支戰擊之神，大概爲凶。\nSammyeong Tonghoe, 論沖擊"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/tags#clash_day_branch", text: "If the day pillar's seat is harmed, it does you no good, and this is called Jeoryosal.\n傷日不利己身，名折腰煞\nSammyeong Tonghoe, 論年月日時"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/tags#dohwa", text: "For Tiger, Horse, and Dog it's Rabbit; for Snake, Rooster, and Ox it's Horse; for Monkey, Rat, and Dragon it's Rooster; for Pig, Rabbit, and Goat it's Rat. This is Mogyok, the seat right after Jangsaeng, also called Paesin or Dohwasal.\n寅午戌卯、已酉丑午、申子辰酉、亥卯未子即長生第二位沐浴之宮是也。一名敗神，一名桃花煞\nSammyeong Tonghoe, 論咸池"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/tags#gongmang", text: "The seats left over when a ten-day cycle starting with Gap runs out are called Gongmang: a seat without its stipend is Gong, and a branch without a stem is Mang.\n故以甲旬盡處曰空亡，蓋有是位而無祿，曰空；有支而無干，曰亡。\nSammyeong Tonghoe, 論空亡"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/tags#hwagae", text: "The last seat of a Three Harmony, its storehouse, is called Hwagae.\n故以三合底處得庫謂之華蓋。\nSammyeong Tonghoe, 論將星華蓋"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/tags#stem_hap", text: "Hap forms only when yin meets yang or yang meets yin, just as a man and a woman come together as husband and wife.\n唯陰見陽，陽見陰爲合，亦如男女相合而成夫婦之道。\nSammyeong Tonghoe, 論十干合"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/tags#yeokma", text: "Yeokma comes from the Three Harmony numbers counted by the Earlier Heaven numbers.\n所謂驛馬者，乃先天三合數也\nSammyeong Tonghoe, 論驛馬"}
- {slot: evidence.source, key: "source.jeokcheonsu/personal#day_master", text: "When energy is strong it should be drained and reduced, and when weak it welcomes help and support; this is the principle of Ziping.\n旺則宜洩宜傷，衰則喜幇喜助，子平之理也\nJeokcheonsu, 衰旺論"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/five_elements#color_change", text: "The true colors are black for water, red for fire, blue-green for wood, white for metal and yellow for earth, but when they change, growth and peak follow the true color, death and severance the color of the element that gives birth to it, formation and capping the color of the element it overcomes, sickness and decay the color of the element that overcomes it, and the tomb after the peak the color of the element it gives birth to.\n推其形色則水黑火赤木青金白土黃此正色也及其變易則不然常以生旺從正色死絶從母色成形冠帶從妻色病敗從鬼色旺墓從子色\nSammyeong Tonghoe, 論五行"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#luck.ten_god", text: "In the luck cycles, the officer wants to be nourished, not harmed; the killer wants to be restrained, not aided; wealth wants support, not robbery; the seal wants strength, not decline; and the eating god wants nourishment, not to be cut off by the owl.\n官欲運生不欲運傷煞欲運制不欲運助財欲運扶不欲運劫印欲運旺不欲運衰食欲運生不欲運梟絶\nSammyeong Tonghoe, 論大運"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#luck.twelve_stage", text: "When a luck cycle reaches Jangsaeng, there is something new to found or start, and at Geonrok and Jewang things flourish, bring joy and add fortune and wealth.\n凡行運長生主有創建作新之事到臨官帝旺主興盛快樂發福進財\nSammyeong Tonghoe, 論大運"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#ten_god.geonrok", text: "Yangin, Bigyeon, Paejae and Geonrok have different names but are really one family of the same energy.\n余按陽刃比肩敗財建祿名雖不同實一家同氣之神\nSammyeong Tonghoe, 論建祿"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#ten_god.jeonggwan", text: "Jeonggwan is like Gap meeting Sin or Eul meeting Gyeong, where yin and yang pair up and regulate each other, proving useful and fulfilling their way.\n正官者乃甲見辛乙見庚之例陰陽配合相制有用成其道也\nSammyeong Tonghoe, 論正官"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#ten_god.jeongin", text: "This pattern points to someone bright and wise, kind by nature and good-hearted in speech though slow and halting, with a full, sturdy build.\n此格主聰明多智慧性慈惠語善良遲訥體貌豐厚\nSammyeong Tonghoe, 論印綬"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#ten_god.jeongjae", text: "The Jeongjae pattern points to someone sincere, frugal in how they act and bright by nature, if a little stingy.\n正財之格主人誠實行事儉約賦性聰明惟有慳吝\nSammyeong Tonghoe, 論正財"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#ten_god.pyeongwan", text: "When it is held in check it is called Pyeongwan, and when it is not, it is called Chilsal.\n故有制謂之偏官無制謂之七煞\nSammyeong Tonghoe, 論偏官"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#ten_god.pyeonin", text: "Dosik is another name for Pyeonin, also called Tandamsal, and it is what Siksin dreads most.\n倒食即偏印之謂一名吞啖煞食神最忌見之\nSammyeong Tonghoe, 論倒食"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#ten_god.pyeonjae", text: "The Pyeonjae pattern points to someone open-handed and not tight with money, warm toward others but full of schemes.\n偏財格主人慷慨不甚吝財與人有情而多詐\nSammyeong Tonghoe, 論偏財"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#ten_god.sanggwan", text: "This pattern points to someone of many talents who looks down on others, proud and hard-hearted, without restraint, full of plans but achieving few, whose cleverness backfires.\n此格主多材藝傲物氣高心險無忌憚多謀少遂弄巧成拙\nSammyeong Tonghoe, 論傷官"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#ten_god.siksin", text: "It points to ample wealth and plenty to eat, great fortune and generosity, a well-fed body, a relaxed and contented life, children and long life.\n主人財厚食豐福量寛弘肌體肥大優游自足有子息有壽考\nSammyeong Tonghoe, 論食神"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#ten_god_group.gwanseong", text: "What overcomes me stands for my being governed by others, so it was named Gwansal.\n尅我者我受制於人之義故立名官煞\nSammyeong Tonghoe, 論古人立印食官財名義"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#ten_god_group.inseong", text: "What gives birth to me stands for a parent, so it was named Insu.\n生我者有父母之義故立名印綬\nSammyeong Tonghoe, 論古人立印食官財名義"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#ten_god_group.jaeseong", text: "What I overcome stands for others being governed by me, so it was named Cheojae.\n我尅者是人受制於我之義故立名妻財\nSammyeong Tonghoe, 論古人立印食官財名義"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#ten_god_group.siksang", text: "What I give birth to stands for children and grandchildren, so it was named Siksin.\n我生者有子孫之義故立名食神\nSammyeong Tonghoe, 論古人立印食官財名義"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#twelve_stage", text: "The five elements move through twelve stages, Jangsaeng, Mogyok, Gwandae, Geonrok, Jewang, Soe, Byeong, Sa, Myo, Jeol, Tae and Yang, circling endlessly and starting over, much like the turning of a human life.\n夫五行寄生十二官長生沐浴冠帶臨官帝旺衰病死墓絶胎養循環無端週而復始造物大體與人相似循環十二宮亦若人世輪迴也\nSammyeong Tonghoe, 論五行旺相休囚死並寄生十二宮"}
- {slot: evidence.source, key: "source.sammyeong-tonghoe/personal#yangin", text: "Yang stands for firmness and in for cutting apart, and Yangin arises just past the Rok position.\n羊言剛也刃者取宰割之義祿過則刃生\nSammyeong Tonghoe, 論羊刃"}
- {slot: evidence.source, key: "source.xieji-bianfang/hours#birth_year", text: "People of old all looked at the heavenly stem of the birth year, choosing times that join with its officer or wealth, act as its peer or seal, sit at its growth stage, or bring its Rok, Ma and Gwiin, without clashing with or overcoming the birth chart.\n古人皆論生年之天干或合官或合財或比肩或印綬或四長生或取祿馬貴人不衝命尅命\nHyeopgi Byeonbangseo, 論相主"}
- {slot: evidence.source, key: "source.xieji-bianfang/hours#huangdao", text: "When counting hours from the day, on a Ja day Cheongnyong starts at the Sin hour and Myeongdang falls at the Yu hour, and the rest follow in order.\n日起時則子日申時起青龍酉時為明堂依次順數\nHyeopgi Byeonbangseo, 黃道黑道"}
- {slot: evidence.source, key: "source.xieji-bianfang/hours#use_hour", text: "The hour serves the day, so all that matters is whether it supports the day: if it shares the energy of the day stem or branch or forms a three-way or six-way union with the day branch, it is lucky, and rather than following every lucky and unlucky spirit of the hour, only Gwiin, Rok and Ma count as lucky.\n時者日之用也全在幇扶日辰或與日支干比和或與日支三合六合即吉時家吉凶神不必盡拘惟貴人祿馬為吉\nHyeopgi Byeonbangseo, 用時法"}
