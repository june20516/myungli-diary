- {slot: calc-basis.convention.body, key: calcBasisConventionBody, text: "Readings follow the standard widely used in Korea. It's one well-grounded approach among several schools."}
- {slot: calc-basis.schools.body, key: calcBasisSchoolsBody, text: "We show every hidden stem instead of picking just one. If you were born in the Rat hour, we count it as the next day, even before midnight. Schools handle these differently, so your results may differ from other apps or books."}
- {slot: calc-basis.longitude.body, key: calcBasisLongitudeBodySubtract, text: "We subtract {minutes, plural, one{{minutes} minute} other{{minutes} minutes}} from your birth time, based on {longitude}. We don't use true solar time. If you were born within minutes of an hour boundary, your hour pillar may differ from other saju apps."}
- {slot: calc-basis.longitude.body, key: calcBasisLongitudeBodyAdd, text: "We add {minutes, plural, one{{minutes} minute} other{{minutes} minutes}} to your birth time, based on {longitude}. We don't use true solar time. If you were born within minutes of an hour boundary, your hour pillar may differ from other saju apps."}
- {slot: calc-basis.longitude.body, key: calcBasisLongitudeBodyNone, text: "We use your birth time as is, based on {longitude}. We don't use true solar time. If you were born within minutes of an hour boundary, your hour pillar may differ from other saju apps."}
- {slot: calc-basis.longitude.body, key: calcBasisLongitudeBodyDstSubtract, text: "We remove the {dstMinutes}-minute daylight saving offset from your birth time, then subtract {minutes, plural, one{{minutes} minute} other{{minutes} minutes}} based on {longitude}. We don't use true solar time. If you were born within minutes of an hour boundary, your hour pillar may differ from other saju apps."}
- {slot: calc-basis.longitude.body, key: calcBasisLongitudeBodyDstAdd, text: "We remove the {dstMinutes}-minute daylight saving offset from your birth time, then add {minutes, plural, one{{minutes} minute} other{{minutes} minutes}} based on {longitude}. We don't use true solar time. If you were born within minutes of an hour boundary, your hour pillar may differ from other saju apps."}
- {slot: calc-basis.longitude.body, key: calcBasisLongitudeBodyDstNone, text: "We remove the {dstMinutes}-minute daylight saving offset from your birth time. Based on {longitude}, there's no further adjustment. We don't use true solar time. If you were born within minutes of an hour boundary, your hour pillar may differ from other saju apps."}
- {slot: calc-basis.longitude.body, key: calcBasisLongitudeBodyEast, text: "{degrees}°E"}
- {slot: calc-basis.longitude.body, key: calcBasisLongitudeBodyWest, text: "{degrees}°W"}
