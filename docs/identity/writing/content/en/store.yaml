- {slot: store.description, key: description, text: "Even on the same day, everyone's today is different.\n\nIf a zodiac-sign horoscope tells everyone the same thing, Myungli Diary sets the day's energy against your natal chart, built from the date and time you were born. The line it gives you is truly \"your own story.\"\n\n■ Open today\nFirst you meet the day's one-line reading and the character of the day. A badge tells you whether it's a Day in your favor or a Day of helpers, along with your lucky color, direction, number, and the best hours to focus. Tap any unfamiliar term to see what it means and why today reads that way.\n\n■ Write down your day\nStart each entry with a question that changes every day. Write several entries a day, or catch up on days that have passed. Saved entries get chart-energy tags, so you can gather and reread entries with the same tag. Keep your good days together with that day's reading.\n\n■ If you wonder why\nEvery sentence of a reading has its basis. Open the original passages from Gungtong Bogam, Jeokcheonsu, and Sammyeong Tonghoe along with what they mean.\n\n■ When something important is coming up\nCheck smooth days and careful days ahead of time in the calendar. Set big plans on auspicious days. Each date shows that day's fortune, plans, and diary in one place.\n\n■ When you wonder how to live as who you are\nLay out your whole chart in tables: natal chart and five elements, ten gods and hidden stems, 12 stages, shinsal, and your 10-year and yearly cycles. You can also read about your inborn nature and the energy that helps you.\n\n■ On good days\nPut today's luck on a single card and share it with friends.\n\n\n*The lunar calendar follows the Korea Astronomy and Space Science Institute. See the app for calculation details."}
