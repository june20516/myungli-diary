# Evidence basis lines (evidence.basis), en. W1-3b draft from the approved ko file; native review pending.
- {slot: evidence.basis, key: "basis.calendar/score", text: "We added points if the day was a Day of helpers or a Day in your favor, took points off if it was a Day to go gently or formed [[Chung|relation.chung]] or [[Hyeong|relation.hyeong]] with your chart, and set the grade from there."}
- {slot: evidence.basis, key: "basis.color/lucky_element", text: "On a Day to go gently, we based your lucky color on the element that reconnects a blocked flow, and on other days on your [[Yongsin|role.yongsin]] element. Your lucky direction follows this base element as it is."}
- {slot: evidence.basis, key: "basis.color/shift", text: "The classics hold that an element's color changes with the stage it sits in that day. Today {base_element} sits at {twelve_stage} on the branch {day_branch}, so we chose {element:color}. Your direction doesn't change this way and follows the base element."}
- {slot: evidence.basis, key: "basis.color/balance", text: "According to the classics, today's color would be {shifted_element:color}, but that energy pulls against your chart's balance, so we also show {element:color}, based on your balance, as the first color."}
- {slot: evidence.basis, key: "basis.direction/gwiin_branch", text: "Since it's a Day of helpers, we took {direction}, the direction of today's branch {day_branch}, as your lucky direction."}
- {slot: evidence.basis, key: "basis.direction/yongsin", text: "Since it's a Day in your favor, we looked to {element}, your [[Yongsin|role.yongsin]] element, and took its direction, {direction}, as your lucky direction."}
- {slot: evidence.basis, key: "basis.direction/tonggwan", text: "Since it's a Day to go gently, we looked to {element}, the element that reconnects a blocked flow, and took its direction, {direction}, as your lucky direction."}
- {slot: evidence.basis, key: "basis.direction/ordinary_deity_yongsin", text: "Since it's an Ordinary day, from the day's lucky directions we chose {direction}, which matches {element}, your [[Yongsin|role.yongsin]] element."}
- {slot: evidence.basis, key: "basis.direction/ordinary_deity_huisin", text: "Since it's an Ordinary day, from the day's lucky directions we chose {direction}, which matches {element}, your [[Huisin|role.huisin]] element."}
- {slot: evidence.basis, key: "basis.direction/ordinary_fallback", text: "It's an Ordinary day, but none of the day's lucky directions matched a fitting element, so we chose {direction}, the direction that matches {element}, your [[Yongsin|role.yongsin]] element."}
- {slot: evidence.basis, key: "basis.fortune/day_kind", text: "Today is marked {day_kind}, and today's heavenly stem counts as {ten_god} to your Day Master, so we chose today's main reading based on these two."}
- {slot: evidence.basis, key: "basis.fortune/tag", text: "We chose the line under today's main reading based on the top tag of the day."}
- {slot: evidence.basis, key: "basis.guide/question", text: "We chose today's question from the top tag of the day if there is one, and if not, from {ten_god:ten_god_group}, the group today's heavenly stem falls into for your Day Master."}
- {slot: evidence.basis, key: "basis.number/hado", text: "Of the two Hado numbers for {element}, the same element as your lucky color, we chose the odd one if today's heavenly stem {day_stem} is yang and the even one if it's yin."}
- {slot: evidence.basis, key: "basis.personal/day_master", text: "We weighed the elements that support your Day Master against those that press on it and found it to be {strength}. So we took {yongsin} as your [[Yongsin|role.yongsin]] and {gisin} as your [[Gisin|role.gisin]]."}
- {slot: evidence.basis, key: "basis.personal/ten_god", text: "The element of your {place}, {element}, is {role} in your chart. We chose this reading from that role, along with how many ten gods of the same group you have and your Day Master's strength."}
- {slot: evidence.basis, key: "basis.personal/twelve_stage", text: "The element of your {place}, {element}, is {role} in your chart. We chose this Twelve Stages reading from that role, along with your Day Master's strength."}
- {slot: evidence.basis, key: "basis.personal/shinsal", text: "This shinsal sits in your {place}, and its element, {element}, is {role} in your chart. We chose the shinsal reading to fit that role."}
- {slot: evidence.basis, key: "basis.personal/luck_ten_god", text: "The {part} element of your {luck}, {element}, is {role} in your chart. We chose the reading to fit that role."}
- {slot: evidence.basis, key: "basis.personal/luck_twelve_stage", text: "The branch element of your 10-year luck cycle, {element}, is {role} in your chart. We chose the Twelve Stages reading to fit that role."}
- {slot: evidence.basis, key: "basis.tags/select", text: "We looked for tags in this order: the Hap and Chung that today's day pillar forms with your chart, a crowding of one ten god group, then shinsal. We picked the first two as the main tags."}
- {slot: evidence.basis, key: "basis.tags/cheoneul_gwiin", text: "By your chart, today's branch {day_branch} falls on the {shinsal} position, so we added this tag."}
- {slot: evidence.basis, key: "basis.tags/clash", text: "Today's branch {day_branch} forms [[Chung|relation.chung]] with your {natal_positions}, so we added this tag."}
