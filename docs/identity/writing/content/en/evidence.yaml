- {slot: evidence.basis, key: "basis.tags/gosin", text: "By your chart, today's branch {day_branch} falls on the {shinsal} position, so we added this tag."}
- {slot: evidence.basis, key: "basis.tags/gwasuk", text: "By your chart, today's branch {day_branch} falls on the {shinsal} position, so we added this tag."}
- {slot: evidence.basis, key: "basis.tags/wonjin", text: "By your zodiac sign, today's branch {day_branch} falls on the {shinsal} position, so we added this tag. For Wonjin we use the pairs common in Korea for everyone, while the classics set different pairs for men and women."}
- {slot: evidence.basis, key: "basis.day_virtue/cheondeok", text: "The classic of day selection sets, for each month, the stem where heaven's virtue lies, and counts days with that stem as Heavenly Virtue Days. Today has this month's stem."}
- {slot: evidence.basis, key: "basis.day_virtue/woldeok", text: "The classic of day selection sets, for each month, the stem where the month's virtue lies, and counts days with that stem as Monthly Virtue Days. Today has this month's stem."}
- {slot: evidence.basis, key: "basis.tags/gwiin_day", text: "Today is a Day of helpers, so we added this tag."}
- {slot: evidence.basis, key: "basis.tags/harmony", text: "Today's day pillar forms {relation_kind} with your {natal_positions}, so we added this tag."}
- {slot: evidence.basis, key: "basis.tags/hwagae", text: "By your chart, today's branch {day_branch} falls on the {shinsal} position, so we added this tag."}
- {slot: evidence.basis, key: "basis.tags/ten_god_rush", text: "Today's stem is {stem_ten_god} and its branch is {branch_ten_god}, both {group}, and your chart already has {natal_count} of {group}, so we added this tag."}
- {slot: evidence.basis, key: "basis.tags/yeokma", text: "By your chart, today's branch {day_branch} falls on the {shinsal} position, so we added this tag."}
- {slot: evidence.basis, key: "basis.tags/yongsin_day", text: "Today is a Day in your favor, so we added this tag."}
- {slot: evidence.basis, key: "basis.yongsin/eokbu", text: "We set your [[Yongsin|role.yongsin]] by the Eokbu method. Your Day Master is {strength_level}, so we chose the element that evens out its strength."}
- {slot: evidence.basis, key: "basis.yongsin/johu", text: "You were born in summer or winter and your chart runs too hot or too cold, so we set your [[Yongsin|role.yongsin]] by the Johu method, which evens out temperature. The element that fits your Day Master in the {month_branch} month follows the Johu table of Gungtong Bogam."}
- {slot: evidence.basis, key: "basis.yongsin/johu_neutral", text: "Your Day Master's strength is fairly even, so we set your [[Yongsin|role.yongsin]] by the Johu method instead of the Eokbu method. The element that fits your Day Master in your birth month follows the Johu table of Gungtong Bogam."}
- {slot: evidence.no_source, key: "no_source.tags/ten_god_rush", text: "This rule isn't from the classical texts, but since the same ten god group comes in through both today's stem and branch and your chart already has plenty of it, we read that energy as amplified."}
- {slot: evidence.basis, key: "basis.focus_time/day_relation", text: "We favored hours that support today's day pillar or join with it, and left out hours that clash with it."}
- {slot: evidence.basis, key: "basis.focus_time/birth_year", text: "We favored hours that support or join with the heavenly stem of your birth year, and avoided hours that clash with your birth year."}
- {slot: evidence.basis, key: "basis.focus_time/huangdao", text: "We also checked whether the hour is one the classic almanac marks as a lucky Hwangdo hour."}
