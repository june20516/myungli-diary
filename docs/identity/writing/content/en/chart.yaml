- {slot: chart.ilgan_body, key: ilgan.body.gap, text: "Once you set a direction, you rarely change it. That strength shows when you see a long task through to the end."}
- {slot: chart.ilgan_body, key: ilgan.body.eul, text: "You tend to bend with the situation and find a way through. That strength shows in how quickly you settle into new places."}
- {slot: chart.ilgan_body, key: ilgan.body.byeong, text: "You tend to be open and honest. When it's time to step forward, you don't hesitate."}
- {slot: chart.ilgan_body, key: ilgan.body.jeong, text: "You tend to pay close attention to how the people near you feel. That warmth shows most when you look after someone over a long time."}
- {slot: chart.ilgan_body, key: ilgan.body.mu, text: "You tend to stay steady and make room for the people around you. When a group needs someone to hold the center, you're the one they lean on."}
- {slot: chart.ilgan_body, key: ilgan.body.gi, text: "You tend to grow people and projects step by step. You find your strength in teaching or in tending something over time."}
- {slot: chart.ilgan_body, key: ilgan.body.gyeong, text: "When you believe something is right, you tend to act on it right away. In moments that call for a decision, your readiness stands out."}
- {slot: chart.ilgan_body, key: ilgan.body.sin, text: "You tend to notice small differences and care about getting things just right. That care shows in work where the finish matters."}
- {slot: chart.ilgan_body, key: ilgan.body.im, text: "Your thinking runs wide, and you tend to read new currents quickly. That breadth helps when you have to bring many things together at once."}
- {slot: chart.ilgan_body, key: ilgan.body.gye, text: "You tend to think things through deeply rather than show them. That depth shows when you notice what others have missed."}
- {slot: chart.yongsin_summary, key: yongsin.summary, text: "The element that fits you well is [[{yongsin}]], and its color is {yongsin:color}. Try keeping it close through clothes or small items."}
