name: app

on:
  push:
    branches: [main]
    # 경로 목록은 push·pull_request 두 곳을 함께 고칩니다.
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
      - "server/api/openapi.yaml"
      - "docs/ia/screens.json"
      - "docs/identity/design/tokens/**"
      - "docs/identity/design/components/**"
      - "docs/identity/writing/slots/**"
      - "docs/identity/writing/tools/**"
  # ci-gate 연결(#85) 전까지 pull_request 트리거를 유지한다. 연결 후에는 지휘 세션이 지운다.
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
      - "server/api/openapi.yaml"
      - "docs/ia/screens.json"
      - "docs/identity/design/tokens/**"
      - "docs/identity/design/components/**"
      - "docs/identity/writing/slots/**"
      - "docs/identity/writing/tools/**"
  workflow_call:
  workflow_dispatch:
    inputs:
      update_goldens:
        description: "golden 기준 이미지를 Linux에서 다시 만들어 artifact로 올린다"
        type: boolean
        default: false

# workflow 단위 concurrency는 두지 않는다. workflow_call로 불리면 호출 측 event·ref로 group이 겹쳐 서로 취소되며, concurrency는 ci-gate가 가진다.

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # Gradle이 걸려 runner를 오래 점유하지 않게 상한을 둔다.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # flutter build apk는 Java 17이 필요하다.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: 의존성 받기
        run: flutter pub get
      - name: 포맷 확인
        run: dart format --output=none --set-exit-if-changed .
      - name: 생성 코드 차이 확인
        run: |
          dart run tool/gen_ia.dart
          dart run tool/gen_tokens.dart
          flutter gen-l10n
          # openapi-generator를 Docker 이미지로 돌린 뒤 build_runner 전체(json_serializable·drift)를 돌린다.
          tool/gen_api.sh
          # 수정된 파일과 commit되지 않은 새 파일을 모두 잡는다.
          changes="$(git status --porcelain -- .)"
          if [ -n "$changes" ]; then
            echo "생성 코드가 commit된 것과 다릅니다:"
            echo "$changes"
            exit 1
          fi
      # 저장소 루트의 검사기를 쓰므로 이 단계만 루트에서 실행한다.
      - uses: astral-sh/setup-uv@v6
      - name: ARB 문구 검사
        working-directory: .
        run: uv run --project docs/identity/writing/tools mlw check-arb app/lib/core/l10n/arb/*.arb
      - name: fixture 스키마 검증
        run: |
          uv run --with jsonschema --with pyyaml --with referencing --with rfc3339-validator sh -c '
            python -I tool/test_validate_fixtures.py &&
            python -I tool/validate_fixtures.py'
      - name: 정적 분석
        run: flutter analyze
      - name: Widgetbook 정적 분석
        working-directory: app/widgetbook
        run: |
          flutter pub get
          flutter analyze
      # golden은 Flutter 버전을 고정한 goldens job이 비교한다(stable 추종과 분리).
      - name: 테스트
        run: flutter test --exclude-tags golden
      - name: Android 디버그 빌드
        run: flutter build apk --debug

  # golden 비교: Flutter 버전을 app/tool/golden_flutter_version으로 고정한다.
  # checks와 같은 트리거·경로로 돈다(workflow 수준 on).
  goldens:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: golden Flutter 버전 읽기
        id: golden-flutter
        working-directory: .
        run: |
          version="$(grep -v '^[[:space:]]*#' app/tool/golden_flutter_version | grep -v '^[[:space:]]*$' | head -n 1 | tr -d '[:space:]')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.golden-flutter.outputs.version }}
          cache: true
      - name: 의존성 받기
        run: flutter pub get
      - name: golden 비교
        run: flutter test --tags golden

  # golden 기준 이미지는 Linux에서만 만든다(workflow_dispatch에서 update_goldens를 켰을 때만). 버전은 goldens job과 같다.
  # 받은 artifact를 test/goldens에 덮어 commit한다.
  update-goldens:
    if: github.event_name == 'workflow_dispatch' && inputs.update_goldens
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: golden Flutter 버전 읽기
        id: golden-flutter
        working-directory: .
        run: |
          version="$(grep -v '^[[:space:]]*#' app/tool/golden_flutter_version | grep -v '^[[:space:]]*$' | head -n 1 | tr -d '[:space:]')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.golden-flutter.outputs.version }}
          cache: true
      - name: 의존성 받기
        run: flutter pub get
      - name: golden 갱신
        run: flutter test --update-goldens --tags golden
      - name: 기준 이미지 올리기
        uses: actions/upload-artifact@v4
        with:
          name: goldens
          path: app/test/goldens/**
          if-no-files-found: error
