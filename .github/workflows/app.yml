name: app

on:
  push:
    branches: [main]
    # main push는 app 소유 경로만 본다. 계약 경로(openapi·screens·tokens·components·slots·tools)는
    # ci-gate의 drift 판정이 맡으므로 여기에 두지 않는다(D73, workflow §6.1).
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  # PR 검사는 ci-gate가 부른다(#85). push는 main 병합 뒤 기기 E2E만 돌리려고 남긴다.
  # checks·goldens는 main push에서도 ci-gate가 한 번 돌리므로 이 push에서는 돌지 않는다(D81).
  # 기기 E2E(e2e-android)는 PR에서 돌지 않고 main push, 매일 03:00 KST, 수동 실행에서만 돈다.
  schedule:
    - cron: "0 18 * * *"
  # ci-gate가 부르면 e2e-android는 돌지 않는다(판정에 넣지 않음). run_e2e로만 켤 수 있다.
  workflow_call:
    inputs:
      mode:
        description: "ci-gate 판별(own·drift·gate). own은 빠른 검사 전체, drift·gate는 계약을 읽는 검사만"
        type: string
        default: own
      run_e2e:
        description: "재사용 호출에서도 기기 E2E(e2e-android)를 돌린다"
        type: boolean
        default: false
      build_apk:
        description: "재사용 호출에서 Android 디버그 빌드를 돌린다"
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      update_goldens:
        description: "golden 기준 이미지를 Linux에서 다시 만들어 artifact로 올린다"
        type: boolean
        default: false

# workflow 단위 concurrency는 두지 않는다. workflow_call로 불리면 호출 측 event·ref로 group이 겹쳐 서로 취소되며, concurrency는 ci-gate가 가진다.

permissions:
  contents: read

jobs:
  checks:
    # 직접 실행에서는 수동 실행만 돈다. main push는 ci-gate가 이미 돌리고, 밤 schedule은 e2e-android만 돈다(D81).
    # 재사용 호출이면 github.workflow가 호출 측 이름이다(e2e-android 주석).
    if: github.workflow != 'app' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Gradle이 걸려 runner를 오래 점유하지 않게 상한을 둔다.
    timeout-minutes: 30
    env:
      # own은 빠른 검사 전체, drift·gate는 계약을 읽는 검사만 돈다(D81). 직접 실행에는 mode 입력이 없어 own이다.
      # 계약 검사: 생성 코드 차이, ARB 문구, fixture 스키마, E2E 커버리지(IA), contract 태그 테스트.
      # drift·gate에서 생성 코드가 commit된 것과 같으면 app 코드도 main과 같으므로 analyze는 own에만 둔다.
      OWN: ${{ (inputs.mode || 'own') == 'own' }}
      # 계약 PR의 깨짐은 위 검사가 잡고, Gradle 문제는 app/ 변경에서만 생기므로 own에서만 빌드한다.
      BUILD_APK: ${{ (inputs.mode || 'own') == 'own' && (github.workflow == 'app' || inputs.build_apk == true) }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      # Android 빌드(NDK·CMake 설치 포함)가 ubuntu-latest 기본 여유 공간을 넘으므로,
      # 이 job이 쓰지 않는 사전 설치 도구를 지운다. Android SDK와 Docker는 남긴다.
      - name: runner 디스크 확보
        if: env.BUILD_APK == 'true'
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # flutter build apk는 Java 17이 필요하다.
      - uses: actions/setup-java@v6
        if: env.BUILD_APK == 'true'
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # NDK·CMake가 없으면 Gradle이 원격 package manifest를 받아 설치하느라 빌드마다 6분쯤 기다린다(#358).
      # NDK는 Flutter가 정한 버전(flutter.ndkVersion), CMake는 jni plugin이 쓰는 AGP 기본 버전이다.
      # 키 밖의 설치는 빌드 뒤 "NDK·CMake 캐시 대상 확인"이 warning으로 알린다. 비우는 기준은 app/README.md "NDK·CMake 캐시".
      - name: NDK·CMake 경로 읽기
        id: android-native
        if: env.BUILD_APK == 'true'
        working-directory: .
        env:
          ANDROID_CMAKE_VERSION: "3.22.1"
        run: |
          flutter_root="${FLUTTER_ROOT:-$(dirname "$(dirname "$(command -v flutter)")")}"
          ndk="$(sed -nE 's/.*val ndkVersion: String = "([0-9.]+)".*/\1/p' "$flutter_root/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt")"
          if [ -z "$ndk" ]; then
            echo "::warning title=NDK 캐시::flutter.ndkVersion을 찾지 못해 캐시 없이 빌드합니다."
            exit 0
          fi
          {
            echo "key=android-native-ndk-$ndk-cmake-$ANDROID_CMAKE_VERSION"
            echo "ndk=$ANDROID_HOME/ndk/$ndk"
            echo "cmake=$ANDROID_HOME/cmake/$ANDROID_CMAKE_VERSION"
          } >> "$GITHUB_OUTPUT"
          # 빌드 뒤 캐시 키 밖의 설치를 찾으려고 runner에 원래 있던 버전을 적어 둔다.
          (cd "$ANDROID_HOME" && for dir in ndk/* cmake/*; do [ -d "$dir" ] && echo "$dir"; done) > "$RUNNER_TEMP/android-native-before.txt"
      - name: NDK·CMake 캐시
        if: steps.android-native.outputs.key != ''
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.android-native.outputs.ndk }}
            ${{ steps.android-native.outputs.cmake }}
          key: ${{ steps.android-native.outputs.key }}
      - name: 의존성 받기
        run: flutter pub get
      - name: 포맷 확인
        if: env.OWN == 'true'
        run: dart format --output=none --set-exit-if-changed .
      - name: 생성 코드 차이 확인
        run: |
          dart run tool/gen_ia.dart
          dart run tool/gen_tokens.dart
          flutter gen-l10n
          # openapi-generator를 Docker 이미지로 돌린 뒤 build_runner 전체(json_serializable·drift)를 돌린다.
          tool/gen_api.sh
          # 수정된 파일과 commit되지 않은 새 파일을 모두 잡는다.
          changes="$(git status --porcelain -- .)"
          if [ -n "$changes" ]; then
            echo "생성 코드가 commit된 것과 다릅니다:"
            echo "$changes"
            exit 1
          fi
      # 저장소 루트의 검사기를 쓰므로 이 단계만 루트에서 실행한다.
      - uses: astral-sh/setup-uv@v10.3.0
      - name: ARB 문구 검사
        working-directory: .
        run: uv run --project docs/identity/writing/tools mlw check-arb app/lib/core/l10n/arb/*.arb
      - name: fixture 스키마 검증
        run: |
          uv run --with jsonschema --with pyyaml --with referencing --with rfc3339-validator sh -c '
            python -I tool/test_validate_fixtures.py &&
            python -I tool/validate_fixtures.py'
      - name: 정적 분석
        if: env.OWN == 'true'
        run: flutter analyze
      # flutter analyze는 analyzer plugin(riverpod_lint)을 싣는 일이 실행마다 달라 지적이 빠질 수 있다.
      # dart analyze는 plugin을 늘 실으므로 함께 돌려 로컬과 같은 결과를 보장한다.
      - name: 정적 분석 (analyzer plugin 포함)
        if: env.OWN == 'true'
        run: dart analyze
      # 흐름 테스트·E2E의 Covers 선언을 IA와 대조하고, 커버리지가 baseline보다 줄면 실패한다.
      - name: E2E 커버리지 ratchet
        run: dart run tool/ia_coverage.dart --check
      - name: Widgetbook 정적 분석
        if: env.OWN == 'true'
        working-directory: app/widgetbook
        run: |
          flutter pub get
          flutter analyze
      - name: Widgetbook 테스트
        if: env.OWN == 'true'
        working-directory: app/widgetbook
        run: flutter test
      # golden은 Flutter 버전을 고정한 goldens job이 비교한다(stable 추종과 분리).
      - name: 테스트
        if: env.OWN == 'true'
        run: flutter test --exclude-tags golden
      # 계약 파일을 읽는 테스트만 고른다. 태그를 붙일 곳은 test/contract/contract_tags_test.dart가 대조한다.
      - name: 계약 테스트
        if: env.OWN != 'true'
        run: flutter test --tags contract --exclude-tags golden
      - name: Android 디버그 빌드
        if: env.BUILD_APK == 'true'
        run: flutter build apk --debug
      # 빌드가 캐시 키 밖의 NDK·CMake를 설치했으면 키가 낡은 것이다(README "NDK·CMake 캐시").
      - name: NDK·CMake 캐시 대상 확인
        if: always() && steps.android-native.outputs.key != ''
        working-directory: .
        env:
          NDK_DIR: ${{ steps.android-native.outputs.ndk }}
          CMAKE_DIR: ${{ steps.android-native.outputs.cmake }}
        run: |
          cd "$ANDROID_HOME"
          new=""
          for dir in ndk/* cmake/*; do
            [ -d "$dir" ] || continue
            case "$dir" in "${NDK_DIR#"$ANDROID_HOME"/}" | "${CMAKE_DIR#"$ANDROID_HOME"/}") continue ;; esac
            grep -qxF "$dir" "$RUNNER_TEMP/android-native-before.txt" || new="$new $dir"
          done
          if [ -n "$new" ]; then
            echo "::warning title=NDK·CMake 캐시::캐시 키 밖의 설치가 있습니다:$new. app.yml의 ANDROID_CMAKE_VERSION 또는 키를 맞춥니다."
          fi

  # 기기 E2E: Android 에뮬레이터에서 Patrol을 돈다. PR에서는 돌지 않는다(비용·시간).
  # 재사용 호출(workflow_call)에서는 github.event_name이 호출 측 이벤트(ci-gate의 main push 등)라
  # 이벤트만으로는 거를 수 없다. 호출되면 github.workflow가 호출 측 이름이 되므로, 직접 실행
  # (github.workflow == 'app')일 때만 이벤트로 켜고, 호출되면 run_e2e 입력으로만 켠다.
  e2e-android:
    if: >-
      (github.workflow == 'app' &&
        (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'))
      || (github.workflow != 'app' && inputs.run_e2e == true)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      # Android 빌드(NDK·CMake 설치 포함)가 ubuntu-latest 기본 여유 공간을 넘으므로,
      # 이 job이 쓰지 않는 사전 설치 도구를 지운다. Android SDK와 Docker는 남긴다.
      - name: runner 디스크 확보
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # NDK·CMake가 없으면 Gradle이 원격 package manifest를 받아 설치하느라 빌드마다 6분쯤 기다린다(#358).
      # NDK는 Flutter가 정한 버전(flutter.ndkVersion), CMake는 jni plugin이 쓰는 AGP 기본 버전이다.
      # 키 밖의 설치는 빌드 뒤 "NDK·CMake 캐시 대상 확인"이 warning으로 알린다. 비우는 기준은 app/README.md "NDK·CMake 캐시".
      - name: NDK·CMake 경로 읽기
        id: android-native
        working-directory: .
        env:
          ANDROID_CMAKE_VERSION: "3.22.1"
        run: |
          flutter_root="${FLUTTER_ROOT:-$(dirname "$(dirname "$(command -v flutter)")")}"
          ndk="$(sed -nE 's/.*val ndkVersion: String = "([0-9.]+)".*/\1/p' "$flutter_root/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt")"
          if [ -z "$ndk" ]; then
            echo "::warning title=NDK 캐시::flutter.ndkVersion을 찾지 못해 캐시 없이 빌드합니다."
            exit 0
          fi
          {
            echo "key=android-native-ndk-$ndk-cmake-$ANDROID_CMAKE_VERSION"
            echo "ndk=$ANDROID_HOME/ndk/$ndk"
            echo "cmake=$ANDROID_HOME/cmake/$ANDROID_CMAKE_VERSION"
          } >> "$GITHUB_OUTPUT"
          # 빌드 뒤 캐시 키 밖의 설치를 찾으려고 runner에 원래 있던 버전을 적어 둔다.
          (cd "$ANDROID_HOME" && for dir in ndk/* cmake/*; do [ -d "$dir" ] && echo "$dir"; done) > "$RUNNER_TEMP/android-native-before.txt"
      - name: NDK·CMake 캐시
        if: steps.android-native.outputs.key != ''
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.android-native.outputs.ndk }}
            ${{ steps.android-native.outputs.cmake }}
          key: ${{ steps.android-native.outputs.key }}
      - name: 의존성 받기
        run: flutter pub get
      - name: patrol_cli 설치
        run: dart pub global activate patrol_cli 4.8.0
      # 에뮬레이터 가속(KVM)을 켠다.
      - name: KVM 켜기
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Patrol E2E (fake 모드)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          working-directory: app
          # sh 한 줄이라 pipefail 없이 로그를 파일로 받고, 실패하면 로그를 보여 주고 기기 전체 logcat을 남긴다.
          # Patrol 포트는 기본값(8081·8082) 대신 덜 쓰이는 47281·47282로 고정한다(로컬 Metro 등과 충돌 방지, app/CLAUDE.md와 같은 값).
          script: mkdir -p build && patrol test -t patrol_test --dart-define=API_MODE=fake --test-server-port 47281 --app-server-port 47282 --screenshots-output-dir build/e2e-native-screenshots > build/patrol.log 2>&1 || { cat build/patrol.log; adb logcat -d > build/logcat-full.txt; exit 1; }
        env:
          PATROL_ANALYTICS_ENABLED: "false"
      # 빌드가 캐시 키 밖의 NDK·CMake를 설치했으면 키가 낡은 것이다(README "NDK·CMake 캐시").
      - name: NDK·CMake 캐시 대상 확인
        if: always() && steps.android-native.outputs.key != ''
        working-directory: .
        env:
          NDK_DIR: ${{ steps.android-native.outputs.ndk }}
          CMAKE_DIR: ${{ steps.android-native.outputs.cmake }}
        run: |
          cd "$ANDROID_HOME"
          new=""
          for dir in ndk/* cmake/*; do
            [ -d "$dir" ] || continue
            case "$dir" in "${NDK_DIR#"$ANDROID_HOME"/}" | "${CMAKE_DIR#"$ANDROID_HOME"/}") continue ;; esac
            grep -qxF "$dir" "$RUNNER_TEMP/android-native-before.txt" || new="$new $dir"
          done
          if [ -n "$new" ]; then
            echo "::warning title=NDK·CMake 캐시::캐시 키 밖의 설치가 있습니다:$new. app.yml의 ANDROID_CMAKE_VERSION 또는 키를 맞춥니다."
          fi
      # Patrol 파일 이름(<타임스탬프>_<태그>.png)을 <화면>__<상태|default>-<흐름>.png로 모은다(흐름은 테스트마다 달라 이름이 겹치지 않는다).
      - name: 스크린샷 모으기
        if: always()
        continue-on-error: true
        run: tool/collect_e2e_screenshots.sh build/e2e-native-screenshots build/e2e-screenshots
      - name: 스크린샷 올리기
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: |
            app/build/e2e-screenshots/**
            app/build/e2e-native-screenshots/**
            app/build/patrol.log
          if-no-files-found: warn
      # 실패 원인 추적용: Gradle(androidTest) 보고서와 결과 XML, 기기 전체 logcat.
      - name: Gradle 보고서 올리기
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-gradle-reports
          path: |
            app/build/app/reports/androidTests/**
            app/build/app/outputs/androidTest-results/**
            app/build/logcat-full.txt
          if-no-files-found: warn

  # golden 비교: Flutter 버전을 app/tool/golden_flutter_version으로 고정한다.
  # 직접 실행은 checks와 같이 수동 실행만, 재사용 호출은 own에서만 돈다(D81).
  # 토큰 계약이 바뀌면 drift의 생성 코드 차이 확인이 먼저 잡는다.
  goldens:
    if: >-
      (github.workflow == 'app' && github.event_name == 'workflow_dispatch')
      || (github.workflow != 'app' && (inputs.mode || 'own') == 'own')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - name: golden Flutter 버전 읽기
        id: golden-flutter
        working-directory: .
        run: |
          version="$(app/tool/golden_flutter_version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.golden-flutter.outputs.version }}
          cache: true
      - name: 의존성 받기
        run: flutter pub get
      - name: golden 비교
        run: flutter test --tags golden

  # golden 기준 이미지는 Linux에서만 만든다(workflow_dispatch에서 update_goldens를 켰을 때만). 버전은 goldens job과 같다.
  # 받은 artifact를 test/goldens에 덮어 commit한다.
  update-goldens:
    if: github.event_name == 'workflow_dispatch' && inputs.update_goldens
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - name: golden Flutter 버전 읽기
        id: golden-flutter
        working-directory: .
        run: |
          version="$(app/tool/golden_flutter_version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.golden-flutter.outputs.version }}
          cache: true
      - name: 의존성 받기
        run: flutter pub get
      - name: golden 갱신
        run: flutter test --update-goldens --tags golden
      - name: 기준 이미지 올리기
        uses: actions/upload-artifact@v7
        with:
          name: goldens
          path: app/test/goldens/**
          if-no-files-found: error
