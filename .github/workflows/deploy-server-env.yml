# 환경 하나에 server를 배포합니다(deploy-server.yml이 부름, spec §7.1).
# 순서: 엔진 이미지 확인 → Terraform apply → 설정, Secret 확인 → server-ops 계정 검사 → 이미지 → migrate → seed → server → server-ops → Job → Scheduler → 부하 생성기(부하 환경만) → Firebase Hosting
# → 판 맞춤 확인 → 조합 확인(D147, S169). 엔진이 뒤처졌으면 조합 확인을 건너뛰고 engine_behind를 내어, 부르는 쪽이 엔진을 배포한 뒤 확인합니다.
# env와 Secret 연결은 Terraform이 두지 않고, 준비를 확인한 뒤 이미지와 함께 여기서 붙입니다(S121).
name: deploy-server-env

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      project_id:
        type: string
        required: true
      go_tags:
        type: string
        required: true
      wif_provider:
        type: string
        required: true
      service_account:
        type: string
        required: true
    outputs:
      engine_behind:
        description: "배포한 환경의 엔진이 이 commit의 core/와 다른지(true|false). server를 배포하지 않았으면 비어 있습니다"
        value: ${{ jobs.deploy.outputs.engine_behind }}

permissions:
  contents: read
  id-token: write

env:
  REGION: asia-northeast3
  TERRAFORM_VERSION: "1.17.0"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # 같은 환경의 server 배포는 하나씩, 진행 중인 것을 취소하지 않습니다. 엔진 배포는 group이 달라 서로 대기 job을 밀어내지 않습니다.
    concurrency:
      group: deploy-server-${{ inputs.environment }}
      cancel-in-progress: false
    outputs:
      engine_behind: ${{ steps.versions.outputs.engine_behind }}
    env:
      PROJECT: ${{ inputs.project_id }}
    steps:
      # 판 맞춤 확인이 배포된 이미지 commit의 core/, server/ 내용을 HEAD와 비교하므로 이력 전체를 받습니다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ inputs.wif_provider }}
          service_account: ${{ inputs.service_account }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # Terraform은 엔진 서비스를 engine:current로 만들므로, deploy-engine이 아직 push하지 않았으면 여기서 멈춥니다(실패 아님).
      # 이미지가 없을 때("Image not found", gcloud 591)만 건너뛰고, 권한·일시 오류는 실패로 드러냅니다(#647).
      - name: 엔진 이미지 확인
        id: engine
        run: |
          if output="$(gcloud artifacts docker images describe "${REGION}-docker.pkg.dev/${PROJECT}/myungli/engine:current" --format='value(image_summary.digest)' 2>&1)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q "Image not found" <<< "$output"; then
            echo "### 배포 건너뜀 (${{ inputs.environment }}): engine:current가 없습니다. deploy-engine을 먼저 실행하세요." >> "$GITHUB_STEP_SUMMARY"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "$output" >&2
            exit 1
          fi

      - name: terraform apply
        if: steps.engine.outputs.exists == 'true'
        working-directory: server/deploy/terraform/env
        run: |
          terraform init -input=false -backend-config="bucket=${PROJECT}-tfstate"
          terraform apply -input=false -auto-approve -var-file="${{ inputs.environment }}.tfvars"

      # 필수 설정이나 Secret 값이 비어 있으면 server가 시작하지 못하므로 server 배포를 건너뜁니다(인프라는 이미 적용됨).
      - name: 설정과 Secret 확인
        if: steps.engine.outputs.exists == 'true'
        id: ready
        working-directory: server/deploy/terraform/env
        run: |
          missing="$(terraform output -json missing_server_settings | jq -r '.[]')"
          secrets=""
          for secret in $(terraform output -json secret_ids | jq -r '.[]'); do
            version="$(gcloud secrets versions list "$secret" --project "$PROJECT" --filter='state:ENABLED' --limit=1 --format='value(name)')"
            if [ -z "$version" ]; then
              missing="$missing"$'\n'"secret:$secret"
            fi
            secrets="${secrets:+$secrets,}${secret}=${secret}:latest"
          done
          missing="$(echo "$missing" | sed '/^$/d')"
          if [ -n "$missing" ]; then
            {
              echo "### server 배포 건너뜀 (${{ inputs.environment }})"
              echo "비어 있는 설정·Secret:"
              while IFS= read -r name; do echo "* $name"; done <<< "$missing"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 쉼표가 든 값(ANDROID_CERT_SHA256 등)이 있어 env는 YAML 파일로 넘깁니다.
          terraform output -json server_env | jq -r 'to_entries[] | "\(.key): \(.value | @json)"' > "$RUNNER_TEMP/server-env.yaml"
          # migrate와 seed는 DB 사용자만 migrator로 바꾼 env를 쓰고 Secret을 붙이지 않습니다(S137).
          terraform output -json migrator_env | jq -r 'to_entries[] | "\(.key): \(.value | @json)"' > "$RUNNER_TEMP/migrator-env.yaml"
          {
            echo "ready=true"
            echo "secrets=$secrets"
          } >> "$GITHUB_OUTPUT"
          # 운영 API(server-ops, #1321)의 env와 허용 목록 Secret입니다. OPS_OPERATORS는 secret_ids에 없어 위 확인이 server 배포를 막지 않고,
          # 값(버전)이 없으면 server-ops 갱신만 건너뜁니다. 값(운영자 메일)은 읽지 않고 버전 이름만 봅니다(D74).
          terraform output -json ops_env | jq -r 'to_entries[] | "\(.key): \(.value | @json)"' > "$RUNNER_TEMP/ops-env.yaml"
          ops_version="$(gcloud secrets versions list OPS_OPERATORS --project "$PROJECT" --filter='state:ENABLED' --limit=1 --format='value(name)')"
          if [ -n "$ops_version" ]; then
            {
              echo "ops_ready=true"
              # 운영자 목록 Secret을 마운트할 파일 경로(Terraform의 OPS_OPERATORS_FILE)입니다.
              echo "ops_operators_file=$(terraform output -json ops_env | jq -r '.OPS_OPERATORS_FILE')"
            } >> "$GITHUB_OUTPUT"
          else
            echo "### server-ops 배포 건너뜀 (${{ inputs.environment }}): Secret OPS_OPERATORS에 값이 없습니다. 값을 넣은 뒤 다시 배포하세요." >> "$GITHUB_STEP_SUMMARY"
            echo "ops_ready=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$(terraform output -raw billing_enabled)" != "true" ]; then
            echo "### 결제 꺼짐 (${{ inputs.environment }}): billing_enabled = false라 RevenueCat 설정과 Secret을 붙이지 않았습니다. 구매 복원은 503입니다(#654)." >> "$GITHUB_STEP_SUMMARY"
          fi

      # server-ops 계정을 deployer 말고 빌려 쓸 수 있는 주체가 있으면 이미지와 DB를 바꾸기 전에 배포를 멈춥니다(#1321).
      # 출력은 역할과 주체 종류만 적고 사람 메일은 가립니다.
      - name: server-ops 계정 검사
        if: steps.ready.outputs.ready == 'true'
        run: server/deploy/check-ops-sa.sh "$PROJECT"

      - name: 이미지 빌드와 push
        if: steps.ready.outputs.ready == 'true'
        id: image
        run: |
          image="${REGION}-docker.pkg.dev/${PROJECT}/myungli/server:${GITHUB_SHA}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build \
            --build-arg GO_VERSION="$(cd server && go list -m -f '{{.GoVersion}}')" \
            --build-arg GO_TAGS="${{ inputs.go_tags }}" \
            -t "$image" server
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      # migrate가 실패하면 --wait가 실패로 끝나 이후 단계(seed, server)가 돌지 않고 이전 리비전이 남습니다.
      # migrate와 seed는 server-migrator로 돌고 Secret이 필요 없어 붙이지 않습니다. 예전에 붙인 것은 --clear-secrets로 지웁니다(S137).
      - name: migrate
        if: steps.ready.outputs.ready == 'true'
        run: |
          gcloud run jobs update server-migrate --region "$REGION" --project "$PROJECT" \
            --image "${{ steps.image.outputs.image }}" \
            --env-vars-file "$RUNNER_TEMP/migrator-env.yaml" --clear-secrets
          gcloud run jobs execute server-migrate --wait --region "$REGION" --project "$PROJECT"

      - name: seed
        if: steps.ready.outputs.ready == 'true'
        run: |
          gcloud run jobs update server-seed --region "$REGION" --project "$PROJECT" \
            --image "${{ steps.image.outputs.image }}" \
            --env-vars-file "$RUNNER_TEMP/migrator-env.yaml" --clear-secrets
          gcloud run jobs execute server-seed --wait --region "$REGION" --project "$PROJECT"

      - name: server 배포
        if: steps.ready.outputs.ready == 'true'
        run: |
          gcloud run services update server --region "$REGION" --project "$PROJECT" \
            --image "${{ steps.image.outputs.image }}" \
            --env-vars-file "$RUNNER_TEMP/server-env.yaml" --set-secrets "${{ steps.ready.outputs.secrets }}"

      # 운영 API는 server와 같은 이미지를 ops-serve(Terraform args)로 돌립니다. migrate가 운영 DB 사용자의 권한 묶음을 둔 뒤에 갱신합니다.
      # 앱 Secret은 붙이지 않고 허용 목록만 붙입니다. 환경 변수가 아니라 볼륨(버전 latest)으로 붙여, 새 버전을 넣으면
      # 떠 있는 인스턴스도 다시 읽습니다(ops-serve가 1분 TTL). --set-secrets는 이전 매핑(예전의 환경 변수 OPS_OPERATORS)을 모두 바꿉니다.
      - name: server-ops 배포
        if: steps.ready.outputs.ready == 'true' && steps.ready.outputs.ops_ready == 'true'
        run: |
          gcloud run services update server-ops --region "$REGION" --project "$PROJECT" \
            --image "${{ steps.image.outputs.image }}" \
            --env-vars-file "$RUNNER_TEMP/ops-env.yaml" --set-secrets "${{ steps.ready.outputs.ops_operators_file }}=OPS_OPERATORS:latest"

      # Scheduler는 scheduler_enabled(Terraform 출력)가 true일 때만 켭니다. 부하 환경은 false라 Job 이미지만 바꿉니다(D104).
      - name: 배치 Job과 Scheduler
        if: steps.ready.outputs.ready == 'true'
        run: |
          scheduler_enabled="$(terraform -chdir=server/deploy/terraform/env output -raw scheduler_enabled)"
          resume() {
            if [ "$scheduler_enabled" = "true" ]; then
              gcloud scheduler jobs resume "$1" --location "$REGION" --project "$PROJECT"
            fi
          }
          gcloud run jobs update server-retention --region "$REGION" --project "$PROJECT" \
            --image "${{ steps.image.outputs.image }}" \
            --env-vars-file "$RUNNER_TEMP/server-env.yaml" --set-secrets "${{ steps.ready.outputs.secrets }}"
          resume retention-daily
          gcloud run jobs update server-precompute --region "$REGION" --project "$PROJECT" \
            --image "${{ steps.image.outputs.image }}" \
            --env-vars-file "$RUNNER_TEMP/server-env.yaml" --set-secrets "${{ steps.ready.outputs.secrets }}"
          resume precompute-half-hourly
          gcloud run jobs update server-notify --region "$REGION" --project "$PROJECT" \
            --image "${{ steps.image.outputs.image }}" \
            --env-vars-file "$RUNNER_TEMP/server-env.yaml" --set-secrets "${{ steps.ready.outputs.secrets }}"
          resume notify-every-5m
          # 조합 확인 Job은 Scheduler 없이 아래 조합 확인 단계와 deploy-engine이 실행합니다(S169).
          gcloud run jobs update server-smoke --region "$REGION" --project "$PROJECT" \
            --image "${{ steps.image.outputs.image }}" \
            --env-vars-file "$RUNNER_TEMP/server-env.yaml" --set-secrets "${{ steps.ready.outputs.secrets }}"

      # 부하 생성기 Job(load-k6, L1-2b)은 load_generator_enabled(Terraform 출력)가 true인 부하 환경에만 있습니다.
      # 스크립트 이미지를 빌드해 붙이고, 테스트 로그인 비밀만 연결합니다(server Secret 전부를 붙이지 않음).
      - name: 부하 생성기 Job
        if: steps.ready.outputs.ready == 'true'
        run: |
          if [ "$(terraform -chdir=server/deploy/terraform/env output -raw load_generator_enabled)" != "true" ]; then
            exit 0
          fi
          image="${REGION}-docker.pkg.dev/${PROJECT}/myungli/load-k6:${GITHUB_SHA}"
          docker build -t "$image" server/load
          docker push "$image"
          gcloud run jobs update load-k6 --region "$REGION" --project "$PROJECT" \
            --image "$image" --set-secrets "TEST_LOGIN_SECRET=TEST_LOGIN_SECRET:latest"

      - name: Firebase Hosting
        if: steps.ready.outputs.ready == 'true'
        working-directory: server/deploy/firebase
        run: npx --yes firebase-tools@14 deploy --only hosting --project "$PROJECT" --non-interactive

      # 판 맞춤 확인(D147 ②): 그 환경의 server, 엔진 이미지 commit을 적고 HEAD와 다르면 경고합니다.
      - name: 판 맞춤 확인
        if: steps.ready.outputs.ready == 'true'
        id: versions
        run: server/deploy/compose-check.sh versions "$PROJECT"

      # 조합 확인(D147 ①): 엔진이 뒤처졌으면 지금 돌려도 옛 엔진과의 조합이라 건너뛰고, deploy-server가 엔진을 배포한 뒤 그쪽에서 돌립니다.
      - name: 조합 확인
        if: steps.ready.outputs.ready == 'true'
        run: |
          if [ "${{ steps.versions.outputs.engine_behind }}" = "true" ]; then
            echo "### 조합 확인 미룸 (${{ inputs.environment }}): 엔진이 뒤처져 엔진 배포 뒤에 확인합니다." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          server/deploy/compose-check.sh smoke "$PROJECT"
