name: web

# ci-gate가 부르는 web 단위 검사입니다(D144, WB1 #1331).
# pull_request 트리거는 ci-gate에 web 갈래가 생기기 전까지만 둡니다(ci-gate.yml 머리 주석의 전환 순서 1단계).
# 지휘가 web 갈래를 넣으면(지휘 plan docs/plans/2026-11-25-web-landing.md Task 5) web이 다음 PR에서 지웁니다.
on:
  workflow_call:
    inputs:
      mode:
        description: "ci-gate 판별(own·drift·gate). own은 빠른 검사 전체, drift·gate는 계약(토큰, IA site.json, writing 생성물)을 읽는 검사만"
        type: string
        default: own
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

# workflow 단위 concurrency는 두지 않습니다. workflow_call로 불리면 호출 측과 group이 겹치고, concurrency는 ci-gate가 가집니다.

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # 직접 실행(pull_request, workflow_dispatch)에는 mode 입력이 없어 own입니다.
      OWN: ${{ (inputs.mode || 'own') == 'own' }}
      # 캐시 저장은 기준 브랜치 staging push의 own 실행에서만 합니다(D81 ⑥). 정기, 수동 실행은 캐시 없이 새로 받습니다.
      USE_CACHE: ${{ github.event_name != 'workflow_dispatch' && github.event_name != 'schedule' }}
      SAVE_CACHE: ${{ (inputs.mode || 'own') == 'own' && github.event_name == 'push' && github.ref == 'refs/heads/staging' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
      - name: pnpm store 경로
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      # 키: runner OS, Node 버전 파일, lockfile. 복원이 실패해도 install이 받으므로 결과는 같습니다.
      - name: pnpm store 캐시 복원
        if: env.USE_CACHE == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: web-pnpm-${{ runner.os }}-${{ hashFiles('web/.nvmrc', 'web/pnpm-lock.yaml') }}
      - name: 설치(lockfile 고정)
        run: pnpm install --frozen-lockfile
      # OG 글꼴은 고정 주소와 sha256(site/src/og/fonts.ts)이라 그 파일이 키입니다. 복원 뒤에도 sha256을 다시 확인합니다.
      - name: OG 글꼴 캐시 복원
        if: env.USE_CACHE == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: web/.cache/fonts
          key: web-fonts-${{ hashFiles('web/site/src/og/fonts.ts') }}

      - name: lint
        if: env.OWN == 'true'
        run: pnpm lint
      - name: 타입 검사
        if: env.OWN == 'true'
        run: pnpm typecheck
      - name: 단위 테스트 전체
        if: env.OWN == 'true'
        run: pnpm test
      # 계약 검사: 토큰 생성물 대조(design 토큰), 원고와 IA 슬롯 대조(site.json, writing 생성물).
      - name: 토큰 CSS가 design 토큰과 같은지
        run: pnpm --filter @myungli/tokens check
      - name: 원고와 IA 대조
        if: env.OWN != 'true'
        run: pnpm exec vitest run --project site site/test/copy.test.ts
      # 빌드는 세 계약을 모두 읽고, 빌드 뒤 검사(check-dist)가 페이지, OG, D93, 내부 링크를 봅니다.
      - name: 빌드와 빌드 뒤 검사
        run: pnpm build

      - name: Playwright 버전
        if: env.OWN == 'true'
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Playwright 브라우저 캐시 복원
        if: env.OWN == 'true' && env.USE_CACHE == 'true'
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: web-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Playwright 브라우저 설치
        if: env.OWN == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright(Hosting 에뮬레이터)
        if: env.OWN == 'true'
        run: pnpm e2e
      - name: Playwright 보고서
        if: failure() && env.OWN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

      - name: pnpm store 캐시 저장
        if: env.SAVE_CACHE == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: web-pnpm-${{ runner.os }}-${{ hashFiles('web/.nvmrc', 'web/pnpm-lock.yaml') }}
      - name: OG 글꼴 캐시 저장
        if: env.SAVE_CACHE == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: web/.cache/fonts
          key: web-fonts-${{ hashFiles('web/site/src/og/fonts.ts') }}
      - name: Playwright 브라우저 캐시 저장
        if: env.SAVE_CACHE == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: web-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
