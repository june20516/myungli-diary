name: core

on:
  # PR과 main push에서는 ci-gate가 이 workflow를 호출한다(D44). 호출된 실행의 github.event_name은 호출한 쪽 이벤트다.
  workflow_call:
    inputs:
      mode:
        description: "ci-gate 판별(own·drift·gate). own은 빠른 검사 전체, drift·gate는 계약을 읽는 검사만"
        type: string
        default: own
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # 매주 월요일 03:00 UTC: slow 테스트 전체와 property 테스트 전체

permissions:
  contents: read

# 검사 범위(D81, docs/workflow.md §6.2): inputs.mode가 없는 실행(schedule·workflow_dispatch)은 own으로 본다.
# * own: 아래 job 전체(slow는 바뀐 경로에 맞는 묶음만).
# * gate·drift: 계약 검사만. 제공 계약 파일 대조(`pytest -m contract`)와 proto 검사(core-proto).
#   core는 받는 계약이 없어 drift가 생기지 않지만, 넘어오면 gate와 같이 다룬다.
jobs:
  # slow 테스트는 엔진 정확성의 근거라서, 묶음(kasi·calibration)이 의존하는 경로를 바꾼 변경에서도 돌린다.
  # 묶음별 경로는 core/tools/slow_scope.py에 있다.
  core-paths:
    if: (inputs.mode || 'own') == 'own'
    runs-on: ubuntu-latest
    outputs:
      slow_markers: ${{ steps.detect.outputs.slow_markers }}
      full_properties: ${{ steps.detect.outputs.full_properties }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 돌릴 slow 테스트 묶음 판별
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            echo "slow_markers=slow" >> "$GITHUB_OUTPUT"
            echo "full_properties=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "full_properties=false" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "pull_request" ]; then
            # checkout은 merge ref(refs/pull/N/merge)이고, 그 first parent가 검사 시점의 main이다(D81 ②).
            base=$(git rev-parse HEAD^1)
          elif [ "$EVENT" = "push" ] && [ -n "$PUSH_BEFORE" ] && ! echo "$PUSH_BEFORE" | grep -qE '^0+$'; then
            base="$PUSH_BEFORE"
          else
            echo "slow_markers=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git -c core.quotePath=false diff --name-only "$base"...HEAD)
          echo "$changed"
          markers=$(echo "$changed" | python3 -I core/tools/slow_scope.py)
          echo "slow 묶음: ${markers:-없음}"
          echo "slow_markers=$markers" >> "$GITHUB_OUTPUT"

  core-check:
    # slow 테스트는 아래 slow job에서만 돌린다.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      # setup-uv는 v8부터 메이저 태그(v10)를 두지 않아 정확한 버전으로 고정한다.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.3"
          python-version: "3.13"
          # v10의 기본값(auto)은 일부 이벤트에서 캐시를 끄므로 명시한다.
          enable-cache: true
          cache-dependency-glob: core/uv.lock
      - run: uv sync --frozen
      - if: (inputs.mode || 'own') == 'own'
        run: uv run ruff check .
      - if: (inputs.mode || 'own') == 'own'
        run: uv run mypy src tools
      # 빠른 테스트 전체. 계약 검사(contract 표지, proto 생성 코드 대조 포함)도 여기에 들어 있다.
      - if: (inputs.mode || 'own') == 'own'
        run: uv run pytest -q -m "not slow"
      - name: 계약 검사만 (gate·drift)
        if: (inputs.mode || 'own') != 'own'
        run: uv run pytest -q -m contract

  # 엔진 컨테이너 이미지(#34, D56): core/만으로 빌드되고 PORT로 떠서 health와 GetInfo에 답하는지 본다.
  core-image:
    if: github.event_name != 'schedule' && (inputs.mode || 'own') == 'own'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      # setup-uv는 v8부터 메이저 태그(v10)를 두지 않아 정확한 버전으로 고정한다.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.3"
          python-version: "3.13"
          # v10의 기본값(auto)은 일부 이벤트에서 캐시를 끄므로 명시한다.
          enable-cache: true
          cache-dependency-glob: core/uv.lock
      - run: uv sync --frozen
      - run: docker build -t myungli-engine:ci .
      - name: PORT=8080으로 실행하고 health와 GetInfo 확인
        run: |
          docker run -d --name engine -e PORT=8080 -p 8080:8080 myungli-engine:ci
          if ! uv run python tools/check_container.py localhost:8080; then
            docker logs engine
            exit 1
          fi
          docker stop engine

  core-proto:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # breaking 비교 기준은 merge ref의 first parent(검사 시점의 main)다(D81 ②).
      # 기준 커밋에 지금의 proto 파일이 없으면 breaking 비교를 건너뛴다. 해당하는 경우:
      # * proto를 처음 들이는 PR
      # * 패키지 이름을 바꾸는 PR(D63, 출시 전 한 번만 허용). 병합 뒤에는 기준 커밋에 이 파일이 있으므로 비교가 다시 켜진다.
      - name: PR 기준 커밋과 그 커밋에 지금의 proto 파일이 있는지 확인
        id: base_proto
        env:
          EVENT: ${{ github.event_name }}
          PROTO_FILE: proto/myungli/engine/v1/engine.proto
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base=$(git rev-parse HEAD^1)
            echo "sha=$base" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${base:-}" ] && git cat-file -e "$base:$PROTO_FILE" 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::기준 커밋에 $PROTO_FILE 이 없어 buf breaking 비교를 건너뜁니다."
          fi
      - uses: bufbuild/buf-action@v1.6.0
        with:
          version: "1.73.0"
          input: proto
          lint: true
          format: false
          breaking: ${{ github.event_name == 'pull_request' && steps.base_proto.outputs.exists == 'true' }}
          # Actions 체크아웃에는 로컬 main 브랜치가 없으므로 기준 커밋을 저장소 URL로 직접 가리킨다.
          breaking_against: "${{ github.event.repository.clone_url }}#format=git,commit=${{ steps.base_proto.outputs.sha }},subdir=proto"
          push: false
          archive: false
          pr_comment: false

  core-slow:
    needs: core-paths
    if: needs.core-paths.outputs.slow_markers != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      # setup-uv는 v8부터 메이저 태그(v10)를 두지 않아 정확한 버전으로 고정한다.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.3"
          python-version: "3.13"
          # v10의 기본값(auto)은 일부 이벤트에서 캐시를 끄므로 명시한다.
          enable-cache: true
          cache-dependency-glob: core/uv.lock
      - run: uv sync --frozen
      - name: slow 테스트 (바뀐 경로에 맞는 묶음)
        env:
          SLOW_MARKERS: ${{ needs.core-paths.outputs.slow_markers }}
        run: uv run pytest -q -m "$SLOW_MARKERS"
      - name: property 테스트 전체 예제 수 (정기·수동 실행)
        if: needs.core-paths.outputs.full_properties == 'true'
        env:
          HYPOTHESIS_PROFILE: full
        run: uv run pytest -q tests/properties
