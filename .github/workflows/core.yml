name: core

on:
  # PR과 main push에서는 ci-gate가 이 workflow를 호출한다(D44). 호출된 실행의 github.event_name은 호출한 쪽 이벤트다.
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # 매주 월요일 03:00 UTC: slow 테스트

permissions:
  contents: read

jobs:
  # slow 테스트(KASI 골든·분포 보정)는 엔진 정확성의 근거라서, 계산·원국·규칙·조립·상수·근거 데이터·의존성과
  # 보정 도구·테스트를 바꾸는 변경에서도 돌린다.
  core-paths:
    runs-on: ubuntu-latest
    outputs:
      slow: ${{ steps.detect.outputs.slow }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: slow 테스트를 돌릴 변경인지 판별
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            echo "slow=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"
          elif [ "$EVENT" = "push" ] && [ -n "$PUSH_BEFORE" ] && ! echo "$PUSH_BEFORE" | grep -qE '^0+$'; then
            base="$PUSH_BEFORE"
          else
            echo "slow=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git -c core.quotePath=false diff --name-only "$base"...HEAD)
          echo "$changed"
          if echo "$changed" | grep -qE '^core/src/myungli_engine/(calendar_core|chart|composers|constants|domain|references|rules)/|^core/tools/calibrate_strength\.py$|^core/tests/unit/rules/test_calibration\.py$|^core/uv\.lock$|^core/tests/golden/|^\.github/workflows/core\.yml$'; then
            echo "slow=true" >> "$GITHUB_OUTPUT"
          else
            echo "slow=false" >> "$GITHUB_OUTPUT"
          fi

  core-check:
    # slow 테스트는 아래 slow job에서만 돌린다.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      # setup-uv는 v8부터 메이저 태그(v10)를 두지 않아 정확한 버전으로 고정한다.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.3"
          python-version: "3.13"
          # v10의 기본값(auto)은 일부 이벤트에서 캐시를 끄므로 명시한다.
          enable-cache: true
          cache-dependency-glob: core/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy src tools
      - run: uv run pytest -q -m "not slow"
      - name: 생성 코드가 proto와 일치하는지 확인
        run: |
          bash tools/gen_proto.sh
          git diff --exit-code src/myungli_engine/_gen

  # 엔진 컨테이너 이미지(#34, D56): core/만으로 빌드되고 PORT로 떠서 health와 GetInfo에 답하는지 본다.
  core-image:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      # setup-uv는 v8부터 메이저 태그(v10)를 두지 않아 정확한 버전으로 고정한다.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.3"
          python-version: "3.13"
          # v10의 기본값(auto)은 일부 이벤트에서 캐시를 끄므로 명시한다.
          enable-cache: true
          cache-dependency-glob: core/uv.lock
      - run: uv sync --frozen
      - run: docker build -t myungli-engine:ci .
      - name: PORT=8080으로 실행하고 health와 GetInfo 확인
        run: |
          docker run -d --name engine -e PORT=8080 -p 8080:8080 myungli-engine:ci
          if ! uv run python tools/check_container.py localhost:8080; then
            docker logs engine
            exit 1
          fi
          docker stop engine

  core-proto:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # PR 기준 커밋에 지금의 proto 파일이 없으면 breaking 비교를 건너뛴다. 해당하는 경우:
      # * proto를 처음 들이는 PR
      # * 패키지 이름을 바꾸는 PR(D63, 출시 전 한 번만 허용). 병합 뒤에는 기준 커밋에 이 파일이 있으므로 비교가 다시 켜진다.
      - name: PR 기준 커밋에 지금의 proto 파일이 있는지 확인
        id: base_proto
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PROTO_FILE: proto/myungli/engine/v1/engine.proto
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA:$PROTO_FILE" 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::기준 커밋에 $PROTO_FILE 이 없어 buf breaking 비교를 건너뜁니다."
          fi
      - uses: bufbuild/buf-action@v1.6.0
        with:
          version: "1.73.0"
          input: proto
          lint: true
          format: false
          breaking: ${{ github.event_name == 'pull_request' && steps.base_proto.outputs.exists == 'true' }}
          # Actions 체크아웃에는 로컬 main 브랜치가 없으므로 PR 기준 커밋을 저장소 URL로 직접 가리킨다.
          breaking_against: "${{ github.event.repository.clone_url }}#format=git,commit=${{ github.event.pull_request.base.sha }},subdir=proto"
          push: false
          archive: false
          pr_comment: false

  core-slow:
    needs: core-paths
    if: needs.core-paths.outputs.slow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      # setup-uv는 v8부터 메이저 태그(v10)를 두지 않아 정확한 버전으로 고정한다.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.3"
          python-version: "3.13"
          # v10의 기본값(auto)은 일부 이벤트에서 캐시를 끄므로 명시한다.
          enable-cache: true
          cache-dependency-glob: core/uv.lock
      - run: uv sync --frozen
      - run: uv run pytest -q -m slow
