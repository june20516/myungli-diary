name: writing

# ci-gate가 부르는 전용 workflow입니다. 직접 push·pull_request로 돌면 중복 실행되므로 트리거를 두지 않습니다(#148).
on:
  workflow_call:
    inputs:
      mode:
        description: "ci-gate 판별(own·drift·gate). own은 빠른 검사 전체, drift·gate는 계약을 읽는 검사만"
        type: string
        default: own
  workflow_dispatch:

# workflow 단위 concurrency는 두지 않는다. workflow_call로 불리면 호출 측 event·ref로 group이 겹쳐 서로 취소되며, concurrency는 ci-gate가 가진다.

permissions:
  contents: read

# 검사 범위(D81, docs/workflow.md §6.2). writing이 받는 계약은 IA·core 메시지 키·매개변수·근거 목록·proto·design 글자 수 표입니다.
# * 계약 검사(모든 mode): 원고 대조 `mlw check`(IA·키·매개변수·근거), 생성 문서 대조 `gen-docs --check`(IA 대응표),
#   proto 생성 코드 대조, `contract` 표지 테스트(design lengths.md 상한 대조, 저장소 IA·키 테스트).
# * 검사기 자체 검사(own만): ruff, mypy, 단위 테스트 전체.
# 수동 실행(workflow_dispatch)은 입력이 비어 있어 own과 같이 전부 돕니다.

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CONTRACT_ONLY: ${{ inputs.mode == 'drift' || inputs.mode == 'gate' }}
    defaults:
      run:
        working-directory: docs/identity/writing/tools
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.3"
          python-version: "3.13"
      - run: uv sync --frozen
      - if: env.CONTRACT_ONLY != 'true'
        run: uv run ruff check .
      - if: env.CONTRACT_ONLY != 'true'
        run: uv run mypy src
      - if: env.CONTRACT_ONLY != 'true'
        run: uv run pytest -q
      - name: 계약 테스트만(drift·gate)
        if: env.CONTRACT_ONLY == 'true'
        run: uv run pytest -q -m contract
      - run: uv run mlw gen-docs --check
      - run: uv run mlw check ../content
      - name: 생성 코드가 proto와 일치하는지 확인
        run: |
          bash gen_proto.sh
          git diff --exit-code src/mlw/_gen
