name: writing

on:
  push:
    paths:
      - "docs/identity/writing/**"
      - ".github/workflows/writing.yml"
      - "core/message_keys.json"
      - "proto/**"
  pull_request:
    paths:
      - "docs/identity/writing/**"
      - ".github/workflows/writing.yml"
      - "core/message_keys.json"
      - "proto/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/identity/writing/tools
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.3"
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest -q
      - run: uv run mlw gen-docs --check
      - run: uv run mlw check ../content --partial
      - name: 생성 코드가 proto와 일치하는지 확인
        run: |
          bash gen_proto.sh
          git diff --exit-code src/mlw/_gen
