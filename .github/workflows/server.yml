name: server

on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/server.yml"]

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          working-directory: server
      # testcontainers가 ubuntu runner의 Docker로 PostgreSQL을 띄운다.
      - run: go test -race ./...
      - name: 생성 코드가 계약과 일치하는지 확인
        run: |
          go generate ./...
          git diff --exit-code
      - run: docker build .
