name: server

# ci-gate가 부르는 전용 workflow입니다. 직접 push·pull_request로 돌면 중복 실행되므로 트리거를 두지 않습니다(#102).
on:
  workflow_call:
  workflow_dispatch:

# workflow 단위 concurrency는 두지 않는다. workflow_call로 불리면 호출 측 event·ref로 group이 겹쳐 서로 취소되며, concurrency는 ci-gate가 가진다.

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      # staging 테스트 로그인(S24)은 build tag staging 파일에만 있어 그 tag로 한 번 더 검사합니다.
      - run: go vet -tags staging ./...
      # 시드의 원본인 writing 원고를 검사합니다(spec §6.1). 원고가 W1로 다 오기 전까지 --partial입니다(P4-8).
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.3"
          python-version: "3.13"
      - name: writing 원고 검사
        working-directory: docs/identity/writing/tools
        run: |
          uv sync --frozen
          uv run mlw check ../content --partial
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: server
      - name: golangci-lint (staging tag)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: server
          args: --build-tags=staging
      # testcontainers가 ubuntu runner의 Docker로 PostgreSQL을 띄운다.
      - run: go test -race ./...
      - name: staging 테스트 로그인
        # prod 빌드에 라우트가 없음은 위 go test(!staging)가, staging 빌드의 동작은 이 단계가 확인합니다(S24).
        run: go test -race -tags staging ./internal/httpapi/ ./internal/auth/... ./internal/platform/config/ ./internal/cli/ -run 'TestLogin|TestLoadTestLogin|TestValidTestLabel|TestServe_RequiresTestLogin|TestServe_AssemblesTestLogin'
      - name: 실제 엔진과 계약 테스트
        # core/Dockerfile로 엔진 이미지를 빌드해 띄우고 server 클라이언트로 실제 RPC를 부른다(#79).
        run: go test -tags enginecontract ./internal/engine/...
      # go generate는 시드(seed/data/content.json)도 원고에서 다시 만듭니다. 원고와 시드가 어긋나면 아래 차이 검사가 잡습니다.
      - name: 생성 코드가 계약과 일치하는지 확인
        run: |
          go generate ./...
          # untracked 새 파일도 잡으려고 git diff 대신 status를 본다.
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            exit 1
          fi
      - name: 이미지 빌드
        run: docker build --build-arg GO_VERSION="$(go list -m -f '{{.GoVersion}}')" .
