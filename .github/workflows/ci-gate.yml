# ci-gate: 모든 PR과 main push에서 항상 도는 단일 판정 workflow (지휘 소유)
#
# * 필수 검사 이름은 `ci-gate` 하나입니다. 경로 필터가 걸린 workflow를 필수로 두면
#   해당 경로를 건드리지 않은 PR이 "대기"에 멈추므로, 판정은 항상 이 job이 냅니다.
# * 새 단위 검사를 붙이는 방법 (docs/specs/2026-10-10-collab-workflow-design.md §4.1):
#   1. (단위) 단위 workflow에 `on: workflow_call`만 더합니다. 기존 트리거를 유지합니다.
#   2. (지휘) 아래 `changes` job에 그 단위의 경로 출력을 더하고(계약 경로는 주는 쪽·쓰는 쪽 모두),
#      `uses: ./.github/workflows/<단위>.yml` job을 더해 `ci-gate`의 needs에 넣습니다.
#   3. (단위) 단위 workflow의 `pull_request`·`push` 트리거를 지웁니다(`schedule`·`workflow_dispatch`는 유지).
#   이 순서면 검사가 하나도 돌지 않는 구간이 생기지 않습니다. 전환 전까지 그 단위는 이 판정에 들어가지 않습니다.
# * PR 본문 검사(pr-body): 처리한 Issue는 `Closes #<번호>`, 없으면 `처리한 Issue: 없음`(docs/workflow.md §5.2).
#   본문만 고쳐도 다시 판정하도록 `edited`에서도 돕니다.
# * main push가 force-push여서 `before` 커밋이 없으면 `changes`가 실패하고 판정도 실패합니다(사후에 잡는다는 취지대로).

name: ci-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # PR은 ref마다 한 그룹이라 새 commit이 오면 앞선 실행을 취소합니다.
  # main push는 커밋마다 판정을 남겨야 하므로 커밋(sha)마다 그룹을 따로 둡니다. 같은 그룹을 쓰면
  # cancel-in-progress가 false여도 GitHub이 대기 중인 실행을 새 실행으로 바꾸며 취소합니다(연달아 병합할 때).
  group: ci-gate-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.detect.outputs.docs }}
      core: ${{ steps.detect.outputs.core }}
      server: ${{ steps.detect.outputs.server }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 바뀐 경로 판별
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"
          elif [ "$EVENT" = "push" ] && [ -n "$PUSH_BEFORE" ] && ! echo "$PUSH_BEFORE" | grep -qE '^0+$'; then
            base="$PUSH_BEFORE"
          else
            # workflow_dispatch 등 비교 기준이 없으면 아무 검사도 고르지 않습니다.
            echo "docs=false" >> "$GITHUB_OUTPUT"
            echo "core=false" >> "$GITHUB_OUTPUT"
            echo "server=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git -c core.quotePath=false diff --name-only "$base"...HEAD)
          echo "$changed"
          if echo "$changed" | grep -qE '\.md$|(^|/)artifacts/|^docs/ia/|^tools/docs-check/|^\.github/workflows/ci-gate\.yml$'; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
          fi
          # 단위 검사(core·server)는 문서(.md)를 읽지 않으므로, .md만 바뀐 경우에는 고르지 않습니다(docs 검사만 돕니다).
          code_changed=$(echo "$changed" | grep -vE '\.md$' || true)
          # core가 제공하는 계약(proto, message_keys.json, message_params.json)도 core/·proto/ 안에 있습니다.
          if echo "$code_changed" | grep -qE '^core/|^proto/|^\.github/workflows/(core|ci-gate)\.yml$'; then
            echo "core=true" >> "$GITHUB_OUTPUT"
          else
            echo "core=false" >> "$GITHUB_OUTPUT"
          fi
          # server가 쓰는 계약(proto, 메시지 키·매개변수, 슬롯 명세·호칭·조사 규칙)이 바뀌어도 server 검사를 돌립니다.
          if echo "$code_changed" | grep -qE '^server/|^proto/|^core/message_(keys|params)\.json$|^docs/identity/writing/|^\.github/workflows/(server|ci-gate)\.yml$'; then
            echo "server=true" >> "$GITHUB_OUTPUT"
          else
            echo "server=false" >> "$GITHUB_OUTPUT"
          fi

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: docs 검사 테스트
        working-directory: tools/docs-check
        run: python3 -I -m unittest -q
      - name: docs 검사 (링크·artifacts·결정 번호)
        run: python3 -I tools/docs-check/docs_check.py .

  pr-body:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 처리한 Issue 표기 확인
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 -I - <<'PY'
          import os, re, sys
          # 템플릿 안내 주석은 빼고 봅니다. 주석에도 예시 문구가 들어 있기 때문입니다.
          body = re.sub(r"<!--.*?-->", "", os.environ.get("BODY") or "", flags=re.S)
          closes = re.findall(r"(?im)^[\s*-]*(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)", body)
          none = re.search(r"(?m)^[\s*-]*처리한 Issue:\s*없음", body)
          if closes:
              print("처리한 Issue: " + ", ".join("#" + n for n in closes))
          elif none:
              print("처리한 Issue: 없음")
          else:
              print("PR 본문에 `Closes #<번호>` 또는 `처리한 Issue: 없음`이 없습니다 (docs/workflow.md §5.2).")
              sys.exit(1)
          PY

  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    uses: ./.github/workflows/core.yml

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    uses: ./.github/workflows/server.yml

  ci-gate:
    needs: [changes, docs, pr-body, core, server]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 판정
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "결과: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "실패한 검사가 있습니다: $result"; exit 1 ;;
            esac
          done
          echo "ci-gate 통과"
