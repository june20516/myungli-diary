# ci-gate: 모든 PR과 main push에서 항상 도는 단일 판정 workflow (지휘 소유)
#
# * 필수 검사 이름은 `ci-gate` 하나입니다. 경로 필터가 걸린 workflow를 필수로 두면
#   해당 경로를 건드리지 않은 PR이 "대기"에 멈추므로, 판정은 항상 이 job이 냅니다.
# * 새 단위 검사를 붙이는 방법 (docs/specs/2026-10-10-collab-workflow-design.md §4.1):
#   1. (단위) 단위 workflow에 `on: workflow_call`만 더합니다. 기존 트리거를 유지합니다.
#   2. (지휘) 아래 `changes` job에 그 단위의 경로 출력을 더하고(계약 경로는 주는 쪽·쓰는 쪽 모두),
#      `uses: ./.github/workflows/<단위>.yml` job을 더해 `ci-gate`의 needs에 넣습니다.
#   3. (단위) 단위 workflow의 `pull_request`·`push` 트리거를 지웁니다(`schedule`·`workflow_dispatch`는 유지).
#   이 순서면 검사가 하나도 돌지 않는 구간이 생기지 않습니다. 전환 전까지 그 단위는 이 판정에 들어가지 않습니다.
# * PR 본문 검사는 별도 workflow(pr-body.yml)입니다. 본문만 고친 `edited`에서 단위 검사를 다시 돌리거나
#   진행 중인 판정을 취소하지 않으려는 것입니다(D81).
# * 비교 기준: PR은 merge ref의 first parent(검사 시점의 main)와 비교합니다. `pull_request.base.sha`는 PR을 열거나
#   push한 시점의 main이라, 그 뒤 main에 들어온 다른 PR의 파일까지 바뀐 것으로 잡습니다(#345 실행에서 server가 own으로 돈 원인).
# * 수동 실행(workflow_dispatch)은 모든 단위를 own으로 돌립니다. main 전체를 한 번에 확인할 때 씁니다.
# * main push가 force-push여서 `before` 커밋이 없으면 `changes`가 실패하고 판정도 실패합니다(사후에 잡는다는 취지대로).
# * 단위 간 맞물림(drift, docs/workflow.md §6.1): 단위 검사는 두 방식으로 돕니다.
#   - own: PR이 그 단위의 코드(소유 경로)나 그 단위 workflow를 바꿨습니다. 실패하면 판정을 막습니다.
#   - drift: 그 단위가 쓰는 계약 파일만 바뀌었습니다(예: server PR이 openapi.yaml만 바꿈). 받는 쪽이 아직
#     따라오지 않아 실패할 수 있으므로 판정에서 빼고 경고로 남기며, PR이면 받는 쪽 앞으로 `drift` Issue를 엽니다.
#     받는 쪽은 다음 PR(own)에서 맞춰야 병합할 수 있습니다. 통합 마일스톤(I1~I4)은 남은 drift 0이 조건입니다.
#   - gate: 그 단위의 소유·계약 경로는 바뀌지 않았고 이 workflow(ci-gate.yml)가 바뀌었습니다. 실패하면 막되, 그 단위 앞으로 열린 `drift` Issue가 있으면
#     이미 알려진 실패로 보고 경고만 남깁니다. 병렬로 일하는 동안 drift가 0이 되기를 기다리지 않으려는 것입니다.
#   main push에서는 drift를 돌리지 않습니다. 결과가 판정에도 Issue에도 쓰이지 않기 때문입니다(실패는 PR 단계에서 이미 Issue로 열림).

name: ci-gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # PR은 ref마다 한 그룹이라 새 commit이 오면 앞선 실행을 취소합니다.
  # main push는 커밋마다 판정을 남겨야 하므로 커밋(sha)마다 그룹을 따로 둡니다. 같은 그룹을 쓰면
  # cancel-in-progress가 false여도 GitHub이 대기 중인 실행을 새 실행으로 바꾸며 취소합니다(연달아 병합할 때).
  group: ci-gate-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.detect.outputs.docs }}
      core: ${{ steps.detect.outputs.core }}
      server: ${{ steps.detect.outputs.server }}
      app: ${{ steps.detect.outputs.app }}
      writing: ${{ steps.detect.outputs.writing }}
      design: ${{ steps.detect.outputs.design }}
      core_mode: ${{ steps.detect.outputs.core_mode }}
      server_mode: ${{ steps.detect.outputs.server_mode }}
      app_mode: ${{ steps.detect.outputs.app_mode }}
      writing_mode: ${{ steps.detect.outputs.writing_mode }}
      design_mode: ${{ steps.detect.outputs.design_mode }}
      contracts: ${{ steps.detect.outputs.contracts }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 바뀐 경로 판별
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "수동 실행: 모든 단위를 own으로 돌립니다."
            echo "docs=true" >> "$GITHUB_OUTPUT"
            for name in core server app writing design; do
              echo "$name=true" >> "$GITHUB_OUTPUT"; echo "${name}_mode=own" >> "$GITHUB_OUTPUT"
            done
            exit 0
          elif [ "$EVENT" = "pull_request" ]; then
            # checkout은 merge ref(refs/pull/N/merge)이고, 그 first parent가 검사 시점의 main입니다.
            base=$(git rev-parse HEAD^1)
          elif [ "$EVENT" = "push" ] && [ -n "$PUSH_BEFORE" ] && ! echo "$PUSH_BEFORE" | grep -qE '^0+$'; then
            base="$PUSH_BEFORE"
          else
            # 비교 기준이 없으면 아무 검사도 고르지 않습니다.
            echo "docs=false" >> "$GITHUB_OUTPUT"
            for name in core server app writing design; do
              echo "$name=false" >> "$GITHUB_OUTPUT"; echo "${name}_mode=none" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi
          changed=$(git -c core.quotePath=false diff --name-only "$base"...HEAD)
          echo "$changed"
          if echo "$changed" | grep -qE '\.md$|(^|/)artifacts/|^docs/ia/|^docs/research/|^tools/docs-check/|^\.github/workflows/ci-gate\.yml$'; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
          fi
          # 단위 검사(core·server·app)는 문서(.md)를 읽지 않으므로, .md만 바뀐 경우에는 고르지 않습니다(docs 검사만 돕니다).
          # writing은 생성 문서(.md)도 원본과 대조하므로(gen-docs --check) .md를 빼지 않습니다.
          code_changed=$(echo "$changed" | grep -vE '\.md$' || true)
          # unit <이름> <바뀐 목록> <소유 경로> <쓰는 계약 경로>
          # 소유 경로(또는 단위 workflow)가 바뀌면 own, 계약 경로만 바뀌면 drift(main push에서는 돌지 않음), 이 workflow만 바뀌면 gate, 모두 아니면 돌지 않습니다.
          unit() {
            name="$1"; list="$2"; own="$3"; contract="$4"
            if echo "$list" | grep -qE "$own|^\.github/workflows/$name\.yml$"; then
              echo "$name=true" >> "$GITHUB_OUTPUT"; echo "${name}_mode=own" >> "$GITHUB_OUTPUT"
            elif [ -n "$contract" ] && echo "$list" | grep -qE "$contract" && [ "$EVENT" = "push" ]; then
              echo "$name=false" >> "$GITHUB_OUTPUT"; echo "${name}_mode=none" >> "$GITHUB_OUTPUT"
            elif [ -n "$contract" ] && echo "$list" | grep -qE "$contract"; then
              echo "$name=true" >> "$GITHUB_OUTPUT"; echo "${name}_mode=drift" >> "$GITHUB_OUTPUT"
            elif echo "$list" | grep -qE '^\.github/workflows/ci-gate\.yml$'; then
              echo "$name=true" >> "$GITHUB_OUTPUT"; echo "${name}_mode=gate" >> "$GITHUB_OUTPUT"
            else
              echo "$name=false" >> "$GITHUB_OUTPUT"; echo "${name}_mode=none" >> "$GITHUB_OUTPUT"
            fi
          }
          # core가 제공하는 계약(proto, message_keys.json, message_params.json)도 core/·proto/ 안에 있어 core 소유입니다.
          # core/docs/(원전 근거 자료와 그 도구)는 core 검사가 읽지 않으므로 고르지 않습니다(docs 검사만 돕니다).
          core_changed=$(echo "$code_changed" | grep -vE '^core/docs/' || true)
          unit core "$core_changed" '^core/|^proto/' ''
          # server가 쓰는 계약: proto, 메시지 키·매개변수, IA(시드 CI의 `mlw check`가 IA 대조까지 함),
          # writing 원고·슬롯 명세·조사 규칙과 그 검사기(seed/convert와 `mlw check`가 읽는 content·slots·rules·tools),
          # 법적 문서 원문(`go generate ./legal/`이 내장 파일로 바꿈, D80·#341).
          # code_changed는 .md를 빼므로, server가 읽는 법적 문서 원문(docs/legal/<언어>/*.md)은 다시 넣습니다.
          server_changed=$( { echo "$code_changed"; echo "$changed" | grep -E '^docs/legal/[^/]+/' || true; } | grep -v '^$' || true)
          unit server "$server_changed" '^server/' '^proto/|^core/(message_(keys|params)|evidence_(rules|sources))\.json$|^docs/identity/writing/(content|slots|rules|tools)/|^docs/ia/screens\.json$|^docs/legal/[^/]+/'
          # app이 쓰는 계약: REST, IA, 디자인 토큰·컴포넌트, 슬롯 명세와 ARB 검사기(#85).
          unit app "$code_changed" '^app/' '^server/api/openapi\.yaml$|^docs/ia/screens\.json$|^docs/identity/design/(tokens|components)/|^docs/identity/writing/(slots|tools)/'
          # writing 검사기가 읽는 계약: IA, 메시지 키·매개변수, proto(#144), design 글자 수 상한 표(슬롯 max_length 대조, W26).
          # 검사기가 읽지 않는 과정 문서(CLAUDE.md·결정·spec·계획·산출물)만 바뀐 것은 writing 검사를 고르지 않습니다(docs 검사만 돕니다).
          writing_changed=$(echo "$changed" | grep -vE '^docs/identity/writing/(CLAUDE\.md|decisions\.md|specs/|plans/|artifacts/)' || true)
          unit writing "$writing_changed" '^docs/identity/writing/' '^docs/ia/screens\.json$|^core/(message_(keys|params)|evidence_(rules|sources))\.json$|^proto/|^docs/identity/design/lengths\.md$'
          # design 검사기가 읽는 계약: IA(components.py), writing 라운드 원고와 ui 원고의 링크 문구(lengths.py). 과정 문서는 writing과 같이 뺍니다.
          design_changed=$(echo "$changed" | grep -vE '^docs/identity/design/(CLAUDE\.md|decisions\.md|specs/|plans/|artifacts/)' || true)
          unit design "$design_changed" '^docs/identity/design/' '^docs/ia/screens\.json$|^docs/identity/writing/artifacts/[^/]*-round-R[0-9]+\.md$|^docs/identity/writing/content/[^/]+/ui\.yaml$'
          # drift Issue 본문에 적을 계약 파일 목록입니다.
          contracts=$(echo "$changed" | grep -E '^server/api/openapi\.yaml$|^docs/ia/screens\.json$|^docs/identity/design/(tokens|components)/|^docs/identity/writing/(content|slots|rules|tools)/|^docs/identity/writing/artifacts/[^/]*-round-R[0-9]+\.md$|^core/(message_(keys|params)|evidence_(rules|sources))\.json$|^proto/|^docs/identity/design/lengths\.md$|^docs/legal/[^/]+/' | head -20 | tr '\n' ' ')
          echo "contracts=$contracts" >> "$GITHUB_OUTPUT"

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: docs 검사 테스트
        working-directory: tools/docs-check
        run: python3 -I -m unittest -q
      - name: docs 검사 (링크·artifacts·결정 번호·IA·아이디어·ja 근거 용어집)
        run: python3 -I tools/docs-check/docs_check.py .

  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    uses: ./.github/workflows/core.yml
    # 단위가 mode 입력을 받으면 넘깁니다(D81). own은 빠른 검사 전체, drift·gate는 계약 검사만입니다.
    with:
      mode: ${{ needs.changes.outputs.core_mode }}

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    uses: ./.github/workflows/server.yml
    with:
      mode: ${{ needs.changes.outputs.server_mode }}

  # 기기 E2E(e2e-android)는 run_e2e 기본값(false)이라 판정에 들어가지 않습니다. main push·매일 밤·수동은 app.yml이 직접 돕니다.
  # mode가 검사 범위를 정합니다(D81). Android 디버그 빌드와 golden은 own에서만 돕니다(app.yml).
  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    uses: ./.github/workflows/app.yml
    with:
      mode: ${{ needs.changes.outputs.app_mode }}

  writing:
    needs: changes
    if: needs.changes.outputs.writing == 'true'
    uses: ./.github/workflows/writing.yml

  design:
    needs: changes
    if: needs.changes.outputs.design == 'true'
    uses: ./.github/workflows/design.yml

  # drift로 돈 단위가 실패하면 PR에서 받는 쪽 앞으로 Issue를 엽니다. 같은 PR·단위의 Issue가 열려 있으면 다시 열지 않습니다.
  # 같은 PR의 다음 실행에서 drift가 통과하면(주는 쪽이 PR 안에서 맞춤) 그 Issue를 닫습니다. main push에서는 drift를 돌리지 않기 때문입니다.
  drift-report:
    needs: [changes, core, server, app, writing, design]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: drift Issue 열기
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          CONTRACTS: ${{ needs.changes.outputs.contracts }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SERVER: ${{ needs.changes.outputs.server_mode }}:${{ needs.server.result }}
          APP: ${{ needs.changes.outputs.app_mode }}:${{ needs.app.result }}
          WRITING: ${{ needs.changes.outputs.writing_mode }}:${{ needs.writing.result }}
          DESIGN: ${{ needs.changes.outputs.design_mode }}:${{ needs.design.result }}
        run: |
          # 계약 파일의 소유 단위(from 라벨)입니다.
          from_labels=""
          echo "$CONTRACTS" | grep -q 'server/api/openapi' && from_labels="$from_labels,from:server"
          echo "$CONTRACTS" | grep -q 'docs/ia/' && from_labels="$from_labels,from:root"
          echo "$CONTRACTS" | grep -q 'docs/identity/design/' && from_labels="$from_labels,from:design"
          echo "$CONTRACTS" | grep -q 'docs/identity/writing/' && from_labels="$from_labels,from:writing"
          echo "$CONTRACTS" | grep -qE 'core/|proto/' && from_labels="$from_labels,from:core"
          gh label create drift --color FBCA04 --description "계약 변경을 받는 쪽이 아직 따라오지 않음 (workflow §6.1)" 2>/dev/null || true
          for pair in "server=$SERVER" "app=$APP" "writing=$WRITING" "design=$DESIGN"; do
            unit="${pair%%=*}"; state="${pair#*=}"
            title="[drift] $unit: PR #$PR 계약 변경 따라잡기"
            if [ "$state" = "drift:success" ]; then
              gh issue list --state open --label drift --label "to:$unit" --limit 200 --json number,title \
                --jq ".[] | select(.title == \"$title\") | .number" | while read -r number; do
                gh issue close "$number" --comment "PR #$PR의 다음 실행에서 $unit drift 검사가 통과해 자동으로 닫습니다($RUN_URL)."
              done
              continue
            fi
            [ "$state" = "drift:failure" ] || continue
            if gh issue list --state open --label drift --limit 200 --json title --jq '.[].title' | grep -qxF "$title"; then
              echo "이미 열려 있습니다: $title"; continue
            fi
            printf '%s\n' \
              "## 무엇이 필요한가" \
              "PR #$PR($PR_TITLE)이 바꾼 계약에 \`$unit\`이 아직 맞지 않습니다. 이 단위의 다음 PR에서 맞춰 주세요. 맞추기 전에는 이 단위의 PR이 ci-gate를 통과하지 못합니다(docs/workflow.md §6.1)." \
              "" \
              "* 바뀐 계약 파일: $CONTRACTS" \
              "* 실패한 검사: $RUN_URL" \
              "" \
              "## 관련" \
              "PR #$PR. 이 Issue는 ci-gate가 자동으로 열었습니다. 맞춘 PR 본문에 \`Closes #<이 Issue>\`를 적어 주세요." > body.md
            gh issue create --title "$title" --label "drift,kind:request,to:$unit$from_labels" --body-file body.md
          done

  # main에서 단위 검사가 통과하면 그 단위는 그 커밋의 모든 계약에 맞습니다. 원인 PR이 그 커밋에 들어 있는 drift Issue를 닫습니다.
  # 원인 PR이 병합 없이 닫혔으면 따라잡을 것이 없으므로 not planned로 닫습니다.
  # 받는 쪽이 PR 본문에 `Closes`를 빠뜨려도 남지 않게 하려는 것입니다(남은 drift는 gate 판정을 느슨하게 합니다).
  drift-close:
    needs: [changes, server, app, writing, design]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: 따라잡은 단위의 drift Issue 닫기
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SERVER: ${{ needs.server.result }}
          APP: ${{ needs.app.result }}
          WRITING: ${{ needs.writing.result }}
          DESIGN: ${{ needs.design.result }}
        run: |
          for pair in "server=$SERVER" "app=$APP" "writing=$WRITING" "design=$DESIGN"; do
            unit="${pair%%=*}"; result="${pair#*=}"
            [ "$result" = "success" ] || continue
            gh issue list --state open --label drift --label "to:$unit" --limit 200 --json number,title \
              --jq '.[] | "\(.number) \(.title)"' | while read -r number title; do
              # 제목의 원인 PR(`PR #N`)이 이 main 커밋에 들어 있을 때만 닫습니다.
              # 원인 PR이 열린 채 다른 PR이 먼저 병합되면, 이 통과는 원인 계약 변경을 아직 검사하지 않은 것입니다.
              source=$(echo "$title" | sed -nE 's/.*PR #([0-9]+).*/\1/p')
              [ -n "$source" ] || continue
              state=$(gh pr view "$source" --json state,mergeCommit --jq '"\(.state) \(.mergeCommit.oid // "")"')
              case "$state" in
                MERGED\ *)
                  merge_sha="${state#MERGED }"
                  compare=$(gh api "repos/$GH_REPO/compare/$merge_sha...$SHA" --jq .status)
                  if [ "$compare" = "ahead" ] || [ "$compare" = "identical" ]; then
                    gh issue close "$number" --comment "main \`${SHA:0:7}\`(원인 PR #$source 포함)에서 $unit 검사가 통과해 자동으로 닫습니다($RUN_URL, docs/workflow.md §6.1)."
                  fi ;;
                CLOSED\ *)
                  gh issue close "$number" --reason "not planned" --comment "원인 PR #$source이 병합되지 않고 닫혀 따라잡을 계약 변경이 없습니다. 자동으로 닫습니다." ;;
              esac
            done
          done

  ci-gate:
    needs: [changes, docs, core, server, app, writing, design]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: read
    steps:
      - name: 판정
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FIXED: ${{ needs.changes.result }} ${{ needs.docs.result }}
          CORE: ${{ needs.changes.outputs.core_mode }}:${{ needs.core.result }}
          SERVER: ${{ needs.changes.outputs.server_mode }}:${{ needs.server.result }}
          APP: ${{ needs.changes.outputs.app_mode }}:${{ needs.app.result }}
          WRITING: ${{ needs.changes.outputs.writing_mode }}:${{ needs.writing.result }}
          DESIGN: ${{ needs.changes.outputs.design_mode }}:${{ needs.design.result }}
        run: |
          echo "결과: $FIXED core=$CORE server=$SERVER app=$APP writing=$WRITING design=$DESIGN"
          failed=""
          for result in $FIXED; do
            case "$result" in
              success|skipped) ;;
              *) failed="$failed $result" ;;
            esac
          done
          for pair in "core=$CORE" "server=$SERVER" "app=$APP" "writing=$WRITING" "design=$DESIGN"; do
            unit="${pair%%=*}"; mode="${pair#*=}"; mode_name="${mode%%:*}"; result="${mode#*:}"
            case "$result" in
              success|skipped) continue ;;
            esac
            if [ "$mode_name" = "drift" ]; then
              echo "::warning title=drift ($unit)::계약 변경을 $unit이 아직 따라오지 않았습니다. 판정에서 빼고, 받는 쪽 다음 PR에서 맞춥니다(docs/workflow.md §6.1)."
              echo "* drift: $unit ($result)" >> "$GITHUB_STEP_SUMMARY"
            elif [ "$mode_name" = "gate" ] && open=$(gh issue list --state open --label drift --label "to:$unit" --json number --jq 'map("#\(.number)")|join(" ")') && [ -n "$open" ]; then
              echo "::warning title=gate ($unit)::이 workflow만 바뀌었고 $unit 앞으로 열린 drift($open)가 있어 알려진 실패로 봅니다(docs/workflow.md §6.1)."
              echo "* gate: $unit ($result, 열린 drift $open)" >> "$GITHUB_STEP_SUMMARY"
            else
              failed="$failed $unit:$result"
            fi
          done
          if [ -n "$failed" ]; then
            echo "실패한 검사가 있습니다:$failed"; exit 1
          fi
          echo "ci-gate 통과"
