# server 배포(D65, spec server/docs/specs/2026-10-28-p9-deploy-design.md §7.1, S121).
# PR: Terraform fmt·validate와 workflow 검사, bootstrap 뒤에는 plan. main: staging 배포 뒤 prod(environment 승인).
# 저장소 변수 DEPLOY_ENABLED가 true가 아니면(bootstrap 전) plan과 배포 job은 건너뜁니다.
name: deploy-server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/deploy-*.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/deploy-*.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "staging-prod: staging 뒤 prod. load: 부하 전용 프로젝트에 배포. load-teardown: 부하 전용 프로젝트의 Cloud SQL만 지움(L1, D104)"
        type: choice
        options: [staging-prod, load, load-teardown]
        default: staging-prod

permissions:
  contents: read

env:
  TERRAFORM_VERSION: "1.17.0"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: terraform fmt
        run: terraform fmt -check -recursive server/deploy/terraform
      - name: terraform validate
        run: |
          for dir in server/deploy/terraform/bootstrap server/deploy/terraform/env; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
      - name: actionlint
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.12 -color

  plan:
    needs: checks
    # fork PR은 OIDC 토큰을 받지 못하므로 같은 저장소 PR만 plan합니다.
    if: >-
      github.event_name == 'pull_request'
      && vars.DEPLOY_ENABLED == 'true'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: staging
            project_id: myungli-diary-staging
          - environment: prod
            project_id: myungli-diary
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ matrix.environment == 'prod' && vars.GCP_WIF_PROVIDER_PROD || vars.GCP_WIF_PROVIDER_STAGING }}
          service_account: ${{ matrix.environment == 'prod' && vars.GCP_PLANNER_PROD || vars.GCP_PLANNER_STAGING }}
      - uses: google-github-actions/setup-gcloud@v3
      # 첫 env apply 전에는 state 객체가 없고, init이 빈 state를 쓰려다 읽기 전용 planner라 막힙니다.
      # 객체가 없을 때만 건너뛰고, 권한, 일시 오류는 실패로 드러냅니다(#668). bucket이 없을 때도 같은 404지만,
      # 그때는 bootstrap 전이라 WIF가 없어 앞의 auth가 먼저 실패합니다.
      - name: env state 확인
        id: state
        run: |
          object="gs://${{ matrix.project_id }}-tfstate/env/default.tfstate"
          if output="$(gcloud storage objects describe "$object" --format='value(name)' 2>&1)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q "not found: 404" <<< "$output"; then
            echo "### terraform plan (${{ matrix.environment }}) 건너뜀: env state가 아직 없습니다(첫 배포 전)." >> "$GITHUB_STEP_SUMMARY"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "$output" >&2
            exit 1
          fi
      - uses: hashicorp/setup-terraform@v4
        if: steps.state.outputs.exists == 'true'
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: terraform plan
        if: steps.state.outputs.exists == 'true'
        working-directory: server/deploy/terraform/env
        run: |
          terraform init -input=false -backend-config="bucket=${{ matrix.project_id }}-tfstate"
          terraform plan -input=false -lock=false -no-color -var-file="${{ matrix.environment }}.tfvars" > plan.txt
          {
            echo "### terraform plan (${{ matrix.environment }})"
            echo '```'
            grep -E '^(Plan:|No changes)' plan.txt || tail -n 20 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  staging:
    needs: checks
    # push(main)와 workflow_dispatch(staging-prod)에서 돕니다. push에서는 inputs.target이 비어 있습니다.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' && inputs.target != 'load' && inputs.target != 'load-teardown'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-server-env.yml
    with:
      environment: staging
      project_id: myungli-diary-staging
      go_tags: staging
      wif_provider: ${{ vars.GCP_WIF_PROVIDER_STAGING }}
      service_account: ${{ vars.GCP_DEPLOYER_STAGING }}

  prod:
    needs: staging
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-server-env.yml
    with:
      environment: prod
      project_id: myungli-diary
      go_tags: ""
      wif_provider: ${{ vars.GCP_WIF_PROVIDER_PROD }}
      service_account: ${{ vars.GCP_DEPLOYER_PROD }}

  # 부하 전용 프로젝트(L1, D104). workflow_dispatch로만 돌고 staging과 prod에는 손대지 않습니다.
  load:
    needs: checks
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'load' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-server-env.yml
    with:
      environment: load
      project_id: myungli-diary-load
      go_tags: staging
      wif_provider: ${{ vars.GCP_WIF_PROVIDER_LOAD }}
      service_account: ${{ vars.GCP_DEPLOYER_LOAD }}

  # 측정 회차가 끝나면 비용이 큰 Cloud SQL만 지웁니다. 그 인스턴스에 기대는 자원(DB, DB 사용자, SQL 알림 정책)도 함께 지워지고,
  # 다음 load 배포의 apply가 다시 만듭니다. Secret 틀과 값, Cloud Run(요청이 없으면 0으로 줄어듦), 네트워크는 남깁니다.
  load-teardown:
    needs: checks
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'load-teardown' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: load
    concurrency:
      group: deploy-server-load
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER_LOAD }}
          service_account: ${{ vars.GCP_DEPLOYER_LOAD }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Cloud SQL 지우기
        working-directory: server/deploy/terraform/env
        run: |
          terraform init -input=false -backend-config="bucket=myungli-diary-load-tfstate"
          terraform destroy -input=false -auto-approve -var-file=load.tfvars -target=google_sql_database_instance.main
