# 계산 규칙 지도 (#988). 엔진이 계산하는 값을 공통 틀, 그룹, 항목으로 정리한 원본이다.
# 이 파일을 고친 뒤 `uv run python tools/rules_map.py`로 `core/rules_map.json`을 다시 만든다(core 디렉터리에서).
# 규칙을 바꾸는 PR은 이 지도도 함께 고친다. 빠진 근거 규칙 id, 메시지 키, 규칙 모듈은 테스트가 잡는다
# (tests/unit/test_rules_map.py).
#
# 필드 뜻
# * rules[].source_status: 규칙 줄마다 다섯 단계(#997). 기준은 "이 규칙이 명리에 대한 주장인가, 그 근거가 원문에 있는가".
#   source(원전), concept_quantified(원전 개념 + 명리일기 수치화), principle_selected(원전 원리 + 명리일기 선택),
#   product(제품 규칙, 명리 주장이 아님), no_source(명리 주장인데 원문 없음)
#   항목의 source_status_counts는 생성기가 규칙 줄 분류를 세어 만든다(원본에 적지 않음).
# * values: 규칙 줄에 적은 기준값과 그 상수. 상수가 바뀌면 테스트가 실패하니 규칙 줄과 함께 고친다.
# * rules[].kind: base(공통 틀을 그대로 씀), added(공통 틀에 더한 규칙), removed(공통 틀에서 뺀 단계)
# * code: core/src/myungli_engine/ 아래 경로
# * message_keys: 메시지 키 패턴(* 는 아무 글자)
# * sources[].ref: 근거 원전 목록(core/evidence_sources.json)의 source_ref. 패턴(*)이면 칸마다 하나.
#   엔진 근거로 쓰지 않는 개념 원전은 ref 대신 file(core/docs/references/ 아래 저장 원문)을 적고, quote가 그 파일에 있어야 한다.
# * 이 지도는 내부 문서라 분류, 해석, 수치를 모두 적는다. 앱에 보이는 근거는 의혹이 없을 만큼만 밝힌다(D121).

[meta]
title = "명리일기 계산 규칙 지도"
version = 2
updated = "2026-11-11"
owner = "core"
description = """엔진이 계산하는 값(행운 색, 방향, 숫자, 집중 시간, 날의 성격, 달력 길흉, 태그, 용신, 신강약, 개인 해석 등)을 \
하나의 공통 틀에 놓고, 항목마다 더하거나 뺀 규칙과 그 이유, 원전을 적습니다. 지금 규칙을 있는 그대로 옮긴 것이며, \
규칙의 기준 문서는 엔진 spec(core/docs/specs/2026-10-10-myungli-engine-design.md)과 결정 로그입니다."""

[meta.source_status_labels]
source = "원전"
concept_quantified = "원전 개념 + 명리일기 수치화"
principle_selected = "원전 원리 + 명리일기 선택"
product = "제품 규칙"
no_source = "원전 없음"

[meta.source_status_descriptions]
source = "규칙이 원문 조목에 있습니다."
concept_quantified = "개념은 원전에 있고, 가중치, 점수, 경계값 같은 수치만 명리일기가 정했습니다."
principle_selected = "원전 원리를 따르되, 원문이 정하지 않은 고르는 법이나 순서를 명리일기가 정했습니다."
product = "명리에 대한 주장이 아니라 앱 설계라 원전 대상이 아닙니다."
no_source = "명리에 대한 주장인데 근거 원문이 없습니다. 앱 근거에 원전 없음을 밝힙니다(D108 ④)."

[meta.inconsistency_intent_labels]
intended = "의도"
partly = "반쯤 의도"
missing = "누락"

[meta.inconsistency_handling_labels]
keep = "그대로 둠"
keep_and_disclose = "그대로 두고 문구로 밝힘"
merge = "합침"
pending = "결정 대기"

[meta.rule_kind_labels]
base = "공통 틀 그대로"
added = "더한 규칙"
removed = "뺀 단계"

# ---------------------------------------------------------------------------
# 공통 틀: 계산 값이 거치는 단계
# ---------------------------------------------------------------------------

[[framework]]
id = "basis"
order = 1
name = "기준 고르기"
description = """원국(태어난 때의 사주)에서 그 사람의 기준을 정합니다. 일간, 신강약, 용신, 희신, 기신, 통관 오행, \
천을귀인 지지처럼 평생 바뀌지 않는 값입니다."""

[[framework]]
id = "today"
order = 2
name = "오늘과의 관계"
description = """그날의 일진(모두에게 같음)과 원국(사람마다 다름)의 관계를 봅니다(D13). 날의 성격, 합충형, 신살 발동, \
그날 일지에서의 12운성이 여기에 속합니다. 원국 해석처럼 오늘을 보지 않는 항목은 이 단계를 뺍니다."""

[[framework]]
id = "output"
order = 3
name = "출력 바꾸기"
description = """앞 단계에서 나온 오행이나 판정을 화면에 보일 값으로 바꿉니다. 오행을 색, 방위, 수로, 점수를 수준으로, \
관계를 태그로 바꾸는 단계입니다."""

[[framework]]
id = "evidence"
order = 4
name = "근거"
description = """판정마다 근거 규칙 id(rule_id)와 계산 내역(detail), 원전 위치(source_ref)를 붙입니다. \
원전이 없으면 공통 근거(C8) 또는 빈 값(C28)입니다."""

[[framework]]
id = "params"
order = 5
name = "문구 매개변수"
description = """엔진은 문장을 만들지 않고 메시지 키와 매개변수만 냅니다(D27). 문장은 writing이 키마다 씁니다."""

# ---------------------------------------------------------------------------
# 그룹
# ---------------------------------------------------------------------------

[[groups]]
id = "natal"
order = 1
name = "원국 해석"
description = "태어난 때만으로 정해지는 값입니다. 신강약, 용신, 원국 신살, 개인 해석."

[[groups]]
id = "day_judgment"
order = 2
name = "날 판정"
description = "일진과 원국의 관계로 그날의 성격과 길흉을 정합니다. 날의 성격, 합충형, 달력 길흉."

[[groups]]
id = "tags_messages"
order = 3
name = "태그와 문장"
description = "그날 두드러진 관계를 태그로 고르고, 총운과 가이드 질문의 메시지 키를 정합니다."

[[groups]]
id = "element_luck"
order = 4
name = "오행 행운 값"
description = """날의 성격으로 고른 오행 하나를 색, 방위, 수로 바꾸는 값입니다. \
바탕 오행은 셋이 같고(기신의 날 통관, 그 밖 용신), 그 뒤 바꾸는 규칙이 항목마다 다릅니다."""

[[groups]]
id = "hour"
order = 5
name = "시진 값"
description = "하루 열두 시진 가운데 하나를 고르는 값입니다. 오행 하나가 아니라 시진마다 점수를 매깁니다."

# ---------------------------------------------------------------------------
# 항목: 원국 해석
# ---------------------------------------------------------------------------

[[items]]
id = "strength"
group = "natal"
name = "신강약"
summary = "일간을 돕는 오행이 원국에서 얼마나 많은지를 점수로 매기고 다섯 등급으로 나눕니다. 일간의 旺衰(신강, 신약)는 원전 개념이고, 점수로 바꾸는 방식이 명리일기 것입니다."
decisions = ["D7", "C21", "C31"]
code = ["rules/strength.py", "constants/calibration.py"]
evidence_rules = []
message_keys = []
values = [
  { name = "MONTH_BRANCH_WEIGHT", module = "rules/strength.py", value = 3.0 },
  { name = "BRANCH_WEIGHT", module = "rules/strength.py", value = 1.5 },
  { name = "STEM_WEIGHT", module = "rules/strength.py", value = 1.0 },
  { name = "STRENGTH_THRESHOLDS", module = "constants/calibration.py", value = [22.381, 35.2381, 43.8095, 57.619] },
]

[items.steps]
basis = "원국 여덟 글자(시간 모름이면 여섯 글자)에서 일간을 뺀 자리를 봅니다."
today = "쓰지 않습니다."
output = "점수(0~100)와 등급(VERY_WEAK, WEAK, NEUTRAL, STRONG, VERY_STRONG), 오행별 가중 합."
evidence = "따로 근거를 내지 않고, 억부 용신 근거(yongsin/eokbu)의 detail에 점수와 등급이 들어갑니다."
params = "개인 해석(day_master, ten_god, twelve_stage)의 strength 매개변수로 쓰입니다. 용신 문구(yongsin.method.*)에는 매개변수로 가지 않고 억부 근거 detail에만 들어갑니다."

[[items.rules]]
kind = "base"
text = "자리 가중치: 월지 3, 그 밖의 지지 1.5, 천간 1. 지지는 지장간 비율(3개 0.6/0.3/0.1, 2개 0.7/0.3, 1개 1.0)로 오행에 나눕니다."
reason = "계절(월령)을 얻으면 왕하다는 旺相休囚 원리(三命通會)를 따라 월지를 가장 무겁게 봅니다. 3, 1.5, 1과 지장간 비율은 명리일기 수치입니다."
when = "모든 원국."
decisions = ["C31"]
source_status = "concept_quantified"

[[items.rules]]
kind = "base"
text = "점수 = 일간을 돕는 오행(비겁 + 인성)의 가중 합 / 전체 가중 합 x 100. 등급 경계는 점수 22.381, 35.2381, 43.8095, 57.619(무작위 출생 2만 건 분포의 15, 40, 60, 85 백분위)입니다."
reason = "돕는 기운이 많고 적음으로 강약을 본다는 억부의 전제(五行總論)는 원전이고, 등급이 한쪽에 몰리지 않게 실제 분포로 경계를 정한 것은 명리일기입니다."
when = "모든 원국. 시간 모름 원국도 같은 경계를 씁니다(C21)."
decisions = ["C21"]
source_status = "concept_quantified"

[[items.sources]]
file = "sammyeong-tonghoe/vol2.wikitext"
work = "三命通會"
section = "论五行旺相休囚死并寄生十二宫"
quote = "盛德乘时曰旺。如春木旺"
meaning = "때를 얻어 덕이 성한 것을 왕이라 한다. 봄의 목이 왕한 것과 같다."
interpretation = "계절(월령)을 얻은 오행이 왕하다는 개념입니다. 자리 가중치와 점수, 등급 경계는 원문에 없습니다."

[[items.sources]]
ref = "gungtong-bogam/five_elements#balance_principle"
work = "窮通寶鑑"
section = "五行總論"
quote = "高者抑之使平，下者举之使崇，或益其不及，或损其太过。所以贵在折衷，归於中道"
meaning = "높은 것은 눌러 고르게 하고 낮은 것은 들어 올려, 모자라면 더하고 넘치면 덜어 가운데로 돌린다."
interpretation = "넘치고 모자람(강약)을 보고 덜거나 더한다는 원리입니다. 강약을 재는 점수 방식은 원문에 없습니다."

[[items]]
id = "yongsin"
group = "natal"
name = "용신, 희신, 기신, 통관"
summary = "그 사람에게 가장 필요한 오행(용신)을 정하고, 거기서 희신, 기신, 통관 오행을 끌어냅니다."
decisions = ["D7", "D32", "C8", "C37"]
code = ["rules/yongsin.py", "constants/johu.py"]
evidence_rules = ["yongsin/johu", "yongsin/johu_neutral", "yongsin/eokbu"]
message_keys = ["yongsin.method.*"]
values = [
  { name = "JOHU_SUMMER_FIRE_SHARE", module = "constants/calibration.py", value = 0.3 },
  { name = "JOHU_WINTER_WATER_SHARE", module = "constants/calibration.py", value = 0.3571 },
]

[items.steps]
basis = "이 항목이 기준 자체입니다. 일간, 월지, 신강약 등급, 오행 분포를 씁니다."
today = "쓰지 않습니다."
output = "용신, 희신(용신을 생하는 오행), 기신(용신을 극하는 오행), 통관(기신이 생하고 용신을 생하는 오행, 희신과 같음)."
evidence = "조후는 그 일간과 월지의 窮通寶鑑 조후 칸, 억부는 五行總論의 억부 원리(balance_principle)."
params = "yongsin.method.<방식>에 yongsin, huisin, gisin, tonggwan."

[[items.rules]]
kind = "base"
text = "조후 우선: 월지가 巳午未이고 화 비중이 0.3 이상, 또는 월지가 亥子丑이고 수 비중이 0.3571 이상이면 조후표(窮通寶鑑) 첫 글자의 오행이 용신입니다(JOHU). 비중은 신강약의 오행별 가중 합에서 그 오행이 차지하는 몫입니다."
reason = "너무 덥거나 추운 계절에 난 사주는 기후를 먼저 맞춘다는 조후 원리(窮通寶鑑)입니다. 기준값(같은 계절 무작위 표본의 상위 40% 경계)은 명리일기가 정했습니다."
when = "여름, 겨울 태생이고 그 계절 오행이 많을 때."
decisions = ["D7"]
source_status = "concept_quantified"

[[items.rules]]
kind = "base"
text = "중화: 신강약이 NEUTRAL이면 조후표 첫 글자를 씁니다(JOHU_NEUTRAL)."
reason = "억부로 덜거나 더할 쪽이 없으니 조후표를 따릅니다."
when = "조후 우선이 아니고 신강약이 중간일 때."
decisions = ["D32"]
source_status = "principle_selected"

[[items.rules]]
kind = "base"
text = "억부: WEAK 이하는 인성 오행, STRONG 이상은 식상, 재성, 관성 중 오행 분포가 가장 약한 오행(동점이면 식상, 재성, 관성 순)이 용신입니다(EOKBU)."
reason = "넘치면 덜고 모자라면 더한다는 억부 원리(五行總論)입니다. 어느 오행으로 덜지는 명리일기가 정했습니다."
when = "위 둘이 아닐 때."
decisions = ["D7"]
source_status = "principle_selected"

[[items.rules]]
kind = "added"
text = "조후표는 통용 정리표를 원문과 대조해 15칸을 바로잡은 것이고, 원문이 첫 문장과 끝의 정리(总之) 문장에서 순서를 달리 말하면 정리 문장을 따릅니다. 원문이 순위 없이 나란히 말하는 칸(戊辰 \"不见丙甲癸者\", 辛午 \"壬己并用\")은 통용표 순서를 둡니다."
reason = "원전 우선(D120). 정리 문장은 원문이 스스로 내린 결론이라 첫 문장보다 앞섭니다(#625, 사용자 결정 2026-11-11). 나란히 말하는 칸의 순서는 원문이 정하지 않아 명리일기 선택입니다. 앱 근거에는 순서 이야기를 넣지 않습니다(D121). 정리 문장이 없는 乙申은 순서를 가장 분명히 말하는 \"七月喜己土为用…己土必不可少\"를 따랐고, 용신 문장이 없는 丁酉는 같은 계절 七月丁 문장을 인용으로 빌렸습니다(core 판단, C39)."
when = "조후 방식(JOHU, JOHU_NEUTRAL)일 때 표 첫 글자."
decisions = ["D7", "C37", "C39"]
source_status = "principle_selected"

[[items.sources]]
ref = "gungtong-bogam/johu_evidence#*"
work = "窮通寶鑑"
section = "일간과 달마다의 조후 항목(예: 正月甲, 三冬丁)"
quote = "칸마다 다릅니다(120칸, core/evidence_sources.json)."
meaning = "그 일간이 그 달에 났을 때 먼저 쓸 글자를 적은 표입니다."
interpretation = "표의 첫 글자만 쓰고, 둘째 이하 글자는 쓰지 않습니다. 일부 칸은 그 달 항목이 없어 계절 총론으로 대신합니다(evidence_level season). 인용(quote)은 첫 문장, 또는 용신을 말하는 문장으로 고른 문장입니다(quote-choices.json, #625). 丁酉의 인용은 앞 달(七月丁) 항목에서 빌린 문장이고 근거 note가 이를 밝힙니다."

[[items.sources]]
ref = "gungtong-bogam/five_elements#balance_principle"
work = "窮通寶鑑"
section = "五行總論"
quote = "高者抑之使平，下者举之使崇，或益其不及，或损其太过。所以贵在折衷，归於中道"
meaning = "높은 것은 눌러 고르게 하고 낮은 것은 들어 올려, 모자라면 더하고 넘치면 덜어 가운데로 돌린다."
interpretation = "어느 오행으로 덜고 더할지(인성, 식상, 재성, 관성 중 가장 약한 것)는 원문에 없고 명리일기가 정했습니다."

[[items]]
id = "natal_shinsal"
group = "natal"
name = "원국 신살"
summary = "원국 안에 있는 신살 열아홉(천을귀인, 도화, 역마, 화개, 양인, 공망과 D124 열셋)을 찾고, 그 가운데 오늘 태그로 쓰는 아홉의 지지를 데일리 발동 판정에 넘깁니다."
decisions = ["D13", "C24", "D124", "C40", "C42"]
code = ["chart/shinsal.py", "constants/shinsal.py", "constants/gwiin.py"]
evidence_rules = []
message_keys = []

[items.steps]
basis = "천을귀인과 양인은 일간, 도화, 역마, 화개는 연지와 일지 각각, 공망은 일주로 신살 지지를 정합니다. D124 열셋은 아래 규칙의 기준 자리(월지, 연간, 연지, 일주, 천간 순서)로 정합니다."
today = "원국 표에서는 쓰지 않습니다. 데일리는 오늘 지지가 신살 지지면 발동으로 봅니다(태그 항목)."
output = "원국 신살 목록(대표 자리와 걸친 자리 전부)과 오늘 태그 아홉의 신살 지지 집합."
evidence = "원국 표에는 근거를 따로 내지 않습니다. 발동 태그와 개인 해석에서 근거가 붙습니다."
params = "개인 해석 personal.shinsal.*의 키가 됩니다."

[[items.rules]]
kind = "base"
text = "천을귀인: 甲戊庚 丑未, 乙己 子申, 丙丁 亥酉, 辛 寅午, 壬癸 巳卯. 도화, 역마, 화개는 삼합 그룹으로, 공망은 일주가 속한 순으로 정합니다."
reason = "신살 표 그대로입니다."
when = "모든 원국. 시간 모름이면 시지는 뺍니다."
decisions = ["C24"]
source_status = "source"

[[items.rules]]
kind = "added"
text = "D124 열셋. 천덕(월지, 천간 또는 申亥寅巳), 월덕(월지 삼합, 丙甲壬庚), 금여(연간 祿 앞 두 자리), 암록(연간 祿과 육합), 고신과 과숙(연지 방합 다음과 앞), 구교(연지 앞뒤 세 자리), 천라지망(戌亥, 辰巳), 괴강, 십악대패, 음착양차(일주), 삼기(乙丙丁, 甲戊庚 順布, 연월일 또는 월일시). 연지 기준 신살은 연지 자리 자신을 보지 않습니다."
reason = "원문 조목의 정의 그대로입니다. 금여와 암록은 원문 예(如甲子人, 甲生人)대로 연간으로 보고, 한국 통용인 일간 기준은 원문을 찾지 못해 쓰지 않습니다(D120)."
when = "모든 원국. 시간 모름이면 시주 자리는 뺍니다."
decisions = ["D124", "C40"]
source_status = "source"

[[items.rules]]
kind = "added"
text = "원진은 한국 통용 쌍(子未, 丑午, 寅酉, 卯申, 辰亥, 巳戌)을 남녀 구분 없이 연지 기준으로 씁니다."
reason = "원문 「論元辰」은 남녀를 나누고 이 쌍은 원문의 남자 쪽과 같습니다. 원전 우선(D120)의 의도적 예외이고, 근거 원전 note와 설명에 차이를 밝힙니다(D121의 예외)."
when = "원진."
decisions = ["D124"]
source_status = "principle_selected"

[[items.rules]]
kind = "added"
text = "구교의 두 자리는 성별과 무관하고, 어느 자리가 勾이고 絞인지는 연간 음양과 성별로 정해 개인 해석 part(GOU, JIAO)로 냅니다."
reason = "원문 「論勾絞」이 남녀로 勾과 絞를 나눕니다(D124 ④)."
when = "구교."
decisions = ["D124", "C40"]
source_status = "source"

[[items.rules]]
kind = "added"
text = "십악대패는 첫 열거의 乙丑을 元白經 문단대로 己丑으로 읽습니다. 삼기의 辛壬癸는 넣지 않습니다."
reason = "乙丑은 祿入空亡에 맞지 않고 같은 조목의 다른 문단이 己丑입니다. 辛壬癸는 원문이 其說無據라 합니다."
when = "십악대패, 삼기."
decisions = ["C40"]
source_status = "principle_selected"

[[items.rules]]
kind = "added"
text = "길흉 분류(#1065). 길: 천을귀인, 천덕, 월덕, 금여, 암록, 삼기, 역마. 흉: 고신, 과숙, 원진, 구교, 천라지망, 십악대패, 음착양차, 도화. 섞임: 양인, 공망, 화개, 괴강. 흉 신살 설명 끝의 마무리 줄(D124 ⑦)은 흉과 섞임 열둘에 붙입니다."
reason = "원문 조목이 그 신살을 길로 보는지 흉으로 보는지로 나눴습니다. 길이나 흉을 말하면서 단서(합을 만나면 길, 길신이 도우면 길 등)만 붙인 것은 본문 쪽으로 두고, 원문이 같은 무게로 양쪽을 말하는 것만 섞임으로 둡니다. 섞임은 결과가 원국 전체에 달렸다는 뜻이라 \"신살만으로 판단하지 않는다\"는 마무리 줄과 맞아 붙입니다. 마무리 줄 원문(若專論神煞則誣矣)은 길흉을 가리지 않는 말이고, 흉에만 붙이는 것은 D124 ⑦의 선택입니다."
when = "원국 신살 개인 해석과 오늘 태그 설명."
decisions = ["D124", "C42"]
source_status = "principle_selected"

[[items.sources]]
