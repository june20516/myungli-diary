# ---------------------------------------------------------------------------

[[inconsistencies]]
id = "direction_no_shift"
items = ["direction", "color", "number"]
text = "같은 오행 행운 값인데 색은 12운성 변역을 하고 숫자는 색을 따르지만, 방향은 바탕 오행 그대로입니다(평범한 날은 길신 방위)."
intent = "intended"
intent_note = "의도. 변역 원문은 색(形色)만 말합니다."
continuity = "있음. 같은 행운 칩 줄이라 같은 방식을 기대할 수 있습니다."
disclosure = "부족. 색 근거 문장이 옛 \"용신 오행\" 문장입니다."
handling = "keep_and_disclose"
handling_note = "그대로 두고, writing 원고에서 \"색만 원전 변역, 방향은 용신 그대로\"를 밝힙니다."
issues = ["#978", "#971"]

[[inconsistencies]]
id = "focus_time_separate_scoring"
items = ["focus_time"]
text = "집중 시간은 바탕 오행 하나와 날의 성격을 쓰지 않고, 시진마다 택일 원전(用時法, 論相主) 등급으로 줄 세웁니다. 사람 기준은 원국 일간이 아니라 태어난 해입니다(D122). D122 전에는 원전 없는 가중치였고 1년 내내 같은 시간인 사람이 있었습니다."
intent = "intended"
intent_note = "의도. 시 고르기도 원문(協紀辨方書 用時法)에서 별도 법입니다."
continuity = "약함. 시간은 다른 항목으로 읽힙니다."
disclosure = "있음."
handling = "keep"
handling_note = "D122로 정리했습니다. 별도 체계는 원전(시 고르기 법)을 따른 의도라 그대로 둡니다."
issues = ["#980"]

[[inconsistencies]]
id = "role_value_sets"
items = ["color", "direction", "personal_reading"]
text = "오행 역할 값 집합이 자리마다 다릅니다. 색은 YONGSIN, TONGGWAN, 방향은 YONGSIN, TONGGWAN, HUISIN, 개인 해석은 YONGSIN, HUISIN, GISIN, NEUTRAL입니다. 통관과 희신은 같은 오행인데 이름이 갈립니다."
intent = "intended"
intent_note = "의도. 통관은 기신의 날에만 쓰는 역할입니다."
continuity = "약함. 앱은 \"이어 주는 오행\"으로 풀어 씁니다."
disclosure = "있음."
handling = "keep"
handling_note = "그대로 둡니다."
issues = ["#988"]

[[inconsistencies]]
id = "no_source_marking"
items = ["focus_time", "calendar_luck", "fortune_guide", "personal_reading", "tags"]
text = "원전이 없는 판정을 표시하는 방식이 둘이었습니다. 태그는 source_ref를 빈 값으로 두고(C28, D108 ④), 집중 시간, 달력 길흉, 총운 본문, 개인 해석은 공통 근거 balance_principle을 붙였습니다(C8). #998, D122로 개인 해석, 총운 본문, 집중 시간은 실제 조목을, 달력 길흉은 빈 값을 내어 하나로 합쳤습니다(C35, C36). balance_principle은 용신 억부의 실제 근거로만 남습니다."
intent = "missing"
intent_note = "누락."
continuity = "있음. 같은 근거 시트에 나옵니다."
disclosure = "없음. 관련이 적은 임시 원전(五行總論 균형 원리)이 나옵니다."
handling = "merge"
handling_note = "임시 원전을 없애고 하나의 방식(실제 조목 또는 빈 값)으로 합쳤습니다."
issues = ["#998"]

[[inconsistencies]]
