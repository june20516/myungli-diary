text = "숫자 원전 대목의 生旺加倍，死绝减半(생왕이면 배, 사절이면 반)은 쓰지 않고, 같은 생왕사절을 색에서는 변역으로 씁니다."
intent = "intended"
intent_note = "의도(D119 ③, #979)."
