params = "개인 해석 personal.shinsal.*의 키가 됩니다."

[[items.rules]]
kind = "base"
text = "천을귀인: 甲戊庚 丑未, 乙己 子申, 丙丁 亥酉, 辛 寅午, 壬癸 巳卯. 도화, 역마, 화개는 삼합 그룹으로, 공망은 일주가 속한 순으로 정합니다."
reason = "신살 표 그대로입니다."
when = "모든 원국. 시간 모름이면 시지는 뺍니다."
