evidence = "첫째 tags/select(선택 결과, 원전 없음), 그 뒤 태그마다 하나(합은 합 종류마다). 원전이 없는 태그는 source_ref가 빈 값입니다(C28)."
params = "태그 키에는 매개변수가 없습니다."

[[items.rules]]
kind = "base"
text = "그룹 순서: ① 합충(일지 충, 월지 충, 그 밖 충, 합) ② 십성 쏠림(관성, 비겁, 재성, 식상, 인성) ③ 신살(공망, 역마, 화개, 도화, 천을귀인, 고신, 과숙, 원진). 이 순서로 전체 목록을 세운 뒤, 길 태그(합, 재성, 인성, 식상 쏠림, 천을귀인, 보조 태그)가 있으면 그 가운데 맨 앞의 것 하나만 목록 맨 앞으로 옮깁니다. 나머지는 순서 그대로이고 앞에서 두 개를 대표로 둡니다. 일기에 저장되는 전체 목록도 이 순서입니다."
reason = "묶음 안의 흉 → 중립 → 길 순서는 추길피흉에서 왔지만(C9), 오늘 이야기는 길을 앞세우는 것이 사용자가 바라는 바라 첫째 대표만 길로 바꿉니다(D125). 둘째 자리는 원래 순서라 일지 충, 월지 충 같은 큰 흉이 대표에서 모두 빠지는 날은 없습니다(표본 0%). D124 새 셋은 원전에 하루 근거가 있는 기존 신살보다 늘 뒤입니다. 원전이 없는 명리일기 순서라 앱 근거에는 드러내지 않습니다(D121)."
when = "모든 날."
decisions = ["C9", "C29", "D125", "C41", "C43"]
source_status = "principle_selected"

[[items.rules]]
kind = "added"
text = "도화 태그는 중립입니다. 길 먼저(D125)로 앞세우지 않고, 신살 묶음 안 자리(역마, 화개 다음)는 그대로입니다."
reason = "원문 「論咸池」는 도화를 흉(非吉煞)으로 보고, 한국 통용 풀이는 매력과 인기로 읽습니다. 원전에 없는 길로 앞세우지도, 흉으로 단정하지도 않으려 중립에 둡니다. 원전 우선(D120)의 의도적 예외입니다(사용자 결정 2026-11-13, #1065). 원국 설명의 마무리 줄은 원문대로 흉 쪽에 붙입니다(D124 ⑦)."
