[[background]]
order = 1
title = "천간과 지지"
body = """시간을 적는 두 가지 글자입니다. 천간은 열 개(甲乙丙丁戊己庚辛壬癸), 지지는 열두 개(子丑寅卯辰巳午未申酉戌亥)입니다. \
천간 하나와 지지 하나를 짝지은 것을 간지라 하고, 해, 달, 날, 시를 모두 간지로 적습니다. 그날의 간지를 일진이라고 합니다."""

[[background]]
order = 2
title = "오행"
body = """모든 글자는 다섯 기운(오행) 중 하나에 속합니다. 목(나무), 화(불), 토(흙), 금(쇠), 수(물)입니다. \
천간과 지지는 다시 양과 음으로 나뉩니다(예: 甲은 양의 목, 乙은 음의 목). 지지 안에는 천간 몇 개가 숨어 있고(지장간), 그중 대표가 정기입니다."""

[[background]]
order = 3
title = "상생과 상극"
body = """오행은 서로 돕거나 누릅니다. 돕는 순서(상생)는 목 → 화 → 토 → 금 → 수 → 목, 누르는 순서(상극)는 목 → 토 → 수 → 화 → 금 → 목입니다. \
이 지도에서 "나를 생하는 오행", "내가 극하는 오행" 같은 말은 이 두 순서를 가리킵니다."""

[[background]]
order = 4
title = "원국과 일간"
body = """태어난 해, 달, 날, 시의 간지 여덟 글자가 원국(사주팔자)입니다. 평생 바뀌지 않습니다. \
그중 태어난 날의 천간이 일간이고, "나"를 뜻합니다. 다른 글자는 모두 일간과의 관계로 읽습니다. 시간을 모르면 시의 두 글자를 빼고 여섯 글자로 봅니다."""

[[background]]
order = 5
title = "십성"
body = """다른 글자가 일간과 어떤 관계인지에 붙인 이름 열 가지입니다. 같은 오행은 비겁, 내가 생하면 식상, 내가 극하면 재성, \
나를 극하면 관성, 나를 생하면 인성이고, 음양이 같은지 다른지로 다시 둘씩 나뉩니다. 다섯 묶음은 태그와 총운에서 그대로 씁니다."""

[[background]]
order = 6
title = "신강과 신약"
body = """원국에 일간을 돕는 기운(비겁과 인성)이 많으면 신강, 적으면 신약입니다. 명리일기는 자리마다 무게를 달리해(월지가 가장 무거움) \
점수를 매기고 다섯 등급으로 나눕니다."""

[[background]]
order = 7
title = "용신, 희신, 기신, 통관"
body = """원국의 치우침을 바로잡는 데 가장 필요한 오행이 용신입니다. 용신을 생해 돕는 오행이 희신, 용신을 극해 해치는 오행이 기신입니다. \
기신과 용신 사이를 이어 주는 오행(기신이 생하고 용신을 생함)이 통관이고, 정의상 희신과 같은 오행입니다. \
명리일기는 여름과 겨울 태생은 기후(조후)를 먼저 보고, 그 밖은 강약을 덜고 더하는 억부로 용신을 정합니다."""

[[background]]
order = 8
title = "억부와 조후"
body = """용신을 고르는 두 가지 법입니다. 억부(抑扶)는 일간이 강하면 덜어 내는 오행을, 약하면 돕는 오행을 용신으로 삼는 법이고, 그래서 신강약을 먼저 잽니다(원전 窮通寶鑑 五行總論 "넘치면 덜고 모자라면 더한다"). 조후(調候)는 계절 온도를 맞추는 법으로, 여름생은 식히고 겨울생은 데우는 오행을 먼저 씁니다. 명리일기는 여름과 겨울 태생이면서 그 계절 기운이 지나치면 조후를 먼저 보고(窮通寶鑑 조후표의 첫 글자), 강약이 중간이어도 조후표를 따릅니다. 그 밖에는 억부로, 약하면 인성(나를 생하는 오행), 강하면 식상, 재성, 관성 중 원국에 가장 적은 오행을 용신으로 씁니다."""

[[background]]
order = 9
title = "일진과 날의 성격"
body = """일진은 모두에게 같지만, 원국과 맞대 보면 사람마다 다른 날이 됩니다(D13). 오늘 지지가 내 천을귀인이면 귀인의 날, \
일진에 기신 오행이 있으면 기신의 날, 용신 오행만 있으면 용신의 날, 그 밖은 평범한 날입니다. 행운 값과 총운은 대부분 이 성격에서 시작합니다."""

[[background]]
order = 10
title = "12운성"
body = """천간의 기운이 열두 지지를 지나며 태어나고 자라고 늙고 사라지는 단계를 열둘로 나눈 것입니다. \
長生, 沐浴, 冠帶, 臨官, 帝旺, 衰, 病, 死, 墓, 絶, 胎, 養 순입니다. 원국에서는 일간 기준으로, 행운 색에서는 바탕 오행의 양간 기준으로 오늘 일지의 자리를 봅니다."""

[[background]]
order = 11
title = "합, 충, 형"
body = """글자끼리 맺는 관계입니다. 합은 서로 끌어 묶이는 관계(천간합 다섯, 지지육합 여섯), 충은 정면으로 부딪치는 관계(지지충 여섯, 예: 子午), \
형은 서로 해치는 관계입니다. 오늘 지지가 한 글자와 합하면서 다른 글자와 충하면 합에 끌려 충을 잊는다고 보아 충을 무효로 둡니다(탐합망충)."""

[[background]]
order = 12
title = "신살"
body = """특정 글자 조합에 붙은 별칭입니다. 천을귀인(귀한 도움), 도화(사람을 끄는 기운), 역마(움직임), 화개(혼자 깊어짐), 양인(날카로움), 공망(비어 있음) 등이 있습니다. \
원국에 있는 신살은 원국 표에, 오늘 지지가 내 신살 지지와 같으면 그날 발동한 태그로 보입니다."""

[[background]]
order = 13
title = "원전과 명리일기 해석"
body = """원전은 窮通寶鑑, 三命通會, 滴天髓, 協紀辨方書 같은 옛 책의 조목입니다. 지도는 규칙 줄마다 원전 상태를 다섯으로 나눕니다. \
원전(규칙이 원문에 있음), 원전 개념 + 명리일기 수치화(개념은 원문, 가중치와 경계값은 명리일기), \
원전 원리 + 명리일기 선택(원리는 원문, 원문이 정하지 않은 고르는 법은 명리일기), 제품 규칙(명리 주장이 아닌 앱 설계), \
원전 없음(명리 주장인데 원문이 없음, 십성 쏠림 태그)입니다. 이 분류는 내부 기록이고, 앱 근거는 의혹이 없을 만큼만 밝힙니다(D121)."""

