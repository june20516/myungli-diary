version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: queries/auth.sql
    gen:
      go:
        package: authdb
        out: ../internal/auth/authdb
        sql_package: pgx/v5
        emit_interface: true
        overrides: &overrides
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type: github.com/google/uuid.NullUUID
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
