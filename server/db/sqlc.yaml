version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: queries/auth.sql
    gen:
      go:
        package: authdb
        out: ../internal/auth/authdb
        sql_package: pgx/v5
        emit_interface: true
        overrides: &overrides
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type: github.com/google/uuid.NullUUID
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
  - engine: postgresql
    schema: migrations
    queries: queries/account.sql
    gen:
      go:
        package: accountdb
        out: ../internal/account/accountdb
        sql_package: pgx/v5
        emit_interface: true
        overrides: *overrides
  - engine: postgresql
    schema: migrations
    queries: queries/profile.sql
    gen:
      go:
        package: profiledb
        out: ../internal/profile/profiledb
        sql_package: pgx/v5
        emit_interface: true
        overrides: *overrides
  - engine: postgresql
    schema: migrations
    queries: queries/cache.sql
    gen:
      go:
        package: cachedb
        out: ../internal/fortune/cachedb
        sql_package: pgx/v5
        emit_interface: true
        overrides: *overrides
