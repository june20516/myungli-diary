  /v1/calendar/{year}/{month}:
    parameters:
      - name: year
        in: path
        required: true
        schema:
          type: integer
          minimum: 1900
          maximum: 2099
      - name: month
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 12
    get:
      operationId: getCalendar
      summary: 달력
      description: |
        한 달의 날짜별 일진, 음력, 절기, 길흉 수준을 돌려줍니다. `year`·`month`가 정수가 아니거나 스키마 범위(1900~2099, 1~12) 밖이면 400 `request.invalid`, 스키마 범위 안이지만 D41 지원 범위(양력 1900-01-31 ~ 2099-12-31)를 벗어나면 422 `date.out_of_range`입니다. 프로필이 없으면 409 `profile.required`입니다.

        달력은 한 달 전체가 지원 범위 안인 달만 줍니다. 그래서 첫 달은 1900-02, 마지막 달은 2099-12이고, 1900-01은 1900-01-31이 지원 범위 안이어도 422 `date.out_of_range`입니다(#248).

        캐시: `ETag`는 없습니다. 응답은 출생 정보·언어·`rulesetVersion`·문장 시드로 정해지므로 app은 달마다 캐시해도 됩니다.
        프로필(출생 정보·언어)이나 `rulesetVersion`이 바뀌면 캐시를 버립니다. 문장 개선(시드 갱신)은 다음 무효화 때 반영됩니다.
      responses:
        '200':
          description: 한 달 달력
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calendar'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        default:
          $ref: '#/components/responses/UnexpectedError'

