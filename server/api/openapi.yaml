  /v1/diaries:
    get:
      operationId: listDiaries
      summary: 일기 목록
      description: |
        날짜 범위와 태그로 일기를 찾습니다. 날짜 내림차순이고, 같은 날짜 안에서는 작성 순(`createdAt` 오름차순)입니다.
        `limit`은 일기 편수라 한 날짜의 일기가 두 쪽에 나뉠 수 있습니다. 날짜 하나의 일기는 `from`과 `to`에 같은 날짜를 넣어 받습니다.
        합친 유저 계정은 한 날짜에 10편을 넘을 수 있으니(D83 ④) 날짜 하나를 받을 때도 `nextCursor`를 따라갑니다.
        `from`이 `to`보다 늦으면 빈 목록입니다.
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: tag
          in: query
          required: false
          description: 태그 키. 그 태그가 붙은 일기만 돌려줍니다.
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          description: 앞 응답의 `nextCursor`
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        '200':
          description: 일기 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiaryList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      operationId: createDiary
      summary: 일기 쓰기
      description: |
        일기를 한 편 씁니다. 하루에 살아 있는 일기는 10편까지입니다. 그날 첫 편이면 날짜 기록(태그·`rulesetVersion`·가이드 질문)을 함께 만듭니다.
        같은 `Idempotency-Key`로 다시 보내면 24시간 동안 같은 응답입니다.
        그날 살아 있는 일기가 이미 10편이면 422 `diary.day_full`, 오늘 이후 날짜는 422 `diary.future_date`, 지원 범위(D41) 밖 날짜는 422 `date.out_of_range`입니다.
        프로필이 없으면 409 `profile.required`입니다.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiaryInput'
      responses:
        '201':
          description: 새로 쓴 일기
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Diary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        default:
          $ref: '#/components/responses/UnexpectedError'

