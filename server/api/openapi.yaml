  /v1/schedules/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateSchedule
      summary: 일정 수정
      description: |
        보낸 필드만 바꿉니다(JSON Merge Patch).
        `allDay`를 true로 바꾸면 `time`이 지워집니다. 짝 위반(`allDay`·`time`)은 422 `request.inconsistent`입니다(`SchedulePatch` 참고).
        `memo`는 빈 문자열을 보내 지웁니다.
        없는 일정(남의 일정 포함)은 404 `schedule.not_found`입니다.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/SchedulePatch'
      responses:
        '200':
          description: 고친 일정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
