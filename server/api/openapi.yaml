openapi: 3.1.0
info:
  title: 명리일기 API
  version: 1.1.0
  description: |
    명리일기 server가 app에 제공하는 REST API v1 계약입니다. 1.0.0에서 freeze했습니다(마일스톤 S3).

    호환과 버전
    * v1을 freeze(마일스톤 S3)한 뒤에는 하위 호환 변경만 합니다. 하위 호환 변경은 operation 추가, 선택 요청 필드 추가, 응답 필드 추가,
      아래 "열린 enum"의 값 추가, problem code 추가, 응답 헤더 추가입니다. app은 모르는 응답 필드와 헤더를 무시합니다.
    * 하위 호환을 깨야 하면 `/v2` 경로를 새로 엽니다. v1에서는 하위 호환을 깨는 변경을 하지 않습니다.
    * `info.version`은 freeze 때 `1.0.0`이 되고, 그 뒤 하위 호환 추가마다 minor를, 설명만 바꾸면 patch를 올립니다.
    * 열린 enum: 값이 늘어날 수 있는 응답 enum입니다. app은 모르는 값이 와도 응답 전체를 실패로 보지 않고 그 항목만 건너뛰거나 기본 표시를 씁니다.
      `NoticeCode`, `ShinsalKind`, `RelationKind`, `PersonalReading.kind`, `FocusSlot.reasons`의 항목, `SlotText.variant`, `Insight.source`,
      `ConsentDocument.document`, `Problem.code`, `LoginProvider`, `PurchaseStatus`, `YongsinMethod`, `SlotText.reaction`, `Language`입니다. 그 밖의 enum은 닫힌 enum이라 값을 더하면 하위 호환을 깨는 변경으로 봅니다.

    공통 규약
    * JSON 필드는 camelCase입니다. 단, Apple이 보내는 `appleCallback`의 form 필드는 Apple이 정한 이름을 그대로 씁니다.
    * 로그인(`loginKakao`·`loginApple`·`loginLine`·`loginGoogle`)과 `linkIdentity`의 nonce는 제공자에게 SHA-256 hex를, server에 원문을 보냅니다.
      server는 `id_token`의 `nonce`가 원문의 SHA-256 hex인지만 보고 일회용으로 기록하지 않습니다. Google은 app 프로세스마다 nonce가 하나라 같은 원문이 여러 번 올 수 있습니다.
    * 날짜는 `YYYY-MM-DD`(`format: date`), 시각은 RFC 3339(`format: date-time`)입니다.
    * 시각(`date-time`)은 기본이 UTC이고, 화면 표시용 시각(`FocusSlot.start`·`end`, `CalendarDay.solarTerm.at`)만 프로필 현재 시간대의 offset으로 보냅니다.
    * 사용자의 선택(예: 출생 시각 모름, 출생지 건너뜀, 알림 끔)은 상태 필드로 보냅니다. 필드를 빼거나 `null`을 보내는 것으로 뜻을 담지 않습니다.
      생략 가능한 필드를 생략하면 "값 없음"만 뜻합니다. 이 계약에는 `null` 값이 없습니다.
    * PATCH(`application/merge-patch+json`)에서 필드가 없으면 "바꾸지 않음" 하나만 뜻합니다. `null`로 필드를 지우지 않습니다.
    * 요청 본문 상한은 1 MiB입니다. 넘으면 413 `request.too_large`입니다.
    * 언어는 bearer 요청이면 프로필의 `language`, 그 밖이면 `Accept-Language` 헤더를 씁니다. 지원 언어는 `ko`·`en`·`ja`이고, 헤더의 q값 순서로 첫 지원 언어를 고릅니다(`ko-KR`은 `ko`). 맞는 언어가 없거나 헤더가 없으면 기본 언어는 `en`입니다. `Accept-Language`는 middleware가 읽으므로 operation parameter로 적지 않습니다.
    * 생성하는 POST(`createSchedule`, `registerDevice`, `createDiary`)와 `mergeAccounts`는 `Idempotency-Key` 헤더를 받습니다. 24시간 동안 같은 키에는 같은 응답을 돌려줍니다.
    * 문장 필드는 조각 배열(`RenderedText`)입니다. 화면의 고정 UI 문구는 app 몫입니다.
    * 목록은 cursor 방식입니다(`cursor`, `limit`, 응답의 `nextCursor`). `nextCursor`가 없으면 마지막 쪽입니다.
      cursor는 불투명한 값이라 app은 해석하거나 만들지 않고, 받은 값을 같은 필터와 함께 그대로 보냅니다. 읽지 못하는 cursor는 400 `request.invalid`(field `cursor`)입니다.
      기간(`from`·`to`)으로 받는 목록(`listSchedules`)은 cursor 없이 범위 안을 한 번에 돌려줍니다. 검색(`listCities`)은 cursor 없이 `limit`까지만 돌려줍니다.
    * 모든 응답에는 `X-Trace-Id` 헤더가 있고 `Problem.traceId`와 같은 값입니다. 문의를 받을 때 이 값으로 server 로그를 찾습니다.

    오류
    * 모든 오류는 RFC 9457 `application/problem+json`(`Problem`)입니다. app은 `code`를 보고 자기 UI 문구로 보여 줍니다. `title`은 개발자용 영어입니다.
    * `type`은 `https://api.myungli.app/problems/<code>`입니다. 도메인은 배포 전에 바뀔 수 있으므로 app은 `type`이 아니라 `code`로 구분합니다.
    * 400과 422의 경계: 스키마로 표현되는 형식·범위 위반(타입, 필수 필드, `enum`, `pattern`, 길이, `minimum`·`maximum`, `format`)은
      모두 400 `request.invalid`이고 `errors[].code`(위반한 keyword)로 구분합니다. 예를 들어 알림 시각의 분이 5의 배수가 아니면 `pattern` 위반 400입니다.
    * 422는 스키마로 표현할 수 없는 의미 검사에만 씁니다.
      * 형식은 맞지만 D41 지원 범위(양력 1900-01-31 ~ 2099-12-31) 밖인 날짜: `date.out_of_range`, 출생 정보는 `birth.out_of_range`
      * 정수 필드 객체 `LunarOrSolarDate`가 달력에 없는 날짜(예 양력 2월 31일): `date.invalid`.
        `format: date` 문자열(경로 parameter `date`, `ScheduleInput.date`·`SchedulePatch.date` 등)의 없는 날짜(예 `2026-02-30`)는
        스키마 형식 위반이라 422가 아니라 400 `request.invalid`입니다.
      * 상태-값 짝 위반: `request.inconsistent`. `errors[].field`는 JSON Pointer, `errors[].code`는 상태가 요구하는 값이 없으면
        `required_by_status`, 상태가 허용하지 않는 값이 있으면 `forbidden_by_status`입니다. 대상은 `BirthTime`(`status`·`value`),
        `BirthPlace`(`status`·`cityId`), 양력(`calendar: solar`)인데 `isLeapMonth`가 true, `NotificationSetting`(`status`·`time`),
        `ScheduleInput`·`SchedulePatch`(`allDay`·`time`)입니다.
      * 엔진 판정과 업무 규칙: 예 `birth.invalid`, `diary.future_date`, 호칭 규칙 위반, `idempotency.mismatch`

    근거 열람 권한 (D60)
    * 근거 열람 권한(`insight`)이 없으면 evidence 깊이의 해석(판정 근거, 원전, 원국 개인 해석, 용신 근거)을 응답에 담지 않고 `evidenceAccess: locked`로 표시합니다.
      근거가 원래 없는 것과 잠겨서 빠진 것을 `evidenceAccess`로 구분합니다. surface·explain과 사주 표·만세력·대운 표의 데이터는 잠그지 않습니다.
    * evidence 깊이의 문장(`Evidence.basis`·`Evidence.source`)은 `evidence[]`에 들어 있어 함께 빠집니다.
      explain 깊이의 문장(`SlotText.todayReason`, `Glossary.meanings`)과 용어 한자(`Glossary.hanja`)는 잠그지 않습니다.
servers:
  - url: /
security:
  - bearerAuth: []

paths:
  /v1/auth/kakao:
    post:
      operationId: loginKakao
      summary: 카카오 로그인
      description: 카카오 OIDC `id_token`과 nonce 원문을 검증하고 자체 토큰을 발급합니다. 처음 보는 계정이면 새로 만듭니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KakaoLoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/auth/apple:
    post:
      operationId: loginApple
      summary: Apple 로그인
      description: |
        Apple `identity_token`(`idToken`), `authorization_code`, nonce 원문을 검증하고 자체 토큰을 발급합니다.
        iOS 전용입니다. Android는 `appleCallback`과 `completeAppleWebLogin`을 씁니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleLoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/auth/apple/callback:
    post:
      operationId: appleCallback
      summary: Apple 웹 로그인 콜백 (Android)
      description: |
        Android의 Apple 웹 흐름에서 Apple이 form_post로 부르는 주소입니다. app이 직접 부르지 않습니다.
        server는 Apple의 값을 직접 검증하고 일회용 교환 코드를 만든 뒤 app link로 303 이동시킵니다. app은 그 교환 코드로 `completeAppleWebLogin`을 부릅니다.
        form 필드 이름은 Apple이 정한 그대로입니다.
        Apple의 `code`·`id_token`·`user`는 Location에 넘기지 않습니다. `state`가 없거나 비어 있으면 400입니다.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [state]
              properties:
                error:
                  type: string
                  description: 사용자가 취소하면 Apple이 보내는 오류 코드, 예 `user_cancelled_authorize`
                code:
                  type: string
                  description: Apple authorization code
                id_token:
                  type: string
                  description: Apple identity token
                state:
                  type: string
                  minLength: 1
                user:
                  type: string
                  description: 처음 로그인할 때만 Apple이 보내는 사용자 정보(JSON 문자열)
      responses:
        '303':
          description: |
            app link로 이동합니다. `Location`은 `<APP_LINK_BASE>/auth/apple?exchange=<교환 코드>&state=<state>`이고,
            실패하면 `<APP_LINK_BASE>/auth/apple?error=<값>&state=<state>`입니다.
            `error` 값은 `user_cancelled_authorize`, `token_invalid`, `provider_unavailable`, `invalid_request`, `server_error`입니다.
            Apple이 보낸 토큰·authorization code·사용자 정보는 Location에 넘기지 않습니다(`appleCallback` 설명 참고).
          headers:
            Location:
              $ref: '#/components/headers/Location'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/auth/apple/web:
    post:
      operationId: completeAppleWebLogin
      summary: Apple 웹 로그인 완료 (Android)
      description: |
        `appleCallback`이 app link로 넘긴 교환 코드와 nonce 원문으로 자체 토큰을 발급합니다.
        교환 코드는 일회용이고 수명이 2분입니다. nonce가 틀려도 교환 코드는 소진되지 않습니다.
        교환 코드가 없거나 만료됐거나 이미 썼거나 nonce가 맞지 않으면 401 `auth.exchange_invalid`이며, 이 경우들을 구분하지 않습니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleWebLoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/auth/line:
    post:
      operationId: loginLine
      summary: LINE 로그인
      description: LINE OIDC `id_token`과 nonce 원문을 검증하고 자체 토큰을 발급합니다. 흐름은 `loginKakao`와 같습니다. 처음 보는 인증 계정이면 유저 계정을 새로 만듭니다. 삭제한 유저 계정의 인증 계정은 남지 않으므로 같은 인증 계정으로 다시 로그인하면 새 유저 계정입니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LineLoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/auth/google:
    post:
      operationId: loginGoogle
      summary: Google 로그인
      description: Google OIDC `id_token`과 nonce 원문을 검증하고 자체 토큰을 발급합니다. 흐름은 `loginKakao`와 같습니다. 처음 보는 인증 계정이면 유저 계정을 새로 만듭니다. 삭제한 유저 계정의 인증 계정은 남지 않으므로 같은 인증 계정으로 다시 로그인하면 새 유저 계정입니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/auth/refresh:
    post:
      operationId: refreshToken
      summary: 토큰 갱신
      description: refresh token을 새 토큰 쌍으로 바꿉니다. 이미 쓴 refresh token이 첫 사용 뒤 30초 안에 다시 오고 그 다음 token이 아직 쓰이지 않았으면 응답 유실 재시도로 보고 새 토큰 쌍을 줍니다(앞서 준 토큰은 폐기). 이렇게 대체된 토큰이 다시 오거나 그 밖의 재사용이면 탈취로 보고 family 전체를 폐기합니다(401 `auth.refresh_reused`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: 새 토큰 쌍
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/auth/logout:
    post:
      operationId: logout
      summary: 로그아웃
      description: |
        보낸 refresh token의 family를 폐기합니다. 모르는 refresh token이나 다른 계정의 refresh token이면 아무것도 하지 않고 204입니다.
        알림을 멈추려면 로그아웃하기 전에 `deleteDevice`를 부릅니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: 로그아웃 완료
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/me:
    get:
      operationId: getMe
      summary: 내 정보
      description: 유저 계정 id, 동의 필요 여부와 동의할 문서, 프로필 유무, 권한(광고 제거·근거 열람) 상태를 돌려줍니다. 약관 동의 전에도 부를 수 있습니다.
      responses:
        '200':
          description: 내 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
    delete:
      operationId: deleteMe
      summary: 계정 삭제 요청
      description: |
        유저 계정을 바로 삭제합니다. 삭제 대기 기간이 없고 되돌릴 수 없습니다. 그 유저 계정의 프로필, 기록(일기·일정·날짜 기록·반응), 인증 계정 연결, 세션을 지웁니다. 구매와 결제 기록은 법정 보관을 위해 지운 유저 계정 앞으로 남고, 반응은 지우기 전에 유저 계정과 끊긴 문장별 집계에 더합니다.
        카카오·Apple 제공자 허가는 server가 취소를 시도하며, 실패해도 삭제는 성공입니다. LINE·Google 제공자 허가는 server도 app도 취소하지 않습니다(D95).
        같은 인증 계정으로 다시 로그인하면 새 유저 계정이 만들어집니다. 이미 삭제된 유저 계정의 access token은 401입니다.
      responses:
        '204':
          description: 삭제함
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/me/identities:
    get:
      operationId: listIdentities
      summary: 연결된 로그인 제공자 목록
      description: 현재 계정에 붙은 로그인 제공자를 붙인 순서로 돌려줍니다. 제공자 사용자 id(`subject`)는 내보내지 않습니다.
      responses:
        '200':
          description: 연결 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/me/identities/{provider}:
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/LoginProvider'
    post:
      operationId: linkIdentity
      summary: 로그인 제공자 붙이기
      description: |
        현재 계정에 로그인 제공자 하나를 붙입니다. 본문은 그 제공자의 로그인 증명과 같습니다.
        * kakao·line·google: `idToken`과 `nonce`
        * apple(iOS): `idToken`, `authorizationCode`, `nonce`. 로그인과 같이 code를 교환해 refresh token을 받아 새 연결에 저장합니다.
        * apple(Android 웹 흐름): `exchangeCode`와 `nonce`. `appleCallback`이 만든 교환 코드를 `completeAppleWebLogin`과 같은 규칙(일회용, 2분, nonce가 틀려도 소진하지 않음)으로 씁니다.
        경로의 제공자와 본문 조합이 맞지 않으면 400 `request.invalid`입니다(`LinkIdentityRequest` 참고).

        응답
        * 201: 연결이 어디에도 없어 현재 계정에 만들었습니다.
        * 200: 그 연결이 이미 현재 계정에 있어 바꾸지 않았습니다(apple이면 refresh token만 새 값으로).
        * 401 `auth.provider_token_invalid`·`auth.exchange_invalid`: 붙이려는 증명이 틀림. 현재 세션은 유효하니 다시 로그인시키지 않고 붙이기를 다시 시도합니다.
        * 409 `auth.provider_taken`: 현재 계정에 같은 제공자의 다른 사용자 연결이 있습니다.
        * 409 `auth.identity_in_use`: 그 인증 계정이 다른 유저 계정에 연결돼 있습니다. 본문은 일반 `Problem`이고 합치기 토큰은 없습니다. 두 유저 계정을 합치려면 app이 그 인증 계정으로 `previewMerge`를 부릅니다.

        409가 나면 새로 받은 Apple 승인은 저장하지 않고 버립니다. 취소(revoke)하지도 않습니다. Apple revoke는 그 사용자의 앱 승인 전체를 끊어 다른 계정에 저장된 연결까지 무효로 만들기 때문입니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkIdentityRequest'
      responses:
        '200':
          description: 그 연결이 이미 현재 계정에 있음. 붙인 뒤의 연결 목록(`listIdentities`와 같음)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityList'
        '201':
          description: 연결을 만듦. 붙인 뒤의 연결 목록(`listIdentities`와 같음)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 붙일 수 없음. `auth.provider_taken`, `auth.identity_in_use`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
    delete:
      operationId: unlinkIdentity
      summary: 로그인 제공자 떼기
      description: |
        현재 계정에서 로그인 제공자 연결을 지웁니다. 떼면 그 제공자로는 이 계정에 들어오지 못합니다.
        마지막 연결이면 409 `auth.last_identity`, 현재 계정에 그 제공자 연결이 없으면 404 `auth.identity_not_found`입니다.
        카카오·Apple 제공자 허가는 server가 취소를 시도하며, 실패해도 떼기는 성공입니다. LINE·Google 제공자 허가는 server도 app도 취소하지 않습니다(D95).
      responses:
        '204':
          description: 연결을 지움
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/me/merge/preview:
    post:
      operationId: previewMerge
      summary: 계정 합치기 요약
      description: |
        합칠 다른 유저 계정(B)의 로그인 증명을 받아, 현재 유저 계정(A)과 B를 합칠 때 옮겨질 것을 요약하고 합치기 토큰을 발급합니다.
        본문은 `linkIdentity`의 본문에 `provider`를 더한 것이고 검증도 같습니다(`MergePreviewRequest` 참고). Apple은 소유 확인에 id_token만 씁니다.
        Android 웹 흐름의 code 교환으로 받은 refresh token은 저장하지 않습니다.

        응답
        * 200: 증명한 인증 계정이 B에 연결돼 있습니다. 합치기 토큰(`mergeToken`, `expiresAt`)과 요약(`summary`)을 줍니다. 옮길 기록이 없어도 줍니다.
          토큰은 일회용이고 10분 동안 현재 유저 계정(A)의 bearer만 쓸 수 있으며, 증명한 인증 계정을 B에서 떼면 무효가 됩니다. URL에 넣지 않습니다.
        * 400 `request.invalid`: `provider`와 본문 조합이 맞지 않음.
        * 401 `auth.provider_token_invalid`·`auth.exchange_invalid`: 증명이 틀림. 현재 세션은 유효합니다.
        * 422 `merge.same_account`: 증명한 인증 계정이 현재 유저 계정에 이미 연결돼 있습니다.
        * 422 `merge.no_account`: 증명한 인증 계정이 어느 유저 계정에도 연결돼 있지 않습니다. 이 응답은 인증 계정을 연결하지 않으니 app은 `linkIdentity`를 부릅니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergePreviewRequest'
      responses:
        '200':
          description: 두 유저 계정의 요약
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergePreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/me/merge:
    post:
      operationId: mergeAccounts
      summary: 계정 합치기
      description: |
        `previewMerge`가 준 합치기 토큰으로 다른 유저 계정(B)을 현재 유저 계정(A)에 합칩니다. 남는 유저 계정은 언제나 A입니다.
        B의 일기(지운 일기 포함, 하루 10편 상한은 검사하지 않음)·일정·날짜 기록·오늘 문장 선택 기록·반응과 구매를 A로 옮기고, B는 삭제합니다(`deleteMe`와 같이 즉시, 되돌릴 수 없음).
        `profile`은 합친 뒤 쓸 프로필(사주 정보·호칭)입니다. `current`는 A의 것을 그대로 두고, `other`는 B의 것으로 A의 프로필을 바꿉니다.
        같은 날짜에 양쪽 모두 날짜 기록(태그·가이드 질문)이 있으면 고른 프로필 쪽을 남기고, 다른 쪽 일기는 모두 남긴 날짜 기록 아래로 옮깁니다. 일기는 지우지 않습니다.
        고른 쪽 프로필이 없으면(`status`가 `none`) 합친 뒤 A는 프로필이 없습니다.
        인증 계정 연결, 세션, 약관 동의는 옮기지 않습니다. B의 인증 계정 연결은 B와 함께 사라지고 A의 세션은 그대로입니다.
        B의 카카오·Apple 제공자 허가는 server가 취소를 시도합니다. B의 LINE·Google 제공자 허가는 증명에 쓴 것을 포함해 server도 app도 취소하지 않습니다(D95).

        응답은 A의 `Me`입니다. 새 세션을 주지 않으므로 app은 토큰을 바꾸지 않고, 합친 유저 계정 기준으로 캐시·초안을 지운 뒤 `getMe`부터 다시 읽습니다.
        `Idempotency-Key`를 받습니다. 같은 키로 다시 보내면 24시간 동안 처음 응답을 돌려줍니다.
        같은 키의 요청이 처리 중이면 409 `idempotency.in_progress`이고, 잠시 뒤 같은 키로 다시 보냅니다.
        합치기가 끝난 토큰을 같은 유저 계정이 24시간 안에 다시 보내면, 키 없이 보내거나 다른 키로 보내도 다시 합치지 않고 200 `Me`입니다(1.1.0).
        이때 `profile`이 처음과 달라도 처음 합친 결과를 그대로 둡니다. 같은 키에 본문(`profile`)이 다르면 422 `idempotency.mismatch`입니다.
        그래서 응답을 받지 못했으면 같은 토큰과 본문으로 다시 보내고, 200이면 합쳐진 것입니다.
        토큰이 없거나, 만료됐거나, 이미 썼거나, 현재 유저 계정의 토큰이 아니거나, 확인 시점에 조건이 바뀌었으면(B가 이미 없어짐, 증명한 인증 계정이 B에서 떨어짐) 422 `merge.token_invalid`이고 이 경우들은 구분하지 않습니다.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeRequest'
      responses:
        '200':
          description: 합침. 남은 유저 계정(A)의 `getMe`와 같은 응답
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/me/consents:
    post:
      operationId: agreeConsents
      summary: 약관 동의
      description: 현재 버전 문서에 동의합니다. 동의 전에는 `getMe`, 동의, 로그아웃, 계정 삭제, 알림 기기 해제(`deleteDevice`) 말고는 403 `consent.required`입니다.
      requestBody:
        required: true
