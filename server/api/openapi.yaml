      description: |
        `from`부터 `to`까지(둘 다 포함) 일정을 돌려줍니다. 범위는 62일 이내이고, 넘으면 422 `range.too_long`입니다.
        `from`이 `to`보다 늦으면 400 `request.invalid`(field `from`), 62일을 넘으면 field는 `to`입니다.
        정렬은 날짜, 같은 날이면 종일 일정 먼저, 그다음 시각, 만든 시각 순입니다.
      parameters:
        - name: from
