        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/daily/{date}:
    parameters:
      - $ref: '#/components/parameters/Date'
    get:
      operationId: getDaily
      summary: 하루 운세
      description: |
        그날의 데일리(일진, 총운, 가이드 질문, 카드, 태그, 관계)를 돌려줍니다. 세 깊이(surface·explain·evidence)를 한 번에 담습니다.
        형식이 틀리거나 달력에 없는 날짜(예 `2026-02-30`)는 400 `request.invalid`, 형식은 맞지만 D41 지원 범위 밖이면 422 `date.out_of_range`입니다. 프로필이 없으면 409 `profile.required`입니다.
      responses:
        '200':
          description: 하루 운세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Daily'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
