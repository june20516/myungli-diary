      summary: 지운 일정 되살리기
      description: |
        지운 일정을 되살립니다. 이미 살아 있는 일정이면 그대로 200입니다(같은 요청을 다시 보내도 같은 결과).
        없는 일정(남의 일정 포함)은 404 `schedule.not_found`입니다.
      responses:
