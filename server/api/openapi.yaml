        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/devices:
    post:
      operationId: registerDevice
      summary: 알림 기기 등록
      description: |
        아침 알림을 받을 FCM 토큰을 등록합니다. app은 실행할 때와 FCM 토큰이 바뀔 때 부릅니다. 프로필은 요구하지 않습니다.
        * 처음 보는 토큰이면 기기를 만들고 201입니다.
        * 이미 등록된 토큰이면 같은 `id`로 200입니다. 다른 계정의 토큰이었으면 요청한 계정으로 옮기고, 비활성이었으면 다시 활성으로 바꿉니다.
        * 토큰이 바뀌면 app은 새 토큰을 등록한 뒤 이전 `id`를 `deleteDevice`로 해제합니다.
          해제하지 못한 이전 토큰은 FCM이 무효라고 답할 때 server가 비활성으로 바꿉니다.
        * 한 계정의 활성 기기는 10대까지입니다. 넘으면 가장 오래 등록·갱신하지 않은 기기를 비활성으로 바꿉니다.
        * 알림을 켜고 끄는 것은 프로필의 `notification`이 정합니다. 기기 등록은 받을 곳만 정합니다.
        * `Idempotency-Key`를 보내면 24시간 안의 같은 키에는 처음 응답(201 포함)을 그대로 돌려줍니다. 키 없이 다시 보내면 위 규칙대로 200입니다.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceInput'
      responses:
        '200':
          description: 이미 등록된 토큰의 기기
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '201':
          description: 새로 등록된 기기
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/devices/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteDevice
      summary: 알림 기기 해제
      description: |
        기기를 비활성으로 바꿔 알림을 멈춥니다. app은 로그아웃하기 전과, FCM 토큰이 바뀌어 새 토큰을 등록한 뒤 이전 `id`에 부릅니다.
        이미 비활성인 자기 기기도 204입니다. 없는 기기(남의 기기 포함)는 404 `device.not_found`입니다.
        계정 삭제(`deleteMe`)는 그 계정의 기기를 모두 비활성으로 바꾸므로 따로 부르지 않아도 됩니다.
      responses:
        '204':
          description: 해제됨
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/me/entitlements:
    get:
      operationId: getEntitlements
      summary: 이용권 상태
      responses:
        '200':
          description: 이용권 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entitlements'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/me/purchases:
    get:
      operationId: listPurchases
      summary: 구매 목록
      description: |
        이 유저 계정의 구매 장부를 최근 구매 먼저 돌려줍니다. 상품 이름은 app이 `productId`로 자기 문구나 스토어 이름에서 찾습니다.
        기간 상품이면 `period`에 이 유저 계정의 사용 구간이 있습니다. 합친 구매는 현재 유저 계정의 구간만 담습니다. 산 유저 계정과 합치기 출처는 주지 않습니다.
        production이 아닌 구매는 `BILLING_PRODUCTION_ONLY`가 꺼진 환경에서만 보입니다. 페이지 나누기는 필요해지면 선택 필드로 더하고, 그 뒤에도 그 필드 없이 부르면 전부 돌려줍니다.
      responses:
        '200':
          description: 구매 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/billing/restore:
    post:
      operationId: restorePurchases
      summary: 구매 복원
      description: |
        이 유저 계정의 RevenueCat 구매 목록으로 구매 장부를 다시 맞추고 광고 제거권을 처음부터 다시 계산합니다. 환불된 구매는 빼고 계산합니다.
        장부에 없는 구매는 이 유저 계정의 것으로 적습니다. 다른 유저 계정이 주인인 구매는 주인을 바꾸거나 가져오지 않습니다(환불 사실만 장부에 맞춥니다).
        장부에 있는데 이 유저 계정의 RevenueCat 목록에 없는 구매는 취소하지 않습니다.
        app은 RevenueCat `Purchases.logIn`에 `Me.accountId` 문자열(소문자 표준 UUID 표기)을 그대로 넘깁니다. 다른 표기면 server가 구매를 찾지 못합니다.
        RevenueCat 장애는 503 `billing.provider_unavailable`입니다.
      responses:
        '200':
          description: 복원 뒤 이용권 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entitlements'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /webhooks/revenuecat:
    post:
      operationId: revenuecatWebhook
      summary: RevenueCat webhook
      description: |
        RevenueCat이 부르는 주소입니다. app은 부르지 않습니다.
        Authorization 헤더는 RevenueCat에 설정한 값과 같은지 핸들러가 검증합니다(다르면 401 `auth.token_invalid`). 그래서 security와 parameter로 적지 않습니다.
        webhook은 신호로만 씁니다. 이벤트에서 계정을 찾아 RevenueCat 구매 목록으로 이용권을 다시 계산하며, 같은 `event.id`는 한 번만 처리합니다.
        이벤트에서 계정 id를 찾지 못하거나 모르는 계정이면 기록만 하고 200입니다(재시도를 막음). `type`이 `TEST`인 이벤트도 기록만 하고 200입니다.
        저장·동기화에 실패하면 500을 돌려주고 RevenueCat의 재전송에 맡깁니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: RevenueCat webhook 이벤트 원문
      responses:
        '200':
          description: 처리됨
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /webhooks/admob-ssv:
    get:
      operationId: admobRewardCallback
      summary: AdMob 보상형 광고 SSV 콜백
      description: |
        AdMob이 보상형 광고 시청 뒤 부르는 서버 측 확인(SSV) 주소입니다. app은 부르지 않습니다.
        서명은 핸들러가 원본 쿼리 문자열(`signature` 앞까지)로 AdMob 공개 키(`key_id`로 고름)를 써 ECDSA 검증합니다.
        `user_id`는 계정 id이며, app이 SSV 옵션에 넣습니다. 같은 `transaction_id`는 한 번만 처리하고, 다시 오면 아무것도 하지 않고 200입니다.
        서명이 맞아도 `user_id`가 없거나 없는 계정이면 기록만 하고 200입니다(재시도를 막음).
        검증되면 근거 열람 권한(`insight`)을 출처 `rewarded_ad`로 그 계정 현재 시간대의 다음 자정까지 부여합니다.
        서명 검증 실패는 401 `reward.invalid_signature`, 현재와 1시간 넘게 어긋난(오래됐거나 미래) `timestamp`는 401 `reward.expired`입니다. 검증 키 목록을 받지 못하면 503입니다.
      security: []
      parameters:
        - name: key_id
          in: query
          required: true
          schema:
            type: string
        - name: signature
          in: query
          required: true
          schema:
            type: string
        - name: timestamp
          in: query
          required: true
          schema:
            type: string
        - name: transaction_id
          in: query
          required: true
          schema:
            type: string
        - name: ad_network
          in: query
          required: false
          schema:
            type: string
        - name: ad_unit
          in: query
          required: false
          schema:
            type: string
        - name: reward_amount
          in: query
          required: false
          schema:
            type: string
        - name: reward_item
          in: query
          required: false
          schema:
            type: string
        - name: user_id
          in: query
          required: false
          schema:
            type: string
        - name: custom_data
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 처리됨(이미 처리한 `transaction_id`, 없는 계정 포함)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/cities:
    get:
      operationId: listCities
      summary: 도시 검색
      description: |
        출생지 도시를 이름으로 찾습니다(`ETag`). 언어는 `lang`, 생략하면 `Accept-Language`입니다.
        `q`는 한국어·영어·일본어 이름 중 하나의 앞부분과 같은 도시를 찾습니다(대소문자 무시).
        요청 언어 이름이 앞부분과 같은 도시가 먼저, 그다음은 요청 언어 이름 순입니다. `limit`개까지 돌려줍니다.
        `If-None-Match`가 현재 `ETag`와 같으면 304를 돌려줍니다.
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 50
        - name: lang
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Language'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: 도시 목록
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityList'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/app-config:
    get:
      operationId: getAppConfig
      summary: 앱 설정
      description: 플랫폼별 최소 앱 버전과 법적 문서 주소입니다.
      security: []
      responses:
        '200':
          description: 앱 설정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfig'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /healthz:
    get:
      operationId: getHealth
      summary: 헬스 체크
      description: 정상이면 200, 비정상이면 503입니다.
      security: []
      responses:
        '200':
          description: 정상
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: server가 발급한 access token(JWT, 15분)
    appCheck:
      type: apiKey
      in: header
      name: X-Firebase-AppCheck
      description: Firebase App Check 토큰. 비로그인 요청(`createPreview`, `getBirthHour`, `convertLunarDate`)에 필요합니다.

  parameters:
    Date:
      name: date
      in: path
      required: true
      schema:
        type: string
        format: date
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 같은 키로 다시 보내면 24시간 동안 같은 응답을 돌려줍니다(IETF draft-ietf-httpapi-idempotency-key-header).
      schema:
        type: string
        minLength: 1
        maxLength: 255

    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: 앞 응답의 `ETag`. 같으면 본문 없이 304를 돌려줍니다.
      schema:
        type: string

  headers:
    Location:
      description: 이동하거나 새로 만든 리소스의 주소
      schema:
        type: string
    ETag:
      description: 응답 본문의 버전 식별자
      schema:
        type: string
    RetryAfter:
      description: 다시 시도하기까지 기다릴 초
      schema:
        type: integer
        minimum: 0
    WWWAuthenticate:
      description: RFC 6750 형식, 예 `Bearer error="invalid_token"`
      schema:
        type: string

  responses:
    NotModified:
      description: '`If-None-Match`가 현재 `ETag`와 같음. 본문이 없습니다.'
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
    BadRequest:
      description: |
        요청 형식 오류. JSON 문법 오류는 `request.malformed`, 스키마로 표현되는 형식·범위 위반(타입, 필수 필드, `enum`, `pattern`, 길이,
        `minimum`·`maximum`, `format`)은 모두 `request.invalid`이며 `errors[].code`(위반한 keyword)로 구분합니다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: |
        인증 실패. `auth.token_expired`, `auth.token_invalid`, `auth.refresh_reused`, `auth.provider_token_invalid`, `auth.exchange_invalid`, `app_check.invalid`,
        `reward.invalid_signature`, `reward.expired`. `WWW-Authenticate` 헤더는 bearer 인증(access token) 실패 401에만 붙고, 제공자 토큰·교환 코드 401에는 없습니다.
        그 밖의 bearer가 아닌 401(App Check, webhook)에도 붙지 않습니다.
        webhook·App Check의 401에 challenge를 붙이지 않는 것은 RFC 9110 §15.5.2와 다른 의도한 이탈입니다.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WWWAuthenticate'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 권한 없음. 약관 미동의·문서 버전 변경은 `consent.required`, 미리보기를 이미 썼으면 `preview.used`입니다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 리소스가 없음. 남의 리소스도 404로 보내 존재 여부를 숨깁니다(예 `diary.not_found`, `reaction.not_found`, `schedule.not_found`, `device.not_found`). 현재 계정에 없는 제공자 연결은 `auth.identity_not_found`입니다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 상태 충돌. `profile.required`, `idempotency.in_progress`, `auth.last_identity`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: 요청 본문이 1 MiB를 넘음(`request.too_large`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: 지원하지 않는 요청 Content-Type(`request.unsupported_media_type`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: |
        형식은 맞지만 스키마로 표현할 수 없는 의미 검사에 걸림. 형식·범위 위반은 422가 아니라 400 `request.invalid`입니다.
        * `date.out_of_range`·`birth.out_of_range`: 형식은 맞지만 D41 지원 범위(양력 1900-01-31 ~ 2099-12-31) 밖
        * `date.invalid`: 정수 필드 객체 `LunarOrSolarDate`가 달력에 없는 날짜(예 양력 2월 31일). `format: date` 문자열의 없는 날짜(예 `2026-02-30`)는 400 `request.invalid`입니다.
          `convertLunarDate`에서는 없는 음력 날짜(윤달이 없는 달의 윤달, 그 달에 없는 30일)도 `date.invalid`입니다.
        * `request.inconsistent`: 상태-값 짝 위반. `errors[].field`는 JSON Pointer, `errors[].code`는 `required_by_status`·`forbidden_by_status`
          (대상 `BirthTime`, `BirthPlace`, 양력의 `isLeapMonth`, `NotificationSetting`, `ScheduleInput`·`SchedulePatch`)
        * `consent.version_mismatch`: 동의한 문서 버전이 현재 버전과 다름. `errors[].field`는 `/documents/<i>/version`
        * `timezone.invalid`: IANA 시간대 이름이 아님. `errors[].field`는 `/currentTimezone` 또는 `/birth/timezone`
        * `city.not_found`: `cityId`가 도시 목록에 없음. `errors[].field`는 `/birth/place/cityId`
        * `range.too_long`: `listSchedules`의 조회 범위(`from`~`to`)가 62일을 넘음
        * `merge.token_invalid`: 합치기 토큰이 없음·만료·이미 씀·현재 계정의 토큰이 아님, 또는 합치는 시점에 조건이 바뀜(구분하지 않음)
        * `merge.same_account`: `previewMerge`에서 증명한 인증 계정이 현재 유저 계정에 이미 연결돼 있음
        * `merge.no_account`: `previewMerge`에서 증명한 인증 계정이 어느 유저 계정에도 연결돼 있지 않음
        * 엔진 판정과 업무 규칙: `birth.invalid`, `diary.future_date`, `diary.day_full`, 호칭 거부(`name.empty`·`name.too_long`·`name.emoji`·`name.control`·`name.invalid_char`, josa.yaml name_rules의 기준 구현 normalize_name), `idempotency.mismatch`
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: 요청 한도 초과(`rate_limited`).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: 예상하지 못한 오류(`internal`). 상세는 server 로그에만 남습니다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadGateway:
      description: 엔진 내부 오류(`engine.error`). 다시 시도해도 같을 가능성이 큽니다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: |
        일시적으로 처리할 수 없음. `engine.unavailable`, `service.unavailable`, `auth.provider_unavailable`, `billing.provider_unavailable`.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    GatewayTimeout:
      description: 엔진 응답 시간 초과(`engine.timeout`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnexpectedError:
      description: 위에 적지 않은 그 밖의 오류
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    # ---- 공통 ----
    Problem:
      type: object
      description: RFC 9457 오류 응답
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri
          description: '`https://api.myungli.app/problems/<code>`. 도메인은 바뀔 수 있어 app은 `code`로 구분합니다.'
        title:
          type: string
          description: 개발자용 영어 제목. 사용자에게 보이지 않습니다.
        status:
          type: integer
        code:
          type: string
          description: |
            오류 코드. app은 이 값으로 UI 문구를 고릅니다. 가능한 값과 상태는 `x-problem-codes`입니다.
            목록에 없는 code가 오면 status 대역의 기본 문구를 씁니다(목록은 하위 호환으로 늘어납니다).
          x-problem-codes:
            request.malformed:
              status: 400
              description: 'JSON 문법 오류, 값 뒤에 데이터가 더 있음'
            request.invalid:
              status: 400
              description: '스키마로 표현되는 형식·범위 위반. errors[].code는 위반한 keyword'
            auth.token_expired:
              status: 401
              description: 'access token 만료. 갱신하면 됨'
            auth.token_invalid:
              status: 401
              description: 'access token 없음·위조, refresh token 무효, 또는 RevenueCat webhook의 Authorization 불일치'
            auth.refresh_reused:
              status: 401
              description: 'refresh token 재사용 감지. family 전체 폐기, 다시 로그인'
            auth.provider_token_invalid:
              status: 401
              description: '카카오·Apple·LINE·Google 제공자 토큰 검증 실패(로그인과 linkIdentity)'
            auth.exchange_invalid:
              status: 401
              description: 'Apple 웹 로그인(completeAppleWebLogin)이나 Apple 붙이기(linkIdentity)의 교환 코드가 없음·만료·이미 씀, 또는 nonce 불일치(구분하지 않음)'
            app_check.invalid:
              status: 401
              description: 'App Check 토큰 검증 실패'
            reward.invalid_signature:
              status: 401
              description: 'AdMob 보상 콜백 서명 검증 실패'
            reward.expired:
              status: 401
              description: 'AdMob 보상 콜백 timestamp가 현재와 1시간 넘게 어긋남(오래됐거나 미래)'
            consent.required:
              status: 403
              description: '약관 미동의 또는 문서 버전 변경'
            preview.used:
              status: 403
              description: '설치당 1회인 미리보기를 이미 씀'
            route.not_found:
              status: 404
              description: '등록된 라우트가 없음'
            diary.not_found:
              status: 404
              description: '없는 일기. 남의 일기도 같은 응답'
            reaction.not_found:
              status: 404
              description: '그날 그 슬롯에 반응할 선택 기록이 없거나 반응할 수 없는 슬롯'
            schedule.not_found:
              status: 404
              description: '없는 일정. 남의 일정도 같은 응답'
            device.not_found:
              status: 404
              description: '없는 기기. 남의 기기도 같은 응답'
            auth.identity_not_found:
              status: 404
              description: '현재 계정에 없는 제공자 연결을 떼려 함'
            method.not_allowed:
              status: 405
              description: '라우트는 있으나 메서드가 다름(Allow 헤더)'
            profile.required:
              status: 409
              description: '프로필 없이 운세·일기를 요청함'
            idempotency.in_progress:
              status: 409
              description: '같은 Idempotency-Key 요청이 처리 중'
            auth.provider_taken:
              status: 409
              description: '현재 계정에 같은 제공자의 다른 사용자 연결이 있음'
            auth.identity_in_use:
              status: 409
              description: '붙이려는 인증 계정이 다른 유저 계정에 연결돼 있음. 합치려면 그 인증 계정으로 previewMerge'
            auth.last_identity:
              status: 409
              description: '마지막 연결은 뗄 수 없음'
            request.too_large:
              status: 413
              description: '요청 본문이 1 MiB를 넘음'
            request.unsupported_media_type:
              status: 415
              description: '지원하지 않는 요청 Content-Type'
            date.out_of_range:
              status: 422
              description: '형식은 맞지만 지원 범위(양력 1900-01-31 ~ 2099-12-31) 밖의 날짜'
            birth.out_of_range:
              status: 422
              description: '형식은 맞지만 지원 범위 밖의 출생 정보'
            date.invalid:
              status: 422
              description: 'LunarOrSolarDate가 달력에 없는 날짜(예 양력 2월 31일)'
            request.inconsistent:
              status: 422
              description: '상태-값 짝 위반. errors[].code는 required_by_status 또는 forbidden_by_status'
            birth.invalid:
              status: 422
              description: '엔진이 거절한 출생 정보(예 없는 음력 날짜)'
            diary.future_date:
              status: 422
              description: '오늘 이후 날짜의 일기'
            diary.day_full:
              status: 422
              description: '그 날짜에 살아 있는 일기가 이미 10편'
            name.empty:
              status: 422
              description: '호칭 거부: 공백과 접미사를 떼고 나면 비어 있음'
            name.too_long:
              status: 422
              description: '호칭 거부: 언어별 최대 길이(ko·ja 10, en 20)를 넘음'
            name.emoji:
              status: 422
              description: '호칭 거부: 이모지를 포함함'
            name.control:
              status: 422
              description: '호칭 거부: 제어 문자를 포함함'
            name.invalid_char:
              status: 422
              description: '호칭 거부: 받지 않는 글자({ } [ ] ( ))를 포함함'
            idempotency.mismatch:
              status: 422
              description: '같은 Idempotency-Key에 다른 본문'
            consent.version_mismatch:
              status: 422
              description: '동의한 문서 버전이 현재 버전과 다름. errors[].field는 /documents/<i>/version'
            timezone.invalid:
              status: 422
              description: 'IANA 시간대 이름이 아님. errors[].field는 /currentTimezone 또는 /birth/timezone'
            city.not_found:
              status: 422
              description: 'cityId가 도시 목록에 없음. errors[].field는 /birth/place/cityId'
            range.too_long:
              status: 422
              description: '일정 조회 범위(from~to)가 62일을 넘음'
            merge.token_invalid:
              status: 422
              description: '합치기 토큰이 없음·만료·이미 씀·현재 계정의 토큰이 아님, 또는 합치는 시점에 조건이 바뀜(구분하지 않음)'
            merge.same_account:
              status: 422
              description: 'previewMerge에서 증명한 인증 계정이 현재 유저 계정에 이미 연결돼 있음'
            merge.no_account:
              status: 422
              description: 'previewMerge에서 증명한 인증 계정이 어느 유저 계정에도 연결돼 있지 않음. linkIdentity로 붙임'
            rate_limited:
              status: 429
              description: '요청 한도 초과(Retry-After)'
            internal:
              status: 500
              description: '예상하지 못한 server 오류. 상세는 로그에만'
            not_implemented:
              status: 501
              description: '계약에는 있으나 아직 구현하지 않은 operation'
            engine.error:
              status: 502
              description: '엔진 내부 오류. 다시 시도해도 같을 가능성이 큼'
            engine.unavailable:
              status: 503
              description: '엔진에 연결할 수 없음(Retry-After)'
            auth.provider_unavailable:
              status: 503
              description: '카카오·Apple·LINE·Google 제공자 장애'
            billing.provider_unavailable:
              status: 503
              description: 'RevenueCat 장애'
            service.unavailable:
              status: 503
              description: 'DB 연결 실패 등 server가 일시적으로 처리할 수 없음'
            engine.timeout:
              status: 504
              description: '엔진 응답 시간 초과'
        traceId:
          type: string
          description: 문의가 왔을 때 server 로그를 찾는 값
        detail:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
          description: |
            위반 위치. 요청 본문 안이면 JSON Pointer(RFC 6901)입니다(예 `/birth/date/day`, 본문 전체는 빈 문자열).
            경로·쿼리·헤더 parameter면 계약의 parameter 이름입니다(예 `date`, `limit`). JSON Pointer는 `/`로 시작하거나 비어 있어 둘은 겹치지 않습니다.
        code:
          type: string
          description: |
            `request.invalid`에서는 위반한 JSON Schema keyword(예 `required`, `pattern`, `minimum`, `format`)이고, parameter를 타입으로 읽지 못하면 `type`입니다.
            keyword를 알 수 없는 스키마 위반은 `invalid`입니다. 스키마 밖 검사로 나는 `request.invalid`(`listSchedules`의 `from` > `to`, 읽지 못하는 `cursor`)는 `request.invalid`입니다.
            `request.inconsistent`에서는 `required_by_status`(상태가 요구하는 값이 없음) 또는 `forbidden_by_status`(상태가 허용하지 않는 값이 있음)입니다.
            그 밖(예 `ProfileResponse.warnings`)에서는 그 응답이 정한 코드입니다.
    Language:
      type: string
      description: 언어. 요청에서는 이 값만 받습니다(밖의 값은 400). 응답에서는 열린 enum이라 app은 모르는 값이면 기본 언어로 표시합니다.
      enum: [ko, en, ja]
    RenderedText:
      type: object
      description: 렌더된 문장. 용어 토큰은 위치 숫자 대신 조각 배열로 나눕니다.
      required: [segments]
      properties:
        segments:
          type: array
          items:
            $ref: '#/components/schemas/Segment'
    Segment:
      type: object
      required: [text]
      properties:
        text:
          type: string
        term:
          type: string
          description: 이 조각이 용어면 그 **용어 id**(`<범주>.<값>` 또는 `tag.<키>`, 호칭·조사 처리 규칙 v1.1). `Glossary.values`·`meanings`를 찾는 키입니다
    SlotText:
      type: object
      description: |
        writing 슬롯 하나의 문장입니다.
        `todayReason`은 풀이 시트의 "오늘 그런 이유"(writing 슬롯 `explain.today_reason`)입니다. 이 문장의 판정 근거 규칙(`Evidence.ruleId`)으로 고르고,
        깊이 explain이라 잠그지 않습니다. 그 규칙의 문장이 없으면 생략합니다.
        깊이 evidence의 판정 근거·원전 문장은 `evidence[]`의 `basis`·`source`입니다.

        `reactable`은 총운 슬롯(`daily.fortune.head`·`daily.fortune.tag`)만 true입니다.
        `variant`는 유형 슬롯이면 `advice`·`state`·`care`, 가이드 슬롯이면 `1`·`2`, 그 밖은 `single`입니다.

        문장이 없을 때: 필수 문장 필드(`text`)는 템플릿(writing 원고)이 없으면 빈 `segments`로 오고,
        선택 문장 필드(`todayReason`·`Evidence.basis`·`Evidence.source`)는 생략합니다.
      required: [slot, messageKey, variant, text, reactable]
      properties:
        slot:
          type: string
          description: writing 슬롯 id(예 `daily.fortune.head`)
        messageKey:
          type: string
        variant:
          type: string
          enum: [advice, state, care, '1', '2', single]
        text:
          $ref: '#/components/schemas/RenderedText'
        reactable:
          type: boolean
        reaction:
          type: string
          enum: [like]
          description: 이 사용자가 남긴 반응. 반응이 없으면 생략합니다. 열린 enum이라 app은 모르는 값이면 반응이 없는 것으로 표시합니다.
        todayReason:
          $ref: '#/components/schemas/RenderedText'
        evidence:
          type: array
          description: 판정 근거. 응답의 `evidenceAccess`가 `unlocked`이고 근거가 있을 때만 담깁니다. 빈 배열은 보내지 않습니다.
          items:
            $ref: '#/components/schemas/Evidence'
    Evidence:
      type: object
      description: |
        판정 근거 하나입니다. `ruleId`는 core 근거 규칙 목록(`core/evidence_rules.json`), `sourceRef`는 원전 목록(`core/evidence_sources.json`)의 키입니다.
        `basis`는 근거 시트의 판정 근거 문장(writing 슬롯 `evidence.basis`, 키 `basis.<ruleId>`, `detail` 값을 매개변수로 렌더)이고,
        `source`는 원전 인용 문장(writing 슬롯 `evidence.source`, 키 `source.<sourceRef>`, 원전 이름·대목·뜻)입니다. 문장이 없으면 각각 생략합니다.
      required: [ruleId, sourceRef]
      properties:
        ruleId:
          type: string
        sourceRef:
          type: string
        detail:
          type: object
          additionalProperties:
            type: string
        basis:
          $ref: '#/components/schemas/RenderedText'
        source:
          $ref: '#/components/schemas/RenderedText'
    EvidenceAccess:
      type: string
      enum: [unlocked, locked]
      description: |
        근거 열람 권한 상태(D60). 권한이 없으면 `locked`이고, evidence 깊이의 해석(판정 근거, 원전, 원국 개인 해석, 용신 근거)을 응답에서 뺍니다.
        surface·explain과 표 데이터는 잠그지 않습니다. 근거가 원래 없는 것과 잠겨서 빠진 것을 이 값으로 구분합니다.
    Notice:
      type: object
      description: |
        엔진 안내입니다. `text`는 writing 문구가 없으면 빈 `segments`이고, 그때 app은 배너를 그리지 않습니다.
      required: [code, text]
      properties:
        code:
          $ref: '#/components/schemas/NoticeCode'
        text:
          $ref: '#/components/schemas/RenderedText'
    NoticeCode:
      type: string
      enum:
        - ambiguous_local_time
        - nonexistent_local_time
        - zi_hour_next_day
        - time_unknown
        - near_solar_term
        - dayun_start_approximate
        - focus_time_fallback

    # ---- 엔진 enum (proto enum 이름에서 접두어를 떼고 소문자로, glossary 키 규칙과 같음) ----
    Stem:
      type: string
