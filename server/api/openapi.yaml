          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRequest'
      responses:
        '204':
          description: 동의 기록됨
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/me/profile:
    get:
      operationId: getProfile
      summary: 프로필 읽기
      description: 저장된 프로필을 돌려줍니다. 새 기기·재설치에서 현재 값을 받는 데 씁니다(#141). 프로필이 없으면 409 `profile.required`입니다.
      responses:
        '200':
          description: 저장된 프로필
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
    put:
      operationId: createProfile
      summary: 프로필 첫 등록
      description: |
        프로필을 처음 등록합니다. 출생 정보는 저장 전에 엔진으로 검증합니다(422 `birth.invalid`·`birth.out_of_range`).
        호칭 경고(`name.suffix_stripped`·`name.suffix_warning`)는 오류가 아니며 200 응답의 `warnings`에 담깁니다.
        `currentTimezone`이나 `birth.timezone`이 IANA 이름이 아니면 422 `timezone.invalid`, `birth.place.cityId`가 도시 목록에 없으면 422 `city.not_found`입니다.
      requestBody:
