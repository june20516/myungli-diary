        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleInput'
      responses:
        '201':
          description: 만든 일정
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/schedules/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateSchedule
      summary: 일정 수정
      description: |
        보낸 필드만 바꿉니다(JSON Merge Patch).
        `allDay`를 true로 바꾸면 `time`이 지워집니다. 짝 위반(`allDay`·`time`)은 422 `request.inconsistent`입니다(`SchedulePatch` 참고).
        `memo`는 빈 문자열을 보내 지웁니다.
        없는 일정(남의 일정 포함)은 404 `schedule.not_found`입니다.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/SchedulePatch'
      responses:
        '200':
          description: 고친 일정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
    delete:
      operationId: deleteSchedule
      summary: 일정 지우기
      description: 일정을 지웁니다. 지운 일정은 `restoreSchedule`로 되살릴 수 있습니다. 없는 일정(남의 일정 포함)은 404 `schedule.not_found`입니다.
      responses:
        '204':
          description: 지워짐
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/schedules/{id}/restore:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: restoreSchedule
      summary: 지운 일정 되살리기
      description: |
        지운 일정을 되살립니다. 이미 살아 있는 일정이면 그대로 200입니다(같은 요청을 다시 보내도 같은 결과).
        없는 일정(남의 일정 포함)은 404 `schedule.not_found`입니다.
      responses:
        '200':
          description: 되살린 일정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/devices:
    post:
      operationId: registerDevice
      summary: 알림 기기 등록
      description: |
        아침 알림을 받을 FCM 토큰을 등록합니다. app은 실행할 때와 FCM 토큰이 바뀔 때 부릅니다. 프로필은 요구하지 않습니다.
        * 처음 보는 토큰이면 기기를 만들고 201입니다.
        * 이미 등록된 토큰이면 같은 `id`로 200입니다. 다른 계정의 토큰이었으면 요청한 계정으로 옮기고, 비활성이었으면 다시 활성으로 바꿉니다.
        * 토큰이 바뀌면 app은 새 토큰을 등록한 뒤 이전 `id`를 `deleteDevice`로 해제합니다.
          해제하지 못한 이전 토큰은 FCM이 무효라고 답할 때 server가 비활성으로 바꿉니다.
        * 한 계정의 활성 기기는 10대까지입니다. 넘으면 가장 오래 등록·갱신하지 않은 기기를 비활성으로 바꿉니다.
        * 알림을 켜고 끄는 것은 프로필의 `notification`이 정합니다. 기기 등록은 받을 곳만 정합니다.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceInput'
      responses:
        '200':
          description: 이미 등록된 토큰의 기기
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '201':
          description: 새로 등록된 기기
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/devices/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteDevice
      summary: 알림 기기 해제
      description: |
        기기를 비활성으로 바꿔 알림을 멈춥니다. app은 로그아웃하기 전과, FCM 토큰이 바뀌어 새 토큰을 등록한 뒤 이전 `id`에 부릅니다.
        이미 비활성인 자기 기기도 204입니다. 없는 기기(남의 기기 포함)는 404 `device.not_found`입니다.
        계정 삭제(`deleteMe`)는 그 계정의 기기를 모두 비활성으로 바꾸므로 따로 부르지 않아도 됩니다.
      responses:
        '204':
          description: 해제됨
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/me/entitlements:
    get:
      operationId: getEntitlements
      summary: 이용권 상태
      responses:
        '200':
          description: 이용권 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entitlements'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/billing/restore:
    post:
      operationId: restorePurchases
      summary: 구매 복원
      description: |
        RevenueCat 구매 목록을 다시 조회해 광고 제거권을 처음부터 다시 계산합니다. 환불된 구매는 빼고 계산합니다.
        app은 RevenueCat `Purchases.logIn`에 `Me.accountId` 문자열(소문자 표준 UUID 표기)을 그대로 넘깁니다. 다른 표기면 server가 구매를 찾지 못합니다.
        RevenueCat 장애는 503 `billing.provider_unavailable`입니다.
      responses:
        '200':
          description: 복원 뒤 이용권 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entitlements'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /webhooks/revenuecat:
    post:
      operationId: revenuecatWebhook
      summary: RevenueCat webhook
      description: |
        RevenueCat이 부르는 주소입니다. app은 부르지 않습니다.
        Authorization 헤더는 RevenueCat에 설정한 값과 같은지 핸들러가 검증합니다(다르면 401). 그래서 security와 parameter로 적지 않습니다.
        webhook은 신호로만 씁니다. 이벤트에서 계정을 찾아 RevenueCat 구매 목록으로 이용권을 다시 계산하며, 같은 `event.id`는 한 번만 처리합니다.
        이벤트에서 계정 id를 찾지 못하거나 모르는 계정이면 기록만 하고 200입니다(재시도를 막음). `type`이 `TEST`인 이벤트도 기록만 하고 200입니다.
        저장·동기화에 실패하면 500을 돌려주고 RevenueCat의 재전송에 맡깁니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: RevenueCat webhook 이벤트 원문
      responses:
        '200':
          description: 처리됨
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /webhooks/admob-ssv:
    get:
      operationId: admobRewardCallback
      summary: AdMob 보상형 광고 SSV 콜백
      description: |
        AdMob이 보상형 광고 시청 뒤 부르는 서버 측 확인(SSV) 주소입니다. app은 부르지 않습니다.
        서명은 핸들러가 원본 쿼리 문자열(`signature` 앞까지)로 AdMob 공개 키(`key_id`로 고름)를 써 ECDSA 검증합니다.
        `user_id`는 계정 id이며, app이 SSV 옵션에 넣습니다. 같은 `transaction_id`는 한 번만 처리하고, 다시 오면 아무것도 하지 않고 200입니다.
        서명이 맞아도 `user_id`가 없거나 없는 계정이면 기록만 하고 200입니다(재시도를 막음).
        검증되면 근거 열람 권한(`insight`)을 출처 `rewarded_ad`로 그 계정 현재 시간대의 다음 자정까지 부여합니다.
        서명 검증 실패는 401 `reward.invalid_signature`, 현재와 1시간 넘게 어긋난(오래됐거나 미래) `timestamp`는 401 `reward.expired`입니다. 검증 키 목록을 받지 못하면 503입니다.
      security: []
      parameters:
        - name: key_id
          in: query
          required: true
          schema:
            type: string
        - name: signature
          in: query
          required: true
          schema:
            type: string
        - name: timestamp
          in: query
          required: true
          schema:
            type: string
        - name: transaction_id
          in: query
          required: true
          schema:
            type: string
        - name: ad_network
          in: query
          required: false
          schema:
            type: string
        - name: ad_unit
          in: query
          required: false
          schema:
            type: string
        - name: reward_amount
          in: query
          required: false
          schema:
            type: string
        - name: reward_item
          in: query
          required: false
          schema:
            type: string
        - name: user_id
          in: query
          required: false
          schema:
            type: string
        - name: custom_data
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 처리됨(이미 처리한 `transaction_id`, 없는 계정 포함)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/cities:
    get:
      operationId: listCities
      summary: 도시 검색
      description: |
        출생지 도시를 이름으로 찾습니다(`ETag`). 언어는 `lang`, 생략하면 `Accept-Language`입니다.
        `q`는 한국어·영어·일본어 이름 중 하나의 앞부분과 같은 도시를 찾습니다(대소문자 무시).
        요청 언어 이름이 앞부분과 같은 도시가 먼저, 그다음은 요청 언어 이름 순입니다. `limit`개까지 돌려줍니다.
        `If-None-Match`가 현재 `ETag`와 같으면 304를 돌려줍니다.
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 50
        - name: lang
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Language'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: 도시 목록
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityList'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/app-config:
    get:
      operationId: getAppConfig
      summary: 앱 설정
      description: 플랫폼별 최소 앱 버전과 법적 문서 주소입니다.
      security: []
      responses:
        '200':
          description: 앱 설정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfig'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /healthz:
    get:
      operationId: getHealth
      summary: 헬스 체크
      description: 정상이면 200, 비정상이면 503입니다.
      security: []
      responses:
        '200':
          description: 정상
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: server가 발급한 access token(JWT, 15분)
    appCheck:
      type: apiKey
      in: header
      name: X-Firebase-AppCheck
      description: Firebase App Check 토큰. 비로그인 요청(`createPreview`, `getBirthHour`, `convertLunarDate`)에 필요합니다.

  parameters:
    Date:
      name: date
      in: path
      required: true
      schema:
        type: string
        format: date
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 같은 키로 다시 보내면 24시간 동안 같은 응답을 돌려줍니다(IETF draft-ietf-httpapi-idempotency-key-header).
      schema:
        type: string
        minLength: 1
        maxLength: 255

    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: 앞 응답의 `ETag`. 같으면 본문 없이 304를 돌려줍니다.
      schema:
        type: string

  headers:
    Location:
      description: 이동하거나 새로 만든 리소스의 주소
      schema:
        type: string
    ETag:
      description: 응답 본문의 버전 식별자
      schema:
        type: string
    RetryAfter:
      description: 다시 시도하기까지 기다릴 초
      schema:
        type: integer
        minimum: 0
    WWWAuthenticate:
      description: RFC 6750 형식, 예 `Bearer error="invalid_token"`
      schema:
        type: string

  responses:
    NotModified:
      description: '`If-None-Match`가 현재 `ETag`와 같음. 본문이 없습니다.'
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
    BadRequest:
      description: |
        요청 형식 오류. JSON 문법 오류는 `request.malformed`, 스키마로 표현되는 형식·범위 위반(타입, 필수 필드, `enum`, `pattern`, 길이,
        `minimum`·`maximum`, `format`)은 모두 `request.invalid`이며 `errors[].code`(위반한 keyword)로 구분합니다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: |
        인증 실패. `auth.token_expired`, `auth.token_invalid`, `auth.refresh_reused`, `auth.provider_token_invalid`, `auth.exchange_invalid`, `app_check.invalid`,
        `reward.invalid_signature`, `reward.expired`. `WWW-Authenticate` 헤더는 bearer 요청의 401에만 붙습니다.
        bearer 요청이 아닌 401(제공자 토큰, 교환 코드, App Check, webhook)에는 붙지 않습니다.
        webhook·App Check의 401에 challenge를 붙이지 않는 것은 RFC 9110 §15.5.2와 다른 의도한 이탈입니다.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WWWAuthenticate'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 권한 없음. 약관 미동의·문서 버전 변경은 `consent.required`, 미리보기를 이미 썼으면 `preview.used`입니다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 리소스가 없음. 남의 리소스도 404로 보내 존재 여부를 숨깁니다(예 `diary.not_found`, `reaction.not_found`, `schedule.not_found`, `device.not_found`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 상태 충돌. `profile.required`, `diary.date_taken`, `idempotency.in_progress`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: 요청 본문이 1 MiB를 넘음(`request.too_large`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: 지원하지 않는 요청 Content-Type(`request.unsupported_media_type`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: |
        형식은 맞지만 스키마로 표현할 수 없는 의미 검사에 걸림. 형식·범위 위반은 422가 아니라 400 `request.invalid`입니다.
        * `date.out_of_range`·`birth.out_of_range`: 형식은 맞지만 D41 지원 범위(양력 1900-01-31 ~ 2099-12-31) 밖
        * `date.invalid`: 정수 필드 객체 `LunarOrSolarDate`가 달력에 없는 날짜(예 양력 2월 31일). `format: date` 문자열의 없는 날짜(예 `2026-02-30`)는 400 `request.invalid`입니다.
          `convertLunarDate`에서는 없는 음력 날짜(윤달이 없는 달의 윤달, 그 달에 없는 30일)도 `date.invalid`입니다.
        * `request.inconsistent`: 상태-값 짝 위반. `errors[].field`는 JSON Pointer, `errors[].code`는 `required_by_status`·`forbidden_by_status`
          (대상 `BirthTime`, `BirthPlace`, 양력의 `isLeapMonth`, `NotificationSetting`, `ScheduleInput`·`SchedulePatch`)
        * `consent.version_mismatch`: 동의한 문서 버전이 현재 버전과 다름. `errors[].field`는 `/documents/<i>/version`
        * `timezone.invalid`: IANA 시간대 이름이 아님. `errors[].field`는 `/currentTimezone` 또는 `/birth/timezone`
        * `city.not_found`: `cityId`가 도시 목록에 없음. `errors[].field`는 `/birth/place/cityId`
        * `range.too_long`: `listSchedules`의 조회 범위(`from`~`to`)가 62일을 넘음
        * 엔진 판정과 업무 규칙: `birth.invalid`, `diary.future_date`, 호칭 거부(`name.empty`·`name.too_long`·`name.emoji`·`name.control`·`name.invalid_char`, josa.yaml name_rules의 기준 구현 normalize_name), `idempotency.mismatch`
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: 요청 한도 초과(`rate_limited`).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: 예상하지 못한 오류(`internal`). 상세는 server 로그에만 남습니다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadGateway:
      description: 엔진 내부 오류(`engine.error`). 다시 시도해도 같을 가능성이 큽니다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: |
        일시적으로 처리할 수 없음. `engine.unavailable`, `service.unavailable`, `auth.provider_unavailable`, `billing.provider_unavailable`.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    GatewayTimeout:
      description: 엔진 응답 시간 초과(`engine.timeout`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnexpectedError:
      description: 위에 적지 않은 그 밖의 오류
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    # ---- 공통 ----
    Problem:
      type: object
      description: RFC 9457 오류 응답
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri
          description: '`https://api.myungli.app/problems/<code>`'
        title:
          type: string
          description: 개발자용 영어 제목. 사용자에게 보이지 않습니다.
        status:
          type: integer
        code:
          type: string
          description: |
            오류 코드. app은 이 값으로 UI 문구를 고릅니다. 가능한 값과 상태는 `x-problem-codes`입니다.
            목록에 없는 code가 오면 status 대역의 기본 문구를 씁니다(목록은 하위 호환으로 늘어납니다).
          x-problem-codes:
            request.malformed:
              status: 400
              description: 'JSON 문법 오류, 값 뒤에 데이터가 더 있음'
            request.invalid:
              status: 400
              description: '스키마로 표현되는 형식·범위 위반. errors[].code는 위반한 keyword'
            auth.token_expired:
              status: 401
              description: 'access token 만료. 갱신하면 됨'
            auth.token_invalid:
              status: 401
              description: 'access token 없음·위조, 또는 refresh token 무효'
            auth.refresh_reused:
              status: 401
              description: 'refresh token 재사용 감지. family 전체 폐기, 다시 로그인'
            auth.provider_token_invalid:
              status: 401
              description: '카카오·Apple 제공자 토큰 검증 실패'
            auth.exchange_invalid:
              status: 401
              description: 'Apple 웹 로그인 교환 코드가 없음·만료·이미 씀, 또는 nonce 불일치(구분하지 않음)'
            app_check.invalid:
              status: 401
              description: 'App Check 토큰 검증 실패'
            reward.invalid_signature:
              status: 401
              description: 'AdMob 보상 콜백 서명 검증 실패'
            reward.expired:
              status: 401
              description: 'AdMob 보상 콜백 timestamp가 현재와 1시간 넘게 어긋남(오래됐거나 미래)'
            consent.required:
              status: 403
              description: '약관 미동의 또는 문서 버전 변경'
            preview.used:
              status: 403
              description: '설치당 1회인 미리보기를 이미 씀'
            route.not_found:
              status: 404
              description: '등록된 라우트가 없음'
            diary.not_found:
              status: 404
              description: '없는 일기. 남의 일기도 같은 응답'
            reaction.not_found:
              status: 404
              description: '그날 그 슬롯에 반응할 선택 기록이 없거나 반응할 수 없는 슬롯'
            schedule.not_found:
              status: 404
              description: '없는 일정. 남의 일정도 같은 응답'
            device.not_found:
              status: 404
              description: '없는 기기. 남의 기기도 같은 응답'
            method.not_allowed:
              status: 405
              description: '라우트는 있으나 메서드가 다름(Allow 헤더)'
            profile.required:
              status: 409
              description: '프로필 없이 운세·일기를 요청함'
            diary.date_taken:
              status: 409
              description: '되살리려는 날짜에 이미 일기가 있음'
            idempotency.in_progress:
              status: 409
              description: '같은 Idempotency-Key 요청이 처리 중'
            request.too_large:
              status: 413
              description: '요청 본문이 1 MiB를 넘음'
            request.unsupported_media_type:
              status: 415
              description: '지원하지 않는 요청 Content-Type'
            date.out_of_range:
              status: 422
              description: '형식은 맞지만 지원 범위(양력 1900-01-31 ~ 2099-12-31) 밖의 날짜'
            birth.out_of_range:
              status: 422
              description: '형식은 맞지만 지원 범위 밖의 출생 정보'
            date.invalid:
              status: 422
              description: 'LunarOrSolarDate가 달력에 없는 날짜(예 양력 2월 31일)'
            request.inconsistent:
              status: 422
              description: '상태-값 짝 위반. errors[].code는 required_by_status 또는 forbidden_by_status'
            birth.invalid:
              status: 422
              description: '엔진이 거절한 출생 정보(예 없는 음력 날짜)'
            diary.future_date:
              status: 422
              description: '오늘 이후 날짜의 일기'
            name.empty:
              status: 422
              description: '호칭 거부: 공백과 접미사를 떼고 나면 비어 있음'
            name.too_long:
              status: 422
              description: '호칭 거부: 언어별 최대 길이(ko·ja 10, en 20)를 넘음'
            name.emoji:
              status: 422
              description: '호칭 거부: 이모지를 포함함'
            name.control:
              status: 422
              description: '호칭 거부: 제어 문자를 포함함'
            name.invalid_char:
              status: 422
              description: '호칭 거부: 받지 않는 글자({ } [ ] ( ))를 포함함'
            idempotency.mismatch:
              status: 422
              description: '같은 Idempotency-Key에 다른 본문'
            consent.version_mismatch:
              status: 422
              description: '동의한 문서 버전이 현재 버전과 다름. errors[].field는 /documents/<i>/version'
            timezone.invalid:
              status: 422
              description: 'IANA 시간대 이름이 아님. errors[].field는 /currentTimezone 또는 /birth/timezone'
            city.not_found:
              status: 422
              description: 'cityId가 도시 목록에 없음. errors[].field는 /birth/place/cityId'
            range.too_long:
              status: 422
              description: '일정 조회 범위(from~to)가 62일을 넘음'
            rate_limited:
              status: 429
              description: '요청 한도 초과(Retry-After)'
            internal:
              status: 500
              description: '예상하지 못한 server 오류. 상세는 로그에만'
            not_implemented:
              status: 501
              description: '계약에는 있으나 아직 구현하지 않은 operation'
            engine.error:
              status: 502
              description: '엔진 내부 오류. 다시 시도해도 같을 가능성이 큼'
            engine.unavailable:
              status: 503
              description: '엔진에 연결할 수 없음(Retry-After)'
            auth.provider_unavailable:
              status: 503
              description: '카카오·Apple 제공자 장애'
            billing.provider_unavailable:
              status: 503
              description: 'RevenueCat 장애'
            service.unavailable:
              status: 503
              description: 'DB 연결 실패 등 server가 일시적으로 처리할 수 없음'
            engine.timeout:
              status: 504
              description: '엔진 응답 시간 초과'
        traceId:
          type: string
          description: 문의가 왔을 때 server 로그를 찾는 값
        detail:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
          description: |
            위반 위치. 요청 본문 안이면 JSON Pointer(RFC 6901)입니다(예 `/birth/date/day`, 본문 전체는 빈 문자열).
            경로·쿼리·헤더 parameter면 계약의 parameter 이름입니다(예 `date`, `limit`). JSON Pointer는 `/`로 시작하거나 비어 있어 둘은 겹치지 않습니다.
        code:
          type: string
          description: |
            `request.invalid`에서는 위반한 JSON Schema keyword(예 `required`, `pattern`, `minimum`, `format`)이고, parameter를 타입으로 읽지 못하면 `type`입니다.
            `request.inconsistent`에서는 `required_by_status`(상태가 요구하는 값이 없음) 또는 `forbidden_by_status`(상태가 허용하지 않는 값이 있음)입니다.
            그 밖(예 `ProfileResponse.warnings`)에서는 그 응답이 정한 코드입니다.
    Language:
      type: string
      enum: [ko, en, ja]
    RenderedText:
      type: object
      description: 렌더된 문장. 용어 토큰은 위치 숫자 대신 조각 배열로 나눕니다.
      required: [segments]
      properties:
        segments:
          type: array
          items:
            $ref: '#/components/schemas/Segment'
    Segment:
      type: object
      required: [text]
      properties:
        text:
          type: string
        term:
          type: string
          description: 이 조각이 용어면 그 **용어 id**(`<범주>.<값>` 또는 `tag.<키>`, 호칭·조사 처리 규칙 v1.1). `Glossary.values`·`meanings`를 찾는 키입니다
    SlotText:
      type: object
      description: |
        writing 슬롯 하나의 문장입니다.
        `todayReason`은 풀이 시트의 "오늘 그런 이유"(writing 슬롯 `explain.today_reason`)입니다. 이 문장의 판정 근거 규칙(`Evidence.ruleId`)으로 고르고,
        깊이 explain이라 잠그지 않습니다. 그 규칙의 문장이 없으면 생략합니다.
        깊이 evidence의 판정 근거·원전 문장은 `evidence[]`의 `basis`·`source`입니다.

        `reactable`은 총운 슬롯(`daily.fortune.head`·`daily.fortune.tag`)만 true입니다.
        `variant`는 유형 슬롯이면 `advice`·`state`·`care`, 가이드 슬롯이면 `1`·`2`, 그 밖은 `single`입니다.

        문장이 없을 때: 필수 문장 필드(`text`)는 템플릿(writing 원고)이 없으면 빈 `segments`로 오고,
        선택 문장 필드(`todayReason`·`Evidence.basis`·`Evidence.source`)는 생략합니다.
      required: [slot, messageKey, variant, text, reactable]
      properties:
        slot:
          type: string
          description: writing 슬롯 id(예 `daily.fortune.head`)
        messageKey:
          type: string
        variant:
          type: string
          enum: [advice, state, care, '1', '2', single]
        text:
          $ref: '#/components/schemas/RenderedText'
        reactable:
          type: boolean
        reaction:
          type: string
          enum: [like]
          description: 이 사용자가 남긴 반응. 반응이 없으면 생략합니다.
        todayReason:
          $ref: '#/components/schemas/RenderedText'
        evidence:
          type: array
          description: 판정 근거. 응답의 `evidenceAccess`가 `unlocked`일 때만 담깁니다.
          items:
            $ref: '#/components/schemas/Evidence'
    Evidence:
      type: object
      description: |
        판정 근거 하나입니다. `ruleId`는 core 근거 규칙 목록(`core/evidence_rules.json`), `sourceRef`는 원전 목록(`core/evidence_sources.json`)의 키입니다.
        `basis`는 근거 시트의 판정 근거 문장(writing 슬롯 `evidence.basis`, 키 `basis.<ruleId>`, `detail` 값을 매개변수로 렌더)이고,
        `source`는 원전 인용 문장(writing 슬롯 `evidence.source`, 키 `source.<sourceRef>`, 원전 이름·대목·뜻)입니다. 문장이 없으면 각각 생략합니다.
      required: [ruleId, sourceRef]
      properties:
        ruleId:
          type: string
        sourceRef:
          type: string
        detail:
          type: object
          additionalProperties:
            type: string
        basis:
          $ref: '#/components/schemas/RenderedText'
        source:
          $ref: '#/components/schemas/RenderedText'
    EvidenceAccess:
      type: string
      enum: [unlocked, locked]
      description: |
        근거 열람 권한 상태(D60). 권한이 없으면 `locked`이고, evidence 깊이의 해석(판정 근거, 원전, 원국 개인 해석, 용신 근거)을 응답에서 뺍니다.
        surface·explain과 표 데이터는 잠그지 않습니다. 근거가 원래 없는 것과 잠겨서 빠진 것을 이 값으로 구분합니다.
    Notice:
      type: object
      description: |
        엔진 안내입니다. `text`는 writing 문구가 없으면 빈 `segments`이고, 그때 app은 배너를 그리지 않습니다.
      required: [code, text]
      properties:
        code:
          $ref: '#/components/schemas/NoticeCode'
        text:
          $ref: '#/components/schemas/RenderedText'
    NoticeCode:
      type: string
      enum:
        - ambiguous_local_time
        - nonexistent_local_time
        - zi_hour_next_day
        - time_unknown
        - near_solar_term
        - dayun_start_approximate
        - focus_time_fallback

    # ---- 엔진 enum (proto enum 이름에서 접두어를 떼고 소문자로, glossary 키 규칙과 같음) ----
    Stem:
      type: string
      enum: [gap, eul, byeong, jeong, mu, gi, gyeong, sin, im, gye]
    Branch:
      type: string
      enum: [ja, chuk, in, myo, jin, sa, o, mi, shin, yu, sul, hae]
    FiveElement:
      type: string
      enum: [wood, fire, earth, metal, water]
    ElementRole:
      type: string
      enum: [yongsin, tonggwan]
    TenGod:
      type: string
      enum: [bigyeon, geopjae, siksin, sanggwan, pyeonjae, jeongjae, pyeongwan, jeonggwan, pyeonin, jeongin]
    TwelveStage:
      type: string
      enum: [jangsaeng, mokyok, gwandae, geonrok, jewang, soe, byeong, sa, myo, jeol, tae, yang]
    ShinsalKind:
      type: string
      enum: [cheoneul_gwiin, dohwa, yeokma, hwagae, yangin, gongmang]
    Position:
      type: string
      enum: [year_stem, year_branch, month_stem, month_branch, day_stem, day_branch, hour_stem, hour_branch]
    Direction:
      type: string
      enum: [n, ne, e, se, s, sw, w, nw]
    DayKind:
      type: string
      enum: [gwiin_day, yongsin_day, gisin_day, ordinary_day]
    StrengthLevel:
      type: string
      enum: [very_weak, weak, neutral, strong, very_strong]
    YongsinMethod:
      type: string
      enum: [johu, johu_neutral, eokbu]
    LuckLevel:
      type: string
      enum: [good, neutral, caution]
    RelationKind:
      type: string
      enum: [stem_hap, branch_hap, chung, hyeong]
    SolarTermKind:
      type: string
      enum:
        - sohan
        - daehan
        - ipchun
        - usu
        - gyeongchip
        - chunbun
        - cheongmyeong
        - gogu
        - ipha
        - soman
        - mangjong
        - haji
        - soseo
        - daeseo
        - ipchu
        - cheoseo
        - baengno
        - chubun
        - hallo
        - sanggang
        - ipdong
        - soseol
        - daeseol
        - dongji

    # ---- 인증·계정 ----
    KakaoLoginRequest:
      type: object
      required: [idToken, nonce]
      properties:
        idToken:
          type: string
          description: 카카오 OIDC id_token
        nonce:
          type: string
          description: nonce 원문입니다. app은 제공자(카카오·Apple)에게 이 원문의 SHA-256 소문자 hex를 nonce로 보냅니다. server는 id_token의 `nonce` claim이 SHA-256(원문) hex와 같은지 확인합니다.
          minLength: 16
          maxLength: 256
    AppleLoginRequest:
      type: object
      required: [idToken, authorizationCode, nonce]
      properties:
        idToken:
          type: string
          description: Apple identity_token
        authorizationCode:
          type: string
        nonce:
          type: string
          description: nonce 원문입니다. app은 제공자(카카오·Apple)에게 이 원문의 SHA-256 소문자 hex를 nonce로 보냅니다. server는 id_token의 `nonce` claim이 SHA-256(원문) hex와 같은지 확인합니다.
          minLength: 16
          maxLength: 256
    AppleWebLoginRequest:
      type: object
      required: [exchangeCode, nonce]
      properties:
        exchangeCode:
          type: string
          description: '`appleCallback`이 app link로 넘긴 교환 코드(256비트 난수의 base64url, 패딩 없음)'
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
        nonce:
          type: string
          description: nonce 원문입니다. app은 제공자(카카오·Apple)에게 이 원문의 SHA-256 소문자 hex를 nonce로 보냅니다. server는 Apple id_token의 `nonce` claim이 SHA-256(원문) hex와 같은지 확인합니다.
          minLength: 16
          maxLength: 256
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    TokenPair:
      type: object
      required: [accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt]
      properties:
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshTokenExpiresAt:
          type: string
          format: date-time
    LoginResponse:
      type: object
      required: [tokens, isNewAccount, consentRequired, restoredFromDeletion]
      properties:
        tokens:
          $ref: '#/components/schemas/TokenPair'
        isNewAccount:
          type: boolean
        consentRequired:
          type: boolean
        restoredFromDeletion:
          type: boolean
          description: 삭제 대기 중이던 계정이 이 로그인으로 되돌아왔는지
    Me:
      type: object
      required: [accountId, status, consentRequired, requiredConsents, hasProfile, adFree, insight]
      properties:
        accountId:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, pending_deletion]
        deletionScheduledAt:
          type: string
          format: date-time
          description: '`status`가 `pending_deletion`일 때만 있습니다.'
        consentRequired:
          type: boolean
        requiredConsents:
          type: array
          description: 동의해야 할 문서와 현재 버전
          items:
            $ref: '#/components/schemas/ConsentDocument'
        hasProfile:
          type: boolean
        adFree:
          $ref: '#/components/schemas/AdFree'
        insight:
          $ref: '#/components/schemas/Insight'
    ConsentDocument:
      type: object
      required: [document, version]
      properties:
        document:
          type: string
          enum: [terms, privacy]
        version:
          type: string
    ConsentRequest:
      type: object
      required: [documents]
      properties:
        documents:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ConsentDocument'
    DeletionScheduled:
      type: object
      required: [deletionScheduledAt]
      properties:
        deletionScheduledAt:
          type: string
          format: date-time

    # ---- 프로필 ----
    LunarOrSolarDate:
      type: object
      description: |
        달력 날짜. 음력 30일이 있어 `format: date`를 쓰지 않습니다.
        양력인데 달력에 없는 날짜(예 2월 31일)면 422 `date.invalid`, 음력 날짜가 실제로 있는지는 엔진 판정(422 `birth.invalid`)입니다.
      required: [year, month, day]
      properties:
        year:
          type: integer
          minimum: 1900
          maximum: 2099
        month:
          type: integer
          minimum: 1
          maximum: 12
        day:
          type: integer
          minimum: 1
          maximum: 31
    BirthTime:
      type: object
      description: |
        `status`가 `known`일 때만 `value`가 있습니다. `unknown`은 사용자가 "모름"을 고른 것입니다.
        `known`인데 `value`가 없으면 422 `request.inconsistent`(`required_by_status`), `unknown`인데 `value`가 있으면 `forbidden_by_status`입니다.
      required: [status]
      properties:
        status:
          type: string
          enum: [known, unknown]
        value:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: HH:MM
    BirthPlace:
      type: object
      description: |
        `status`가 `city`일 때만 `cityId`가 있습니다. `not_asked`는 묻지 않음(한국 기기), `skipped`는 물었지만 건너뜀입니다.
        `city`인데 `cityId`가 없으면 422 `request.inconsistent`(`required_by_status`), 그 밖의 상태인데 `cityId`가 있으면 `forbidden_by_status`입니다.
      required: [status]
      properties:
        status:
          type: string
          enum: [not_asked, skipped, city]
        cityId:
          type: string
          description: '`City.id`'
    Birth:
      type: object
      required: [calendar, date, isLeapMonth, time, gender, timezone, place]
      properties:
        calendar:
          $ref: '#/components/schemas/CalendarType'
        date:
          $ref: '#/components/schemas/LunarOrSolarDate'
        isLeapMonth:
          type: boolean
          description: |
            `calendar`가 `solar`면 false입니다. 양력인데 true면 422 `request.inconsistent`(`forbidden_by_status`)입니다.
            음력 날짜가 존재하지 않으면(예 윤달이 없는 달의 윤달) 엔진 판정 422 `birth.invalid`입니다.
        time:
          $ref: '#/components/schemas/BirthTime'
        gender:
          type: string
          enum: [male, female]
        timezone:
          type: string
          description: 출생 시간대 IANA 이름(예 `Asia/Seoul`)
        place:
          $ref: '#/components/schemas/BirthPlace'
    CalendarType:
      type: string
      enum: [solar, lunar]
    NotificationSetting:
      type: object
      description: |
        `status`가 `enabled`일 때만 `time`이 있습니다.
        `enabled`인데 `time`이 없으면 422 `request.inconsistent`(`required_by_status`), 그 밖의 상태인데 `time`이 있으면 `forbidden_by_status`입니다.
      required: [status]
      properties:
        status:
          type: string
          enum: [not_asked, enabled, disabled]
        time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][05]$'
          description: HH:MM. 분은 5의 배수이며, 아니면 `pattern` 위반 400 `request.invalid`입니다.
    ProfileInput:
      type: object
      required: [honorific, language, currentTimezone, birth, notification]
      properties:
        honorific:
          type: string
          minLength: 1
          maxLength: 20
          description: 호칭
        language:
          $ref: '#/components/schemas/Language'
        currentTimezone:
          type: string
          description: 현재 기기 시간대 IANA 이름. "오늘"의 기준입니다.
        birth:
          $ref: '#/components/schemas/Birth'
        notification:
          $ref: '#/components/schemas/NotificationSetting'
    ProfilePatch:
      type: object
      description: |
        `ProfileInput`의 모든 필드를 생략할 수 있습니다. 생략은 "바꾸지 않음"입니다.
        `birth`와 `notification`은 안쪽 필드를 합치지 않고 통째로 바꿉니다.
      properties:
        honorific:
          type: string
          minLength: 1
          maxLength: 20
          description: 호칭
        language:
          $ref: '#/components/schemas/Language'
        currentTimezone:
          type: string
          description: 현재 기기 시간대 IANA 이름
        birth:
          $ref: '#/components/schemas/Birth'
        notification:
          $ref: '#/components/schemas/NotificationSetting'
    Profile:
      type: object
      description: |
        저장된 프로필입니다. `birthCity`는 출생 도시(`birth.place.status`가 `city`일 때만)이고 이름은 프로필 언어입니다.
        `birthCity.longitude`는 계산에 쓴 저장된 경도입니다. 도시 자료가 바뀌어 저장된 도시를 찾지 못하면 `city`여도 `birthCity`를 뺍니다.
        계산 기준 화면의 경도 안내에 씁니다. 응답에만 있는 필드이며, 요청(`ProfileInput`·`ProfilePatch`)은 `birth.place.cityId`로만 보냅니다.
      required: [honorific, language, currentTimezone, birth, notification]
      properties:
        honorific:
          type: string
          minLength: 1
          maxLength: 20
          description: 호칭
        language:
          $ref: '#/components/schemas/Language'
        currentTimezone:
          type: string
          description: 현재 기기 시간대 IANA 이름
        birth:
          $ref: '#/components/schemas/Birth'
        notification:
          $ref: '#/components/schemas/NotificationSetting'
        birthCity:
          $ref: '#/components/schemas/City'
    ProfileResponse:
      type: object
      required: [profile, warnings]
      properties:
        profile:
          $ref: '#/components/schemas/Profile'
        warnings:
          type: array
          description: 오류가 아닌 호칭 경고. `code`는 `name.suffix_stripped` 또는 `name.suffix_warning`입니다.
          items:
            $ref: '#/components/schemas/FieldError'

    # ---- 운세 공용 ----
    Pillar:
      type: object
      required: [stem, branch]
      properties:
        stem:
          $ref: '#/components/schemas/Stem'
        branch:
          $ref: '#/components/schemas/Branch'
    Tag:
      type: object
      required: [key, polarity]
      properties:
        key:
          type: string
          description: 태그 키(glossary `tag` 범주의 키)
        polarity:
          type: string
          enum: [good, bad, neutral]
          description: 태그의 길흉. 엔진 spec §7.7 표의 값입니다.
    Fortune:
      type: object
      description: 총운. `tag`는 대표 태그가 있을 때의 보조 문장입니다.
      required: [head]
      properties:
        head:
          $ref: '#/components/schemas/SlotText'
        tag:
          $ref: '#/components/schemas/SlotText'
    DayTags:
      type: object
      required: [featured, all]
      properties:
        featured:
          type: array
          description: 화면에 보일 대표 태그 0~2개
          maxItems: 2
          items:
            $ref: '#/components/schemas/Tag'
        all:
          type: array
          description: 전체 태그 키
          items:
            type: string

    # ---- 하루 운세 ----
    Daily:
      type: object
      description: "`characterReason`은 슬롯 `character.reason`(키 `character.reason.<dayKind>`)입니다."
      required: [date, rulesetVersion, evidenceAccess, dayPillar, dayKind, characterReason, fortune, guide, cards, tags, relations, notices]
      properties:
        date:
          type: string
          format: date
        rulesetVersion:
          type: string
        evidenceAccess:
          $ref: '#/components/schemas/EvidenceAccess'
        dayPillar:
          $ref: '#/components/schemas/Pillar'
        dayKind:
          $ref: '#/components/schemas/DayKind'
        characterReason:
          $ref: '#/components/schemas/SlotText'
        fortune:
          $ref: '#/components/schemas/Fortune'
        guide:
          $ref: '#/components/schemas/SlotText'
        cards:
          $ref: '#/components/schemas/DailyCards'
        tags:
          $ref: '#/components/schemas/DayTags'
        relations:
          type: array
          description: 일진과 원국의 관계
          items:
            $ref: '#/components/schemas/Relation'
        notices:
          type: array
          items:
            $ref: '#/components/schemas/Notice'
    DailyCards:
      type: object
      required: [color, direction, number, focusTime]
      properties:
        color:
          $ref: '#/components/schemas/ColorCard'
        direction:
          $ref: '#/components/schemas/DirectionCard'
        number:
          $ref: '#/components/schemas/NumberCard'
        focusTime:
          $ref: '#/components/schemas/FocusTimeCard'
    ColorCard:
      type: object
      required: [element, role, text]
      properties:
        element:
          $ref: '#/components/schemas/FiveElement'
        role:
          $ref: '#/components/schemas/ElementRole'
        text:
          $ref: '#/components/schemas/SlotText'
    DirectionCard:
      type: object
      required: [direction, text]
      properties:
        direction:
          $ref: '#/components/schemas/Direction'
        text:
          $ref: '#/components/schemas/SlotText'
    NumberCard:
      type: object
      required: [number, text]
      properties:
        number:
          type: integer
        text:
          $ref: '#/components/schemas/SlotText'
    FocusTimeCard:
      type: object
      required: [picks, fallback, text]
      properties:
        picks:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/FocusSlot'
        fallback:
          type: boolean
        text:
          $ref: '#/components/schemas/SlotText'
    FocusSlot:
      type: object
      required: [branch, start, end, huangdaoLucky, reasons]
      properties:
        branch:
          $ref: '#/components/schemas/Branch'
        start:
          type: string
          format: date-time
          description: 프로필 현재 시간대의 offset으로 나타냅니다.
        end:
          type: string
          format: date-time
          description: 프로필 현재 시간대의 offset으로 나타냅니다.
        huangdaoLucky:
          type: boolean
          description: 황도길시
        reasons:
          type: array
          description: 가점 사유 식별자(glossary `focus_reason` 범주의 키)
          items:
            type: string
            enum: [gwiin, yongsin, huisin, hap]
    Relation:
      type: object
      description: '`suppressedBy`는 `suppressed`가 true일 때만 있습니다.'
      required: [kind, natalPosition, suppressed]
      properties:
        kind:
          $ref: '#/components/schemas/RelationKind'
        natalPosition:
          $ref: '#/components/schemas/Position'
        suppressed:
          type: boolean
        suppressedBy:
          $ref: '#/components/schemas/RelationKind'

    # ---- 나의 사주 ----
    Chart:
      type: object
      description: |
        나의 사주 화면 묶음입니다.
        나의 사주 문장 셋은 근거 열람 권한과 상관없이 오고, 원고가 없거나 고를 값이 없으면 생략합니다(선택 필드).
        * `ilganHead`: 일간 소개 첫 문장(writing 슬롯 `chart.ilgan_head`, IA `my-saju.ilgan.head`). 키는 `ilgan.head.<pillars.day.stem>`이고 호칭을 씁니다.
        * `ilganBody`: 일간 소개 이어지는 문장(`chart.ilgan_body`, IA `my-saju.ilgan.body`). 키는 `ilgan.body.<pillars.day.stem>`입니다.
        * `yongsinSummary`: 용신과 행운 색 설명(`chart.yongsin_summary`, IA `my-saju.yongsin.body`). 키는 `yongsin.summary`이고 매개변수는 `yongsin.yongsin`입니다.
      required:
        - rulesetVersion
        - evidenceAccess
        - pillars
        - tenGods
        - hiddenStems
        - twelveStages
        - shinsal
        - gongmang
        - elementWeights
        - strength
        - yongsin
        - daeun
        - seun
        - notices
      properties:
        rulesetVersion:
          type: string
        evidenceAccess:
          $ref: '#/components/schemas/EvidenceAccess'
        pillars:
          $ref: '#/components/schemas/ChartPillars'
        tenGods:
          type: array
          items:
            $ref: '#/components/schemas/TenGodAt'
        hiddenStems:
          type: array
          items:
            $ref: '#/components/schemas/HiddenStemsAt'
        twelveStages:
          type: array
          items:
            $ref: '#/components/schemas/TwelveStageAt'
        shinsal:
          type: array
          items:
            $ref: '#/components/schemas/ShinsalAt'
        gongmang:
          type: array
          items:
            $ref: '#/components/schemas/Branch'
        elementWeights:
          type: array
          items:
            $ref: '#/components/schemas/ElementWeight'
        strength:
          $ref: '#/components/schemas/Strength'
        yongsin:
          $ref: '#/components/schemas/Yongsin'
        daeun:
          $ref: '#/components/schemas/Daeun'
        seun:
          type: array
          items:
            $ref: '#/components/schemas/SeunYear'
        notices:
          type: array
          items:
            $ref: '#/components/schemas/Notice'
        ilganHead:
          $ref: '#/components/schemas/SlotText'
        ilganBody:
          $ref: '#/components/schemas/SlotText'
        yongsinSummary:
          $ref: '#/components/schemas/SlotText'
        personalReadings:
          type: array
          description: |
            원국 개인 해석("내 사주에서는")입니다. 근거 열람 권한이 없으면(`evidenceAccess: locked`) 이 필드가 없습니다(D60).
            원고가 없는 항목은 빠집니다. 앱은 누른 용어의 (`kind`, `position`, `index`, `shinsal`)로 항목을 찾습니다.
          items:
            $ref: '#/components/schemas/PersonalReading'
    PersonalReading:
      type: object
      description: |
        원국 개인 해석 한 항목입니다. 앱이 누른 용어를 (`kind`, `position`, `index`, `shinsal`)로 찾습니다.
        각 필드는 아래 `kind`에서만 있습니다.
        * `day_master` 일간. `position`은 `day_stem`.
        * `ten_god` 원국 천간·지지의 십성. `position`.
        * `hidden_ten_god` 지장간의 십성. `position`(지지)과 `index`(지장간 순서, 0이 정기).
        * `twelve_stage` 원국 지지의 12운성. `position`.
        * `shinsal` 원국 신살. `position`과 `shinsal`.
        * `daeun_stem_ten_god`·`daeun_branch_ten_god`·`daeun_twelve_stage` 대운. `index`는 `Daeun.periods` 순서. `position`은 없습니다.
        * `seun_ten_god` 세운. `index`는 `Chart.seun` 순서. `position`은 없습니다.
        `index`는 `hidden_ten_god`과 대운·세운 kind에서만 의미가 있고, 그 밖에는 없습니다.
      required: [kind, text]
      properties:
        kind:
          type: string
          enum:
            - day_master
            - ten_god
            - hidden_ten_god
            - twelve_stage
            - shinsal
            - daeun_stem_ten_god
            - daeun_branch_ten_god
            - daeun_twelve_stage
            - seun_ten_god
          # 생성 상수 이름이 TenGod·Shinsal 같은 타입 이름과 겹치지 않게 접두어를 붙입니다.
          x-enum-varnames:
            - PersonalReadingKindDayMaster
            - PersonalReadingKindTenGod
            - PersonalReadingKindHiddenTenGod
            - PersonalReadingKindTwelveStage
            - PersonalReadingKindShinsal
            - PersonalReadingKindDaeunStemTenGod
            - PersonalReadingKindDaeunBranchTenGod
            - PersonalReadingKindDaeunTwelveStage
            - PersonalReadingKindSeunTenGod
        position:
          $ref: '#/components/schemas/Position'
        index:
          type: integer
          minimum: 0
        shinsal:
          $ref: '#/components/schemas/ShinsalKind'
        text:
          $ref: '#/components/schemas/RenderedText'
    ChartPillars:
      type: object
      description: 원국 네 기둥. 출생 시각이 `unknown`이면 `hour`를 생략합니다.
      required: [year, month, day]
      properties:
        year:
          $ref: '#/components/schemas/Pillar'
        month:
          $ref: '#/components/schemas/Pillar'
        day:
          $ref: '#/components/schemas/Pillar'
        hour:
          $ref: '#/components/schemas/Pillar'
    TenGodAt:
      type: object
      required: [position, tenGod]
      properties:
        position:
          $ref: '#/components/schemas/Position'
        tenGod:
          $ref: '#/components/schemas/TenGod'
    HiddenStemsAt:
      type: object
      required: [position, stems]
      properties:
        position:
          $ref: '#/components/schemas/Position'
        stems:
          type: array
          items:
            $ref: '#/components/schemas/HiddenStem'
    HiddenStem:
      type: object
      required: [stem, tenGod]
      properties:
        stem:
          $ref: '#/components/schemas/Stem'
        tenGod:
          $ref: '#/components/schemas/TenGod'
    TwelveStageAt:
      type: object
      required: [position, stage]
      properties:
        position:
          $ref: '#/components/schemas/Position'
        stage:
          $ref: '#/components/schemas/TwelveStage'
    ShinsalAt:
      type: object
      required: [kind, position]
      properties:
        kind:
          $ref: '#/components/schemas/ShinsalKind'
        position:
          $ref: '#/components/schemas/Position'
    ElementWeight:
      type: object
      required: [element, weight]
      properties:
        element:
          $ref: '#/components/schemas/FiveElement'
        weight:
          type: number
    Strength:
      type: object
      required: [score, level]
      properties:
        score:
          type: number
        level:
          $ref: '#/components/schemas/StrengthLevel'
    Yongsin:
      type: object
      description: |
        `johuStem`은 조후 천간이 없으면 생략합니다.
        `basis`(용신 근거 문장)는 evidence 깊이라 응답의 `evidenceAccess`가 `locked`면 생략합니다.
      required: [yongsin, huisin, gisin, tonggwan, method]
      properties:
        yongsin:
          $ref: '#/components/schemas/FiveElement'
        huisin:
          $ref: '#/components/schemas/FiveElement'
        gisin:
          $ref: '#/components/schemas/FiveElement'
        tonggwan:
          $ref: '#/components/schemas/FiveElement'
        method:
          $ref: '#/components/schemas/YongsinMethod'
        johuStem:
          $ref: '#/components/schemas/Stem'
        basis:
          $ref: '#/components/schemas/SlotText'
    Daeun:
      type: object
      required: [forward, startYears, startMonths, periods]
      properties:
        forward:
          type: boolean
          description: 순행 여부
        startYears:
          type: integer
        startMonths:
          type: integer
        periods:
          type: array
          items:
            $ref: '#/components/schemas/DaeunPeriod'
    DaeunPeriod:
      type: object
      required: [pillar, startAge, startAgeKorean, stemTenGod, branchTenGod, twelveStage]
      properties:
        pillar:
          $ref: '#/components/schemas/Pillar'
        startAge:
          type: integer
          description: 만 나이
        startAgeKorean:
          type: integer
          description: 한국식 나이
        stemTenGod:
          $ref: '#/components/schemas/TenGod'
        branchTenGod:
          $ref: '#/components/schemas/TenGod'
        twelveStage:
          $ref: '#/components/schemas/TwelveStage'
    SeunYear:
      type: object
      required: [year, pillar, tenGod, relationsWithNatal]
      properties:
        year:
          type: integer
        pillar:
          $ref: '#/components/schemas/Pillar'
        tenGod:
          $ref: '#/components/schemas/TenGod'
        relationsWithNatal:
          type: array
          items:
            $ref: '#/components/schemas/RelationKind'

    # ---- 달력 ----
    Calendar:
      type: object
      required: [year, month, rulesetVersion, evidenceAccess, days]
      properties:
        year:
          type: integer
        month:
          type: integer
        rulesetVersion:
          type: string
        evidenceAccess:
          $ref: '#/components/schemas/EvidenceAccess'
        days:
          type: array
          items:
            $ref: '#/components/schemas/CalendarDay'
    CalendarDay:
      type: object
      description: '`solarTerm`은 입절일에만 있습니다. `characterReason`은 슬롯 `character.reason`(키 `character.reason.<dayKind>`)입니다.'
      required: [date, pillar, lunar, dayKind, characterReason, luckLevel, score, level]
      properties:
        date:
          type: string
          format: date
        pillar:
          $ref: '#/components/schemas/Pillar'
        lunar:
          $ref: '#/components/schemas/LunarDate'
        solarTerm:
          $ref: '#/components/schemas/SolarTerm'
        dayKind:
          $ref: '#/components/schemas/DayKind'
        characterReason:
          $ref: '#/components/schemas/SlotText'
        luckLevel:
          $ref: '#/components/schemas/LuckLevel'
        score:
          type: integer
        level:
          $ref: '#/components/schemas/SlotText'
    LunarDate:
      type: object
      required: [month, day, isLeapMonth]
      properties:
        month:
          type: integer
        day:
          type: integer
        isLeapMonth:
          type: boolean
    SolarTerm:
      type: object
      required: [kind, at]
      properties:
        kind:
          $ref: '#/components/schemas/SolarTermKind'
        at:
          type: string
          format: date-time
          description: 프로필 현재 시간대의 offset으로 나타냅니다.
    ReactionInput:
      type: object
      required: [reaction]
      properties:
        reaction:
          type: string
          enum: [like]
    Glossary:
      type: object
      required: [seedVersion, lang, values, meanings, hanja]
      properties:
        seedVersion:
          type: string
        lang:
          $ref: '#/components/schemas/Language'
        values:
          type: object
          description: |
            범주 → (값 → 이름). 범주는 writing `glossary.value_name` 키의 `<범주>`, 그리고 `tag`·`focus_reason`·`score_item`·`solar_term`입니다.
          additionalProperties:
            type: object
            additionalProperties:
              type: string
        meanings:
          type: object
          description: 용어 id → 뜻 문장(writing 슬롯 `term.meaning`, 키 `term.<용어 id>`)
          additionalProperties:
            $ref: '#/components/schemas/RenderedText'
        hanja:
          type: object
          description: 용어 id → 한자 표기(예 `ten_god.siksin` → `食神`). 풀이 시트 제목 옆에 씁니다. 한자 표기가 없는 용어는 키가 없습니다.
          additionalProperties:
            type: string

    # ---- 비로그인 ----
    PreviewRequest:
      type: object
      required: [installationId, currentTimezone, birth]
      properties:
        installationId:
          type: string
          minLength: 1
          maxLength: 128
          description: 앱 설치마다 만든 무작위 값
        currentTimezone:
          type: string
          description: 현재 기기 시간대 IANA 이름
        birth:
          $ref: '#/components/schemas/Birth'
    Preview:
      type: object
      description: |
        로그인 없는 미리보기 결과. `evidenceAccess`는 항상 `locked`입니다. 미리보기는 근거 열람 권한과 무관하게 evidence 깊이를 담지 않으며,
        근거가 원래 없는 것과 구분하려고 이 값을 둡니다.
        `fortune.tag`가 IA `preview.fortune.body`입니다.
      required: [date, evidenceAccess, dayKind, dayKindName, fortune, featuredTags, notices]
      properties:
        date:
          type: string
          format: date
        evidenceAccess:
          $ref: '#/components/schemas/EvidenceAccess'
        dayKind:
          $ref: '#/components/schemas/DayKind'
        dayKindName:
          type: string
          description: 날의 성격 이름(writing `glossary.value_name`의 `day_kind`). 미리보기는 로그인 전이라 `getGlossary`를 쓸 수 없어 이름을 함께 싣습니다(D68②).
        fortune:
          $ref: '#/components/schemas/Fortune'
        featuredTags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        notices:
          type: array
          items:
            $ref: '#/components/schemas/Notice'
    BirthHourRequest:
      type: object
      required: [installationId, calendar, date, isLeapMonth, time]
      properties:
        installationId:
          type: string
          minLength: 1
          maxLength: 128
          description: 앱 설치마다 만든 무작위 값
        calendar:
          $ref: '#/components/schemas/CalendarType'
        date:
          $ref: '#/components/schemas/LunarOrSolarDate'
        isLeapMonth:
          type: boolean
          description: '`calendar`가 `solar`면 false입니다. 양력인데 true면 422 `request.inconsistent`(`forbidden_by_status`)입니다.'
        time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: HH:MM
    LunarDateRequest:
      type: object
      description: 음력 날짜를 양력으로 바꿔 달라는 요청입니다. `date`는 음력 연·월·일입니다.
      required: [installationId, date, isLeapMonth]
      properties:
        installationId:
          type: string
          minLength: 1
          maxLength: 128
          description: 앱 설치마다 만든 무작위 값
        date:
          $ref: '#/components/schemas/LunarOrSolarDate'
        isLeapMonth:
          type: boolean
          description: 윤달이면 true입니다. 그해 그 달에 윤달이 없으면 422 `date.invalid`입니다.
    LunarConversion:
      type: object
      required: [solarDate, monthHasLeap]
      properties:
        solarDate:
          type: string
          format: date
          description: 변환한 양력 날짜
        monthHasLeap:
          type: boolean
          description: 그해 그 음력 달에 윤달이 있는지
    BirthHour:
      type: object
      required: [branch, start, end]
      properties:
        branch:
          $ref: '#/components/schemas/Branch'
        start:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: HH:MM, 벽시계 기준
        end:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: HH:MM, 벽시계 기준

    # ---- 일기 ----
    DiaryInput:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 10000
    Diary:
      type: object
      required: [date, body, tags, rulesetVersion, createdAt, updatedAt]
      properties:
        date:
          type: string
          format: date
        body:
          type: string
        guideQuestion:
          $ref: '#/components/schemas/RenderedText'
        tags:
          $ref: '#/components/schemas/DayTags'
        rulesetVersion:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DiaryList:
      type: object
      description: '`nextCursor`가 없으면 마지막 쪽입니다.'
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DiarySummary'
        nextCursor:
          type: string
    DiarySummary:
      type: object
      required: [date, excerpt, featuredTags]
      properties:
        date:
          type: string
          format: date
        excerpt:
          type: string
          description: 본문 앞 100자
        featuredTags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'

    # ---- 일정 ----
    ScheduleInput:
      type: object
      description: |
        `time`은 `allDay`가 false일 때만 있습니다. `allDay`가 false인데 `time`이 없으면 422 `request.inconsistent`(`required_by_status`),
        `allDay`가 true인데 `time`이 있으면 `forbidden_by_status`입니다.
      required: [date, allDay, title]
      properties:
        date:
          type: string
          format: date
        allDay:
          type: boolean
        time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: HH:MM
        title:
          type: string
          minLength: 1
          maxLength: 100
        memo:
          type: string
          minLength: 0
          maxLength: 2000
    SchedulePatch:
      type: object
      description: |
        `ScheduleInput`의 모든 필드를 생략할 수 있습니다. 생략은 "바꾸지 않음"입니다.
        `allDay`를 true로 바꾸면 `time`이 지워집니다. 적용한 결과로 짝을 검사합니다. `allDay`를 false로 바꾸면서 `time`이 없고 기존에도 없으면
        422 `request.inconsistent`(`required_by_status`, field `/time`), 결과가 `allDay` true인데 `time`을 함께 보내면 `forbidden_by_status`입니다.
        `memo`는 빈 문자열로 지웁니다.
      properties:
        date:
          type: string
          format: date
        allDay:
          type: boolean
        time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: HH:MM
        title:
          type: string
          minLength: 1
          maxLength: 100
        memo:
          type: string
          minLength: 0
          maxLength: 2000
    Schedule:
      type: object
      description: '`time`은 `allDay`가 false일 때만 있습니다.'
      required: [id, date, allDay, title, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        allDay:
          type: boolean
        time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: |
            HH:MM. 프로필의 현재 시간대(`currentTimezone`) 벽시계 시각입니다(D30과 같은 기준).
            끝 시각(길이) 필드는 없습니다.
        title:
          type: string
          minLength: 1
          maxLength: 100
        memo:
          type: string
          minLength: 0
          maxLength: 2000
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ScheduleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Schedule'

    # ---- 기기·결제·권한 ----
    DevicePlatform:
      type: string
      enum: [ios, android]
    DeviceInput:
      type: object
      required: [fcmToken, platform]
      properties:
        fcmToken:
          type: string
          minLength: 1
          maxLength: 4096
        platform:
          $ref: '#/components/schemas/DevicePlatform'
    Device:
      type: object
      required: [id, platform]
      properties:
        id:
          type: string
          format: uuid
        platform:
          $ref: '#/components/schemas/DevicePlatform'
    AdFree:
      type: object
      description: 광고 제거권. 만료일이 없으면 `expiresAt`을 생략합니다.
      required: [active]
      properties:
        active:
          type: boolean
        expiresAt:
          type: string
          format: date-time
    Insight:
      type: object
      description: |
        근거 열람 권한(D60). `active`가 true면 `expiresAt`과 `source`가 있습니다.
        여러 부여(예 보상형 광고와 광고 제거권)가 겹치면 만료가 가장 늦은 부여의 `expiresAt`·`source`를 보냅니다.
        `rewarded_ad`는 보상형 광고(그날 자정까지), `ad_free_pass`는 광고 제거권 기간, `subscription`은 구독입니다.
      required: [active]
      properties:
        active:
          type: boolean
        expiresAt:
          type: string
          format: date-time
        source:
          type: string
          enum: [rewarded_ad, ad_free_pass, subscription]
    Entitlements:
      type: object
      required: [adFree, insight]
      properties:
        adFree:
          $ref: '#/components/schemas/AdFree'
        insight:
          $ref: '#/components/schemas/Insight'

    # ---- 참조 ----
    City:
      type: object
      required: [id, name, country, countryName, timezone, longitude]
      properties:
        id:
          type: string
          description: GeoNames id
        name:
          type: string
          description: 요청 언어의 이름
        country:
          type: string
          pattern: '^[A-Z]{2}$'
          description: ISO 3166-1 alpha-2
        countryName:
          type: string
          description: 요청 언어의 나라 이름
        regionName:
          type: string
          description: 1차 행정구역 이름. GeoNames에 없으면 생략합니다.
        timezone:
          type: string
          description: IANA 이름
        longitude:
          type: number
          minimum: -180
          maximum: 180
          description: 경도(도 단위 소수, 동경 양수·서경 음수). 출생 시각의 경도 보정에 쓰는 값입니다.
    CityList:
      type: object
      required: [dataVersion, items]
      properties:
        dataVersion:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/City'
    AppConfig:
      type: object
      required: [minimumVersion, legal]
      properties:
        minimumVersion:
          $ref: '#/components/schemas/MinimumVersion'
        legal:
          $ref: '#/components/schemas/LegalLinks'
    LegalLinks:
      type: object
      description: |
        이용약관·개인정보 처리방침 정적 페이지의 절대 주소입니다(D80). app은 주소를 상수로 두지 않고 이 값을 씁니다.
        주소에는 query가 없고, app이 화면 언어로 `?lang=ko|en|ja`를 붙여 엽니다.
        페이지(`GET /legal/terms`·`GET /legal/privacy`)는 `/v1` 밖 정적 HTML이라 이 명세의 operation이 아닙니다.
        `lang`이 없거나 모르는 값이면 기본 언어 `en`이고, 그 언어의 원문이 아직 없으면 404와 준비 중 안내 페이지입니다(다른 언어로 대신하지 않음).
      required: [terms, privacy]
      properties:
        terms:
          type: string
          format: uri
          description: 이용약관 주소(예 `https://<서비스 도메인>/legal/terms`)
        privacy:
          type: string
          format: uri
          description: 개인정보 처리방침 주소(예 `https://<서비스 도메인>/legal/privacy`)
    MinimumVersion:
      type: object
      description: 플랫폼별 최소 앱 버전(semver 문자열)
      required: [ios, android]
      properties:
        ios:
          type: string
        android:
          type: string
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
