openapi: 3.1.0
info:
  title: 명리일기 API
  version: 1.0.0-draft.10
  description: |
    명리일기 server가 app에 제공하는 REST API v1 계약입니다(초안).

    공통 규약
    * JSON 필드는 camelCase입니다. 단, Apple이 보내는 `appleCallback`의 form 필드는 Apple이 정한 이름을 그대로 씁니다.
    * 날짜는 `YYYY-MM-DD`(`format: date`), 시각은 RFC 3339(`format: date-time`)입니다.
    * 시각(`date-time`)은 기본이 UTC이고, 화면 표시용 시각(`FocusSlot.start`·`end`, `CalendarDay.solarTerm.at`)만 프로필 현재 시간대의 offset으로 보냅니다.
    * 사용자의 선택(예: 출생 시각 모름, 출생지 건너뜀, 알림 끔)은 상태 필드로 보냅니다. 필드를 빼거나 `null`을 보내는 것으로 뜻을 담지 않습니다.
      생략 가능한 필드를 생략하면 "값 없음"만 뜻합니다. 이 계약에는 `null` 값이 없습니다.
    * PATCH(`application/merge-patch+json`)에서 필드가 없으면 "바꾸지 않음" 하나만 뜻합니다. `null`로 필드를 지우지 않습니다.
    * 요청 본문 상한은 1 MiB입니다. 넘으면 413 `request.too_large`입니다.
    * 언어는 bearer 요청이면 프로필의 `language`, 그 밖이면 `Accept-Language` 헤더를 씁니다. 지원 언어는 `ko`·`en`·`ja`이고, 헤더의 q값 순서로 첫 지원 언어를 고릅니다(`ko-KR`은 `ko`). 맞는 언어가 없거나 헤더가 없으면 기본 언어는 `en`입니다. `Accept-Language`는 middleware가 읽으므로 operation parameter로 적지 않습니다.
    * 생성하는 POST(`createSchedule`, `registerDevice`)는 `Idempotency-Key` 헤더를 받습니다. 24시간 동안 같은 키에는 같은 응답을 돌려줍니다.
    * 문장 필드는 조각 배열(`RenderedText`)입니다. 화면의 고정 UI 문구는 app 몫입니다.
    * 목록은 cursor 방식입니다(`cursor`, `limit`, 응답의 `nextCursor`). 기간(`from`·`to`)으로 받는 목록(`listSchedules`)은 cursor 없이 범위 안을 한 번에 돌려줍니다.

    오류
    * 모든 오류는 RFC 9457 `application/problem+json`(`Problem`)입니다. app은 `code`를 보고 자기 UI 문구로 보여 줍니다. `title`은 개발자용 영어입니다.
    * `type`은 `https://api.myungli.app/problems/<code>`입니다.
    * 400과 422의 경계: 스키마로 표현되는 형식·범위 위반(타입, 필수 필드, `enum`, `pattern`, 길이, `minimum`·`maximum`, `format`)은
      모두 400 `request.invalid`이고 `errors[].code`(위반한 keyword)로 구분합니다. 예를 들어 알림 시각의 분이 5의 배수가 아니면 `pattern` 위반 400입니다.
    * 422는 스키마로 표현할 수 없는 의미 검사에만 씁니다.
      * 형식은 맞지만 D41 지원 범위(양력 1900-01-31 ~ 2099-12-31) 밖인 날짜: `date.out_of_range`, 출생 정보는 `birth.out_of_range`
      * 정수 필드 객체 `LunarOrSolarDate`가 달력에 없는 날짜(예 양력 2월 31일): `date.invalid`.
        `format: date` 문자열(경로 parameter `date`, `ScheduleInput.date`·`SchedulePatch.date` 등)의 없는 날짜(예 `2026-02-30`)는
        스키마 형식 위반이라 422가 아니라 400 `request.invalid`입니다.
      * 상태-값 짝 위반: `request.inconsistent`. `errors[].field`는 JSON Pointer, `errors[].code`는 상태가 요구하는 값이 없으면
        `required_by_status`, 상태가 허용하지 않는 값이 있으면 `forbidden_by_status`입니다. 대상은 `BirthTime`(`status`·`value`),
        `BirthPlace`(`status`·`cityId`), 양력(`calendar: solar`)인데 `isLeapMonth`가 true, `NotificationSetting`(`status`·`time`),
        `ScheduleInput`·`SchedulePatch`(`allDay`·`time`)입니다.
      * 엔진 판정과 업무 규칙: 예 `birth.invalid`, `diary.future_date`, 호칭 규칙 위반, `idempotency.mismatch`

    근거 열람 권한 (D60)
    * 근거 열람 권한(`insight`)이 없으면 evidence 깊이의 해석(판정 근거, 원전, 원국 개인 해석, 용신 근거)을 응답에 담지 않고 `evidenceAccess: locked`로 표시합니다.
      근거가 원래 없는 것과 잠겨서 빠진 것을 `evidenceAccess`로 구분합니다. surface·explain과 사주 표·만세력·대운 표의 데이터는 잠그지 않습니다.
    * evidence 깊이의 문장(`Evidence.basis`·`Evidence.source`)은 `evidence[]`에 들어 있어 함께 빠집니다.
      explain 깊이의 문장(`SlotText.todayReason`, `Glossary.meanings`)과 용어 한자(`Glossary.hanja`)는 잠그지 않습니다.
servers:
  - url: /
security:
  - bearerAuth: []

paths:
  /v1/auth/kakao:
    post:
      operationId: loginKakao
      summary: 카카오 로그인
      description: 카카오 OIDC `id_token`과 nonce 원문을 검증하고 자체 토큰을 발급합니다. 처음 보는 계정이면 새로 만듭니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KakaoLoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/auth/apple:
    post:
      operationId: loginApple
      summary: Apple 로그인
      description: |
        Apple `identity_token`(`idToken`), `authorization_code`, nonce 원문을 검증하고 자체 토큰을 발급합니다.
        iOS 전용입니다. Android는 `appleCallback`과 `completeAppleWebLogin`을 씁니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleLoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/auth/apple/callback:
    post:
      operationId: appleCallback
      summary: Apple 웹 로그인 콜백 (Android)
      description: |
        Android의 Apple 웹 흐름에서 Apple이 form_post로 부르는 주소입니다. app이 직접 부르지 않습니다.
        server는 Apple의 값을 직접 검증하고 일회용 교환 코드를 만든 뒤 app link로 303 이동시킵니다. app은 그 교환 코드로 `completeAppleWebLogin`을 부릅니다.
        form 필드 이름은 Apple이 정한 그대로입니다.
        Apple의 `code`·`id_token`·`user`는 Location에 넘기지 않습니다. `state`가 없거나 비어 있으면 400입니다.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [state]
              properties:
                error:
                  type: string
                  description: 사용자가 취소하면 Apple이 보내는 오류 코드, 예 `user_cancelled_authorize`
                code:
                  type: string
                  description: Apple authorization code
                id_token:
                  type: string
                  description: Apple identity token
                state:
                  type: string
                  minLength: 1
                user:
                  type: string
                  description: 처음 로그인할 때만 Apple이 보내는 사용자 정보(JSON 문자열)
      responses:
        '303':
          description: |
            app link로 이동합니다. `Location`은 `<APP_LINK_BASE>/auth/apple?exchange=<교환 코드>&state=<state>`이고,
            실패하면 `<APP_LINK_BASE>/auth/apple?error=<값>&state=<state>`입니다.
            `error` 값은 `user_cancelled_authorize`, `token_invalid`, `provider_unavailable`, `invalid_request`, `server_error`입니다.
            Apple이 보낸 토큰·authorization code·사용자 정보는 Location에 넘기지 않습니다(`appleCallback` 설명 참고).
          headers:
            Location:
              $ref: '#/components/headers/Location'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/auth/apple/web:
    post:
      operationId: completeAppleWebLogin
      summary: Apple 웹 로그인 완료 (Android)
      description: |
        `appleCallback`이 app link로 넘긴 교환 코드와 nonce 원문으로 자체 토큰을 발급합니다.
        교환 코드는 일회용이고 수명이 2분입니다. nonce가 틀려도 교환 코드는 소진되지 않습니다.
        교환 코드가 없거나 만료됐거나 이미 썼거나 nonce가 맞지 않으면 401 `auth.exchange_invalid`이며, 이 경우들을 구분하지 않습니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleWebLoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/auth/refresh:
    post:
      operationId: refreshToken
      summary: 토큰 갱신
      description: refresh token을 새 토큰 쌍으로 바꿉니다. 이미 쓴 refresh token이 첫 사용 뒤 30초 안에 다시 오고 그 다음 token이 아직 쓰이지 않았으면 응답 유실 재시도로 보고 새 토큰 쌍을 줍니다(앞서 준 토큰은 폐기). 이렇게 대체된 토큰이 다시 오거나 그 밖의 재사용이면 탈취로 보고 family 전체를 폐기합니다(401 `auth.refresh_reused`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: 새 토큰 쌍
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/auth/logout:
    post:
      operationId: logout
      summary: 로그아웃
      description: 보낸 refresh token의 family를 폐기합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: 로그아웃 완료
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/me:
    get:
      operationId: getMe
      summary: 내 계정 상태
      description: 계정 상태, 동의 필요 여부, 프로필 유무, 광고 제거 상태를 돌려줍니다. 약관 동의 전에도 부를 수 있습니다.
      responses:
        '200':
          description: 계정 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
    delete:
      operationId: deleteMe
      summary: 계정 삭제 요청
      description: 계정을 삭제 대기(`pending_deletion`)로 바꿉니다. 30일 안에 같은 제공자로 로그인하면 되돌아오고, 지나면 익명화합니다.
      responses:
        '202':
          description: 삭제 예약됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionScheduled'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/me/consents:
    post:
      operationId: agreeConsents
      summary: 약관 동의
      description: 현재 버전 문서에 동의합니다. 동의 전에는 `getMe`, 동의, 로그아웃, 계정 삭제 말고는 403 `consent.required`입니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRequest'
      responses:
        '204':
          description: 동의 기록됨
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/me/profile:
    get:
      operationId: getProfile
      summary: 프로필 읽기
      description: 저장된 프로필을 돌려줍니다. 새 기기·재설치에서 현재 값을 받는 데 씁니다(#141). 프로필이 없으면 409 `profile.required`입니다.
      responses:
        '200':
          description: 저장된 프로필
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
    put:
      operationId: createProfile
      summary: 프로필 첫 등록
      description: |
        프로필을 처음 등록합니다. 출생 정보는 저장 전에 엔진으로 검증합니다(422 `birth.invalid`·`birth.out_of_range`).
        호칭 경고(`name.suffix_stripped`·`name.suffix_warning`)는 오류가 아니며 200 응답의 `warnings`에 담깁니다.
        `currentTimezone`이나 `birth.timezone`이 IANA 이름이 아니면 422 `timezone.invalid`, `birth.place.cityId`가 도시 목록에 없으면 422 `city.not_found`입니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileInput'
      responses:
        '200':
          description: 저장된 프로필
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        default:
          $ref: '#/components/responses/UnexpectedError'
    patch:
      operationId: updateProfile
      summary: 프로필 수정
      description: |
        보낸 필드만 바꿉니다(JSON Merge Patch). `birth`와 `notification`은 통째로 바꿉니다.
        기기 시간대가 바뀌면 app이 `currentTimezone`을 보내 알립니다. 프로필이 없으면 409 `profile.required`입니다.
        `currentTimezone`이나 `birth.timezone`이 IANA 이름이 아니면 422 `timezone.invalid`, `birth.place.cityId`가 도시 목록에 없으면 422 `city.not_found`입니다.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/ProfilePatch'
      responses:
        '200':
          description: 저장된 프로필
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/daily/{date}:
    parameters:
      - $ref: '#/components/parameters/Date'
    get:
      operationId: getDaily
      summary: 하루 운세
      description: |
        그날의 데일리(일진, 총운, 가이드 질문, 카드, 태그, 관계)를 돌려줍니다. 세 깊이(surface·explain·evidence)를 한 번에 담습니다.
