          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 일정 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
