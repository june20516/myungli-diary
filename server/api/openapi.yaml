    # ---- 인증·계정 ----
    KakaoLoginRequest:
      type: object
      required: [idToken, nonce]
      properties:
        idToken:
          type: string
          description: 카카오 OIDC id_token
        nonce:
          type: string
          description: nonce 원문입니다. app은 제공자(카카오·Apple)에게 이 원문의 SHA-256 소문자 hex를 nonce로 보냅니다. server는 id_token의 `nonce` claim이 SHA-256(원문) hex와 같은지 확인합니다.
          minLength: 16
          maxLength: 256
    AppleLoginRequest:
      type: object
      required: [idToken, authorizationCode, nonce]
      properties:
        idToken:
          type: string
          description: Apple identity_token
        authorizationCode:
          type: string
        nonce:
          type: string
          description: nonce 원문입니다. app은 제공자(카카오·Apple)에게 이 원문의 SHA-256 소문자 hex를 nonce로 보냅니다. server는 id_token의 `nonce` claim이 SHA-256(원문) hex와 같은지 확인합니다.
          minLength: 16
          maxLength: 256
    AppleWebLoginRequest:
      type: object
      required: [exchangeCode, nonce]
      properties:
        exchangeCode:
          type: string
          description: '`appleCallback`이 app link로 넘긴 교환 코드(256비트 난수의 base64url, 패딩 없음)'
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
        nonce:
          type: string
          description: nonce 원문입니다. app은 제공자(카카오·Apple)에게 이 원문의 SHA-256 소문자 hex를 nonce로 보냅니다. server는 Apple id_token의 `nonce` claim이 SHA-256(원문) hex와 같은지 확인합니다.
          minLength: 16
          maxLength: 256
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    TokenPair:
      type: object
      required: [accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt]
      properties:
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshTokenExpiresAt:
          type: string
          format: date-time
    LoginResponse:
      type: object
      required: [tokens, isNewAccount, consentRequired]
      properties:
        tokens:
          $ref: '#/components/schemas/TokenPair'
        isNewAccount:
          type: boolean
        consentRequired:
          type: boolean
    LoginProvider:
      type: string
      description: 로그인 제공자. 요청(`{provider}` 경로)에서는 이 값만 받습니다(밖의 값은 400). 응답에서는 열린 enum이라 app은 모르는 값을 건너뜁니다.
      enum: [kakao, apple, line, google]
    LineLoginRequest:
      type: object
      required: [idToken, nonce]
      properties:
        idToken:
          type: string
          description: LINE OIDC id_token
        nonce:
          type: string
          description: nonce 원문입니다. app은 제공자에게 이 원문의 SHA-256 소문자 hex를 nonce로 보냅니다. server는 id_token의 `nonce` claim이 SHA-256(원문) hex와 같은지 확인합니다.
          minLength: 16
          maxLength: 256
    GoogleLoginRequest:
      type: object
      required: [idToken, nonce]
      properties:
        idToken:
          type: string
          description: Google OIDC id_token
        nonce:
          type: string
          description: nonce 원문입니다. app은 제공자에게 이 원문의 SHA-256 소문자 hex를 nonce로 보냅니다. server는 id_token의 `nonce` claim이 SHA-256(원문) hex와 같은지 확인합니다. Google은 app 프로세스마다 nonce가 하나라 같은 원문이 여러 번 올 수 있습니다.
          minLength: 16
          maxLength: 256
    Identity:
      type: object
      description: 현재 계정에 붙은 로그인 제공자 연결. 제공자 사용자 id(`subject`)는 내보내지 않습니다.
      required: [provider, linkedAt]
      properties:
        provider:
          $ref: '#/components/schemas/LoginProvider'
        linkedAt:
          type: string
          format: date-time
    IdentityList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: 붙인 순서
          items:
            $ref: '#/components/schemas/Identity'
    LinkIdentityRequest:
      type: object
      description: |
        `linkIdentity` 본문. 필드는 제공자마다 쓰는 조합이 다르고 `nonce`만 항상 필수입니다.
        * kakao·line·google: `idToken`
        * apple(iOS): `idToken`과 `authorizationCode`
        * apple(Android 웹 흐름): `exchangeCode`
        제공자별 조합이 맞지 않으면(필요한 필드가 없거나 그 제공자가 쓰지 않는 필드가 있음) 400 `request.invalid`이고,
        `errors[]`는 없는 필드 `{field: "/idToken", code: "required"}`, 쓰지 않는 필드 `{field: "/exchangeCode", code: "additionalProperties"}` 꼴입니다.
        apple에 `idToken`·`authorizationCode`와 `exchangeCode`가 함께 오면 `exchangeCode`가 쓰지 않는 필드입니다.
      required: [nonce]
      properties:
        idToken:
          type: string
          description: 제공자 OIDC id_token(Apple은 identity_token)
        authorizationCode:
          type: string
          description: Apple authorization_code. apple(iOS)에서만 씁니다.
        exchangeCode:
          type: string
          description: '`appleCallback`이 app link로 넘긴 교환 코드(256비트 난수의 base64url, 패딩 없음). apple(Android 웹 흐름)에서만 씁니다.'
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
        nonce:
          type: string
          description: nonce 원문입니다. app은 제공자에게 이 원문의 SHA-256 소문자 hex를 nonce로 보냅니다. server는 id_token의 `nonce` claim이 SHA-256(원문) hex와 같은지 확인합니다.
          minLength: 16
          maxLength: 256
    MergePreviewRequest:
      type: object
      description: |
        `previewMerge` 본문. 합칠 다른 유저 계정(B)의 로그인 증명입니다. `provider`가 필수이고, 나머지는 `LinkIdentityRequest`와 같습니다.
        `nonce`만 항상 필수이고, 제공자마다 쓰는 조합이 다릅니다.
        * kakao·line·google: `idToken`
        * apple(iOS): `idToken`과 `authorizationCode`
        * apple(Android 웹 흐름): `exchangeCode`
        조합이 맞지 않으면 400 `request.invalid`이고 `errors[]`는 `LinkIdentityRequest`와 같은 꼴입니다.
      required: [provider, nonce]
      properties:
        provider:
          $ref: '#/components/schemas/LoginProvider'
        idToken:
          type: string
          description: 제공자 OIDC id_token(Apple은 identity_token)
        authorizationCode:
          type: string
          description: Apple authorization_code. apple(iOS)에서만 씁니다.
        exchangeCode:
          type: string
          description: '`appleCallback`이 app link로 넘긴 교환 코드(256비트 난수의 base64url, 패딩 없음). apple(Android 웹 흐름)에서만 씁니다.'
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
        nonce:
          type: string
          description: nonce 원문입니다. app은 제공자에게 이 원문의 SHA-256 소문자 hex를 nonce로 보냅니다. server는 id_token의 `nonce` claim이 SHA-256(원문) hex와 같은지 확인합니다.
          minLength: 16
          maxLength: 256
    MergePreview:
      type: object
      required: [mergeToken, expiresAt, summary]
      properties:
        mergeToken:
          type: string
          description: 합치기 토큰(랜덤 32바이트, base64url 패딩 없음). 일회용이고 현재 유저 계정의 bearer만 `mergeAccounts`에 쓸 수 있습니다. URL에 넣지 않습니다.
        expiresAt:
          type: string
          format: date-time
          description: 합치기 토큰 만료 시각(발급 + 10분)
        summary:
          $ref: '#/components/schemas/MergeSummary'
    MergeSummary:
      type: object
      description: 합치면 옮겨지거나 더해지는 것의 요약. 옮길 기록이 없어도 줍니다.
      required: [diaries, schedules, dateRecords, reactions, overlapDays, addedDays, current, other]
      properties:
        diaries:
          type: integer
          minimum: 0
          description: 옮길 살아 있는 일기 수. 지운 일기도 함께 옮기지만 화면에서 되살릴 수 없어 세지 않습니다.
        schedules:
          type: integer
          minimum: 0
          description: 옮길 살아 있는 일정 수. 지운 일정도 함께 옮기지만 세지 않습니다.
        dateRecords:
          type: integer
          minimum: 0
          description: 옮길 날짜 기록 수. A와 날짜가 겹치지 않는 B의 날짜 기록만 셉니다(겹친 날은 `overlapDays`로만 셈).
        reactions:
          type: integer
          minimum: 0
          description: B의 살아 있는 문장 반응 전체 수. 같은 날·같은 자리·같은 출생 정보의 문장 선택이 겹치면 고른 프로필에 따라 일부는 유저 계정과 끊긴 문장별 집계로만 남을 수 있습니다.
        overlapDays:
          type: integer
          minimum: 0
          description: 두 유저 계정 모두 날짜 기록이 있는 날 수. 0이면 app은 겹치는 날 안내를 보이지 않습니다.
        addedDays:
          $ref: '#/components/schemas/MergeAddedDays'
        current:
          $ref: '#/components/schemas/MergeProfileSummary'
        other:
          $ref: '#/components/schemas/MergeProfileSummary'
    MergeAddedDays:
      type: object
      description: 합치면 현재 유저 계정에 더해지는 남은 기간(일). 기간 상품이 늘면 필드를 더합니다.
      required: [adFree]
      properties:
        adFree:
          type: integer
          minimum: 0
          description: 광고 제거권 남은 날. 같은 구매가 주는 근거·해석 열람(insight)도 같은 기간입니다.
    MergeProfileSummary:
      type: object
      description: |
        합칠 때 고를 수 있는 프로필 요약. `status`가 `saved`일 때만 `honorific`·`birth`가 있습니다(`none`은 프로필이 없음).
        고른 쪽의 `status`가 `none`이면 합친 뒤 현재 유저 계정은 프로필이 없습니다.
      required: [status]
      properties:
        status:
          type: string
          enum: [saved, none]
        honorific:
          type: string
          description: 호칭
        birth:
          $ref: '#/components/schemas/Birth'
    MergeProfile:
      type: string
      description: 합친 뒤 쓸 프로필. `current`는 현재 유저 계정(A)의 것, `other`는 합치는 다른 유저 계정(B)의 것입니다.
      enum: [current, other]
    MergeRequest:
      type: object
      required: [mergeToken, profile]
      properties:
        mergeToken:
          type: string
          description: '`previewMerge`가 준 합치기 토큰'
        profile:
          $ref: '#/components/schemas/MergeProfile'
    Me:
      type: object
      required: [accountId, consentRequired, requiredConsents, hasProfile, adFree, insight]
      properties:
        accountId:
          type: string
          format: uuid
        consentRequired:
          type: boolean
        requiredConsents:
          type: array
          description: 동의해야 할 문서와 현재 버전
          items:
            $ref: '#/components/schemas/ConsentDocument'
        hasProfile:
          type: boolean
        adFree:
          $ref: '#/components/schemas/AdFree'
        insight:
          $ref: '#/components/schemas/Insight'
    ConsentDocument:
      type: object
      description: |
        동의할 문서. `document`는 열린 enum이지만 app은 받은 `document`·`version`을 해석하지 않고 `agreeConsents`로 그대로 돌려보냅니다.
        새 문서를 필수 동의로 더할 때 server는 그 문서를 아는 앱 버전으로 `AppConfig.minimumVersion`을 함께 올립니다.
        이전 app은 모르는 필수 문서가 있으면 동의 화면 대신 강제 업데이트 화면으로 보냅니다.
      required: [document, version]
      properties:
        document:
          type: string
          enum: [terms, privacy]
        version:
          type: string
    ConsentRequest:
      type: object
      required: [documents]
      properties:
        documents:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ConsentDocument'

    # ---- 프로필 ----
    LunarOrSolarDate:
      type: object
      description: |
        달력 날짜. 음력 30일이 있어 `format: date`를 쓰지 않습니다.
        양력인데 달력에 없는 날짜(예 2월 31일)면 422 `date.invalid`입니다. 음력 날짜가 실제로 있는지는 엔진 판정이며, 프로필 저장에서는 422 `birth.invalid`, `convertLunarDate`·`getBirthHour`에서는 422 `date.invalid`입니다.
      required: [year, month, day]
      properties:
        year:
          type: integer
          minimum: 1900
          maximum: 2099
        month:
          type: integer
          minimum: 1
          maximum: 12
        day:
          type: integer
          minimum: 1
          maximum: 31
    BirthTime:
      type: object
      description: |
        `status`가 `known`일 때만 `value`가 있습니다. `unknown`은 사용자가 "모름"을 고른 것입니다.
        `known`인데 `value`가 없으면 422 `request.inconsistent`(`required_by_status`), `unknown`인데 `value`가 있으면 `forbidden_by_status`입니다.
      required: [status]
      properties:
        status:
          type: string
          enum: [known, unknown]
        value:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: HH:MM
    BirthPlace:
      type: object
      description: |
        `status`가 `city`일 때만 `cityId`가 있습니다. `not_asked`는 묻지 않음(한국 기기), `skipped`는 물었지만 건너뜀입니다.
        `city`인데 `cityId`가 없으면 422 `request.inconsistent`(`required_by_status`), 그 밖의 상태인데 `cityId`가 있으면 `forbidden_by_status`입니다.
      required: [status]
      properties:
        status:
          type: string
          enum: [not_asked, skipped, city]
        cityId:
          type: string
          description: '`City.id`'
    Birth:
      type: object
      required: [calendar, date, isLeapMonth, time, gender, timezone, place]
      properties:
        calendar:
          $ref: '#/components/schemas/CalendarType'
        date:
          $ref: '#/components/schemas/LunarOrSolarDate'
        isLeapMonth:
          type: boolean
          description: |
            `calendar`가 `solar`면 false입니다. 양력인데 true면 422 `request.inconsistent`(`forbidden_by_status`)입니다.
            음력 날짜가 존재하지 않으면(예 윤달이 없는 달의 윤달) 엔진 판정 422 `birth.invalid`입니다.
        time:
          $ref: '#/components/schemas/BirthTime'
        gender:
          type: string
          enum: [male, female]
        timezone:
          type: string
          description: 출생 시간대 IANA 이름(예 `Asia/Seoul`)
        place:
          $ref: '#/components/schemas/BirthPlace'
    CalendarType:
      type: string
      enum: [solar, lunar]
    NotificationSetting:
      type: object
      description: |
        `status`가 `enabled`일 때만 `time`이 있습니다.
        `enabled`인데 `time`이 없으면 422 `request.inconsistent`(`required_by_status`), 그 밖의 상태인데 `time`이 있으면 `forbidden_by_status`입니다.
      required: [status]
      properties:
        status:
          type: string
          enum: [not_asked, enabled, disabled]
        time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][05]$'
          description: HH:MM. 분은 5의 배수이며, 아니면 `pattern` 위반 400 `request.invalid`입니다.
    ProfileInput:
      type: object
      required: [honorific, language, currentTimezone, birth, notification]
      properties:
        honorific:
          type: string
          minLength: 1
          maxLength: 20
          description: 호칭
        language:
          $ref: '#/components/schemas/Language'
        currentTimezone:
          type: string
          description: 현재 기기 시간대 IANA 이름. "오늘"의 기준입니다.
        birth:
          $ref: '#/components/schemas/Birth'
        notification:
          $ref: '#/components/schemas/NotificationSetting'
    ProfilePatch:
      type: object
      description: |
        `ProfileInput`의 모든 필드를 생략할 수 있습니다. 생략은 "바꾸지 않음"입니다.
        `birth`와 `notification`은 안쪽 필드를 합치지 않고 통째로 바꿉니다.
      properties:
        honorific:
          type: string
          minLength: 1
          maxLength: 20
          description: 호칭
        language:
          $ref: '#/components/schemas/Language'
        currentTimezone:
          type: string
          description: 현재 기기 시간대 IANA 이름
        birth:
          $ref: '#/components/schemas/Birth'
        notification:
          $ref: '#/components/schemas/NotificationSetting'
    Profile:
      type: object
      description: |
        저장된 프로필입니다. `birthCity`는 출생 도시(`birth.place.status`가 `city`일 때만)이고 이름은 프로필 언어입니다.
        `birthCity.longitude`는 계산에 쓴 저장된 경도입니다. 도시 자료가 바뀌어 저장된 도시를 찾지 못하면 `city`여도 `birthCity`를 뺍니다.
        계산 기준 화면의 경도 안내에 씁니다. 응답에만 있는 필드이며, 요청(`ProfileInput`·`ProfilePatch`)은 `birth.place.cityId`로만 보냅니다.
      required: [honorific, language, currentTimezone, birth, notification]
      properties:
        honorific:
          type: string
          minLength: 1
          maxLength: 20
          description: 호칭
        language:
          $ref: '#/components/schemas/Language'
        currentTimezone:
          type: string
          description: 현재 기기 시간대 IANA 이름
        birth:
          $ref: '#/components/schemas/Birth'
        notification:
          $ref: '#/components/schemas/NotificationSetting'
        birthCity:
          $ref: '#/components/schemas/City'
    ProfileResponse:
      type: object
      required: [profile, warnings]
      properties:
        profile:
          $ref: '#/components/schemas/Profile'
        warnings:
          type: array
          description: 오류가 아닌 호칭 경고. `code`는 `name.suffix_stripped` 또는 `name.suffix_warning`입니다.
          items:
            $ref: '#/components/schemas/FieldError'

    # ---- 운세 공용 ----
    Pillar:
      type: object
      required: [stem, branch]
      properties:
        stem:
          $ref: '#/components/schemas/Stem'
        branch:
          $ref: '#/components/schemas/Branch'
    Tag:
      type: object
      required: [key, polarity]
      properties:
        key:
          type: string
          description: 태그 키(glossary `tag` 범주의 키)
        polarity:
          type: string
          enum: [good, bad, neutral]
          description: 태그의 길흉. 엔진 spec §7.7 표의 값입니다.
    Fortune:
      type: object
      description: 총운. `tag`는 대표 태그가 있을 때의 보조 문장입니다.
      required: [head]
      properties:
        head:
          $ref: '#/components/schemas/SlotText'
        tag:
          $ref: '#/components/schemas/SlotText'
    DayTags:
      type: object
      required: [featured, all]
      properties:
        featured:
          type: array
          description: 화면에 보일 대표 태그 0~2개
          maxItems: 2
          items:
            $ref: '#/components/schemas/Tag'
        all:
          type: array
          description: 전체 태그 키
          items:
            type: string

    # ---- 하루 운세 ----
    Daily:
      type: object
      description: "`characterReason`은 슬롯 `character.reason`(키 `character.reason.<dayKind>`)입니다."
      required: [date, rulesetVersion, evidenceAccess, dayPillar, dayKind, characterReason, fortune, guide, cards, tags, relations, notices]
      properties:
        date:
          type: string
          format: date
        rulesetVersion:
          type: string
        evidenceAccess:
          $ref: '#/components/schemas/EvidenceAccess'
        dayPillar:
          $ref: '#/components/schemas/Pillar'
        dayKind:
          $ref: '#/components/schemas/DayKind'
        characterReason:
          $ref: '#/components/schemas/SlotText'
        fortune:
          $ref: '#/components/schemas/Fortune'
        guide:
          $ref: '#/components/schemas/SlotText'
        cards:
          $ref: '#/components/schemas/DailyCards'
        tags:
          $ref: '#/components/schemas/DayTags'
        relations:
          type: array
          description: 일진과 원국의 관계
          items:
            $ref: '#/components/schemas/Relation'
        notices:
          type: array
          items:
            $ref: '#/components/schemas/Notice'
    DailyCards:
      type: object
      required: [color, direction, number, focusTime]
      properties:
        color:
          $ref: '#/components/schemas/ColorCard'
        direction:
          $ref: '#/components/schemas/DirectionCard'
        number:
          $ref: '#/components/schemas/NumberCard'
        focusTime:
          $ref: '#/components/schemas/FocusTimeCard'
    ColorCard:
      type: object
      required: [element, role, text]
      properties:
        element:
          $ref: '#/components/schemas/FiveElement'
        role:
          $ref: '#/components/schemas/ElementRole'
        text:
          $ref: '#/components/schemas/SlotText'
    DirectionCard:
      type: object
      required: [direction, text]
      properties:
        direction:
          $ref: '#/components/schemas/Direction'
        text:
          $ref: '#/components/schemas/SlotText'
    NumberCard:
      type: object
      required: [number, text]
      properties:
        number:
          type: integer
        text:
          $ref: '#/components/schemas/SlotText'
    FocusTimeCard:
      type: object
      required: [picks, fallback, text]
      properties:
        picks:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/FocusSlot'
        fallback:
          type: boolean
        text:
          $ref: '#/components/schemas/SlotText'
    FocusSlot:
      type: object
      required: [branch, start, end, huangdaoLucky, reasons]
      properties:
        branch:
          $ref: '#/components/schemas/Branch'
        start:
          type: string
          format: date-time
          description: 프로필 현재 시간대의 offset으로 나타냅니다.
        end:
          type: string
          format: date-time
          description: 프로필 현재 시간대의 offset으로 나타냅니다.
        huangdaoLucky:
          type: boolean
          description: 황도길시
        reasons:
          type: array
          description: 가점 사유 식별자(glossary `focus_reason` 범주의 키)
          items:
            type: string
            enum: [gwiin, yongsin, huisin, hap]
    Relation:
      type: object
      description: '`suppressedBy`는 `suppressed`가 true일 때만 있습니다.'
      required: [kind, natalPosition, suppressed]
      properties:
        kind:
          $ref: '#/components/schemas/RelationKind'
        natalPosition:
          $ref: '#/components/schemas/Position'
        suppressed:
          type: boolean
        suppressedBy:
          $ref: '#/components/schemas/RelationKind'

    # ---- 나의 사주 ----
    Chart:
      type: object
      description: |
        나의 사주 화면 묶음입니다.
        나의 사주 문장 셋은 근거 열람 권한과 상관없이 오고, 원고가 없거나 고를 값이 없으면 생략합니다(선택 필드).
        * `ilganHead`: 일간 소개 첫 문장(writing 슬롯 `chart.ilgan_head`, IA `my-saju.ilgan.head`). 키는 `ilgan.head.<pillars.day.stem>`이고 호칭을 씁니다.
        * `ilganBody`: 일간 소개 이어지는 문장(`chart.ilgan_body`, IA `my-saju.ilgan.body`). 키는 `ilgan.body.<pillars.day.stem>`입니다.
        * `yongsinSummary`: 용신과 행운 색 설명(`chart.yongsin_summary`, IA `my-saju.yongsin.body`). 키는 `yongsin.summary`이고 매개변수는 `yongsin.yongsin`입니다.
      required:
        - rulesetVersion
        - evidenceAccess
        - pillars
        - tenGods
        - hiddenStems
        - twelveStages
        - shinsal
        - gongmang
        - elementWeights
        - strength
        - yongsin
        - daeun
        - seun
        - notices
      properties:
        rulesetVersion:
          type: string
        evidenceAccess:
          $ref: '#/components/schemas/EvidenceAccess'
        pillars:
          $ref: '#/components/schemas/ChartPillars'
        tenGods:
          type: array
          items:
            $ref: '#/components/schemas/TenGodAt'
        hiddenStems:
          type: array
          items:
            $ref: '#/components/schemas/HiddenStemsAt'
        twelveStages:
          type: array
          items:
            $ref: '#/components/schemas/TwelveStageAt'
        shinsal:
          type: array
          items:
            $ref: '#/components/schemas/ShinsalAt'
        gongmang:
          type: array
          items:
            $ref: '#/components/schemas/Branch'
        elementWeights:
          type: array
          items:
            $ref: '#/components/schemas/ElementWeight'
        strength:
          $ref: '#/components/schemas/Strength'
        yongsin:
          $ref: '#/components/schemas/Yongsin'
        daeun:
          $ref: '#/components/schemas/Daeun'
        seun:
          type: array
          items:
            $ref: '#/components/schemas/SeunYear'
        notices:
          type: array
          items:
            $ref: '#/components/schemas/Notice'
        ilganHead:
          $ref: '#/components/schemas/SlotText'
        ilganBody:
          $ref: '#/components/schemas/SlotText'
        yongsinSummary:
          $ref: '#/components/schemas/SlotText'
        personalReadings:
          type: array
          description: |
            원국 개인 해석("내 사주에서는")입니다. 근거 열람 권한이 없으면(`evidenceAccess: locked`) 이 필드가 없습니다(D60).
            원고가 없는 항목은 빠집니다. 앱은 누른 용어의 (`kind`, `position`, `index`, `shinsal`)로 항목을 찾습니다.
          items:
            $ref: '#/components/schemas/PersonalReading'
    PersonalReading:
      type: object
      description: |
        원국 개인 해석 한 항목입니다. 앱이 누른 용어를 (`kind`, `position`, `index`, `shinsal`)로 찾습니다.
        각 필드는 아래 `kind`에서만 있습니다.
        * `day_master` 일간. `position`은 `day_stem`.
        * `ten_god` 원국 천간·지지의 십성. `position`.
        * `hidden_ten_god` 지장간의 십성. `position`(지지)과 `index`(지장간 순서, 0이 정기).
        * `twelve_stage` 원국 지지의 12운성. `position`.
        * `shinsal` 원국 신살. `position`과 `shinsal`.
        * `daeun_stem_ten_god`·`daeun_branch_ten_god`·`daeun_twelve_stage` 대운. `index`는 `Daeun.periods` 순서. `position`은 없습니다.
        * `seun_ten_god` 세운. `index`는 `Chart.seun` 순서. `position`은 없습니다.
        `index`는 `hidden_ten_god`과 대운·세운 kind에서만 의미가 있고, 그 밖에는 없습니다.
      required: [kind, text]
      properties:
        kind:
          type: string
          enum:
            - day_master
            - ten_god
            - hidden_ten_god
            - twelve_stage
            - shinsal
            - daeun_stem_ten_god
            - daeun_branch_ten_god
            - daeun_twelve_stage
            - seun_ten_god
          # 생성 상수 이름이 TenGod·Shinsal 같은 타입 이름과 겹치지 않게 접두어를 붙입니다.
          x-enum-varnames:
            - PersonalReadingKindDayMaster
            - PersonalReadingKindTenGod
            - PersonalReadingKindHiddenTenGod
            - PersonalReadingKindTwelveStage
            - PersonalReadingKindShinsal
            - PersonalReadingKindDaeunStemTenGod
            - PersonalReadingKindDaeunBranchTenGod
            - PersonalReadingKindDaeunTwelveStage
            - PersonalReadingKindSeunTenGod
        position:
          $ref: '#/components/schemas/Position'
        index:
          type: integer
          minimum: 0
        shinsal:
          $ref: '#/components/schemas/ShinsalKind'
        text:
          $ref: '#/components/schemas/RenderedText'
    ChartPillars:
      type: object
      description: 원국 네 기둥. 출생 시각이 `unknown`이면 `hour`를 생략합니다.
      required: [year, month, day]
      properties:
        year:
          $ref: '#/components/schemas/Pillar'
        month:
          $ref: '#/components/schemas/Pillar'
        day:
          $ref: '#/components/schemas/Pillar'
        hour:
          $ref: '#/components/schemas/Pillar'
    TenGodAt:
      type: object
      required: [position, tenGod]
      properties:
        position:
          $ref: '#/components/schemas/Position'
        tenGod:
          $ref: '#/components/schemas/TenGod'
    HiddenStemsAt:
      type: object
      required: [position, stems]
      properties:
        position:
          $ref: '#/components/schemas/Position'
        stems:
          type: array
          items:
            $ref: '#/components/schemas/HiddenStem'
    HiddenStem:
      type: object
      required: [stem, tenGod]
      properties:
        stem:
          $ref: '#/components/schemas/Stem'
        tenGod:
          $ref: '#/components/schemas/TenGod'
    TwelveStageAt:
      type: object
      required: [position, stage]
      properties:
        position:
          $ref: '#/components/schemas/Position'
        stage:
          $ref: '#/components/schemas/TwelveStage'
    ShinsalAt:
      type: object
      required: [kind, position]
      properties:
        kind:
          $ref: '#/components/schemas/ShinsalKind'
        position:
          $ref: '#/components/schemas/Position'
    ElementWeight:
      type: object
      required: [element, weight]
      properties:
        element:
          $ref: '#/components/schemas/FiveElement'
        weight:
          type: number
    Strength:
      type: object
      required: [score, level]
      properties:
        score:
          type: number
        level:
          $ref: '#/components/schemas/StrengthLevel'
    Yongsin:
      type: object
      description: |
        `johuStem`은 조후 천간이 없으면 생략합니다.
        `basis`(용신 근거 문장)는 evidence 깊이라 응답의 `evidenceAccess`가 `locked`면 생략합니다.
      required: [yongsin, huisin, gisin, tonggwan, method]
      properties:
        yongsin:
          $ref: '#/components/schemas/FiveElement'
        huisin:
          $ref: '#/components/schemas/FiveElement'
        gisin:
          $ref: '#/components/schemas/FiveElement'
        tonggwan:
          $ref: '#/components/schemas/FiveElement'
        method:
          $ref: '#/components/schemas/YongsinMethod'
        johuStem:
          $ref: '#/components/schemas/Stem'
        basis:
          $ref: '#/components/schemas/SlotText'
    Daeun:
      type: object
      required: [forward, startYears, startMonths, periods]
      properties:
        forward:
          type: boolean
          description: 순행 여부
        startYears:
          type: integer
        startMonths:
          type: integer
        periods:
          type: array
          items:
            $ref: '#/components/schemas/DaeunPeriod'
    DaeunPeriod:
      type: object
      required: [pillar, startAge, startAgeKorean, startYear, stemTenGod, branchTenGod, twelveStage]
      properties:
        pillar:
          $ref: '#/components/schemas/Pillar'
        startAge:
          type: integer
          description: 만 나이
        startAgeKorean:
          type: integer
          description: 한국식 나이
        startYear:
          type: integer
          description: 대운이 실제로 시작하는 양력 연도(엔진 값 그대로). 다음 대운은 10년 뒤입니다. `startAgeKorean` = `startYear` - 출생 양력 연도 + 1이고, 출생 양력 연도는 음력 생일이면 양력으로 바꾼 날짜의 연도입니다.
        stemTenGod:
          $ref: '#/components/schemas/TenGod'
        branchTenGod:
          $ref: '#/components/schemas/TenGod'
        twelveStage:
          $ref: '#/components/schemas/TwelveStage'
    SeunYear:
      type: object
      required: [year, pillar, tenGod, relationsWithNatal]
      properties:
        year:
          type: integer
        pillar:
          $ref: '#/components/schemas/Pillar'
        tenGod:
          $ref: '#/components/schemas/TenGod'
        relationsWithNatal:
          type: array
          items:
            $ref: '#/components/schemas/RelationKind'

    # ---- 달력 ----
    Calendar:
      type: object
      required: [year, month, rulesetVersion, evidenceAccess, days]
      properties:
        year:
          type: integer
        month:
          type: integer
        rulesetVersion:
          type: string
        evidenceAccess:
          $ref: '#/components/schemas/EvidenceAccess'
        days:
          type: array
          items:
            $ref: '#/components/schemas/CalendarDay'
    CalendarDay:
      type: object
      description: '`solarTerm`은 입절일에만 있습니다. `characterReason`은 슬롯 `character.reason`(키 `character.reason.<dayKind>`)입니다.'
      required: [date, pillar, lunar, dayKind, characterReason, luckLevel, score, level]
      properties:
        date:
          type: string
          format: date
        pillar:
          $ref: '#/components/schemas/Pillar'
        lunar:
          $ref: '#/components/schemas/LunarDate'
        solarTerm:
          $ref: '#/components/schemas/SolarTerm'
        dayKind:
          $ref: '#/components/schemas/DayKind'
        characterReason:
          $ref: '#/components/schemas/SlotText'
        luckLevel:
          $ref: '#/components/schemas/LuckLevel'
        score:
          type: integer
        level:
          $ref: '#/components/schemas/SlotText'
    LunarDate:
      type: object
      required: [month, day, isLeapMonth]
      properties:
        month:
          type: integer
        day:
          type: integer
        isLeapMonth:
          type: boolean
    SolarTerm:
      type: object
      required: [kind, at]
      properties:
        kind:
          $ref: '#/components/schemas/SolarTermKind'
        at:
          type: string
          format: date-time
          description: 프로필 현재 시간대의 offset으로 나타냅니다.
    ReactionInput:
      type: object
      required: [reaction]
      properties:
        reaction:
          type: string
          enum: [like]
    Glossary:
      type: object
      required: [seedVersion, lang, values, meanings, hanja]
      properties:
        seedVersion:
          type: string
        lang:
          $ref: '#/components/schemas/Language'
        values:
          type: object
          description: |
            범주 → (값 → 이름). 범주는 writing `glossary.value_name` 키의 `<범주>`, 그리고 `tag`·`focus_reason`·`score_item`·`solar_term`입니다.
          additionalProperties:
            type: object
            additionalProperties:
              type: string
        meanings:
          type: object
          description: 용어 id → 뜻 문장(writing 슬롯 `term.meaning`, 키 `term.<용어 id>`)
          additionalProperties:
            $ref: '#/components/schemas/RenderedText'
        hanja:
          type: object
          description: 용어 id → 한자 표기(예 `ten_god.siksin` → `食神`). 풀이 시트 제목 옆에 씁니다. 한자 표기가 없는 용어는 키가 없습니다.
          additionalProperties:
            type: string

    # ---- 비로그인 ----
    PreviewRequest:
      type: object
      required: [installationId, currentTimezone, birth]
      properties:
        installationId:
          type: string
          minLength: 1
          maxLength: 128
          description: 앱 설치마다 만든 무작위 값
        currentTimezone:
          type: string
          description: 현재 기기 시간대 IANA 이름
        birth:
          $ref: '#/components/schemas/Birth'
    Preview:
      type: object
      description: |
        로그인 없는 미리보기 결과. `evidenceAccess`는 항상 `locked`입니다. 미리보기는 근거 열람 권한과 무관하게 evidence 깊이를 담지 않으며,
        근거가 원래 없는 것과 구분하려고 이 값을 둡니다.
        `fortune.tag`가 IA `preview.fortune.body`입니다.
      required: [date, evidenceAccess, dayKind, dayKindName, fortune, featuredTags, notices]
      properties:
        date:
          type: string
          format: date
        evidenceAccess:
          $ref: '#/components/schemas/EvidenceAccess'
        dayKind:
          $ref: '#/components/schemas/DayKind'
        dayKindName:
          type: string
          description: 날의 성격 이름(writing `glossary.value_name`의 `day_kind`). 미리보기는 로그인 전이라 `getGlossary`를 쓸 수 없어 이름을 함께 싣습니다(D68②).
        fortune:
          $ref: '#/components/schemas/Fortune'
        featuredTags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        notices:
          type: array
          items:
            $ref: '#/components/schemas/Notice'
    BirthHourRequest:
      type: object
      required: [installationId, calendar, date, isLeapMonth, time]
      properties:
        installationId:
          type: string
          minLength: 1
          maxLength: 128
          description: 앱 설치마다 만든 무작위 값
        calendar:
          $ref: '#/components/schemas/CalendarType'
        date:
          $ref: '#/components/schemas/LunarOrSolarDate'
        isLeapMonth:
          type: boolean
          description: '`calendar`가 `solar`면 false입니다. 양력인데 true면 422 `request.inconsistent`(`forbidden_by_status`)입니다.'
        time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: HH:MM
    LunarDateRequest:
      type: object
      description: 음력 날짜를 양력으로 바꿔 달라는 요청입니다. `date`는 음력 연·월·일입니다.
      required: [installationId, date, isLeapMonth]
      properties:
        installationId:
          type: string
          minLength: 1
          maxLength: 128
          description: 앱 설치마다 만든 무작위 값
        date:
          $ref: '#/components/schemas/LunarOrSolarDate'
        isLeapMonth:
          type: boolean
          description: 윤달이면 true입니다. 그해 그 달에 윤달이 없으면 422 `date.invalid`입니다.
    LunarConversion:
      type: object
      required: [solarDate, monthHasLeap]
      properties:
        solarDate:
          type: string
          format: date
          description: 변환한 양력 날짜
        monthHasLeap:
          type: boolean
          description: 그해 그 음력 달에 윤달이 있는지
    BirthHour:
      type: object
      required: [branch, start, end]
      properties:
        branch:
          $ref: '#/components/schemas/Branch'
        start:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: HH:MM, 벽시계 기준
        end:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: HH:MM, 벽시계 기준

    # ---- 일기 ----
    DiaryInput:
      type: object
      required: [date, body]
      properties:
        date:
          type: string
          format: date
        body:
          type: string
          minLength: 1
          maxLength: 10000
    DiaryBodyInput:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 10000
    Diary:
      type: object
      description: |
        `guideQuestion`은 그날 첫 편을 쓸 때 보인 가이드 질문의 렌더된 원문이고, 그날 가이드 질문이 없었으면 생략합니다.
        `tags`·`guideQuestion`·`rulesetVersion`·`dayKind`는 그날 첫 편을 쓸 때 기록한 날짜 기록이고 같은 날 일기에 똑같이 붙습니다.
        `dayKind`는 그때 본 날의 성격이며 사주 정보를 고쳐도 바뀌지 않습니다(D90 ①). 이름은 용어 사전 `day_kind.*`에서 찾습니다.
        1.1.0 전에 만든 날짜 기록에는 값이 없어 생략합니다(1.1.0에서 더함).
      required: [id, date, body, tags, rulesetVersion, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        body:
          type: string
        guideQuestion:
          $ref: '#/components/schemas/RenderedText'
        tags:
          $ref: '#/components/schemas/DayTags'
        rulesetVersion:
          type: string
        dayKind:
          $ref: '#/components/schemas/DayKind'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DiaryList:
      type: object
      description: '`nextCursor`가 없으면 마지막 쪽입니다.'
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DiarySummary'
        nextCursor:
          type: string
    DiarySummary:
      type: object
      required: [id, date, createdAt, excerpt, featuredTags]
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
        excerpt:
          type: string
          description: 본문 앞 100자
        featuredTags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'

    # ---- 일정 ----
    ScheduleInput:
      type: object
      description: |
        `time`은 `allDay`가 false일 때만 있습니다. `allDay`가 false인데 `time`이 없으면 422 `request.inconsistent`(`required_by_status`),
        `allDay`가 true인데 `time`이 있으면 `forbidden_by_status`입니다.
      required: [date, allDay, title]
      properties:
        date:
          type: string
          format: date
        allDay:
          type: boolean
        time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: HH:MM
        title:
          type: string
          minLength: 1
          maxLength: 100
        memo:
          type: string
          minLength: 0
          maxLength: 2000
    SchedulePatch:
      type: object
      description: |
        `ScheduleInput`의 모든 필드를 생략할 수 있습니다. 생략은 "바꾸지 않음"입니다.
        `allDay`를 true로 바꾸면 `time`이 지워집니다. 적용한 결과로 짝을 검사합니다. `allDay`를 false로 바꾸면서 `time`이 없고 기존에도 없으면
        422 `request.inconsistent`(`required_by_status`, field `/time`), 결과가 `allDay` true인데 `time`을 함께 보내면 `forbidden_by_status`입니다.
        `memo`는 빈 문자열로 지웁니다.
      properties:
        date:
          type: string
          format: date
        allDay:
          type: boolean
        time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: HH:MM
        title:
          type: string
          minLength: 1
          maxLength: 100
        memo:
          type: string
          minLength: 0
          maxLength: 2000
    Schedule:
      type: object
      description: '`time`은 `allDay`가 false일 때만 있습니다.'
      required: [id, date, allDay, title, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        allDay:
          type: boolean
        time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: |
            HH:MM. 프로필의 현재 시간대(`currentTimezone`) 벽시계 시각입니다(D30과 같은 기준).
            끝 시각(길이) 필드는 없습니다.
        title:
          type: string
          minLength: 1
          maxLength: 100
        memo:
          type: string
          description: 메모. 빈 문자열로 저장하면 메모 없음으로 보고 생략합니다.
          minLength: 1
          maxLength: 2000
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ScheduleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Schedule'

    # ---- 기기·결제·권한 ----
    DevicePlatform:
      type: string
      enum: [ios, android]
    DeviceInput:
      type: object
      required: [fcmToken, platform]
      properties:
        fcmToken:
          type: string
          minLength: 1
          maxLength: 4096
        platform:
          $ref: '#/components/schemas/DevicePlatform'
    Device:
      type: object
      required: [id, platform]
      properties:
        id:
          type: string
          format: uuid
        platform:
          $ref: '#/components/schemas/DevicePlatform'
    AdFree:
      type: object
      description: 광고 제거권. `active`가 true일 때만 `expiresAt`이 있고, 이어 붙인 대기 구간까지 포함한 끝입니다.
      required: [active]
      properties:
        active:
          type: boolean
        expiresAt:
          type: string
          format: date-time
    Insight:
      type: object
      description: |
        근거 열람 권한(D60). `active`가 true면 `expiresAt`과 `source`가 있습니다.
        여러 부여(예 보상형 광고와 광고 제거권)가 겹치면 만료가 가장 늦은 부여의 `expiresAt`·`source`를 보냅니다.
        `rewarded_ad`는 보상형 광고(그날 자정까지), `ad_free_pass`는 광고 제거권 기간, `subscription`은 구독입니다.
      required: [active]
      properties:
        active:
          type: boolean
        expiresAt:
          type: string
          format: date-time
        source:
          type: string
          enum: [rewarded_ad, ad_free_pass, subscription]
    PurchaseStatus:
      type: string
      description: |
        구매 상태. 열린 enum이라 app은 모르는 값이 와도 그 항목을 기본 표시로 보입니다.
        기간 상품은 `active`·`pending`·`expired`·`refunded`, 기간 없는 상품은 `owned`·`refunded`입니다.
        합치기 전에 끝난 다른 유저 계정의 구매는 현재 유저 계정에 구간이 없어 `expired`이고 `period`가 없습니다.
      enum: [active, pending, expired, refunded, owned]
    PurchasePeriod:
      type: object
      description: |
        기간 상품만 있는 이 유저 계정의 사용 구간. 합친 구매는 현재 유저 계정의 구간만 담습니다.
        `refunded`면 실제로 쓴 구간(`startsAt`부터 원래 끝과 끊은 시각 중 이른 것)이고, 시작 전에 환불됐으면 `period`가 없습니다.
        `pending` 구간은 환불이나 합치기로 앞당겨질 수 있습니다.
        합치기 전에 끝난 구매는 현재 유저 계정에 구간이 없어 `expired`이고 `period`가 없습니다.
      required: [startsAt, endsAt]
      properties:
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
    Purchase:
      type: object
      required: [productId, purchasedAt, status]
      properties:
        productId:
          type: string
          description: 상품 id. 이름은 app이 자기 문구나 스토어 이름에서 찾습니다.
        purchasedAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/PurchaseStatus'
        period:
          $ref: '#/components/schemas/PurchasePeriod'
    PurchaseList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: 최근 구매 먼저
          items:
            $ref: '#/components/schemas/Purchase'
    Entitlements:
      type: object
      required: [adFree, insight]
      properties:
        adFree:
          $ref: '#/components/schemas/AdFree'
        insight:
          $ref: '#/components/schemas/Insight'

    # ---- 참조 ----
    City:
      type: object
      required: [id, name, country, countryName, timezone, longitude]
      properties:
        id:
          type: string
          description: GeoNames id
        name:
          type: string
          description: 요청 언어의 이름
        country:
          type: string
          pattern: '^[A-Z]{2}$'
          description: ISO 3166-1 alpha-2
        countryName:
          type: string
          description: 요청 언어의 나라 이름
        regionName:
          type: string
          description: 1차 행정구역 이름. GeoNames에 없으면 생략합니다.
        timezone:
          type: string
          description: IANA 이름
        longitude:
          type: number
          minimum: -180
          maximum: 180
          description: 경도(도 단위 소수, 동경 양수·서경 음수). 출생 시각의 경도 보정에 쓰는 값입니다.
    CityList:
      type: object
      required: [dataVersion, items]
      properties:
        dataVersion:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/City'
    AppConfig:
      type: object
      required: [minimumVersion, legal]
      properties:
        minimumVersion:
          $ref: '#/components/schemas/MinimumVersion'
        legal:
          $ref: '#/components/schemas/LegalLinks'
    LegalLinks:
      type: object
      description: |
        이용약관·개인정보 처리방침 정적 페이지의 절대 주소입니다(D80). app은 주소를 상수로 두지 않고 이 값을 씁니다.
        주소에는 query가 없고, app이 화면 언어로 `?lang=ko|en|ja`를 붙여 엽니다.
        페이지(`GET /legal/terms`·`GET /legal/privacy`)는 `/v1` 밖 정적 HTML이라 이 명세의 operation이 아닙니다.
        `lang`이 없거나 모르는 값이면 기본 언어 `en`이고, 그 언어의 원문이 아직 없으면 404와 준비 중 안내 페이지입니다(다른 언어로 대신하지 않음).
      required: [terms, privacy]
      properties:
        terms:
          type: string
          format: uri
          description: 이용약관 주소(예 `https://<서비스 도메인>/legal/terms`)
        privacy:
          type: string
          format: uri
          description: 개인정보 처리방침 주소(예 `https://<서비스 도메인>/legal/privacy`)
    MinimumVersion:
      type: object
      description: 플랫폼별 최소 앱 버전(semver 문자열)
      required: [ios, android]
      properties:
        ios:
          type: string
        android:
          type: string
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
