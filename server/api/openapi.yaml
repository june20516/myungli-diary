        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      operationId: createSchedule
      summary: 일정 만들기
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
