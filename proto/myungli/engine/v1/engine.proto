// 명리 엔진 gRPC 계약 v1 (core 제공, server 사용).
//
// 엔진은 상태가 없고 문장을 만들지 않습니다(D27). 사용자에게 보일 문장은 server의 콘텐츠 모듈이
// 메시지 키(Judgment.message_key, 태그 키)와 매개변수(Judgment.params)로 만듭니다.
// 이 파일의 문자열 필드는 메시지 키, 규칙 id, 근거 참조(source_ref), IANA 시간대, 절기 참고 표기 같은
// 식별자뿐입니다.
//
// 메시지 개요
// * 서비스 MyungliEngine: GetChart(나의 사주), GetDaily(데일리), GetMonthCalendar(월간 캘린더), GetBirthHour(출생 시진), GetInfo(엔진·규칙 버전),
//   ConvertLunarDate(음력 → 양력, 윤달 유무).
// * 입력: BirthInfo(출생 정보), ChartRequest / DailyRequest / MonthRequest. spec §3·§9 원문 그대로입니다.
// * 공통 값: LocalDate·LocalTime(현지 달력 날짜·시각), Pillar(간지 한 기둥), FourPillars(네 기둥).
// * 판정: Judgment(메시지 키 + 매개변수 + 근거 목록), Evidence(규칙 id + source_ref + 세부), Param(매개변수 값).
// * 응답 공통: ResponseMeta(엔진·규칙 버전, Notice 목록). Notice는 계산은 되지만 민감한 상황 알림입니다(D32).
// * ChartResponse: 원국 표(기둥·십성·지장간·12운성·신살·공망), 오행 분포, 강약, 용신, 대운 표, 세운 표,
//   원국 개인 해석 목록(PersonalReading, D60).
// * DailyResponse: 일진, 날의 성격, 카드 4종(컬러·방향·숫자·집중 시간, 각각 Judgment + 원본 값),
//   일진×원국 합충형, 태그 키(대표·전체), 총운·가이드 질문 Judgment.
// * MonthResponse: 날짜별 MonthDay(일진, 음력, 절기, 날의 성격, 길흉 점수·수준·구성, 대표 태그 키,
//   길흉 수준 Judgment).
//
// 관례
// * enum의 0번은 <ENUM>_UNSPECIFIED입니다. 요청에서 UNSPECIFIED는 INVALID_ARGUMENT입니다.
// * presence: enum 필드의 "값 없음"은 항상 UNSPECIFIED로 표현하고 optional을 쓰지 않습니다
//   (예: YongsinInfo.johu_stem, Relation.suppressed_by). 메시지 타입 필드는 그 자체로 값 유무를 구분하고
//   (예: 시간 모름이면 FourPillars.hour가 비어 있음), 스칼라·문자열의 "없음"은 optional로 표현합니다
//   (예: BirthInfo.time·longitude, MonthDay.featured_tag).
// * 자리(Position)별 값은 map 대신 repeated 메시지로 둡니다(proto map 키로 enum을 쓸 수 없음).
syntax = "proto3";

package myungli.engine.v1;

import "google/protobuf/timestamp.proto";

service MyungliEngine {
  rpc GetChart(ChartRequest) returns (ChartResponse);
  rpc GetDaily(DailyRequest) returns (DailyResponse);
  rpc GetMonthCalendar(MonthRequest) returns (MonthResponse);
  rpc GetBirthHour(BirthHourRequest) returns (BirthHourResponse);
  rpc GetInfo(InfoRequest) returns (InfoResponse);
  rpc ConvertLunarDate(LunarDateRequest) returns (LunarDateResponse);
}

// ---------------------------------------------------------------------------
// enum
// ---------------------------------------------------------------------------

enum CalendarType {
  CALENDAR_TYPE_UNSPECIFIED = 0;
  CALENDAR_TYPE_SOLAR = 1;
  CALENDAR_TYPE_LUNAR = 2;
}

enum Gender {
  GENDER_UNSPECIFIED = 0;
  GENDER_MALE = 1;
  GENDER_FEMALE = 2;
}

// 오행: 목·화·토·금·수.
enum Element {
  ELEMENT_UNSPECIFIED = 0;
  ELEMENT_WOOD = 1;
  ELEMENT_FIRE = 2;
  ELEMENT_EARTH = 3;
  ELEMENT_METAL = 4;
  ELEMENT_WATER = 5;
}

// 천간: 甲~癸 순서.
enum Stem {
  STEM_UNSPECIFIED = 0;
  STEM_GAP = 1;
  STEM_EUL = 2;
  STEM_BYEONG = 3;
  STEM_JEONG = 4;
  STEM_MU = 5;
  STEM_GI = 6;
  STEM_GYEONG = 7;
  STEM_SIN = 8;
  STEM_IM = 9;
  STEM_GYE = 10;
}

// 지지: 子~亥 순서.
enum Branch {
  BRANCH_UNSPECIFIED = 0;
  BRANCH_JA = 1;
  BRANCH_CHUK = 2;
  BRANCH_IN = 3;
  BRANCH_MYO = 4;
  BRANCH_JIN = 5;
  BRANCH_SA = 6;
  BRANCH_O = 7;
  BRANCH_MI = 8;
  BRANCH_SHIN = 9;
  BRANCH_YU = 10;
  BRANCH_SUL = 11;
  BRANCH_HAE = 12;
}

// 십성. 두 개씩 비겁·식상·재성·관성·인성 그룹입니다.
enum TenGod {
  TEN_GOD_UNSPECIFIED = 0;
  TEN_GOD_BIGYEON = 1;
  TEN_GOD_GEOPJAE = 2;
  TEN_GOD_SIKSIN = 3;
  TEN_GOD_SANGGWAN = 4;
  TEN_GOD_PYEONJAE = 5;
  TEN_GOD_JEONGJAE = 6;
  TEN_GOD_PYEONGWAN = 7;
  TEN_GOD_JEONGGWAN = 8;
  TEN_GOD_PYEONIN = 9;
  TEN_GOD_JEONGIN = 10;
}

// 12운성.
enum TwelveStage {
  TWELVE_STAGE_UNSPECIFIED = 0;
  TWELVE_STAGE_JANGSAENG = 1;
  TWELVE_STAGE_MOKYOK = 2;
  TWELVE_STAGE_GWANDAE = 3;
  TWELVE_STAGE_GEONROK = 4;
  TWELVE_STAGE_JEWANG = 5;
  TWELVE_STAGE_SOE = 6;
  TWELVE_STAGE_BYEONG = 7;
  TWELVE_STAGE_SA = 8;
  TWELVE_STAGE_MYO = 9;
  TWELVE_STAGE_JEOL = 10;
  TWELVE_STAGE_TAE = 11;
  TWELVE_STAGE_YANG = 12;
}

// 신살 (spec §5.4 MVP 범위).
enum Shinsal {
  SHINSAL_UNSPECIFIED = 0;
  SHINSAL_CHEONEUL_GWIIN = 1;
  SHINSAL_DOHWA = 2;
  SHINSAL_YEOKMA = 3;
  SHINSAL_HWAGAE = 4;
  SHINSAL_YANGIN = 5;
  SHINSAL_GONGMANG = 6;
}

// 원국의 여덟 자리.
enum Position {
  POSITION_UNSPECIFIED = 0;
  POSITION_YEAR_STEM = 1;
  POSITION_YEAR_BRANCH = 2;
  POSITION_MONTH_STEM = 3;
  POSITION_MONTH_BRANCH = 4;
  POSITION_DAY_STEM = 5;
  POSITION_DAY_BRANCH = 6;
  POSITION_HOUR_STEM = 7;
  POSITION_HOUR_BRANCH = 8;
}

// 8방위.
enum Direction8 {
  DIRECTION8_UNSPECIFIED = 0;
  DIRECTION8_N = 1;
  DIRECTION8_NE = 2;
  DIRECTION8_E = 3;
  DIRECTION8_SE = 4;
  DIRECTION8_S = 5;
  DIRECTION8_SW = 6;
  DIRECTION8_W = 7;
  DIRECTION8_NW = 8;
}

// 날의 성격 (spec §7.1).
enum DayKind {
  DAY_KIND_UNSPECIFIED = 0;
  DAY_KIND_GWIIN_DAY = 1;
  DAY_KIND_YONGSIN_DAY = 2;
  DAY_KIND_GISIN_DAY = 3;
  DAY_KIND_ORDINARY_DAY = 4;
}

// 신강·신약 등급 (spec §6.1).
enum StrengthLevel {
  STRENGTH_LEVEL_UNSPECIFIED = 0;
  STRENGTH_LEVEL_VERY_WEAK = 1;
  STRENGTH_LEVEL_WEAK = 2;
  STRENGTH_LEVEL_NEUTRAL = 3;
  STRENGTH_LEVEL_STRONG = 4;
  STRENGTH_LEVEL_VERY_STRONG = 5;
}

// 용신 판정 방식 (spec §6.2).
enum YongsinMethod {
  YONGSIN_METHOD_UNSPECIFIED = 0;
  YONGSIN_METHOD_JOHU = 1;
  YONGSIN_METHOD_JOHU_NEUTRAL = 2;
  YONGSIN_METHOD_EOKBU = 3;
}

// 월간 캘린더 길흉 수준 (spec §8).
enum LuckLevel {
  LUCK_LEVEL_UNSPECIFIED = 0;
  LUCK_LEVEL_GOOD = 1;
  LUCK_LEVEL_NEUTRAL = 2;
  LUCK_LEVEL_CAUTION = 3;
}

// 계산은 되지만 민감한 상황 (spec §9.1).
enum NoticeCode {
  NOTICE_CODE_UNSPECIFIED = 0;
  NOTICE_CODE_AMBIGUOUS_LOCAL_TIME = 1;
  NOTICE_CODE_NONEXISTENT_LOCAL_TIME = 2;
  NOTICE_CODE_ZI_HOUR_NEXT_DAY = 3;
  NOTICE_CODE_TIME_UNKNOWN = 4;
  NOTICE_CODE_NEAR_SOLAR_TERM = 5;
  NOTICE_CODE_DAYUN_START_APPROXIMATE = 6;
  NOTICE_CODE_FOCUS_TIME_FALLBACK = 7;
}

// 합·충·형 종류 (spec §7.6).
enum RelationKind {
  RELATION_KIND_UNSPECIFIED = 0;
  RELATION_KIND_STEM_HAP = 1;
  RELATION_KIND_BRANCH_HAP = 2;
  RELATION_KIND_CHUNG = 3;
  RELATION_KIND_HYEONG = 4;
}

// 행운 컬러·숫자 오행의 역할 (spec §7.2).
enum ElementRole {
  ELEMENT_ROLE_UNSPECIFIED = 0;
  ELEMENT_ROLE_YONGSIN = 1;
  ELEMENT_ROLE_TONGGWAN = 2;
}

// 24절기. 번호는 양력 1월의 소한(1)부터 12월의 동지(24)까지 한 해 순서입니다.
// 값 이름은 한국어 이름의 로마자 표기입니다.
enum SolarTermKind {
  SOLAR_TERM_KIND_UNSPECIFIED = 0;
  SOLAR_TERM_KIND_SOHAN = 1; // 소한 小寒
  SOLAR_TERM_KIND_DAEHAN = 2; // 대한 大寒
  SOLAR_TERM_KIND_IPCHUN = 3; // 입춘 立春
  SOLAR_TERM_KIND_USU = 4; // 우수 雨水
  SOLAR_TERM_KIND_GYEONGCHIP = 5; // 경칩 驚蟄
  SOLAR_TERM_KIND_CHUNBUN = 6; // 춘분 春分
  SOLAR_TERM_KIND_CHEONGMYEONG = 7; // 청명 淸明
  SOLAR_TERM_KIND_GOGU = 8; // 곡우 穀雨
  SOLAR_TERM_KIND_IPHA = 9; // 입하 立夏
  SOLAR_TERM_KIND_SOMAN = 10; // 소만 小滿
  SOLAR_TERM_KIND_MANGJONG = 11; // 망종 芒種
  SOLAR_TERM_KIND_HAJI = 12; // 하지 夏至
  SOLAR_TERM_KIND_SOSEO = 13; // 소서 小暑
  SOLAR_TERM_KIND_DAESEO = 14; // 대서 大暑
  SOLAR_TERM_KIND_IPCHU = 15; // 입추 立秋
  SOLAR_TERM_KIND_CHEOSEO = 16; // 처서 處暑
  SOLAR_TERM_KIND_BAENGNO = 17; // 백로 白露
  SOLAR_TERM_KIND_CHUBUN = 18; // 추분 秋分
  SOLAR_TERM_KIND_HALLO = 19; // 한로 寒露
  SOLAR_TERM_KIND_SANGGANG = 20; // 상강 霜降
  SOLAR_TERM_KIND_IPDONG = 21; // 입동 立冬
  SOLAR_TERM_KIND_SOSEOL = 22; // 소설 小雪
  SOLAR_TERM_KIND_DAESEOL = 23; // 대설 大雪
  SOLAR_TERM_KIND_DONGJI = 24; // 동지 冬至
}

// 원국 개인 해석("내 사주에서는")이 가리키는 용어 (D60).
enum PersonalTermKind {
  PERSONAL_TERM_KIND_UNSPECIFIED = 0;
  PERSONAL_TERM_KIND_DAY_MASTER = 1; // 일간. position = DAY_STEM
  PERSONAL_TERM_KIND_TEN_GOD = 2; // 원국 천간·지지의 십성. position
  PERSONAL_TERM_KIND_HIDDEN_TEN_GOD = 3; // 지장간의 십성. position(지지) + index(지장간 순서, 0이 정기)
  PERSONAL_TERM_KIND_TWELVE_STAGE = 4; // 원국 지지의 12운성. position
  PERSONAL_TERM_KIND_SHINSAL = 5; // 원국 신살. position + shinsal
  PERSONAL_TERM_KIND_DAEUN_STEM_TEN_GOD = 6; // index = DaeunTable.periods 순서
  PERSONAL_TERM_KIND_DAEUN_BRANCH_TEN_GOD = 7;
  PERSONAL_TERM_KIND_DAEUN_TWELVE_STAGE = 8;
  PERSONAL_TERM_KIND_SEUN_TEN_GOD = 9; // index = ChartResponse.seun 순서
}

// ---------------------------------------------------------------------------
// 공통 값
// ---------------------------------------------------------------------------

// 현지 달력 날짜.
message LocalDate {
  int32 year = 1;
  int32 month = 2;
  int32 day = 3;
}

// 현지 시각(시·분).
message LocalTime {
  int32 hour = 1;
  int32 minute = 2;
}

// 간지 한 기둥.
message Pillar {
  Stem stem = 1;
  Branch branch = 2;
}

// 네 기둥. 시간 모름이면 hour가 비어 있습니다.
message FourPillars {
  Pillar year = 1;
  Pillar month = 2;
  Pillar day = 3;
  Pillar hour = 4;
}

// ---------------------------------------------------------------------------
// 요청 (spec §3·§9 원문)
// ---------------------------------------------------------------------------

message BirthInfo {
  CalendarType calendar = 1;
  bool is_leap_month = 2; // LUNAR일 때만 의미
  LocalDate date = 3; // calendar가 LUNAR면 음력 연·월·일(음력 30일도 그대로), SOLAR면 양력
  optional LocalTime time = 4; // 없음 = 시간 모름
  Gender gender = 5;
  string timezone = 6; // IANA 이름, 예: Asia/Seoul
  optional double longitude = 7; // 동경 +, 서경 -. 없음 = 대표 경도
}

// 요청의 birth와 아래에 "필수"로 적은 필드가 없으면 INVALID_ARGUMENT입니다.
message ChartRequest {
  BirthInfo birth = 1; // 필수
  LocalDate as_of = 2; // 필수. 세운 기준 연도용
}

message DailyRequest {
  BirthInfo birth = 1; // 필수
  LocalDate date = 2; // 필수. 사용자 현재 시간대의 달력 날짜 (D30)
  string current_timezone = 3; // 필수. IANA 이름
}

message MonthRequest {
  BirthInfo birth = 1; // 필수
  int32 year = 2; // 필수(0은 값 없음)
  int32 month = 3; // 필수. 1~12
  string current_timezone = 4; // 필수. IANA 이름
}

// ---------------------------------------------------------------------------
// 판정과 메타 (spec §9 원문)
// ---------------------------------------------------------------------------

// 메시지 키 + 매개변수 + 근거. 근거는 하나 이상입니다.
message Judgment {
  string message_key = 1;
  map<string, Param> params = 2;
  repeated Evidence evidence = 3;
}

message Param {
  oneof value {
    string text = 1;
    int64 integer = 2;
    double number = 3;
    bool flag = 4;
  }
}

// source_ref 형식: <자료 디렉터리>/<파일 이름>#<키 경로> (spec §11).
message Evidence {
  string rule_id = 1;
  string source_ref = 2;
  map<string, string> detail = 3; // 예: 점수 구성, suppressed_by
}

message Notice {
  NoticeCode code = 1;
  map<string, string> detail = 2;
}

message ResponseMeta {
  string engine_version = 1;
  string ruleset_version = 2;
  repeated Notice notices = 3;
}

// ---------------------------------------------------------------------------
// GetChart: 나의 사주
// ---------------------------------------------------------------------------

message ChartResponse {
  FourPillars pillars = 1;
  repeated PositionTenGod ten_gods = 2; // 일간 자리는 없음. 지지는 정기 기준
  repeated PositionHiddenStems hidden_stems = 3;
  repeated PositionTwelveStage twelve_stages = 4;
  repeated ShinsalHit shinsal = 5; // 원국 안에 실제로 있는 신살만
  repeated Branch gongmang = 6; // 일주 기준 공망 두 지지
  repeated ElementWeight element_weights = 7;
  Strength strength = 8;
  YongsinInfo yongsin = 9;
  DaeunTable daeun = 10;
  repeated YearLuck seun = 11; // 현재 대운 구간의 10년
  ResponseMeta meta = 12;
  // evidence 깊이의 원국 개인 해석(D60). 열람 권한이 없으면 server가 이 필드를 응답에서 뺍니다.
  repeated PersonalReading personal_readings = 13;
}

// 순서: 일간 → 원국 십성(자리 순) → 지장간 → 12운성 → 신살 → 대운(구간마다 천간·지지·12운성) → 세운.
// 앱은 누른 용어의 (kind, position, index, shinsal)로 해석을 찾습니다.
message PersonalReading {
  PersonalTermKind kind = 1;
  Position position = 2; // 원국 용어만. 대운·세운은 UNSPECIFIED
  int32 index = 3; // HIDDEN·DAEUN·SEUN만 의미. 그 밖은 0
  Shinsal shinsal = 4; // SHINSAL만. 그 밖은 UNSPECIFIED
  Judgment judgment = 5;
}

message PositionTenGod {
  Position position = 1;
  TenGod ten_god = 2;
}

// 지지 자리의 지장간. 첫 항목이 정기입니다.
message PositionHiddenStems {
  Position position = 1;
  repeated HiddenStem stems = 2;
}

message HiddenStem {
  Stem stem = 1;
  TenGod ten_god = 2;
}

message PositionTwelveStage {
  Position position = 1;
  TwelveStage twelve_stage = 2;
}

message ShinsalHit {
  Shinsal kind = 1;
  Position position = 2;
}

// 오행 분포. 자리 가중치를 반영한 값입니다.
message ElementWeight {
  Element element = 1;
  double weight = 2;
}

message Strength {
  double score = 1;
  StrengthLevel level = 2;
}

// 용신·희신·기신·통관과 판정 방식. johu_stem은 조후 방식일 때만 있고, 그 밖에는 STEM_UNSPECIFIED입니다.
message YongsinInfo {
  Element yongsin = 1;
  Element huisin = 2;
  Element gisin = 3;
  Element tonggwan = 4;
  YongsinMethod method = 5;
  Stem johu_stem = 6;
  Judgment judgment = 7;
}

// 대운 표. start_years·start_months는 대운 시작까지의 기간입니다.
message DaeunTable {
  bool forward = 1; // 순행 여부
  int32 start_years = 2;
  int32 start_months = 3;
  repeated LuckPeriod periods = 4; // 10개 구간
}

// 출생 양력 연도는 BirthInfo.date의 연도다. calendar가 LUNAR면 양력으로 바꾼 날짜의 연도다(시각 보정 전).
message LuckPeriod {
  Pillar pillar = 1;
  int32 start_age = 2; // 만 나이
  int32 start_age_korean = 3; // 한국식 나이. start_age_korean = start_year - 출생 양력 연도 + 1
  TenGod stem_ten_god = 4;
  TenGod branch_ten_god = 5; // 지지 정기 기준
  TwelveStage twelve_stage = 6;
  int32 start_year = 7; // 대운이 실제로 시작하는 양력 연도. 다음 대운은 10년 뒤(#378)
}

message YearLuck {
  int32 year = 1;
  Pillar pillar = 2;
  TenGod ten_god = 3; // 천간 기준
  repeated RelationKind relations_with_natal = 4; // 원국과의 활성 관계 종류(중복 없음)
}

// ---------------------------------------------------------------------------
// GetDaily: 데일리
// ---------------------------------------------------------------------------

message DailyResponse {
  Pillar day = 1; // 일진 (그 날짜 정오 기준)
  DayKind kind = 2;
  ColorCard color = 3;
  DirectionCard direction = 4;
  NumberCard number = 5;
  FocusTimeCard focus_time = 6;
  repeated Relation relations = 7; // 일진 × 원국. 탐합망충으로 무효가 된 충도 포함
  repeated string featured_tags = 8; // 대표 태그 키 0~2개 (화면 표시용)
  repeated string all_tags = 9; // 전체 태그 키 (일기 저장용)
  repeated Evidence tag_evidence = 10;
  repeated Judgment fortune = 11; // 총운. 첫 항목이 본문, 대표 태그가 있으면 보조 문장이 뒤따름
  Judgment guide = 12; // 가이드 질문
  ResponseMeta meta = 13;
}

// 행운 컬러: 오행과 그 역할. 색 이름·색 값은 앱이 오행 팔레트로 정합니다.
message ColorCard {
  Judgment judgment = 1;
  Element element = 2;
  ElementRole role = 3;
}

// 행운 방향. rule_id는 적용한 규칙 식별자입니다.
message DirectionCard {
  Judgment judgment = 1;
  Direction8 direction = 2;
  string rule_id = 3;
}

message NumberCard {
  Judgment judgment = 1;
  int32 number = 2;
}

// 집중하기 좋은 시간. fallback이면 모든 후보가 제외되어 황도길시로 대신한 결과입니다.
message FocusTimeCard {
  Judgment judgment = 1;
  repeated FocusSlot picks = 2; // 1~2개
  bool fallback = 3;
}

// 시진 하나. start(포함)·end(제외)는 절대 시각이며, 요청의 current_timezone으로 바꿔 표시합니다.
message FocusSlot {
  Branch branch = 1;
  Pillar pillar = 2;
  google.protobuf.Timestamp start = 3;
  google.protobuf.Timestamp end = 4;
  bool huangdao_lucky = 5; // 황도길시
  int32 score = 6;
  repeated string reasons = 7; // 가점 사유 식별자: gwiin, yongsin, huisin, hap
}

// 일진과 원국 한 자리 사이의 관계. suppressed_by가 UNSPECIFIED가 아니면 무효가 된 관계입니다.
message Relation {
  RelationKind kind = 1;
  Position natal_position = 2;
  RelationKind suppressed_by = 3;
}

// ---------------------------------------------------------------------------
// GetMonthCalendar: 월간 캘린더
// ---------------------------------------------------------------------------

message MonthResponse {
  repeated MonthDay days = 1;
  ResponseMeta meta = 2;
}

message MonthDay {
  LocalDate date = 1;
  Pillar pillar = 2; // 일진
  int32 lunar_month = 3;
  int32 lunar_day = 4;
  bool is_leap_month = 5;
  SolarTerm solar_term = 6; // 입절일만 있음
  DayKind kind = 7;
  LuckLevel luck_level = 8;
  int32 score = 9;
  repeated ScoreItem score_items = 10; // 점수 구성 원본 값
  optional string featured_tag = 11; // 대표 태그 키
  // 길흉 수준 판정. message_key는 calendar.<good|neutral|caution>, evidence에 점수 구성 근거
  // (Pro 화면의 "왜 좋은 날인가")가 담깁니다.
  Judgment judgment = 12;
}

// 절기. at은 입절 절대 시각입니다.
message SolarTerm {
  string name = 1; // lunar-python 간체 표기(예: 立春, 惊蛰), 참고용. 매핑에는 kind를 쓸 것
  google.protobuf.Timestamp at = 2;
  SolarTermKind kind = 3; // 절기 종류
}

// 점수 구성 항목(원본 값). 화면 문구용 메시지 키는 MonthDay.judgment에 있고, id는 메시지 키가 아닌 식별자입니다:
// gwiin_day, yongsin_day, gisin_day, hap, chung_day_or_month, chung_other, hyeong.
message ScoreItem {
  string id = 1;
  int32 score = 2;
}

// ---------------------------------------------------------------------------
// GetBirthHour: 출생 시진
// ---------------------------------------------------------------------------

// 시진은 출생 시각·시간대·경도로만 정해지므로 GetBirthHour는 birth.gender를 보지 않습니다.
// GENDER_UNSPECIFIED도 받습니다(다른 RPC는 INVALID_ARGUMENT).
message BirthHourRequest {
  BirthInfo birth = 1; // time이 없으면 INVALID_ARGUMENT
}

// 출생 시각이 속한 시진. start·end는 절대 시각이며, 벽시계 표시는 server·app이 출생 시간대로 바꿉니다.
message BirthHourResponse {
  Branch branch = 1;
  google.protobuf.Timestamp start = 2;
  google.protobuf.Timestamp end = 3;
  ResponseMeta meta = 4; // 출생 시각 해석의 notice 그대로(자시 경계, 서머타임 공백·중복, 절입 근처)
}

// ---------------------------------------------------------------------------
// GetInfo: 엔진·규칙 버전
// ---------------------------------------------------------------------------

message InfoRequest {}

message InfoResponse {
  string engine_version = 1;
  string ruleset_version = 2;
}

// ---------------------------------------------------------------------------
// ConvertLunarDate: 음력 → 양력, 윤달 유무
// ---------------------------------------------------------------------------

// 한국 음력(KASI 기준, D41) 날짜. date가 없으면 INVALID_ARGUMENT.
message LunarDateRequest {
  LocalDate date = 1; // 음력 연·월·일
  bool is_leap_month = 2;
}

// 없는 음력 날짜(그해에 없는 윤달, 그 달에 없는 날)는 INVALID_ARGUMENT,
// 음력 연도나 변환한 양력이 지원 범위(양력 1900-01-31 ~ 2099-12-31) 밖이면 OUT_OF_RANGE.
message LunarDateResponse {
  LocalDate solar = 1; // 양력 날짜
  bool month_has_leap = 2; // 그해 그 음력 달 뒤에 같은 이름의 윤달이 있는지
  ResponseMeta meta = 3;
}
