name: myungli_diary
description: "명리일기 모바일 앱 (Flutter)"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  copy_with_extension: ^18.0.0
  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  crypto: ^3.0.7
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  flutter_timezone: ^5.1.1
  go_router: ^18.0.2
  intl: ^0.20.3
  json_annotation: ^4.12.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  phosphor_glyphs: ^2.1.2+1
  pub_semver: ^2.2.1
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  uuid: ^4.6.0
dev_dependencies:
  analyzer: ^14.5.0
  build_runner: ^2.16.2
  copy_with_extension_gen: ^18.0.0
  drift_dev: ^2.35.1
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  json_serializable: ^6.14.1
  patrol: ^4.10.0
  riverpod_lint: ^3.1.9
  very_good_analysis: ^11.0.0
  yaml: ^3.1.4

# Patrol E2E(결정 A13). 테스트는 patrol_test/ 아래에 둡니다.
patrol:
  app_name: 명리일기
  android:
    package_name: app.myungli.diary
  ios:
    bundle_id: app.myungli.diary
  # 실패한 화면을 Android에서 자동 캡처합니다.
  screenshot_on_failure: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  generate: true

  # 브랜드 글꼴(모두 SIL OFL 1.1). family 이름은 디자인 토큰 값 그대로입니다.
  fonts:
    - family: Gowun Dodum
      fonts:
        - asset: assets/fonts/gowun_dodum/GowunDodum-Regular.ttf
    - family: Zen Maru Gothic
      fonts:
        - asset: assets/fonts/zen_maru_gothic/ZenMaruGothic-Regular.ttf
    - family: Pretendard
      fonts:
        - asset: assets/fonts/pretendard/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/pretendard/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/pretendard/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/pretendard/Pretendard-Bold.otf
          weight: 700
    - family: Pretendard JP
      fonts:
        - asset: assets/fonts/pretendard_jp/PretendardJP-Regular.otf
          weight: 400
        - asset: assets/fonts/pretendard_jp/PretendardJP-Medium.otf
          weight: 500
        - asset: assets/fonts/pretendard_jp/PretendardJP-SemiBold.otf
          weight: 600
        - asset: assets/fonts/pretendard_jp/PretendardJP-Bold.otf
          weight: 700
  # 글꼴 라이선스(OFL.txt)는 licenses.dart가 LicenseRegistry에 더합니다.
  assets:
    - assets/brand/kakao/
    - assets/brand/apple/
    - assets/brand/myungli/
    - assets/fonts/gowun_dodum/OFL.txt
    - assets/fonts/zen_maru_gothic/OFL.txt
    - assets/fonts/pretendard/OFL.txt
    - assets/fonts/pretendard/NOTICE.txt
    - assets/fonts/pretendard_jp/OFL.txt
    - assets/fonts/pretendard_jp/NOTICE.txt
    # 대역 서버 fixture(디렉터리는 하위를 싣지 않으므로 시나리오마다 적습니다).
    - fixtures/
    - fixtures/new-user/
    - fixtures/member/
    - fixtures/consent-required/
    - fixtures/profile-required/
    - fixtures/force-update/
    - fixtures/birth-hour-unavailable/
    - fixtures/birth-hour-rate-limited/
    - fixtures/cities-error/
    - fixtures/time-unknown/
    - fixtures/preview-used/
    - fixtures/preview-invalid/
    - fixtures/returning-user/
    - fixtures/login-provider-down/
    - fixtures/login-exchange-invalid/
    - fixtures/new-user-signin/
    - fixtures/consent-mismatch/
    - fixtures/profile-invalid/
    - fixtures/profile-save-unavailable/
    - fixtures/notify-register-unavailable/
    - fixtures/consent-renewal/
    - fixtures/notify-profile-save-unavailable/
    - fixtures/profile-name-invalid/
    - fixtures/login-entry-unavailable/
    - fixtures/member-time-unknown/
    - fixtures/daily-error/
    - fixtures/diary-written/
    - fixtures/reaction-failed/
    - fixtures/reaction-delete-failed/
    - fixtures/evidence-unlocked/
    - fixtures/reward-unlock/
    - fixtures/calendar-error/
    - fixtures/schedule-save-error/
